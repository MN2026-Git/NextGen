ementById('aName').textContent=ac.name||'idle';var ph=document.getElementById('aPhase');ph.textContent=ac.phase||'idle';ph.className='phase '+(ac.phase||'idle');document.getElementById('aBar').style.width=(ac.pct||0)+'%';document.getElementById('aBytes').textContent=fb(ac.bytesDone);document.getElementById('aTotal').textContent=fb(ac.bytesTotal);document.getElementById('aSpeed').textContent=fb(ac.speedBps)+'/s';eyes(s.scan);var f=s.files||[];var fl=document.getElementById('flist');if(!f.length){fl.innerHTML='<div class="empty">No files tracked yet.</div>';}else{var h='';for(var i=0;i<f.length;i++){var it=f[i];var st=it.status||'uploading';var cls=st==='ok'?'ok':(st==='limit'?'limit':'uploading');var bc=st==='ok'?'ok':(st==='limit'?'limit':'up');var pc=st==='ok'?100:(+it.pct||0);var w=bc==='up'?Math.max(4,pc):pc;var lb=st==='ok'?'OK':(st==='limit'?'FAIL':(st==='retry'?'RETRY':pc+'%'));h+='<div class="frow"><span class="st '+cls+'">'+lb+'</span><span class="nm" title="'+(it.name||'')+'">'+(it.name||'')+'</span><span class="bar '+bc+'"><i style="width:'+w+'%"></i></span><span class="src">'+(it.src||'')+'</span></div>';}fl.innerHTML=h;}var bn=document.getElementById('banner');bn.className='banner';if(s.mirror){if((a.failed||0)>0&&(a.active||0)===0){bn.className='banner warn';bn.textContent=(a.failed)+' failed — check log.';}else if((a.tracked||0)>0&&(a.active||0)===0&&(a.failed||0)===0&&(a.done||0)>0){bn.className='banner safe';bn.textContent='ALL UPLOADED — safe to Cancel now.';}}}function runTs(){var box=document.getElementById('tsChecks');box.innerHTML='<div class="empty">running…</div>';document.getElementById('tsRecs').innerHTML='';fetch('/troubleshoot'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){var h='';(d.checks||[]).forEach(function(c){h+='<div class="tcheck"><span class="ic '+(c.pass?'ok':'bad')+'">'+(c.pass?'✔':'✖')+'</span><div><div>'+c.name+'</div><div class="dt">'+(c.detail||'')+'</div></div></div>';});box.innerHTML=h||'<div class="empty">no checks</div>';document.getElementById('tsProfile').textContent=d.profileDir?('profile: '+d.profileDir):'';var rh='';(d.recommendations||[]).forEach(function(r){rh+='<div class="rec">→ '+r+'</div>';});document.getElementById('tsRecs').innerHTML=rh||'<div class="rec" style="color:var(--green);background:#16402c;border-color:#1f6f43">✔ All checks passed.</div>';}).catch(function(e){box.innerHTML='<div class="empty">troubleshoot failed: '+e+'</div>';});}document.getElementById('tsBtn').addEventListener('click',runTs);document.getElementById('healBtn').addEventListener('click',function(){var b=this;b.disabled=true;b.textContent='healing…';fetch('/heal'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){b.disabled=false;b.textContent='🔧 Self-Heal (re-resolve paths)';if(d.ok){alert('Self-Heal done.\nprofile: '+d.profileDir+'\nroots:\n'+(d.roots||[]).join('\n')+'\n\nWatcher will reload paths within a few seconds.');runTs();}else{alert('Self-Heal failed: '+(d.error||'unknown'));}}).catch(function(e){b.disabled=false;b.textContent='🔧 Self-Heal (re-resolve paths)';alert('Self-Heal error: '+e);});});function diag(){var box=document.getElementById('diagOut');box.style.display='block';box.innerHTML='running…';Promise.all([fetch('/diag'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return{_err:String(e)};}),fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return{_err:String(e)};})]).then(function(res){var d=res[0]||{},p=res[1]||{};var L=['cfgLoaded '+(d.cfgLoaded?'PASS':'FAIL')+'  port7331 '+(d.portListening?'PASS':'FAIL')+'  firewall '+(d.firewallRulePresent?'PASS':'FAIL'),'progressLoaded '+(d.progressLoaded?'PASS':'FAIL')+(d.progressError?(' ('+d.progressError+')'):''),'path: '+(d.requestLoopback?'loopback (inside RDP)':'tailnet serve (local pc)')];var sc=p.scan||{};Object.keys(sc).forEach(function(k){var o=sc[k]||{};L.push('  '+k+': raw='+o.rawTotal+' elig='+o.eligible+' @'+(o.path||'')+(o.error?(' ERR='+o.error):''));});var ag=p.agg||{};L.push('tracked='+(ag.tracked||0)+' done='+(ag.done||0)+' active='+(ag.active||0)+' failed='+(ag.failed||0));box.innerHTML=L.join('\n');});}document.getElementById('diagBtn').addEventListener('click',diag);document.getElementById('emBtn').addEventListener('click',function(){var b=this;b.disabled=true;b.textContent='triggered…';fetch('/emergency'+(location.search||''),{cache:'no-store'}).then(function(){setTimeout(function(){b.disabled=false;b.textContent='⚡ Upload everything now';},1500);}).catch(function(){b.disabled=false;b.textContent='⚡ Upload everything now';});});var inf=false;function poll(){if(inf)return;inf=true;fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){}).then(function(){inf=false;});}function connPing(){var t0=Date.now();fetch('/conn'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){var ms=Date.now()-t0;var c=document.getElementById('conn');c.className='conn ok';document.getElementById('connTxt').textContent='online · '+ms+'ms';}).catch(function(){var c=document.getElementById('conn');c.className='conn';document.getElementById('connTxt').textContent='offline';});}render({mirror:false,ghrdp:cur,creds:{ip:document.getElementById('vIp').textContent,user:document.getElementById('vUser').textContent,pass:document.getElementById('vPass').textContent},viaLoopback:!STATIC,alive:true,ts:new Date().toISOString()});if(STATIC){document.getElementById('mode').className='chip mode-funnel';document.getElementById('mode').textContent='⬈ local pc (live)';}else{document.getElementById('mode').className='chip mode-loop';document.getElementById('mode').textContent='◉ inside rdp (live)';}poll();connPing();setInterval(poll,3000);setInterval(connPing,5000);})();</script></body></html>
