name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage+qBittorrent (AES-256) to gofile + rentry/telegraph. default OFF'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"; $out = "tailscale-setup.msi"; $ok = $false
          for ($a = 1; $a -le 4; $a++) { Remove-Item $out -Force -EA 0; & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null; $LASTEXITCODE = 0; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "curl ok $a"; break }; Start-Sleep (3 * $a) }
          if (-not $ok) { for ($a = 1; $a -le 3; $a++) { try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break } } catch {}; Start-Sleep (3 * $a) } }
          if (-not $ok) { throw "Could not download Tailscale MSI." }
      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'; Start-Sleep 5
      - name: Get Tailscale sign-in link (auto if TS_AUTHKEY else guided)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState) { $ok = $true; break } } catch {}; if ($i -eq 3) { Start-Service Tailscale -EA 0 }; Start-Sleep 2 }
          if (-not $ok) { throw "tailscaled not started." }
          $S = $env:GITHUB_STEP_SUMMARY
          if ($env:TS_AUTHKEY) {
            $l = Join-Path $env:RUNNER_TEMP "ts-up.log"; $e = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList @("up", "--authkey=$($env:TS_AUTHKEY)", "--accept-dns=true") -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru
            $r = $false; for ($i = 0; $i -lt 60; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $r = $true; break } } catch {}; Start-Sleep 2 }
            if (-not $r) { throw "TS_AUTHKEY login failed." }
            Write-Host "TAILSCALE AUTO-LOGGED-IN via TS_AUTHKEY. IP=$((& $ts ip -4).Trim())"; "### Tailscale auto-logged-in via TS_AUTHKEY ✅" >> $S
          } else {
            $l = Join-Path $env:RUNNER_TEMP "ts-up.log"; $e = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru
            $url = $null; for ($i = 0; $i -lt 90; $i++) { $t = ""; foreach ($f in @($l, $e)) { if (Test-Path $f) { try { $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $sr = New-Object IO.StreamReader($fs); $t += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch {} } }; if ($t -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }; Start-Sleep 2 }
            if (-not $url) { throw "Sign-in link not found." }
            $kp = "https://login.tailscale.com/admin/settings/keys"; $sp = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"
            Write-Host "TAILSCALE SIGN-IN LINK (click now): $url"; Write-Host "=== ONE-TIME: 1) $kp -> reusable key 90d  2) $sp -> secret TS_AUTHKEY  3) re-run = hands-free forever. NO extra creds for uploads. ==="
            $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
            "### Sign-in (click now)" >> $S; "" >> $S; "**[$url]($url)**" >> $S; "" >> $S; "### Hands-free next time: 1) **[$kp]($kp)** 2) **[$sp]($sp)** add ``TS_AUTHKEY`` 3) re-run." >> $S
          }
      - name: Wait for Tailscale sign-in
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $a = $false
          for ($i = 0; $i -lt 120; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $a = $true; break } } catch {}; Start-Sleep 5 }
          if (-not $a) { throw "Tailscale sign-in timeout." }; Write-Host "Tailscale connected. IP=$((& $ts ip -4).Trim())"
      - name: Auto-enable Funnel on tailnet (TS_API_KEY)
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $tok = $env:TS_KEY; $sp = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"; $tp = "https://login.tailscale.com/admin/settings/keys"; $ap = "https://login.tailscale.com/admin/acls"
          if (-not $tok) { Write-Host "TS_API_KEY not set. One-time: 1) $tp 2) $sp Name=TS_API_KEY 3) re-run. MANUAL: $ap add nodeAttrs:[{target:[*],attr:[funnel]}]"; exit 0 }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'; $h = @{ Authorization = ("Bearer " + $tok); Accept = 'application/json' }; $txt = $null
          try { $txt = (Invoke-WebRequest -Uri $base -Headers $h -UseBasicParsing -TimeoutSec 30).Content } catch { Write-Host "[acl] GET fail $($_.Exception.Message)" }
          $acl = $null; if ($txt) { $c = $txt -replace '/\*[\s\S]*?\*/', ''; $c = ($c -split "`n" | % { $_ -replace '//[^\r\n]*', '' }) -join "`n"; $c = $c -replace ',(\s*[\]}])', '$1'; try { $acl = $c | ConvertFrom-Json -EA Stop } catch { $acl = $null } }
          $post = $false; if ($acl) { $na = @(); if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }; $has = $false; foreach ($n in $na) { if ((@($n.target) -contains '*') -and (@($n.attr) -contains 'funnel')) { $has = $true } }; if (-not $has) { $na = $na + , @{ target = @('*'); attr = @('funnel') }; if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }; $post = $true } else { Write-Host "[acl] funnel present" } }
          if ($post) { try { Invoke-WebRequest -Uri $base -Headers (@{ Authorization = ("Bearer " + $tok); 'Content-Type' = 'application/json' }) -Method Post -Body ([Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))) -UseBasicParsing -TimeoutSec 30 | Out-Null; Write-Host "[acl] SUCCESS" } catch { Write-Host "[acl] POST fail $($_.Exception.Message)" } }
      - name: Setup tailnet web link (Tailscale Serve)
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $al = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b = [byte[]]::new(24); $rng.GetBytes($b); $dt = -join ($b | % { $al[[int]$_ % $al.Length] }); Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dt)
          $so = Join-Path $env:RUNNER_TEMP 'serve.out'; $se = Join-Path $env:RUNNER_TEMP 'serve.err'; Remove-Item $so, $se -Force -EA 0
          try { Start-Process -FilePath $ts -ArgumentList @('serve', '--bg', '7331') -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden | Out-Null } catch {}
          $su = ''; $dns = ''; $dl = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $dl) { $st = $null; try { $j = Start-Job -ScriptBlock { param($t) & $t status --json 2>$null } -ArgumentList $ts; if (Wait-Job $j -Timeout 4) { $st = Receive-Job $j | ConvertFrom-Json -EA 0 }; Remove-Job $j -Force -EA 0 } catch {}; if ($st -and $st.Self.DNSName) { $dns = $st.Self.DNSName.TrimEnd('.'); break }; Start-Sleep 2 }
          if ($dns) { $su = ('https://' + $dns + '/?key=' + $dt) }; Add-Content $env:GITHUB_ENV ('SERVE_URL=' + $su); Start-Sleep 2
          $sl = ''; if (Test-Path $so) { $sl = (Get-Content $so -Raw -EA 0) }; $sr = ''; if (Test-Path $se) { $sr = (Get-Content $se -Raw -EA 0) }; $at = (($sl + "`n" + $sr) -replace "`r`n", ' ')
          if ($at -match 'Serve is not enabled') { $el = $null; if ($at -match 'https://login\.tailscale\.com/f/serve\?[^\s]+') { $el = $Matches[0] }; Write-Host "Serve OFF - enable once: $el"; $su = '' } else { if ($sl) { Write-Host "[serve] $($at.Trim())" } }
          if ($su) { Write-Host "SERVE_WEBAPP_LINK: $su"; "**[>>> OPEN RDP WEB-APP <<<]($su)**" >> $env:GITHUB_STEP_SUMMARY } else { "_Serve not ready - use ghrdp paste._" >> $env:GITHUB_STEP_SUMMARY }
      - name: Enable RDP + harden + NLA off + port 7331
        shell: pwsh
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0   # NLA OFF -> fixes 0x3/0x9 for fresh local accounts (tailnet firewall still restricts)
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 2
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA 0
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -EA 0 | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -EA 0
          Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0; New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -EA 0 | Out-Null
          & netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null; $LASTEXITCODE = 0
      - name: Create secure random RDP account + D-RDP-Storage + pre-create + ROBUST RDP auth
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'; $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | % { $_.ToString('x2') }))
          function New-SafePassword { param($U, $F, $L = 24); $lo = 'abcdefghijkmnopqrstuvwxyz'; $up = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $di = '23456789'; $sp = '!@^-_+~'; $all = $lo + $up + $di + $sp; $b4 = [byte[]]::new(4); function RI($m) { $rng.GetBytes($b4); [int]([BitConverter]::ToUInt32($b4, 0) % [uint32]$m) }; function PK($s) { [string]$s[(RI $s.Length)] }; $bad = New-Object Collections.Generic.HashSet[string]; foreach ($x in @($U, $F)) { $s = ([string]$x).ToLower(); for ($i = 0; $i -le ($s.Length - 3); $i++) { [void]$bad.Add($s.Substring($i, 3)) } }; for ($a = 0; $a -lt 500; $a++) { $r = [char[]]::new($L); $r[0] = (PK $lo)[0]; $r[1] = (PK $up)[0]; $r[2] = (PK $di)[0]; $r[3] = (PK $sp)[0]; for ($i = 4; $i -lt $L; $i++) { $r[$i] = (PK $all)[0] }; for ($i = $L - 1; $i -gt 0; $i--) { $j = RI ($i + 1); $t = $r[$i]; $r[$i] = $r[$j]; $r[$j] = $t }; $c = -join $r; $lw = $c.ToLower(); $good = $true; foreach ($t in $bad) { if ($t -and $lw.Contains($t)) { $good = $false; break } }; if ($good) { return $c } }; throw 'pwd gen fail' }
          $created = $false; $pass = $null
          for ($try = 0; $try -lt 6; $try++) { $pass = New-SafePassword $user 'RDP Session' (24 + $try); try { New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -EA Stop | Out-Null; $created = $true; break } catch { if ($_.ToString() -match 'InvalidPasswordException') { Write-Host "pwd rejected $try" } else { throw } } }
          if (-not $created) { throw "New-LocalUser failed." }
          Enable-LocalUser -Name $user -EA 0
          # ROBUST group add via SID (language-independent) + verify + net-localgroup fallback -> fixes 0x3/0x9
          $sidAdmin = New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544'); $sidRdp = New-Object Security.Principal.SecurityIdentifier('S-1-5-32-555')
          foreach ($pair in @(@($sidAdmin, 'Administrators'), @($sidRdp, 'Remote Desktop Users'))) {
            $sid = $pair[0]; $gn = $pair[1]; $in = $false
            for ($att = 0; $att -lt 3 -and -not $in; $att++) {
              try { Add-LocalGroupMember -SID $sid -Member $user -EA Stop } catch { Write-Host "Add-LocalGroupMember $gn err: $($_.Exception.Message)" }
              try { $m = Get-LocalGroupMember -SID $sid -EA 0; $in = @($m | % { $_.Name }) -contains $user } catch {}
              if (-not $in) { try { & net.exe localgroup $gn $user /add 2>$null | Out-Null; $LASTEXITCODE = 0; $m = Get-LocalGroupMember -SID $sid -EA 0; $in = @($m | % { $_.Name }) -contains $user } catch {} }
              if (-not $in) { Start-Sleep 1 }
            }
            if (-not $in) { throw "FAILED to add $user to $gn (SID $sid). RDP would be denied (0x9)." }
            Write-Host "verified $user in $gn"
          }
          foreach ($sub in @('Downloads', 'Desktop', 'Documents', 'AppData\Local\Temp', 'AppData\Roaming\qBittorrent')) { try { New-Item -ItemType Directory -Path (Join-Path "C:\Users\$user" $sub) -Force -EA 0 | Out-Null } catch {} }
          if (Test-Path 'D:\') { $big = 'D:\RDP-Storage'; New-Item -ItemType Directory -Path $big -Force | Out-Null; & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0; $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save(); Write-Host "D-Storage ready" }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"; Write-Host "Created $user (RDP auth verified)"
      - name: Show RDP credentials
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim(); $u = $env:RDP_USER; $p = $env:RDP_PASS; $g = "ghrdp://$ip/" + [uri]::EscapeDataString($u) + "/" + [uri]::EscapeDataString($p); Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $g); $su = $env:SERVE_URL
          Write-Host "RDP IP=$ip USER=$u PASS=$p"; if ($su) { Write-Host "WEBAPP_LINK: $su" }; Write-Host "PASTE: $g"
      - name: Write mirror lib (hardened gofile + rentry/telegraph + per-file progress)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { $b = [IO.File]::ReadAllBytes($env:GHRDP_CFG); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json) }
          function Save-Cfg($c) { [IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding $false)) }
          function B64U($s) { $x = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+', '-').Replace('/', '_').TrimEnd('=') }
          $global:GHRDP_PROG = @{ ts = ''; alive = $true; rentryEdit = ''; indexBackend = ''; active = @{ name = ''; phase = 'idle'; bytesDone = 0; bytesTotal = 0; pct = 0; speedBps = 0 }; agg = @{ total = 0; done = 0; active = 0; failed = 0; tracked = 0; bytesDone = 0; bytesTotal = 0; overallPct = 0; speedBps = 0 }; files = @(); log = @(); scan = @{} }
          $global:GHRDP_PROG_PATH = $null; $global:GHRDP_LASTFLUSH = 0; $global:GHRDP_DONE_BYTES = 0; $global:GHRDP_TOTAL_BYTES = 0; $global:GHRDP_SP = @{ t = 0; b = 0 }; $global:GHRDP_SP_A = @{ t = 0; b = 0 }; $global:GHRDP_CUR = $null
          function Init-Progress($p) { $global:GHRDP_PROG_PATH = $p; $n = [datetime]::Now.Ticks; $global:GHRDP_SP = @{ t = $n; b = 0 }; $global:GHRDP_SP_A = @{ t = $n; b = 0 } }
          function Set-Active($n, $ph, $tot) { $a = $global:GHRDP_PROG.active; $a.name = $n; $a.phase = $ph; $a.bytesDone = 0; $a.bytesTotal = [long]$tot; $a.pct = 0; $a.speedBps = 0; $global:GHRDP_SP_A = @{ t = [datetime]::Now.Ticks; b = 0 }; if ($global:GHRDP_CUR) { $global:GHRDP_CUR.phase = $ph; $global:GHRDP_CUR.bytesDone = 0; $global:GHRDP_CUR.bytesTotal = [long]$tot; $global:GHRDP_CUR.pct = 0 } }
          function Tick-Bytes($n) { $p = $global:GHRDP_PROG; $p.active.bytesDone += [long]$n; if ($global:GHRDP_CUR) { $global:GHRDP_CUR.bytesDone += [long]$n; if ($global:GHRDP_CUR.bytesTotal -gt 0) { $global:GHRDP_CUR.pct = [math]::Round(100.0 * $global:GHRDP_CUR.bytesDone / $global:GHRDP_CUR.bytesTotal, 1) } }; $now = [datetime]::Now.Ticks; if (($now - $global:GHRDP_LASTFLUSH) -gt 1500000) { Flush-Progress $false } }
          function Flush-Progress($force) { $now = [datetime]::Now.Ticks; if (-not $force -and ($now - $global:GHRDP_LASTFLUSH) -lt 1500000) { return }; $global:GHRDP_LASTFLUSH = $now; $p = $global:GHRDP_PROG; $p.ts = [datetime]::Now.ToString('o'); $comp = $global:GHRDP_DONE_BYTES + $(if ($p.active.phase -eq 'upload') { $p.active.bytesDone } else { 0 }); $dt = ($now - $global:GHRDP_SP.t) / 1e7; if ($dt -gt 0.5) { $p.agg.speedBps = [math]::Max(0, [math]::Round(($comp - $global:GHRDP_SP.b) / $dt)); $global:GHRDP_SP = @{ t = $now; b = $comp } }; $dta = ($now - $global:GHRDP_SP_A.t) / 1e7; if ($dta -gt 0.5) { $p.active.speedBps = [math]::Max(0, [math]::Round(($p.active.bytesDone - $global:GHRDP_SP_A.b) / $dta)); $global:GHRDP_SP_A = @{ t = $now; b = $p.active.bytesDone } }; if ($p.active.bytesTotal -gt 0) { $p.active.pct = [math]::Round(100.0 * $p.active.bytesDone / $p.active.bytesTotal, 1) } else { $p.active.pct = 0 }; $p.agg.bytesDone = $comp; if ($p.agg.bytesTotal -gt 0) { $p.agg.overallPct = [math]::Round(100.0 * $comp / $p.agg.bytesTotal, 1) } else { $p.agg.overallPct = 0 }; if ($global:GHRDP_PROG_PATH) { try { $t = $global:GHRDP_PROG_PATH + '.tmp'; [IO.File]::WriteAllText($t, ($p | ConvertTo-Json -Depth 7 -Compress), (New-Object Text.UTF8Encoding $false)); [IO.File]::Move($t, $global:GHRDP_PROG_PATH, $true) } catch {} } }
          function Encrypt-File($in, $out, $pw) { $a = [Security.Cryptography.Aes]::Create(); $a.KeySize = 256; $a.Mode = 'CBC'; $a.Padding = 'PKCS7'; $s = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($s); $a.IV = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($a.IV); $k = New-Object Security.Cryptography.Rfc2898DeriveBytes($pw, $s, 100000, [Security.Cryptography.HashAlgorithmName]::SHA256); $a.Key = $k.GetBytes(32); $of = [IO.File]::Create($out); $of.Write($s, 0, 16); $of.Write($a.IV, 0, 16); $cs = New-Object Security.Cryptography.CryptoStream($of, $a.CreateEncryptor(), [Security.Cryptography.CryptoStreamMode]::Write); $if = [IO.File]::Open($in, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite); $bf = New-Object byte[] 65536; $r = 1; while ($r -gt 0) { $r = $if.Read($bf, 0, $bf.Length); if ($r -gt 0) { $cs.Write($bf, 0, $r); Tick-Bytes $r } }; $if.Close(); $cs.Close(); $of.Close(); $a.Clear() }
          # HARDENED GOFILE: curl primary + cookie jar + server rotation + backoff + -k last resort
          function Upload-Gofile-Streamed($enc, $disp) {
            $jar = Join-Path $env:TEMP ('gf_' + [guid]::NewGuid().ToString('N') + '.txt'); $ua = 'Mozilla/5.0 ghrdp/1'
            for ($a = 1; $a -le 6; $a++) {
              $srv = $null; try { $raw = & curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 --max-time 30 'https://api.gofile.io/getServer'; $gj = $raw | ConvertFrom-Json -EA Stop; $srv = $gj.data.server } catch { $LASTEXITCODE = 0; Start-Sleep (4 * $a); continue }
              if (-not $srv) { Start-Sleep (4 * $a); continue }
              $code = $null; $useK = ($a -ge 5)
              $kflag = if ($useK) { '-k' } else { '' }
              try { $raw = & curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 $kflag --connect-timeout 30 --max-time 1800 -X POST ("https://$srv.gofile.io/contents/uploadfile") -F ("file=@$enc;filename=$disp"); $uj = $raw | ConvertFrom-Json -EA Stop; if ($uj.status -eq 'ok') { $code = if ($uj.data.downloadPage) { $uj.data.downloadPage } elseif ($uj.data.code) { "https://gofile.io/d/$($uj.data.code)" } elseif ($uj.data.id) { "https://gofile.io/d/$($uj.data.id)" } } else { "gf a$a status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append } } catch { $LASTEXITCODE = 0 }
              if ($code) { Remove-Item $jar -Force -EA 0; return $code }
              Start-Sleep ([math]::Min(60, 6 * $a))
            }
            Remove-Item $jar -Force -EA 0; return $null
          }
          function Load-Index($c) { if (Test-Path $c.idxFile) { try { return [Collections.ArrayList]@(Get-Content $c.idxFile -Raw | ConvertFrom-Json -EA Stop) } catch {} }; return (New-Object Collections.ArrayList) }
          function Save-Index($c, $i) { [IO.File]::WriteAllText($c.idxFile, ($i | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding $false)) }
          function Build-IndexText($c, $i) { $L = New-Object Collections.ArrayList; [void]$L.Add('# GitHub RDP - mirrored files'); [void]$L.Add(''); [void]$L.Add('AES-256 on gofile. Decrypt password: ' + $c.decPw); [void]$L.Add(''); if ($i.Count -eq 0) { [void]$L.Add('_(no files yet)_') }; $n = 1; foreach ($it in $i) { $ln = "$n. **$($it.name)** [$($it.status)] ($($it.src)) $($it.time)"; if ($it.gofile) { $ln += '  ->  ' + $it.gofile }; [void]$L.Add($ln); $n++ }; return ($L -join "`r`n") }
          function Build-IndexNodes($t) { $n = New-Object Collections.ArrayList; foreach ($ln in ($t -split "`r?`n")) { if ($ln -match '^\s*$') { continue }; if ($ln -match '^#\s*(.*)$') { [void]$n.Add(@{ tag = 'h3'; children = @($Matches[1]) }) } else { [void]$n.Add(@{ tag = 'p'; children = @($ln) }) } }; return ($n | ConvertTo-Json -Depth 8 -Compress) }
          # INDEX = RENTRY (permanent, known edit code) PRIMARY + TELEGRAPH fallback
          function Push-Index($c, $t) {
            $nodes = Build-IndexNodes $t; $slug = $c.rentrySlug; $code = $c.rentryEditCode; $url = 'https://rentry.co/' + $slug; $ok = $false
            if ($slug -and $code) {
              try {
                $jar = New-Object Net.CookieContainer; $g = [Net.HttpWebRequest]::Create('https://rentry.co/'); $g.CookieContainer = $jar; $g.UserAgent = 'ghrdp/1'; $g.Timeout = 20000; try { $gr = $g.GetResponse(); $gr.Close() } catch {}
                $csrf = ''; try { $csrf = $jar.GetCookies('https://rentry.co/')['csrftoken'].Value } catch {}
                foreach ($ep in @('edit', 'new')) { try { $body = 'edit_code=' + [uri]::EscapeDataString($code) + '&text=' + [uri]::EscapeDataString($t) + '&url=' + [uri]::EscapeDataString($slug); $p = [Net.HttpWebRequest]::Create('https://rentry.co/api/' + $ep); $p.Method = 'POST'; $p.CookieContainer = $jar; $p.UserAgent = 'ghrdp/1'; $p.ContentType = 'application/x-www-form-urlencoded'; if ($csrf) { $p.Headers.Add('X-CSRFToken', $csrf) }; $p.Referer = $url; $p.Timeout = 25000; $bb = [Text.Encoding]::UTF8.GetBytes($body); $rs = $p.GetRequestStream(); $rs.Write($bb, 0, $bb.Length); $rs.Close(); $pr = $p.GetResponse(); $sr = New-Object IO.StreamReader($pr.GetResponseStream()); $raw = $sr.ReadToEnd(); $sr.Close(); $pr.Close(); $j = $raw | ConvertFrom-Json -EA 0; if ($j -and ($j.status -eq 'success' -or $j.content)) { $ok = $true; break } } catch { $LASTEXITCODE = 0 } }
              } catch { $LASTEXITCODE = 0 }
            }
            if ($ok) { $c.rentryUrl = $url; $c.indexBackend = 'rentry' }
            else {
              $title = 'GitHub RDP - mirrored files'
              if (-not $c.telegraphToken) { try { $acc = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{ short_name = 'ghrdp'; author_name = 'GitHub RDP Mirror' } -TimeoutSec 30; if ($acc.ok) { $c.telegraphToken = $acc.result.access_token } } catch { $LASTEXITCODE = 0 } }
              if ($c.telegraphToken) { try { if (-not $c.telegraphPath) { $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{ access_token = $c.telegraphToken; title = $title; content = $nodes; return_content = 'false' } -TimeoutSec 30; if ($pg.ok) { $c.telegraphPath = $pg.result.path; $c.rentryUrl = $pg.result.url; $c.indexBackend = 'telegraph' } } else { $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{ access_token = $c.telegraphToken; path = $c.telegraphPath; title = $title; content = $nodes; return_content = 'false' } -TimeoutSec 30; if ($pg.ok) { $c.rentryUrl = $pg.result.url; $c.indexBackend = 'telegraph' } } } catch { $LASTEXITCODE = 0 } }
            }
            Save-Cfg $c; $global:GHRDP_PROG.rentryEdit = $code; $global:GHRDP_PROG.indexBackend = $c.indexBackend; return [bool]$c.rentryUrl
          }
          LIBEOF
      - name: Write dashboard server (NO gate + BOM-safe + last-good cache + scan/rentry)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
          function Start-GhrdpServer {
            param([int]$Port, [string]$BindAddress, [string]$UiDir, [string]$ProgressPath, [string]$CfgPath, [string]$EmergencyFlagPath, [string]$FlushFlagPath, [string]$OkFile, [int]$LimitMinutes = 330)
            $ErrorActionPreference = 'SilentlyContinue'; $global:GHRDP_CFGERR = ''; $global:GHRDP_PROGERR = ''; $global:GHRDP_LASTPROG = $null
            $uiPath = Join-Path $UiDir 'ghrdp-ui.html'; $uiBytes = if (Test-Path $uiPath) { [IO.File]::ReadAllBytes($uiPath) } else { [Text.Encoding]::UTF8.GetBytes('<h1 style="color:#e9eef3;background:#0a0e12;padding:30px">ui missing</h1>') }
            function ReadJsonSafe($p, [ref]$e) { if (-not (Test-Path $p)) { $e.Value = 'file-missing'; return $null }; try { $fs = [IO.File]::Open($p, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite); $ms = New-Object IO.MemoryStream; $fs.CopyTo($ms); $fs.Close(); $b = $ms.ToArray(); $ms.Close(); if ($b.Length -eq 0) { $e.Value = 'empty'; return $null }; if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop) } catch { $e.Value = ('parse: ' + $_.Exception.Message); return $null } }
            function ParseHeaders($raw) { $h = @{}; $l = $raw -split "`r`n"; for ($i = 1; $i -lt $l.Length; $i++) { $x = $l[$i].IndexOf(':'); if ($x -gt 0) { $h[($l[$i].Substring(0, $x).Trim().ToLower())] = $l[$i].Substring($x + 1).Trim() } }; $q = @{}; if ($l[0] -match '\?(.+)\s') { foreach ($kv in ($Matches[1] -split '&')) { $p = $kv -split '='; if ($p.Length -eq 2) { $q[$p[0].ToLower()] = [uri]::UnescapeDataString($p[1]) } } }; return @{ headers = $h; query = $q } }
            function Is-Loopback($c) { try { return $c.Client.RemoteEndPoint.Address.IsLoopback } catch { return $false } }
            function ReadReq($s) { $s.ReadTimeout = 5000; $a = New-Object Text.StringBuilder; $bf = New-Object byte[] 4096; while ($true) { $n = 0; try { $n = $s.Read($bf, 0, $bf.Length) } catch { break }; if ($n -le 0) { break }; [void]$a.Append([Text.Encoding]::ASCII.GetString($bf, 0, $n)); if ($a.ToString().Contains("`r`n`r`n")) { break }; if ($a.Length -gt 16384) { break } }; return $a.ToString() }
            function WriteResp($s, $code, $ct, $bb) { $st = switch ([int]$code) { 200 { 'OK' } 404 { 'Not Found' } default { 'OK' } }; $hd = "HTTP/1.1 $code $st`r`nContent-Type: $ct`r`nContent-Length: $($bb.Length)`r`nConnection: close`r`nCache-Control: no-store`r`nAccess-Control-Allow-Origin: *`r`n`r`n"; $hb = [Text.Encoding]::ASCII.GetBytes($hd); $s.Write($hb, 0, $hb.Length); if ($bb.Length -gt 0) { $s.Write($bb, 0, $bb.Length) }; $s.Flush() }
            function JB($o) { return [Text.Encoding]::UTF8.GetBytes(($o | ConvertTo-Json -Depth 9 -Compress)) }
            function HandleOne($client) {
              try {
                $st = $client.GetStream(); $req = ReadReq $st; $pa = ParseHeaders $req; $path = '/'; if ($req -match '(?m)^GET\s+(\S+)') { $path = ($Matches[1] -split '\?')[0] }; $loop = Is-Loopback $client
                $ce = [ref]$global:GHRDP_CFGERR; $cfg = ReadJsonSafe $CfgPath $ce
                if ($path -eq '/emergency') { Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ascii; WriteResp $st 200 'application/json' (JB @{ ok = $true }); return }
                if ($path -eq '/diag') { $pe = [ref]$global:GHRDP_PROGERR; $pr = ReadJsonSafe $ProgressPath $pe; if (-not $pr -and $global:GHRDP_LASTPROG) { $pr = $global:GHRDP_LASTPROG; $global:GHRDP_PROGERR = 'cache' }; $d = [ordered]@{ portListening = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0); requestLoopback = $loop; firewallRulePresent = [bool](Get-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0); cfgLoaded = [bool]$cfg; cfgError = $global:GHRDP_CFGERR; progressLoaded = [bool]$pr; progressError = $global:GHRDP_PROGERR; requestHost = $pa.headers['host']; tailscaleIp = $(if ($cfg) { $cfg.rdpIp } else { '' }) }; WriteResp $st 200 'application/json' (JB $d); return }
                if ($path -eq '/install.ps1') { $ip2 = Join-Path $UiDir 'ghrdp-install.ps1'; if (Test-Path $ip2) { WriteResp $st 200 'application/octet-stream' ([IO.File]::ReadAllBytes($ip2)) } else { WriteResp $st 404 'text/plain' ([Text.Encoding]::UTF8.GetBytes('missing')) }; return }
                if ($path -eq '/progress' -or $path -eq '/app.js') { $pe = [ref]$global:GHRDP_PROGERR; $pr = ReadJsonSafe $ProgressPath $pe; if ($pr) { $global:GHRDP_LASTPROG = $pr } elseif ($global:GHRDP_LASTPROG) { $pr = $global:GHRDP_LASTPROG; $global:GHRDP_PROGERR = 'cache' } else { $pr = @{ alive = $false } }; $o = [ordered]@{ serverTs = (Get-Date -f o); viaLoopback = $loop; cfgLoaded = [bool]$cfg; ghrdp = $(if ($cfg) { $cfg.ghrdp } else { '' }); rentry = $(if ($cfg) { $cfg.rentryUrl } else { '' }); mirror = $(if ($cfg) { [bool]$cfg.mirror } else { $false }); creds = @{ ip = $(if ($cfg) { $cfg.rdpIp } else { '' }); user = $(if ($cfg) { $cfg.rdpUser } else { '' }); pass = $(if ($cfg) { $cfg.rdpPass } else { '' }) }; ts = $pr.ts; alive = $pr.alive; active = $pr.active; agg = $pr.agg; files = $pr.files; scan = $pr.scan; log = $pr.log }; WriteResp $st 200 'application/json' (JB $o); return }
                $html = [Text.Encoding]::UTF8.GetString($uiBytes); $ip = if ($cfg) { [string]$cfg.rdpIp } else { '' }; $us = if ($cfg) { [string]$cfg.rdpUser } else { '' }; $pw = if ($cfg) { [string]$cfg.rdpPass } else { '' }; $gh = if ($cfg) { [string]$cfg.ghrdp } else { '' }; $sv = if ($loop) { '0' } else { '1' }; $html = $html.Replace('__IP__', $ip).Replace('__USER__', $us).Replace('__PASS__', $pw).Replace('__GHRDP__', $gh).Replace('__STATIC__', $sv); WriteResp $st 200 'text/html; charset=utf-8' ([Text.Encoding]::UTF8.GetBytes($html))
              } catch { try { WriteResp $st 200 'application/json' (JB @{ serverTs = (Get-Date -f o); handlerError = $_.Exception.Message; creds = @{ ip = ''; user = ''; pass = '' } }) } catch {} }
              try { $client.Close() } catch {}
            }
            $ip = [Net.IPAddress]::Parse($BindAddress); $li = New-Object Net.Sockets.TcpListener $ip, ([int]$Port); try { $li.Start() } catch { Set-Content $OkFile ("FAIL $_") -Encoding ascii; throw }
            Set-Content $OkFile ("LISTENING pid=$PID port=$Port") -Encoding ascii; $s0 = Get-Date; $lim = (New-TimeSpan -Minutes $LimitMinutes)
            while (((Get-Date) - $s0) -lt $lim) { if (Test-Path $FlushFlagPath) { Remove-Item $FlushFlagPath -Force -EA 0 }; while ($li.Pending()) { $c = $null; try { $c = $li.AcceptTcpClient() } catch {}; if ($c) { HandleOne $c } }; Start-Sleep -Milliseconds 200 }
            try { $li.Stop() } catch {}
          }
          SERVEREOF
      - name: Write mirror watcher (COM roots + careful one-by-one + per-file + resumable)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference = 'Continue'; $pe = Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'
          function Write-HB($m) { try { [IO.File]::WriteAllText($pe, (@{ ts = (Get-Date -f o); alive = $true; rentryEdit = ''; indexBackend = ''; agg = @{ tracked = 0; done = 0; active = 0; failed = 0 }; files = @(); log = @($m); scan = @{} } | ConvertTo-Json -Depth 7 -Compress), (New-Object Text.UTF8Encoding $false)) } catch {} }
          $cn = $false; $mx = New-Object Threading.Mutex $true, 'Global\ghrdp-watcher-single', ([ref]$cn); if (-not $cn) { Write-HB 'lock held - exit'; exit 0 }
          $cfg = $null; try { $b = [IO.File]::ReadAllBytes($CfgPath); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; $cfg = ([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop } catch { Write-HB ('CFG FAIL ' + $_.Exception.Message); throw }
          if (-not $cfg) { Write-HB 'CFG NULL'; throw 'cfg' }; $env:GHRDP_CFG = $CfgPath; $env:GHRDP_LOG = $cfg.logFile; . $cfg.libPath
          if (-not (Get-Command Init-Progress -EA 0)) { Write-HB 'LIB NOT LOADED'; throw 'lib' }; Init-Progress $cfg.progressPath; $script:RUNLOG = New-Object Collections.ArrayList; $script:SCAN = @{}
          function LErr($t, $e) { $m = ("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'), $t, $e.Exception.Message); [void]$script:RUNLOG.Add($m); try { Add-Content $cfg.logFile $m -EA 0 } catch {} }
          function ScanLine { $p = @($script:SCAN.GetEnumerator() | % { $v = $_.Value; $s = $_.Key + ':raw=' + $v.rawTotal + '/elig=' + $v.eligible + ' @' + $v.path; if ($v.error) { $s += ' ERR=' + $v.error }; $s }); return ('[scan] ' + ($p -join ' | ')) }
          function Add-Root($L, $p, $tag, $rec, $min) { if (-not $p) { return $L }; $x = $p.TrimEnd('\'); if (-not $x) { return $L }; foreach ($r in $L) { if ($r.path.TrimEnd('\').ToLower() -eq $x.ToLower()) { return $L } }; try { New-Item -ItemType Directory -Path $x -Force -EA 0 | Out-Null } catch {}; $L += @{ path = $x; tag = $tag; rec = [bool]$rec; min = [long]$min }; return $L }
          function Resolve-COM($n) { foreach ($s in $n) { try { $sh = New-Object -ComObject Shell.Application; $ns = $sh.NameSpace($s); if ($ns -and $ns.Self -and $ns.Self.Path) { return $ns.Self.Path } } catch {} }; return $null }
          function Build-Roots {
            $R = @(); foreach ($r in $cfg.roots) { $R = Add-Root $R $r.path $r.tag $r.rec $r.min }
            $map = @{ Downloads = @('shell:Downloads'); Desktop = @('shell:Desktop'); Documents = @('shell:Personal', 'shell:Documents') }; $guids = @{ Downloads = @('{374DE290-123F-45C5-91F6-3D0D0A7C3D2D}', '{7D83EE9B-2244-4E70-B1F5-5393042AF1E4}'); Desktop = @('{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}'); Documents = @('{FDD39AD0-238F-46AF-ADB4-6C85480369C7}', '{24D89E24-2F19-4534-9DDE-6A6671FBB8FE}') }; $keys = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Shell Folders')
            foreach ($tag in 'Downloads', 'Desktop', 'Documents') { $p = Resolve-COM $map[$tag]; if (-not $p) { foreach ($k in $keys) { if (Test-Path $k) { $pr = Get-ItemProperty -Path $k -EA 0; foreach ($gn in $guids[$tag]) { $v = $pr.$gn; if ($v -and $v -is [string]) { $p = [Environment]::ExpandEnvironmentVariables($v); if ($p -and (Test-Path -LiteralPath $p -PathType Container)) { break } else { $p = $null } } }; if ($p) { break } } } }; if (-not $p) { $p = Join-Path $env:USERPROFILE $tag }; $R = Add-Root $R $p $tag $false 0; foreach ($base in @((Join-Path $env:USERPROFILE 'OneDrive'), $env:OneDrive, $env:OneDriveConsumer, $env:OneDriveCommercial)) { if ($base) { $R = Add-Root $R (Join-Path $base $tag) $tag $false 0 } } }
            $q = Join-Path $env:APPDATA 'qBittorrent\qBittorrent.ini'; if (Test-Path $q) { $t = Get-Content $q -Raw -EA 0; if ($t) { if ($t -match '(?m)^\s*SavePath\s*=\s*(.+)$') { $R = Add-Root $R $Matches[1].Trim() 'qB-Save' $true 0 }; if ($t -match '(?m)^\s*TempPath\s*=\s*(.+)$') { $R = Add-Root $R $Matches[1].Trim() 'qB-Temp' $true 102400 } } }
            $R = Add-Root $R (Join-Path $env:LOCALAPPDATA 'Temp') 'Temp' $true 102400; return $R
          }
          $roots = Build-Roots; Write-HB ('roots(' + $roots.Count + ')=' + (($roots | % { $_.tag + '=' + (Test-Path -LiteralPath $_.path -PathType Container) }) -join ','))
          $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb')
          $done = @{}; if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | % { $done[$_] = $true } }; $idx = Load-Index $cfg; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch { LErr 'init-idx' $_ }
          function DoUpload($fi, $tag) {
            if ($done.ContainsKey($fi.FullName)) { return }; $len = $fi.Length; $safe = $fi.Name -replace '\|', '_'; $disp = ($safe -replace '[^\x20-\x7E]', '_')
            $ex = $idx | ? { $_.name -eq $safe -and $_.src -eq $tag } | select -First 1
            if (-not $ex) { $ex = @{ name = $safe; src = $tag; status = 'queued'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss'); pct = 0; phase = 'queued'; bytesDone = 0; bytesTotal = $len; attempts = 0; nextTry = 0 }; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }
            if ($ex.nextTry -and ([datetime]::Now -lt [datetime]$ex.nextTry)) { return }
            $ex.status = 'uploading'; $ex.time = (Get-Date -f 'HH:mm:ss'); $ex.bytesTotal = $len; $ex.phase = 'encrypt'; $global:GHRDP_CUR = $ex
            $enc = Join-Path $cfg.tmpDir ('ge_' + [guid]::NewGuid().ToString('N') + '.enc'); $gf = $null
            Set-Active $disp 'encrypt' $len; try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch { LErr ('enc ' + $fi.Name) $_ }
            $ex.phase = 'upload'; Set-Active $disp 'upload' $len; try { $gf = Upload-Gofile-Streamed $enc $disp } catch { LErr ('up ' + $fi.Name) $_ }
            Remove-Item $enc -Force -EA 0; $global:GHRDP_CUR = $null
            if ($gf) { $ex.payload = B64U ($gf + '|' + $cfg.decPw + '|' + $safe); $ex.gofile = $gf; $ex.status = 'ok'; $ex.pct = 100; $ex.phase = 'done'; $ex.time = (Get-Date -f 'HH:mm:ss'); $done[$fi.FullName] = $true; $fi.FullName | Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch { LErr 'push' $_ }; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len)" | Out-File $cfg.logFile -Append }
            else { $ex.status = 'retry'; $ex.phase = 'wait'; $ex.attempts = ([int]$ex.attempts) + 1; $ex.nextTry = ([datetime]::Now.AddSeconds([math]::Min(120, 10 * $ex.attempts))).ToString('o'); Save-Index $cfg $idx; "[$(Get-Date -f o)] RETRY $tag $($fi.Name) #$($ex.attempts)" | Out-File $cfg.logFile -Append }
            Set-Active '' 'idle' 0
          }
          function Scan($r) {
            $elig = 0; $rawAll = @(); $err = ''
            if (-not (Test-Path -LiteralPath $r.path -PathType Container)) { $script:SCAN[$r.tag] = @{ rawTotal = 0; eligible = 0; path = $r.path; error = 'path-missing'; rawSamples = @() }; return }
            try { $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 } else { Get-ChildItem -LiteralPath $r.path -File -EA 0 } } catch { $script:SCAN[$r.tag] = @{ rawTotal = -1; eligible = 0; path = $r.path; error = $_.Exception.Message; rawSamples = @() }; return }
            $rawAll = @($items); $rn = @($rawAll | select -First 4 | % { $_.Name })
            foreach ($fi in $rawAll) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; $elig++; DoUpload $fi $r.tag }
            $script:SCAN[$r.tag] = @{ rawTotal = $rawAll.Count; eligible = $elig; path = $r.path; error = $err; rawSamples = $rn }
          }
          function SweepAll($r) { if (-not (Test-Path -LiteralPath $r.path -PathType Container)) { return }; $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 | sort Length -desc } else { Get-ChildItem -LiteralPath $r.path -File -EA 0 | sort Length -desc }; foreach ($fi in $items) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; DoUpload $fi $r.tag } }
          function EmergencyPass { "[$(Get-Date -f o)] EMERGENCY" | Out-File $cfg.logFile -Append; foreach ($p in @('qbittorrent', 'qbittorrent-nox')) { Get-Process -Name $p -EA 0 | Stop-Process -Force -EA 0 }; Start-Sleep 4; for ($rd = 0; $rd -lt 3; $rd++) { foreach ($r in $roots) { Scan $r }; Start-Sleep 4 }; foreach ($r in $roots) { SweepAll $r }; Save-Index $cfg $idx; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch {}; Remove-Item $cfg.emergencyFlag -Force -EA 0 }
          function SyncProg { try { $p = $global:GHRDP_PROG; $d = 0; $u = 0; $f = 0; foreach ($it in $idx) { if ($it.status -eq 'ok') { $d++ } elseif ($it.status -eq 'limit') { $f++ } else { $u++ } }; $p.agg.done = $d; $p.agg.failed = $f; $p.agg.tracked = $idx.Count; $p.agg.active = if ($p.active.phase -ne 'idle') { 1 } else { 0 }; $p.agg.bytesTotal = $global:GHRDP_TOTAL_BYTES; $p.files = @( foreach ($it in $idx) { @{ name = $it.name; src = $it.src; status = $it.status; pct = $it.pct; phase = $it.phase; bytesDone = $it.bytesDone; bytesTotal = $it.bytesTotal } } ); $p.scan = @{}; foreach ($k in @($script:SCAN.Keys)) { $p.scan[$k] = $script:SCAN[$k] }; $mk = '[INDEX] backend=' + $cfg.indexBackend + ' url=' + $cfg.rentryUrl + ' edit=' + $cfg.rentryEditCode; $er = @($script:RUNLOG | select -Last 5); $ft = @(); if (Test-Path $cfg.logFile) { $g = Get-Content $cfg.logFile -Tail 10 -EA 0; if ($g) { $ft = @($g) } }; $p.log = @($mk) + @($er) + @(ScanLine) + $ft; Flush-Progress $true } catch { LErr 'sync' $_ } }
          while ($true) {
            if (Test-Path $cfg.emergencyFlag) { try { EmergencyPass } catch { LErr 'em' $_ } }
