          <style>body{font-family:Segoe UI,system-ui,sans-serif;background:#0a0e12;color:#e9eef3;margin:0;padding:22px}h1{margin:0 0 6px}.sub{color:#8aa0ad;margin-bottom:18px}.panel{background:#11171d;border:1px solid #223039;border-radius:14px;padding:16px;margin:0 0 14px}code{background:#070b0e;border:1px solid #223039;border-radius:8px;padding:6px 8px;display:inline-block;min-width:120px}a.btn,button{display:inline-block;background:#37c6b0;color:#04201c;font-weight:700;border:0;border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;margin:6px 6px 0 0}button.warn{background:#f0644c;color:#fff}button.diag{background:#f4ad3c;color:#231600}pre{background:#070b0e;border:1px solid #223039;border-radius:10px;padding:12px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.big{font-size:52px;font-weight:800}.bar{height:7px;background:#070b0e;border:1px solid #223039;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:#37c6b0;width:0%}.frow{display:grid;grid-template-columns:64px 1fr 90px 50px;gap:8px;align-items:center;font-family:monospace;font-size:12px;padding:5px 2px;border-bottom:1px solid #1a242b}.st{font-size:10px;padding:2px 6px;border-radius:5px;text-align:center}.st.ok{background:#0c3b34;color:#37c6b0}.st.up{background:#3a2f12;color:#f4ad3c}.st.limit{background:#3a1712;color:#e0533d}.eye{font-family:monospace;font-size:11px;padding:3px 0;color:#9fe7d6}.idx{font-family:monospace;font-size:11px;color:#8aa0ad;word-break:break-all}.idx a{color:#37c6b0}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head>
          <body><h1>RDP · Mission Control</h1><div class="sub" id="mode">checking…</div>
          <div class="panel"><div><b>IP</b> <code id="vIp">__IP__</code> <button class="cp" data-k="ip">copy</button></div><div style="margin-top:8px"><b>USER</b> <code id="vUser">__USER__</code> <button class="cp" data-k="user">copy</button></div><div style="margin-top:8px"><b>PASS</b> <code id="vPass">__PASS__</code> <button class="cp" data-k="pass">copy</button></div><div style="margin-top:12px"><a class="btn" id="rdp" href="__GHRDP__">⚡ Open Remote Desktop (zero typing)</a> <button class="diag" id="diagBtn">🔍 Diagnose</button></div><div class="idx" style="margin-top:10px">ghrdp: <a id="ghrdpLink" href="__GHRDP__" style="color:#37c6b0">__GHRDP__</a></div></div>
