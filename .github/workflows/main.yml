          try { [IO.File]::WriteAllText($rp, ($R -join "`r`n"), (New-Object Text.UTF8Encoding $false)); HD 'SAVED'; Say $rp } catch {}
          if (-not $NoPause) { Read-Host 'Enter to close' }
