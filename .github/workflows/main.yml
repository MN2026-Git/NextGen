name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Temp+D-RDP-Storage (AES-256) to gofile+rentry. PUBLIC index! default OFF'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Tailscale
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "tailscale-setup.msi"
          $ok = $false
          for ($a=1; $a -le 4; $a++) {
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
            $LASTEXITCODE = 0
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "Downloaded via curl (attempt $a), size=$((Get-Item $out).Length)"; break }
            Write-Host "curl attempt $a failed, retrying in $((3*$a))s..."; Start-Sleep -Seconds (3 * $a)
          }
          if (-not $ok) {
            for ($a=1; $a -le 3; $a++) {
              try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "Downloaded via IWR (attempt $a)"; break } } catch { Write-Host "IWR attempt $a failed: $_" }
              Start-Sleep -Seconds (3 * $a)
            }
          }
          if (-not $ok) { throw "Could not download Tailscale MSI after retries (transient network issue - just re-run)." }

      - name: Install Tailscale
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5

      - name: Get Tailscale sign-in link
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState) { $daemonOk = $true; break } } catch { }
            if ($i -eq 5) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw "tailscaled not started." }
          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            $txt = ""
            foreach ($f in @($upLog, $upErr)) { if (Test-Path $f) { try { $fs = [System.IO.File]::Open($f,'Open','Read','ReadWrite'); $sr = New-Object System.IO.StreamReader($fs); $txt += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch { } } }
            if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }
            Start-Sleep -Seconds 2
          }
          if (-not $url) { Write-Host $txt; throw "Sign-in link not found." }
          Write-Host "TAILSCALE SIGN-IN LINK: $url"
          $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
          "### Tailscale Sign-in Link (click to authorize the runner)" >> $env:GITHUB_STEP_SUMMARY; "" >> $env:GITHUB_STEP_SUMMARY; "[$url]($url)" >> $env:GITHUB_STEP_SUMMARY

      - name: Wait for Tailscale sign-in
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $authed = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState -eq 'Running') { $authed = $true; break } } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw "Sign-in timeout." }
          Write-Host "Tailscale connected. IP = $((& $ts ip -4).Trim())"

      - name: Enable RDP + harden
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -ErrorAction SilentlyContinue | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -ErrorAction SilentlyContinue
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null; $LASTEXITCODE = 0

      - name: Create secure random RDP account + D-RDP-Storage
        run: |
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $bytes = [byte[]]::new(24); $rng.GetBytes($bytes); $pass = -join ($bytes | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -ErrorAction Stop | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          if (Test-Path 'D:\') {
            $big = 'D:\RDP-Storage'; New-Item -ItemType Directory -Path $big -Force | Out-Null
            & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0
            $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save()
            Write-Host "D:\RDP-Storage ready (146GB-backed, mirrored)."
          } else { Write-Host "No D: drive detected." }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created account: $user"

      - name: Write mirror lib (shared functions)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'EOF'
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { Get-Content $env:GHRDP_CFG -Raw | ConvertFrom-Json }
          function B64U($s){ $x=[Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+','-').Replace('/','_').TrimEnd('=') }
          function Encrypt-File($inPath,$outPath,$password){
          $aes=[System.Security.Cryptography.Aes]::Create(); $aes.KeySize=256; $aes.Mode='CBC'; $aes.Padding='PKCS7'
          $salt=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt)
          $aes.IV=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($aes.IV)
          $kdf=New-Object System.Security.Cryptography.Rfc2898DeriveBytes($password,$salt,100000,[System.Security.Cryptography.HashAlgorithmName]::SHA256); $aes.Key=$kdf.GetBytes(32)
          $outFs=[System.IO.File]::Create($outPath); $outFs.Write($salt,0,16); $outFs.Write($aes.IV,0,16)
          $cs=New-Object System.Security.Cryptography.CryptoStream($outFs, $aes.CreateEncryptor(), [System.Security.Cryptography.CryptoStreamMode]::Write)
          $inFs=[System.IO.File]::Open($inPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
          $buf=[byte[]]::new(65536); $read=1
          while($read -gt 0){ $read=$inFs.Read($buf,0,$buf.Length); if($read -gt 0){ $cs.Write($buf,0,$read) } }
          $inFs.Close(); $cs.Close(); $outFs.Close(); $aes.Clear() }
          function Upload-Gofile($p){
          for ($a=1; $a -le 3; $a++){
          try {
          $gs=(& curl.exe -s --max-time 30 "https://api.gofile.io/getServer") | ConvertFrom-Json -ErrorAction Stop; $srv=$gs.data.server
          $raw=& curl.exe -s --max-time 1800 -X POST "https://$srv.gofile.io/contents/uploadfile" -F "file=@$p"
          $uj=$raw | ConvertFrom-Json -ErrorAction Stop
          if ($uj.status -eq 'ok') { if ($uj.data.downloadPage){return $uj.data.downloadPage}; if ($uj.data.code){return "https://gofile.io/d/$($uj.data.code)"}; if ($uj.data.id){return "https://gofile.io/d/$($uj.data.id)"} }
          "gofile try $a status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append
          } catch { "gofile try $a err $_" | Out-File $env:GHRDP_LOG -Append }
          $LASTEXITCODE = 0; Start-Sleep -Seconds (5*$a) }
          return $null }
          function Push-Rentry($cfg,$text){
          for ($n=0; $n -lt 2; $n++){
          try { $out=& curl.exe -s -S --max-time 30 -X POST ("https://rentry.co/api/edit/"+$cfg.slug) --data-urlencode "edit_code=$($cfg.editCode)" --data-urlencode "text=$text" --data-urlencode "update_mode=replace" 2>$null
          $j=$out | ConvertFrom-Json -ErrorAction Stop; if ("$($j.status)" -eq '200'){return $true}; "rentry $($j.status)" | Out-File $env:GHRDP_LOG -Append } catch { "rentry err $_" | Out-File $env:GHRDP_LOG -Append }
          $LASTEXITCODE = 0; Start-Sleep -Seconds 3 }
          return $false }
          function Load-Index($cfg){ if (Test-Path $cfg.idxFile){ try { return [System.Collections.ArrayList]@(Get-Content $cfg.idxFile -Raw | ConvertFrom-Json -ErrorAction Stop) } catch { } }; return (New-Object System.Collections.ArrayList) }
          function Save-Index($cfg,$idx){ $idx | ConvertTo-Json -Depth 5 | Set-Content $cfg.idxFile -Encoding UTF8 }
          function Icon($s){ if($s -eq 'ok'){return 'OK'} elseif($s -eq 'limit'){return 'LIMIT'} else {return '...' } }
          function Build-Rentry($cfg,$idx){
          $sb=New-Object System.Text.StringBuilder
          [void]$sb.AppendLine("# GitHub RDP - mirrored files"); [void]$sb.AppendLine("")
          [void]$sb.AppendLine("Files are **AES-256 encrypted** on gofile. **Decrypt password:** ``$($cfg.decPw)``"); [void]$sb.AppendLine("")
          [void]$sb.AppendLine("| # | File | Status | One-click | gofile | Source | Time |"); [void]$sb.AppendLine("|---|---|---|---|---|---|---|")
          if ($idx.Count -eq 0){ [void]$sb.AppendLine("| - | _(none yet)_ | - | - | - | - | - |") }
          $n=1; foreach($it in $idx){ $oc=if($it.status -eq 'ok'){'[open](ghrdp://dl/'+$it.payload+')'}else{'-'}; $gf=if($it.gofile){'[gofile]('+$it.gofile+')'}else{'-'}; [void]$sb.AppendLine("| $n | "+$it.name+" | "+(Icon $it.status)+" | "+$oc+" | "+$gf+" | "+$it.src+" | "+$it.time+" |"); $n++ }
          [void]$sb.AppendLine(""); [void]$sb.AppendLine("_OK uploaded  ... progress  LIMIT auto-retry_"); return $sb.ToString() }
          EOF

      - name: Write dashboard server script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'EOF'
          param([string]$Ip,[int]$Port=7331,[string]$Ghrdp,[string]$IndexPath,[string]$HeartbeatPath,[string]$EmergencyFlagPath,[string]$AllDonePath)
          $ErrorActionPreference="SilentlyContinue"
          $listener=New-Object System.Net.HttpListener; $listener.Prefixes.Add("http://${Ip}:${Port}/")
          $ok=$false; try{$listener.Start();$ok=$true}catch{Write-Host "listener failed: $_"}; if(-not $ok){exit 0}
          function Build-Page($ghrdp,$indexPath,$heartbeatPath,$emergencyFlagPath,$allDonePath){
          $alive='NO'; if(Test-Path $heartbeatPath){ $age=[int]((Get-Date)-(Get-Item $heartbeatPath).LastWriteTime).TotalSeconds; if($age -lt 25){$alive="YES ($age s ago)"} }
          $up=0;$pend=0; if(Test-Path $indexPath){ try{ $arr=Get-Content $indexPath -Raw|ConvertFrom-Json -ErrorAction Stop; foreach($it in $arr){ if($it.status -eq 'ok'){$up++}else{$pend++} } }catch{} }
          $alldone = Test-Path $allDonePath
          $rows=""; if(Test-Path $indexPath){ try{ $arr=Get-Content $indexPath -Raw|ConvertFrom-Json -ErrorAction Stop; foreach($it in $arr){ if($it.status -eq 'ok'){ $rows+='<a class="btn file" href="ghrdp://dl/'+$it.payload+'">&#128229; '+[System.Net.WebUtility]::HtmlEncode($it.name)+' ['+$it.status+']</a>' } else { $rows+='<div class="btn file">&#9203; '+[System.Net.WebUtility]::HtmlEncode($it.name)+' ['+$it.status+']</div>' } } }catch{} }
          if(-not $rows){$rows='<p class="muted">No mirrored files yet.</p>'}
          $banner=''; if($alldone){$banner='<div class="ok">ALL UPLOADED - it is now SAFE to press Cancel workflow.</div>'}
          return '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="6"><title>RDP+Files</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Segoe UI,sans-serif;background:#0c1014;color:#e8edf2;padding:24px;display:flex;justify-content:center}.card{width:min(620px,94vw);background:#11171d;border:1px solid #243039;border-radius:18px;padding:28px}.dot{width:10px;height:10px;border-radius:50%;background:#37c6b0;display:inline-block;margin-right:8px}h1{font-size:24px}h2{font-size:14px;color:#9fb0bc;margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}.btn{display:block;margin:8px 0;padding:14px;border-radius:12px;background:#37c6b0;color:#04201c;font-weight:700;text-decoration:none;text-align:center}.btn.file{background:#1c2730;color:#cfe9e4;border:1px solid #2c3b46;text-align:left}.btn.emergency{background:#e0533d;color:#fff;font-size:16px}.ok{background:#1f6f43;color:#fff;padding:16px;border-radius:12px;margin:12px 0;font-weight:700;text-align:center;font-size:16px}.stat{background:#0b0f13;border:1px solid #20292f;border-radius:10px;padding:12px;margin:10px 0;font-size:13px;color:#9fb0bc}.muted{color:#7f93a0;font-size:13px}code{display:block;margin-top:14px;word-break:break-all;background:#0b0f13;border:1px solid #20292f;border-radius:10px;padding:10px;color:#7f93a0;font-size:12px}</style></head><body><div class="card"><h1><span class="dot"></span>Remote Desktop</h1><a class="btn" href="'+$ghrdp+'">Open Remote Desktop</a>'+$banner+'<div class="stat">Watcher alive: <b>'+$alive+'</b> &nbsp;|&nbsp; Uploaded: <b>'+$up+'</b> &nbsp;|&nbsp; Pending: <b>'+$pend+'</b></div><h2>Emergency upload (use BEFORE cancelling)</h2><a class="btn emergency" href="/emergency">UPLOAD EVERYTHING NOW</a><p class="muted">Click it, wait until the green banner appears, THEN press Cancel workflow. Page auto-refreshes every 6s.</p><h2>Mirrored files</h2>'+$rows+'<code>'+$ghrdp+'</code></div></body></html>' }
          while($listener.IsListening){
          $ctx=$listener.GetContext(); $path=$ctx.Request.Url.AbsolutePath
          if($path -eq '/emergency'){ Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ascii; $h='<html><head><meta http-equiv="refresh" content="2; url=/"></head><body style="background:#0c1014;color:#e8edf2;font-family:sans-serif;padding:30px"><h2>Emergency upload triggered. Refreshing dashboard...</h2></body></html>'; $buf=[System.Text.Encoding]::UTF8.GetBytes($h); $ctx.Response.ContentType="text/html; charset=utf-8"; $ctx.Response.ContentLength64=$buf.Length; $ctx.Response.OutputStream.Write($buf,0,$buf.Length); $ctx.Response.Close(); continue }
          $html=Build-Page $ghrdp $IndexPath $HeartbeatPath $EmergencyFlagPath $AllDonePath; $buf=[System.Text.Encoding]::UTF8.GetBytes($html); $ctx.Response.ContentType="text/html; charset=utf-8"; $ctx.Response.ContentLength64=$buf.Length; $ctx.Response.OutputStream.Write($buf,0,$buf.Length); $ctx.Response.Close() }
          EOF

      - name: Write mirror watcher script
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'EOF'
          param([string]$CfgPath)
          $ErrorActionPreference='SilentlyContinue'
          $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json
          $env:GHRDP_CFG=$CfgPath; $env:GHRDP_LOG=$cfg.logFile
          . $cfg.libPath
          $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak')
          $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | %{$done[$_]=$true} }
          $idx=Load-Index $cfg; $lastSize=@{}; $retryAfter=@{}
          Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null
          function DoUpload($fi,$tag){
          if($done.ContainsKey($fi.FullName)){return}
          if($retryAfter.ContainsKey($fi.FullName) -and (Get-Date) -lt $retryAfter[$fi.FullName]){return}
          $safe=$fi.Name -replace '\|','_'
          $ex=$idx | ?{$_.name -eq $safe -and $_.src -eq $tag} | select -First 1
          if(-not $ex){ $ex=@{name=$safe;src=$tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex); Save-Index $cfg $idx }
          $enc=Join-Path $env:RUNNER_TEMP ('ge_'+[guid]::NewGuid().ToString('N')+'.enc'); $gofile=$null
          try { Encrypt-File $fi.FullName $enc $cfg.decPw; $gofile=Upload-Gofile $enc } catch { "encrypt/upload err $($fi.Name): $_" | Out-File $cfg.logFile -Append }
          Remove-Item $enc -Force -ErrorAction SilentlyContinue
          if($gofile){ $ex.payload=B64U ($gofile+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gofile; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; if($retryAfter.ContainsKey($fi.FullName)){$retryAfter.Remove($fi.FullName)}; Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($($fi.Length) bytes)"|Out-File $cfg.logFile -Append }
          else { $ex.status='limit'; $ex.time=(Get-Date -f 'HH:mm:ss'); $retryAfter[$fi.FullName]=(Get-Date).AddMinutes(5); Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; "[$(Get-Date -f o)] LIMIT $tag $($fi.Name)"|Out-File $cfg.logFile -Append } }
          function Proc($fi,$tag){
          if($done.ContainsKey($fi.FullName)){return}
          $cur=$fi.Length
          if(-not $lastSize.ContainsKey($fi.FullName)){ $lastSize[$fi.FullName]=$cur; return }
          if($lastSize[$fi.FullName] -ne $cur){ $lastSize[$fi.FullName]=$cur; return }
          DoUpload $fi $tag }
          function Scan($r){ if(-not (Test-Path $r.path)){return}; $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue}; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; $p=$fi.FullName; if($p -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}; Proc $fi $r.tag } }
          function SweepAll($r){ if(-not (Test-Path $r.path)){return}; $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending}; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}; DoUpload $fi $r.tag } }
          function CountPending{ $p=0; foreach($r in $cfg.roots){ if(Test-Path $r.path){ $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue}; foreach($fi in $items){ if(-not $done.ContainsKey($fi.FullName) -and -not ($junk -contains $fi.Extension.ToLower()) -and $fi.Length -ge $r.min -and -not ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)')){ $p++ } } } }; return $p }
          function EmergencyPass{
          "[$(Get-Date -f o)] EMERGENCY pass start" | Out-File $cfg.logFile -Append
          foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 4
          for($round=0;$round -lt 3;$round++){ foreach($r in $cfg.roots){ Scan $r }; Start-Sleep -Seconds 4 }
          foreach($r in $cfg.roots){ SweepAll $r }
          Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null
          $pend = CountPending
          if($pend -eq 0){ Set-Content $cfg.allDoneFlag (Get-Date -f o) -Encoding ascii }
          Remove-Item $cfg.emergencyFlag -Force -ErrorAction SilentlyContinue
          "[$(Get-Date -f o)] EMERGENCY pass end pending=$pend" | Out-File $cfg.logFile -Append }
          $fsw=$null
          try{ if(Test-Path $cfg.dlDir){ $fsw=New-Object System.IO.FileSystemWatcher; $fsw.Path=$cfg.dlDir; $fsw.IncludeSubdirectories=$false; $fsw.EnableRaisingEvents=$true; $fsw.NotifyFilter=[System.IO.NotifyFilters]::FileName -bor [System.IO.NotifyFilters]::Size -bor [System.IO.NotifyFilters]::LastWrite } }catch{}
          while($true){
          Set-Content $cfg.heartbeatPath (Get-Date -f o) -Encoding ascii
          if(Test-Path $cfg.emergencyFlag){ EmergencyPass }
          else { foreach($r in $cfg.roots){ Scan $r }; if(Test-Path $cfg.flushFlag){ "[$(Get-Date -f o)] FLUSH seen"|Out-File $cfg.logFile -Append; for($p=0;$p -lt 8;$p++){ foreach($r in $cfg.roots){Scan $r}; if(-not ($idx | ?{$_.status -ne 'ok'})){break}; Start-Sleep -Seconds 8 }; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; Remove-Item $cfg.flushFlag -Force -ErrorAction SilentlyContinue } }
          Start-Sleep -Seconds 3 }
          EOF

      - name: Get Connection Info + cfg + launch dashboard + watcher (independent tasks)
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe"; $ip=(& $ts ip -4).Trim(); $user=$env:RDP_USER; $pass=$env:RDP_PASS
          $eu=[uri]::EscapeDataString($user); $ep=[uri]::EscapeDataString($pass); $ghrdp="ghrdp://$ip/$eu/$ep"; $port=7331; $redirectUrl="http://${ip}:${port}/"
          $sd=$env:RUNNER_TEMP
          $indexPath=Join-Path $sd 'ghrdp_mirror_index.json'
          $hbPath=Join-Path $sd 'ghrdp_heartbeat.txt'; $emPath=Join-Path $sd 'ghrdp_emergency.flag'; $adPath=Join-Path $sd 'ghrdp_alldone.flag'
          New-NetFirewallRule -DisplayName "RDP Redirect Page" -Direction Inbound -LocalPort $port -Protocol TCP -RemoteAddress "100.64.0.0/10" -Action Allow -ErrorAction SilentlyContinue | Out-Null
          $serverOk=$false; $mirrorOn=$false
          $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          if($env:MIRROR -eq 'true'){
            $lib=Join-Path $sd 'ghrdp-lib.ps1'; $wp=Join-Path $sd 'ghrdp-watcher.ps1'; $sp=Join-Path $sd 'rdp-redirect-server.ps1'
            if((Test-Path $lib) -and (Test-Path $wp) -and (Test-Path $sp)){
              $rng=[System.Security.Cryptography.RandomNumberGenerator]::Create(); $alpha='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b=[byte[]]::new(20); $rng.GetBytes($b); $decPw=-join ($b|%{$alpha[[int]$_ % $alpha.Length]})
              $dlDir="C:\Users\$user\Downloads"; $tempDir="C:\Users\$user\AppData\Local\Temp"
              $roots=@(@{path=$dlDir;rec=$false;min=0;tag='Downloads'},@{path=$tempDir;rec=$true;min=102400;tag='Temp'})
              if(Test-Path 'D:\RDP-Storage'){ $roots += @{path='D:\RDP-Storage';rec=$true;min=0;tag='D-Storage'}; Write-Host "D-Storage added to mirror." }
              $cfgPath=Join-Path $sd 'ghrdp_cfg.json'
              $cfg=@{ editCode='Gf5xW9qL2mK7pR4tBn3Y'; slug='Rt7mK2pL9vQ4wX8nB3cF6zYe'; decPw=$decPw; user=$user; dlDir=$dlDir; tempDir=$tempDir; roots=$roots; idxFile=$indexPath; doneFile=(Join-Path $sd 'ghrdp_uploaded.txt'); logFile=(Join-Path $sd 'ghrdp_mirror.log'); flushFlag=(Join-Path $sd 'ghrdp_flush.flag'); cfgPath=$cfgPath; libPath=$lib; heartbeatPath=$hbPath; emergencyFlag=$emPath; cancelFlag=(Join-Path $sd 'ghrdp_cancel.flag'); allDoneFlag=$adPath }
              $cfg | ConvertTo-Json -Depth 6 | Set-Content $cfgPath -Encoding UTF8
              # launch watcher as SYSTEM scheduled task (survives step end + cancel)
              $wtr = "$ps -ExecutionPolicy Bypass -WindowStyle Hidden -File '$wp' -CfgPath '$cfgPath'"
              $wcmd = "schtasks /Create /TN ghrdpwatcher /TR ""$wtr"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F"
              cmd /c $wcmd 2>$null | Out-Null; $LASTEXITCODE=0; cmd /c "schtasks /Run /TN ghrdpwatcher" 2>$null | Out-Null; $LASTEXITCODE=0
              # launch dashboard server as SYSTEM scheduled task
              $str = "$ps -ExecutionPolicy Bypass -WindowStyle Hidden -File '$sp' -Ip $ip -Port $port -Ghrdp '$ghrdp' -IndexPath '$indexPath' -HeartbeatPath '$hbPath' -EmergencyFlagPath '$emPath' -AllDonePath '$adPath'"
              $scmd = "schtasks /Create /TN ghrdpserver /TR ""$str"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F"
              cmd /c $scmd 2>$null | Out-Null; $LASTEXITCODE=0; cmd /c "schtasks /Run /TN ghrdpserver" 2>$null | Out-Null; $LASTEXITCODE=0
              Start-Sleep -Seconds 3
              try{ Invoke-WebRequest -Uri $redirectUrl -UseBasicParsing -TimeoutSec 4 | Out-Null; $serverOk=$true }catch{}
              $mirrorOn=$true
              Write-Host "Watcher + dashboard launched as independent SYSTEM tasks. Dashboard=$serverOk"
            }
          } else {
            $sp=Join-Path $sd 'rdp-redirect-server.ps1'
            if(Test-Path $sp){ $str="$ps -ExecutionPolicy Bypass -WindowStyle Hidden -File '$sp' -Ip $ip -Port $port -Ghrdp '$ghrdp' -IndexPath '$indexPath' -HeartbeatPath '$hbPath' -EmergencyFlagPath '$emPath' -AllDonePath '$adPath'"; $scmd="schtasks /Create /TN ghrdpserver /TR ""$str"" /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F"; cmd /c $scmd 2>$null|Out-Null; $LASTEXITCODE=0; cmd /c "schtasks /Run /TN ghrdpserver" 2>$null|Out-Null; $LASTEXITCODE=0; Start-Sleep -Seconds 3; try{Invoke-WebRequest -Uri $redirectUrl -UseBasicParsing -TimeoutSec 4|Out-Null;$serverOk=$true}catch{} }
          }
          Write-Host "============================================================"
          Write-Host "  RDP IS READY  (session alive 5h 30m)"
          Write-Host "  IP=$ip  USER=$user  PASS=$pass  Dashboard=$redirectUrl ($serverOk)"
          Write-Host "  >>> LOCAL PC must have Tailscale ON (same tailnet)."
          Write-Host "  >>> BEFORE cancelling: open dashboard, click UPLOAD EVERYTHING NOW, wait for green banner, THEN cancel."
          Write-Host "============================================================"
          $S = $env:GITHUB_STEP_SUMMARY
          "### FIRST - your LOCAL PC needs Tailscale ON" >> $S
          "The RDP IP ``$ip`` is a Tailscale private address. Your own computer must run the Tailscale client, logged into the same tailnet used for the sign-in link above." >> $S
          "" >> $S
          "### RDP Credentials" >> $S
          "**IP:** ``$ip``  **Username:** ``$user``  **Password:** ``$pass``" >> $S
          "" >> $S
          "### Connect" >> $S
          "**Dashboard:** [$redirectUrl]($redirectUrl)  |  **Handler:** paste ``$ghrdp`` in address bar  |  **Manual:** Win+R -> mstsc -> ``$ip`` -> user ``$user`` / pass ``$pass``." >> $S
          "" >> $S
          if($mirrorOn){ "### Mirror: ON - HOW TO SAVE DATA BEFORE CANCELLING" >> $S; "1. Open the dashboard [$redirectUrl]($redirectUrl) (watcher + server now run as independent SYSTEM tasks, so they survive until the VM is reclaimed)." >> $S; "2. When you are ready to stop, click the red **UPLOAD EVERYTHING NOW** button on the dashboard." >> $S; "3. Wait (page auto-refreshes) until the green banner **ALL UPLOADED - safe to Cancel** appears (Uploaded count = your files, Pending = 0)." >> $S; "4. THEN press **Cancel workflow**. (A 2nd Cancel force-kills immediately.)" >> $S; "Index: https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe" >> $S }
          else { "### Mirror: OFF" >> $S }

      - name: Configure theme + bookmarks + apps (qBittorrent, Parsec, Edge ext)
        run: |
          $ErrorActionPreference = 'Continue'
          function Reset-Exit { $script:LASTEXITCODE = 0 }
          $mPers='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if(-not(Test-Path $mPers)){New-Item -Path $mPers -Force|Out-Null}
          New-ItemProperty -Path $mPers -Name 'AppsUseLightTheme'    -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'SystemUsesLightTheme' -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'ColorPrevalence'      -Value 0 -PropertyType DWord -Force|Out-Null
          $mAcc='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent'
          if(-not(Test-Path $mAcc)){New-Item -Path $mAcc -Force|Out-Null}
          New-ItemProperty -Path $mAcc -Name 'AccentColorMenu' -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'StartColor'      -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'AccentColor'     -Value 0xffc42b8c -PropertyType DWord -Force|Out-Null
          try{ $mag=[byte[]](0x8C,0x2B,0xC4,0xFF,0x9E,0x33,0xD0,0xFF,0xB0,0x3B,0xDC,0xFF,0xC2,0x43,0xE8,0xFF,0x7A,0x22,0xB0,0xFF,0x66,0x1A,0x9C,0xFF,0x52,0x12,0x88,0xFF,0x3E,0x0A,0x74,0xFF); Set-ItemProperty -Path $mAcc -Name 'AccentPalette' -Value $mag -PropertyType Binary -Force|Out-Null }catch{}
          Write-Host "Machine-wide dark mode + magenta accent set (profile untouched)."
          $edgePol='HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'; if(-not(Test-Path $edgePol)){New-Item -Path $edgePol -Force|Out-Null}
          $crx='https://edge.microsoft.com/extensionwebstorebase/v1/crx'
          New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -PropertyType String -Force|Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -PropertyType String -Force|Out-Null
          $fav='[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"},{"name":"GitHub RDP Mirror","url":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe"}]'
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value $fav -PropertyType String -Force|Out-Null
          $ffdist='C:\Program Files\Mozilla Firefox\distribution'; New-Item -ItemType Directory -Path $ffdist -Force|Out-Null
          $ffpol='{"policies":{"Bookmarks":[{"Title":"FMHY Torrenting","URL":"https://fmhy.net/torrenting","Placement":"toolbar"},{"Title":"GitHub RDP Mirror","URL":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe","Placement":"toolbar"}]}}'
          Set-Content -Path (Join-Path $ffdist 'policies.json') -Value $ffpol -Encoding UTF8
          try { winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "qBittorrent installed." } catch { Write-Host "qBittorrent winget failed (non-fatal)." }; Reset-Exit
          try { winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "Parsec installed." } catch { Write-Host "Parsec winget failed (non-fatal)." }; Reset-Exit
          $pcfg='C:\ProgramData\Parsec'; New-Item -ItemType Directory -Path $pcfg -Force|Out-Null
          "app_host = 1`r`nprivacy_mode = 0`r`nserver_resolution = 1920x1080" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -ErrorAction SilentlyContinue
          if(Test-Path 'C:\Program Files\Parsec\parsecd.exe'){ New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ParsecAuto' -Value '"C:\Program Files\Parsec\parsecd.exe"' -PropertyType String -Force -ErrorAction SilentlyContinue|Out-Null; Write-Host "Parsec autolaunch set." } else { Write-Host "Parsec exe not found - skipped autolaunch." }
          Reset-Exit
          "### Theme + Bookmarks + qBittorrent + Parsec Ready" >> $env:GITHUB_STEP_SUMMARY
          "Machine-wide dark mode + magenta accent. Bookmarks set. qBittorrent + Parsec installed. Exact purple-glow wallpaper: in RDP Settings > Personalization click the glow tile (1 click). qBittorrent save path -> set to D:\RDP-Storage once. Parsec: finish email+OTP login inside RDP." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Configure step complete (no profile touched, exit forced 0)."
          exit 0

      - name: Keep Alive (5h30) + flush at 4h30
        run: |
          $limit=New-TimeSpan -Hours 5 -Minutes 30; $flushAt=New-TimeSpan -Hours 4 -Minutes 30
          $flushFlag=Join-Path $env:RUNNER_TEMP 'ghrdp_flush.flag'; $start=Get-Date; $flushed=$false
          try {
            while(((Get-Date)-$start) -lt $limit){ if((-not $flushed) -and (((Get-Date)-$start) -ge $flushAt)){ "flush"|Out-File $flushFlag -Encoding ascii; $flushed=$true; Write-Host "4h30 -> flush flag." }; Start-Sleep -Seconds 60 }
          } catch { Write-Host "Keep Alive interrupted (cancel/timeout) - emergency step runs next." }
          Write-Host "5h30 done or cancelled."

      - name: Emergency upload on cancel (always)
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        run: |
          $sd=$env:RUNNER_TEMP
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $lib=Join-Path $sd 'ghrdp-lib.ps1'
          if(-not ((Test-Path $cfgPath) -and (Test-Path $lib))){ Write-Host "no mirror cfg/lib - skip"; exit 0 }
          $hb=Join-Path $sd 'ghrdp_heartbeat.txt'; $emf=Join-Path $sd 'ghrdp_emergency.flag'; $cf=Join-Path $sd 'ghrdp_cancel.flag'; $adf=Join-Path $sd 'ghrdp_alldone.flag'
          Remove-Item $adf -Force -ErrorAction SilentlyContinue
          Set-Content $emf (Get-Date -f o) -Encoding ascii
          Set-Content $cf (Get-Date -f o) -Encoding ascii
          Write-Host "EMERGENCY (status=$env:STATUS) - signalled watcher; waiting for upload to finish..."
          $watcherAlive = (Test-Path $hb) -and (((Get-Date)-(Get-Item $hb).LastWriteTime).TotalSeconds -lt 40)
          if($watcherAlive){
            $deadline=(Get-Date).AddMinutes(12)
            while((Get-Date) -lt $deadline){ if(Test-Path $adf){ Write-Host "Watcher reported ALL DONE."; break }; Start-Sleep -Seconds 6; $age=if(Test-Path $hb){[int]((Get-Date)-(Get-Item $hb).LastWriteTime).TotalSeconds}else{'?'}; Write-Host "...uploading in progress (watcher heartbeat ${age}s ago; check dashboard/rentry)" }
          } else { Write-Host "Watcher not responding - will do direct fallback upload." }
          if(-not (Test-Path $adf)){
            Write-Host "DIRECT fallback upload (streaming, lock-safe)..."
            $env:GHRDP_CFG=$cfgPath; . $lib; $cfg=Read-Cfg; $env:GHRDP_LOG=$cfg.logFile
            foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 4
            $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak')
            $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | %{$done[$_]=$true} }
            $idx=Load-Index $cfg
            foreach($r in $cfg.roots){
              if(-not (Test-Path $r.path)){ continue }
              $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending}
              foreach($fi in $items){
                if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}
                if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}
                $safe=$fi.Name -replace '\|','_'; $ex=$idx | ?{$_.name -eq $safe -and $_.src -eq $r.tag} | select -First 1
                if(-not $ex){ $ex=@{name=$safe;src=$r.tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex) }
                $enc=Join-Path $sd ('em_'+[guid]::NewGuid().ToString('N')+'.enc'); $gf=$null
                try { Encrypt-File $fi.FullName $enc $cfg.decPw; $gf=Upload-Gofile $enc } catch { "DIRECT err $($fi.Name): $_" | Out-File $cfg.logFile -Append }
                Remove-Item $enc -Force -ErrorAction SilentlyContinue
                if($gf){ $ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gf; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; Write-Host "DIRECT OK $($fi.Name) ($($fi.Length) bytes)" }
                else { $ex.status='limit'; Write-Host "DIRECT LIMIT $($fi.Name)" }
              }
            }
            Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null
            Set-Content $adf (Get-Date -f o) -Encoding ascii
            Write-Host "DIRECT fallback upload complete."
          }
          Write-Host "Emergency handling complete. (A 2nd Cancel force-kills immediately.)"

      - name: Secure Cleanup (wipe all data)
        if: ${{ always() }}
        run: |
          $ml=Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'; if(Test-Path $ml){ Write-Host "----- mirror log (tail) -----"; Get-Content $ml -Tail 100 | %{Write-Host $_} }
          & schtasks.exe /End /TN ghrdpwatcher 2>$null | Out-Null; & schtasks.exe /Delete /TN ghrdpwatcher /F 2>$null | Out-Null
          & schtasks.exe /End /TN ghrdpserver 2>$null | Out-Null; & schtasks.exe /Delete /TN ghrdpserver /F 2>$null | Out-Null
          $LASTEXITCODE = 0
          foreach($p in @('chrome','msedge','firefox','iexplore','brave','opera','qbittorrent')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          foreach($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data","$env:LOCALAPPDATA\Microsoft\Edge\User Data","$env:APPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data","$env:APPDATA\Opera Software\Opera Stable")){ if(Test-Path $p){ try{Remove-Item -Path $p -Recurse -Force -ErrorAction Stop}catch{Start-Sleep 2;Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue} } }
          foreach($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")){ if(Test-Path $p){Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue} }
          if($env:RDP_USER){ foreach($s in @('Downloads','AppData\Local\Temp')){ $d="C:\Users\$($env:RDP_USER)\$s"; if(Test-Path $d){Remove-Item "$d\*" -Recurse -Force -ErrorAction SilentlyContinue} } }
          if(Test-Path 'D:\RDP-Storage'){ Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
          Set-Clipboard -Value "" -ErrorAction SilentlyContinue; Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | %{wevtutil cl "$_" 2>$null}; $LASTEXITCODE = 0
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
          "VM wiped (incl D-RDP-Storage). Mirror copies (AES) + rentry index remain if mirror ON. No GitHub secrets - recoverable from script." >> $env:GITHUB_STEP_SUMMARY

      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        run: |
          Write-Host "Overwriting free space (cipher /w)..."
          cipher /w:C:\
          $LASTEXITCODE = 0
          "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
