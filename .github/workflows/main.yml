      - name: Write safe desktop debug script (gofile probe + resolved roots + index creds + profile path)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Debug-GHRDP.ps1" <<'DEBUGEOF'
          param([switch]$NoPause, [switch]$ShowSecrets)
          $ErrorActionPreference = 'Continue'; $R = New-Object Collections.ArrayList; $me = $PID
          function Say($t = '') { Write-Host $t; [void]$R.Add([string]$t) }; function KV($k, $v) { Say (('{0,-30}: {1}' -f $k, [string]$v)) }; function HD($t) { Say ''; Say ('==== ' + $t + ' ====') }
          function Mask($s) { if ([string]::IsNullOrEmpty($s)) { return '' }; if ($ShowSecrets) { return $s }; if ($s.Length -le 6) { return '****' }; return $s.Substring(0, 2) + '****' + $s.Substring($s.Length - 2) }
          function SJ($p) { if (-not (Test-Path $p)) { return $null }; try { $fs = [IO.File]::Open($p, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite); $ms = New-Object IO.MemoryStream; $fs.CopyTo($ms); $fs.Close(); $b = $ms.ToArray(); $ms.Close(); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop) } catch { return $null } }
          function Own($p) { try { $o = Invoke-CimMethod -InputObject $p -MethodName GetOwner -EA Stop; if ($o.User) { return $o.Domain + '\' + $o.User } } catch {}; return '?' }
          function Get-UP2([string]$UserName) { try { $u = Get-LocalUser -Name $UserName -EA Stop; $sid = $u.SID.Value; $pl = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"; $p = (Get-ItemProperty -Path $pl -Name ProfileImagePath -EA Stop).ProfileImagePath; if ($p -and (Test-Path $p)) { return $p } } catch {}; $c = Get-ChildItem 'C:\Users' -Directory -EA 0 | Where-Object { $_.Name -eq $UserName -or $_.Name.StartsWith("$UserName.") } | Select-Object -First 1; if ($c) { return $c.FullName }; return "C:\Users\$UserName" }
          $desk = [Environment]::GetFolderPath('Desktop'); if (-not $desk -or -not (Test-Path $desk)) { $desk = $env:USERPROFILE }; $rp = Join-Path $desk ('Debug-GHRDP_' + (Get-Date -Format 'yyyy-MM-dd_HH-mm-ss') + '.txt')
          HD 'GHRDP DEBUG'; KV 'user' (whoami); KV 'USERPROFILE' $env:USERPROFILE; KV 'admin' $((New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))
          HD 'CONFIG'; $cp = $null; if (Test-Path 'C:\ProgramData\ghrdp\cfgpath.txt') { $cp = (Get-Content 'C:\ProgramData\ghrdp\cfgpath.txt' -Raw -EA 0).Trim() }; if (-not $cp -or -not (Test-Path $cp)) { foreach ($d in @($env:RUNNER_TEMP, 'D:\a\_temp')) { if ($d -and (Test-Path (Join-Path $d 'ghrdp_cfg.json'))) { $cp = Join-Path $d 'ghrdp_cfg.json'; break } } }; KV 'cfg' $cp; $cfg = if ($cp) { SJ $cp } else { $null }; KV 'loaded' ([bool]$cfg)
          if ($cfg) { HD 'VALUES'; KV 'rdpIp' $cfg.rdpIp; KV 'mirror' $cfg.mirror; KV 'rentryUrl' $cfg.rentryUrl; KV 'indexBackend' $cfg.indexBackend; KV 'rentryEditCode' $cfg.rentryEditCode; KV 'profileDir(cfg)' $cfg.profileDir; KV 'decPw' (Mask $cfg.decPw) }
          HD 'REAL PROFILE PATH (ProfileList registry)'; if ($cfg -and $cfg.user) { $rp2 = Get-UP2 $cfg.user; KV 'resolved profile' $rp2; KV 'Downloads exists' (Test-Path (Join-Path $rp2 'Downloads')); KV 'Desktop exists' (Test-Path (Join-Path $rp2 'Desktop')) }
          HD 'RDP/PORTS'; $fdn = (Get-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections -EA 0).fDenyTSConnections; KV 'fDeny' $fdn; foreach ($c in @(Get-NetTCPConnection -State Listen -EA 0 | Where-Object { @(3389, 7331) -contains $_.LocalPort })) { $pn = ''; try { $pn = (Get-Process -Id $c.OwningProcess -EA Stop).ProcessName } catch {}; KV ("listen " + $c.LocalPort) ($c.LocalAddress + ' pid=' + $c.OwningProcess + ' ' + $pn) }
          HD 'WATCHER RESOLVED ROOTS (from progress.scan)'; $pp = if ($cfg) { $cfg.progressPath } else { $null }; $prog = if ($pp) { SJ $pp } else { $null }; if ($prog -and $prog.scan) { $prog.scan.PSObject.Properties | ForEach-Object { $o = $_.Value; Say ('  ' + $_.Name + ' -> ' + $o.path + ' raw=' + $o.rawTotal + ' elig=' + $o.eligible + $(if ($o.error) { ' ERR=' + $o.error } else { '' })) } } else { Say '  (no scan yet)' }
          HD 'GOFILE PROBE'; try { $gs = (& curl.exe -sS --max-time 20 'https://api.gofile.io/getServer') | ConvertFrom-Json -EA Stop; KV 'getServer' ('OK ' + $gs.data.server); $pb = Join-Path $env:TEMP ('gp_' + [guid]::NewGuid().ToString('N') + '.bin'); [IO.File]::WriteAllBytes($pb, [byte[]]::new(1024)); $up = (& curl.exe -sS --max-time 60 -X POST ('https://' + $gs.data.server + '.gofile.io/contents/uploadfile') -F ('file=@' + $pb)); $uj = $up | ConvertFrom-Json -EA 0; KV 'testUpload1KB' ($uj.status + $(if ($uj.data.code) { ' gofile.io/d/' + $uj.data.code } else { '' })); Remove-Item $pb -Force -EA 0 } catch { KV 'gofile FAIL' $_.Exception.Message }
          HD 'PROCESSES'; $ps = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -EA 0 | Where-Object { $_.ProcessId -ne $me -and $_.CommandLine -match 'ghrdp-watcher|rdp-redirect-server|ghrdp-server-run' }); if (-not $ps.Count) { Say 'none' }; foreach ($p in $ps) { KV ('pid ' + $p.ProcessId) (Own $p) }
          HD 'ENDPOINTS'; try { $d = Invoke-RestMethod 'http://127.0.0.1:7331/diag' -TimeoutSec 5; KV 'port' $d.portListening; KV 'cfgLoaded' $d.cfgLoaded; KV 'progressLoaded' $d.progressLoaded } catch { KV 'diag err' $_.Exception.Message }
          if ($prog) { HD 'PROGRESS'; KV 'age' ([int]((Get-Date) - (Get-Date $prog.ts)).TotalSeconds); KV 'alive' $prog.alive; if ($prog.agg) { KV 'tracked/done/active/fail' ("$($prog.agg.tracked)/$($prog.agg.done)/$($prog.agg.active)/$($prog.agg.failed)") } }
          HD 'VERDICT'; $cu = (whoami).Trim(); $wp = @($ps | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }) | Select-Object -First 1; $wo = if ($wp) { Own $wp } else { '' }; Say ('[' + $(if ($fdn -eq 0) { 'PASS' } else { 'FAIL' }) + '] RDP enabled'); Say ('[' + $(if ($wp) { 'PASS' } else { 'FAIL' }) + '] watcher running owner=' + $wo); Say ('[' + $(if ($wo.ToLower() -eq $cu.ToLower()) { 'PASS' } else { 'FAIL' }) + '] watcher identity = you')
          try { [IO.File]::WriteAllText($rp, ($R -join "`r`n"), (New-Object Text.UTF8Encoding $false)); HD 'SAVED'; Say $rp } catch {}
          if (-not $NoPause) { Read-Host 'Enter to close' }
          DEBUGEOF
          cat > "$RUNNER_TEMP/DEBUG-GHRDP.bat" <<'BATEOF'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Debug-GHRDP.ps1"
          BATEOF
      - name: Place debug on desktops
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'Debug-GHRDP.ps1'; $b = Join-Path $env:RUNNER_TEMP 'DEBUG-GHRDP.bat'; $desks = @('C:\Users\Public\Desktop'); if ($env:RDP_USER) { $desks += "C:\Users\$($env:RDP_USER)\Desktop"; $desks += "C:\Users\$($env:RDP_USER).$env:COMPUTERNAME\Desktop" }; foreach ($d in ($desks | Select-Object -Unique)) { try { if (Test-Path $d) { Copy-Item $p (Join-Path $d 'Debug-GHRDP.ps1') -Force; Copy-Item $b (Join-Path $d 'DEBUG-GHRDP.bat') -Force } } catch {} }
      - name: Keep Alive (5h30) - server SYSTEM task; watcher via logon
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null | Out-Null; & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null; $LASTEXITCODE = 0
          $sd = $env:RUNNER_TEMP; & (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json'); $cp = Join-Path $sd 'ghrdp_cfg.json'; $ss = Join-Path $sd 'rdp-redirect-server.ps1'; $ws = Join-Path $sd 'ghrdp-watcher.ps1'; $pr = Join-Path $sd 'ghrdp_progress.json'; $em = Join-Path $sd 'ghrdp_emergency.flag'; $fl = Join-Path $sd 'ghrdp_flush.flag'; $hf = Join-Path $sd 'ghrdp_heal.flag'; $ok = Join-Path $sd 'ghrdp_server_ok.txt'; $cfg = Get-Content $cp -Raw | ConvertFrom-Json; Remove-Item $ok -Force -EA 0
          $sr = Join-Path $sd 'ghrdp-server-run.ps1'; $tpl = "`$ErrorActionPreference='Continue'`r`n. '<<SS>>'`r`nStart-GhrdpServer -Port 7331 -BindAddress '0.0.0.0' -UiDir '<<SD>>' -ProgressPath '<<PR>>' -CfgPath '<<CF>>' -EmergencyFlagPath '<<EM>>' -FlushFlagPath '<<FL>>' -HealFlagPath '<<HF>>' -OkFile '<<OK>>' -LimitMinutes 330`r`n"; $tpl = $tpl.Replace('<<SS>>', $ss).Replace('<<SD>>', $sd).Replace('<<PR>>', $pr).Replace('<<CF>>', $cp).Replace('<<EM>>', $em).Replace('<<FL>>', $fl).Replace('<<HF>>', $hf).Replace('<<OK>>', $ok); [IO.File]::WriteAllText($sr, $tpl, (New-Object Text.UTF8Encoding $false))
          foreach ($f in @($cp, $ss, $ws, $pr, $em, $fl, $hf, $ok, (Join-Path $sd 'ghrdp-lib.ps1'), (Join-Path $sd 'ghrdp-ui.html'), (Join-Path $sd 'ghrdp-install.ps1'), $sr, (Join-Path $sd 'ghrdp-launcher.ps1'))) { if (Test-Path $f) { & icacls.exe $f /grant "*S-1-5-18:(R)" 2>$null | Out-Null } }; & icacls.exe $sd /grant "*S-1-5-18:(OI)(CI)R" 2>$null | Out-Null; $LASTEXITCODE = 0
          if ($env:RDP_USER) { & icacls.exe $sd /grant "$($env:RDP_USER):(OI)(CI)M" 2>$null | Out-Null; $LASTEXITCODE = 0 }
          if ($cfg.roots) { foreach ($r in $cfg.roots) { if ($r.path -and (Test-Path $r.path)) { & icacls.exe $r.path /grant "*S-1-5-18:(OI)(CI)R" 2>$null | Out-Null } }; $LASTEXITCODE = 0 }
          $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"; $tr = "`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$sr`""; & schtasks /Create /TN ghrdpserver /TR $tr /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F 2>$null | Out-Null; $LASTEXITCODE = 0; & schtasks /Run /TN ghrdpserver 2>$null | Out-Null; $LASTEXITCODE = 0
          $up = $false; for ($i = 0; $i -lt 40; $i++) { if ((Test-Path $ok) -and ((Get-Content $ok -Raw) -match 'LISTENING')) { $up = $true; break }; Start-Sleep -Milliseconds 500 }; $self = $false; try { Invoke-WebRequest 'http://127.0.0.1:7331/' -UseBasicParsing -TimeoutSec 3 | Out-Null; $self = $true } catch {}; Write-Host "server up=$up loopback=$self"
          $lim = New-TimeSpan -Hours 5 -Minutes 30; $s0 = Get-Date; while (((Get-Date) - $s0) -lt $lim) { Start-Sleep 60 }
      - name: Emergency upload on cancel (resolves REAL profile via ProfileList)
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          $sd = $env:RUNNER_TEMP; $cp = Join-Path $sd 'ghrdp_cfg.json'; $lib = Join-Path $sd 'ghrdp-lib.ps1'; if (-not ((Test-Path $cp) -and (Test-Path $lib))) { exit 0 }
          Set-Content (Join-Path $sd 'ghrdp_emergency.flag') (Get-Date -f o) -Encoding ascii; $dl = (Get-Date).AddMinutes(12); $seen = $false
          while ((Get-Date) -lt $dl) { $p = $null; if (Test-Path (Join-Path $sd 'ghrdp_progress.json')) { try { $p = Get-Content (Join-Path $sd 'ghrdp_progress.json') -Raw | ConvertFrom-Json -EA Stop } catch {} }; if ($p -and $p.ts) { $age = [int]((Get-Date) - (Get-Date $p.ts)).TotalSeconds; if ($age -lt 15) { $seen = $true } else { break } }; if ($seen -and $p -and $p.agg -and [int]$p.agg.active -eq 0 -and [int]$p.agg.tracked -gt 0) { break }; Start-Sleep 5 }
          $fb = -not $seen; if (-not $fb -and (Test-Path (Join-Path $sd 'ghrdp_progress.json'))) { try { $pp = Get-Content (Join-Path $sd 'ghrdp_progress.json') -Raw | ConvertFrom-Json -EA Stop; if ($pp.agg -and [int]$pp.agg.active -gt 0) { $fb = $true } } catch {} }
          if ($fb) {
            Write-Host "DIRECT fallback"; $env:GHRDP_CFG = $cp; . $lib; $cfg = Read-Cfg; $env:GHRDP_LOG = $cfg.logFile; Init-Progress (Join-Path $sd 'ghrdp_progress.json')
            $prof = if ($cfg.profileDir -and (Test-Path $cfg.profileDir)) { $cfg.profileDir } else { Get-UserProfilePath $cfg.user }; Write-Host "resolved profile: $prof"
            foreach ($p in @('qbittorrent', 'qbittorrent-nox')) { Get-Process -Name $p -EA 0 | Stop-Process -Force -EA 0 }; Start-Sleep 4
            $roots = @(); foreach ($s in @('Downloads', 'Desktop', 'Documents')) { $roots += @{ path = (Join-Path $prof $s); rec = $false; min = 0; tag = $s } }; $roots += @{ path = (Join-Path $prof 'AppData\Local\Temp'); rec = $true; min = 102400; tag = 'Temp' }; foreach ($r in $cfg.roots) { if (@('Downloads', 'Desktop', 'Documents', 'Temp') -notcontains $r.tag) { $roots += $r } }
            $junk = @('.tmp', '.crdownload', '.partial', '.part', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb'); $done = @{}; if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }; $idx = Load-Index $cfg
            foreach ($r in $roots) { if (-not (Test-Path $r.path)) { continue }; $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 | Sort-Object Length -Descending } else { Get-ChildItem -LiteralPath $r.path -File -EA 0 | Sort-Object Length -Descending }; foreach ($fi in $items) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; $len = $fi.Length; $safe = $fi.Name -replace '\|', '_'; $disp = ($safe -replace '[^\x20-\x7E]', '_') -replace '[^A-Za-z0-9._-]', '_'; $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $r.tag } | Select-Object -First 1; if (-not $ex) { $ex = @{ name = $safe; src = $r.tag; status = 'uploading'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss'); pct = 0; phase = 'uploading'; bytesDone = 0; bytesTotal = $len; attempts = 0; nextTry = 0 }; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len }; $ex.status = 'uploading'; $ex.phase = 'encrypt'; $ex.bytesTotal = $len; $global:GHRDP_CUR = $ex; $enc = Join-Path $cfg.tmpDir ('em_' + [guid]::NewGuid().ToString('N') + '.enc'); $gf = $null; $eok = $false; Set-Active $disp 'encrypt' $len; try { Encrypt-File $fi.FullName $enc $cfg.decPw; $eok = $true } catch {}; if ($eok) { $ex.phase = 'upload'; Set-Active $disp 'upload' $len; try { $gf = Upload-Gofile-Streamed $enc $disp } catch {} }; Remove-Item $enc -Force -EA 0; $global:GHRDP_CUR = $null; if ($gf) { $ex.payload = B64U ($gf + '|' + $cfg.decPw + '|' + $safe); $ex.gofile = $gf; $ex.status = 'ok'; $ex.pct = 100; $done[$fi.FullName] = $true; $fi.FullName | Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Write-Host "OK $($fi.Name)" } else { $ex.status = 'limit'; Write-Host "LIMIT $($fi.Name)" }; Set-Active '' 'idle' 0 } }
            Save-Index $cfg $idx; Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null; Write-Host "fallback complete."
          }
      - name: Secure Cleanup (wipe all data)
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null | Out-Null; & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null; $LASTEXITCODE = 0
          $ml = Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'; if (Test-Path $ml) { Get-Content $ml -Tail 120 | ForEach-Object { Write-Host $_ } }
          foreach ($p in @('chrome', 'msedge', 'firefox', 'iexplore', 'brave', 'opera', 'qbittorrent')) { Get-Process -Name $p -EA 0 | Stop-Process -Force -EA 0 }; Start-Sleep 3
          foreach ($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data", "$env:LOCALAPPDATA\Microsoft\Edge\User Data", "$env:APPDATA\Mozilla\Firefox\Profiles", "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data", "$env:APPDATA\Opera Software\Opera Stable")) { if (Test-Path $p) { try { Remove-Item $p -Recurse -Force -EA Stop } catch { Remove-Item $p -Recurse -Force -EA 0 } } }
          foreach ($p in @("$env:USERPROFILE\Downloads", "$env:USERPROFILE\Desktop", "$env:USERPROFILE\Documents")) { if (Test-Path $p) { Remove-Item "$p\*" -Recurse -Force -EA 0 } }
          if ($env:RDP_USER) { foreach ($base in @("C:\Users\$($env:RDP_USER)", "C:\Users\$($env:RDP_USER).$env:COMPUTERNAME")) { foreach ($s in @('Downloads', 'Desktop', 'Documents', 'AppData\Local\Temp')) { $d = Join-Path $base $s; if (Test-Path $d) { Remove-Item "$d\*" -Recurse -Force -EA 0 } } } }
          if (Test-Path 'D:\RDP-Storage') { Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -EA 0 }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -EA 0; Remove-Item "$env:TEMP\*" -Recurse -Force -EA 0; Clear-RecycleBin -Force -EA 0; wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }; $LASTEXITCODE = 0
          & "C:\Program Files\Tailscale\tailscale.exe" serve reset 2>$null | Out-Null; $LASTEXITCODE = 0; "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          cipher /w:C:\; $LASTEXITCODE = 0; "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
