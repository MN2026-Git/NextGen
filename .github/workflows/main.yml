name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage (AES-256) -> gofile(+fallbacks) + telegraph index. default OFF'
        type: boolean
        default: false
permissions: {contents: read}
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12;$u="https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi";$o="tailscale-setup.msi";$ok=$false;for($a=1;$a -le 4;$a++){Remove-Item $o -Force -EA 0;& curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $o $u 2>$null;$LASTEXITCODE=0;if((Test-Path $o)-and (Get-Item $o).Length -gt 1000000){$ok=$true;break};Start-Sleep (3*$a)};if(-not $ok){for($a=1;$a -le 3;$a++){try{Invoke-WebRequest -Uri $u -OutFile $o -UseBasicParsing;if((Test-Path $o)-and (Get-Item $o).Length -gt 1000000){$ok=$true;break}}catch{};Start-Sleep (3*$a)}};if(-not $ok){throw "Tailscale MSI download failed"}
      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet';Start-Sleep 5
      - name: Tailscale sign-in (auto if TS_AUTHKEY else link)
        env: {TS_AUTHKEY: "${{ secrets.TS_AUTHKEY }}"}
        shell: pwsh
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe";$d=$false;for($i=0;$i -lt 30;$i++){try{$j=& $ts status --json 2>$null|ConvertFrom-Json -EA Stop;if($j -and $j.BackendState){$d=$true;break}}catch{};if($i -eq 3){Start-Service Tailscale -EA 0};Start-Sleep 2};if(-not $d){throw "tailscaled not started"};$S=$env:GITHUB_STEP_SUMMARY;if($env:TS_AUTHKEY){$l=Join-Path $env:RUNNER_TEMP ts.log;$e=Join-Path $env:RUNNER_TEMP ts.err;$null=Start-Process $ts -ArgumentList @("up","--authkey=$($env:TS_AUTHKEY)","--accept-dns=true") -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru;$ok=$false;for($i=0;$i -lt 60;$i++){try{$j=& $ts status --json 2>$null|ConvertFrom-Json -EA Stop;if($j -and $j.BackendState -eq 'Running'){$ok=$true;break}}catch{};Start-Sleep 2};if(-not $ok){throw "TS_AUTHKEY login failed"};"### Tailscale auto-login OK" >> $S}else{$l=Join-Path $env:RUNNER_TEMP ts.log;$e=Join-Path $env:RUNNER_TEMP ts.err;$null=Start-Process $ts -ArgumentList "up" -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru;$url=$null;for($i=0;$i -lt 90;$i++){$t="";foreach($f in @($l,$e)){if(Test-Path $f){try{$fs=[IO.File]::Open($f,'Open','Read','ReadWrite');$sr=New-Object IO.StreamReader($fs);$t+=$sr.ReadToEnd();$sr.Close();$fs.Close()}catch{}}};if($t -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+'){$url=$Matches[0];break};Start-Sleep 2};if(-not $url){throw "sign-in link not found"};$url|Out-File (Join-Path $env:RUNNER_TEMP ts-url.txt) -Encoding utf8;"### Click to sign in" >> $S;"**[$url]($url)**" >> $S}
      - name: Wait Tailscale
        shell: pwsh
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe";$a=$false;for($i=0;$i -lt 120;$i++){try{$j=& $ts status --json 2>$null|ConvertFrom-Json -EA Stop;if($j -and $j.BackendState -eq 'Running'){$a=$true;break}}catch{};Start-Sleep 5};if(-not $a){throw "ts timeout"}
      - name: Auto Funnel (TS_API_KEY optional)
        env: {TS_KEY: "${{ secrets.TS_API_KEY }}"}
        shell: pwsh
        run: |
          $tok=$env:TS_KEY;if(-not $tok){Write-Host "TS_API_KEY not set - enable Serve/Funnel once at login.tailscale.com/admin/acls nodeAttrs funnel (or ignore; in-RDP dashboard still works)";exit 0};$b='https://api.tailscale.com/api/v2/tailnet/-/acl';$h=@{Authorization="Bearer $tok";Accept='application/json'};try{$t=(Invoke-WebRequest $b -Headers $h -UseBasicParsing -TimeoutSec 30).Content;$c=$t -replace '/\*[\s\S]*?\*/','';$c=($c -split "`n"|%{$_ -replace '//[^\r\n]*',''}) -join "`n";$c=$c -replace ',(\s*[\]}])','$1';$a=$c|ConvertFrom-Json -EA Stop;$na=@();if($a.PSObject.Properties['nodeAttrs'] -and $a.nodeAttrs){$na=@($a.nodeAttrs)};$has=$na|?{(@($_.target) -contains '*') -and (@($_.attr) -contains 'funnel')};if(-not $has){$na=$na+ ,@{target=@('*');attr=@('funnel')};if($a.PSObject.Properties['nodeAttrs']){$a.nodeAttrs=$na}else{$a|Add-Member -NotePropertyName nodeAttrs -NotePropertyValue $na -Force};Invoke-WebRequest $b -Headers @{Authorization="Bearer $tok";'Content-Type'='application/json'} -Method Post -Body ([Text.Encoding]::UTF8.GetBytes(($a|ConvertTo-Json -Depth 12 -Compress))) -UseBasicParsing -TimeoutSec 30|Out-Null;Write-Host "funnel attr added"}}catch{Write-Host "acl skip $($_.Exception.Message)"}
      - name: Serve web link
        shell: pwsh
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe";$rng=[Security.Cryptography.RandomNumberGenerator]::Create();$al='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';$b=[byte[]]::new(24);$rng.GetBytes($b);$dt=-join($b|%{$al[[int]$_ % $al.Length]});Add-Content $env:GITHUB_ENV ("DASH_TOKEN=$dt");$so=Join-Path $env:RUNNER_TEMP serve.out;$se=Join-Path $env:RUNNER_TEMP serve.err;Remove-Item $so,$se -Force -EA 0;try{Start-Process $ts -ArgumentList @('serve','--bg','7331') -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden|Out-Null}catch{};$su='';$dns='';$dl=(Get-Date).AddSeconds(25);while((Get-Date) -lt $dl){$st=$null;try{$j=Start-Job {param($t)& $t status --json 2>$null} -ArgumentList $ts;if(Wait-Job $j -Timeout 4){$st=Receive-Job $j|ConvertFrom-Json -EA 0};Remove-Job $j -Force -EA 0}catch{};if($st -and $st.Self.DNSName){$dns=$st.Self.DNSName.TrimEnd('.');break};Start-Sleep 2};if($dns){$su='https://'+$dns+'/?key='+$dt};Add-Content $env:GITHUB_ENV ("SERVE_URL=$su");if($su){"**[>>> OPEN RDP WEB-APP (THIS run only) <<<]($su)**  (if black: stale link from old run -> use THIS link, or inside RDP open http://127.0.0.1:7331)" >> $env:GITHUB_STEP_SUMMARY}else{"_Serve not ready - use ghrdp link + in-RDP http://127.0.0.1:7331_" >> $env:GITHUB_STEP_SUMMARY}
      - name: Enable RDP + port 7331
        shell: pwsh
        run: |
          $r='HKLM:\System\CurrentControlSet\Control\Terminal Server';Set-ItemProperty $r fDenyTSConnections 0;Set-ItemProperty "$r\WinStations\RDP-Tcp" UserAuthentication 0;Set-ItemProperty "$r\WinStations\RDP-Tcp" SecurityLayer 1;Set-ItemProperty "$r\WinStations\RDP-Tcp" MinEncryptionLevel 2;Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA 0;Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -EA 0|Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -EA 0;Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0;New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -EA 0|Out-Null;& netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes|Out-Null;$LASTEXITCODE=0
      - name: Create RDP account (safe pwd + never-throw groups + NO ghost profile)
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue';$rng=[Security.Cryptography.RandomNumberGenerator]::Create();$hb=[byte[]]::new(4);$rng.GetBytes($hb);$user='rdp'+(-join($hb|%{$_.ToString('x2')}));function New-SafePassword($U,$F,$Len){$lo='abcdefghijkmnopqrstuvwxyz';$up='ABCDEFGHJKLMNPQRSTUVWXYZ';$di='23456789';$sp='!@^-_+~';$all=$lo+$up+$di+$sp;$b4=[byte[]]::new(4);function RandInt($m){$rng.GetBytes($b4);[int]([BitConverter]::ToUInt32($b4,0) % [uint32]$m)};function Pick($s){[string]$s[(RandInt $s.Length)]};$bad=New-Object Collections.Generic.HashSet[string];foreach($src in @($U,$F)){$s=([string]$src).ToLower();for($i=0;$i -le ($s.Length-3);$i++){[void]$bad.Add($s.Substring($i,3))}};for($a=0;$a -lt 500;$a++){$r=[char[]]::new($Len);$r[0]=(Pick $lo)[0];$r[1]=(Pick $up)[0];$r[2]=(Pick $di)[0];$r[3]=(Pick $sp)[0];for($i=4;$i -lt $Len;$i++){$r[$i]=(Pick $all)[0]};for($i=$Len-1;$i -gt 0;$i--){$j=RandInt ($i+1);$t=$r[$i];$r[$i]=$r[$j];$r[$j]=$t};$c=-join $r;$lw=$c.ToLower();$g=$true;foreach($t in $bad){if($t -and $lw.Contains($t)){$g=$false;break}};if($g){return $c}};throw 'pwd gen failed'};$created=$false;$pass=$null;for($try=0;$try -lt 6;$try++){$pass=New-SafePassword $user 'RDP Session' (24+$try);try{New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -EA Stop|Out-Null;$created=$true;break}catch{if($_.ToString() -match 'InvalidPasswordException'){Write-Host "pwd rejected $try"}else{throw}}};if(-not $created){throw "New-LocalUser failed"};Enable-LocalUser $user -EA 0;function InGrp($sid,$u){try{$m=Get-LocalGroupMember -SID (New-Object Security.Principal.SecurityIdentifier($sid)) -EA 0;foreach($mm in @($m)){if(([string]$mm.Name -eq $u) -or ([string]$mm.Name -like "*\$u")){return $true}}}catch{};return $false};foreach($p in @(@('S-1-5-32-544','Administrators'),@('S-1-5-32-555','Remote Desktop Users'))){$sid=$p[0];$gn=$p[1];if(InGrp $sid $user){continue};for($a=0;$a -lt 3;$a++){try{Add-LocalGroupMember -SID (New-Object Security.Principal.SecurityIdentifier($sid)) -Member $user -EA Stop;break}catch{if($_.ToString() -match 'already a member'){break}};try{& net.exe localgroup $gn $user /add 2>$null|Out-Null;$LASTEXITCODE=0}catch{};Start-Sleep 1}};if(Test-Path 'D:\'){$big='D:\RDP-Storage';New-Item -ItemType Directory $big -Force|Out-Null;& icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null|Out-Null;$LASTEXITCODE=0;$ws=New-Object -ComObject WScript.Shell;$sc=$ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk");$sc.TargetPath=$big;$sc.Save()};Add-Content $env:GITHUB_ENV "RDP_USER=$user";Add-Content $env:GITHUB_ENV "RDP_PASS=$pass";Write-Host "Created $user (profile NOT pre-created -> watcher resolves real suffixed path at runtime)"
      - name: Show RDP credentials
        shell: pwsh
        run: |
          $ip=(& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim();$u=$env:RDP_USER;$p=$env:RDP_PASS;$g="ghrdp://$ip/"+[uri]::EscapeDataString($u)+"/"+[uri]::EscapeDataString($p);Add-Content $env:GITHUB_ENV ("GHRDP_NOW=$g");Write-Host "IP=$ip USER=$u PASS=$p";if($env:SERVE_URL){Write-Host "WEBAPP(this run)=$($env:SERVE_URL)"};Write-Host "PASTE=$g";"IP $ip / $u / $p  |  paste locally: ``$g``  |  inside RDP dashboard: http://127.0.0.1:7331" >> $env:GITHUB_STEP_SUMMARY
      - name: Write mirror lib (NEW gofile + fallbacks + real % + telegraph index)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12;$ErrorActionPreference='SilentlyContinue'
          function ReadCfg{$b=[IO.File]::ReadAllBytes($env:GHRDP_CFG);if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]};return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json)}
          function SaveCfg($c){[IO.File]::WriteAllText($c.cfgPath,($c|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding $false))}
          function B64U($s){$x=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s));return $x.Replace('+','-').Replace('/','_').TrimEnd('=')}
          $global:GHRDP_PROG=@{ts='';alive=$true;resolvedProfile='';rentryUrl='';active=@{name='';phase='idle';bytesDone=0;bytesTotal=0;pct=0;speedBps=0};agg=@{done=0;active=0;failed=0;tracked=0;bytesDone=0;bytesTotal=0;overallPct=0;speedBps=0};files=@();log=@();scan=@{}};$global:GHRDP_PROG_PATH=$null;$global:GHRDP_LASTFLUSH=0;$global:GHRDP_DONE_BYTES=0;$global:GHRDP_TOTAL_BYTES=0;$global:GHRDP_SP=@{t=0;b=0};$global:GHRDP_SP_A=@{t=0;b=0};$global:GHRDP_CUR=$null
          function Init-Progress($p){$global:GHRDP_PROG_PATH=$p;$n=[datetime]::Now.Ticks;$global:GHRDP_SP=@{t=$n;b=0};$global:GHRDP_SP_A=@{t=$n;b=0}}
          function Set-Active($n,$ph,$tot){$a=$global:GHRDP_PROG.active;$a.name=$n;$a.phase=$ph;$a.bytesDone=0;$a.bytesTotal=[long]$tot;$a.pct=0;$a.speedBps=0;$global:GHRDP_SP_A=@{t=[datetime]::Now.Ticks;b=0};if($global:GHRDP_CUR){$global:GHRDP_CUR.phase=$ph;$global:GHRDP_CUR.bytesDone=0;$global:GHRDP_CUR.bytesTotal=[long]$tot;$global:GHRDP_CUR.pct=0}}
          function Tick-Bytes($n){$p=$global:GHRDP_PROG;$p.active.bytesDone+=[long]$n;if($global:GHRDP_CUR){$global:GHRDP_CUR.bytesDone+=[long]$n;if($global:GHRDP_CUR.bytesTotal -gt 0){$global:GHRDP_CUR.pct=[math]::Round(100.0*$global:GHRDP_CUR.bytesDone/$global:GHRDP_CUR.bytesTotal,1)}};$now=[datetime]::Now.Ticks;if(($now-$global:GHRDP_LASTFLUSH) -gt 1500000){Flush-Progress $false}}
          function Flush-Progress($f){$now=[datetime]::Now.Ticks;if(-not $f -and ($now-$global:GHRDP_LASTFLUSH) -lt 1500000){return};$global:GHRDP_LASTFLUSH=$now;$p=$global:GHRDP_PROG;$p.ts=[datetime]::Now.ToString('o');$comp=$global:GHRDP_DONE_BYTES+$(if($p.active.phase -eq 'upload'){$p.active.bytesDone}else{0});$dt=($now-$global:GHRDP_SP.t)/1e7;if($dt -gt 0.5){$p.agg.speedBps=[math]::Max(0,[math]::Round(($comp-$global:GHRDP_SP.b)/$dt));$global:GHRDP_SP=@{t=$now;b=$comp}};$dta=($now-$global:GHRDP_SP_A.t)/1e7;if($dta -gt 0.5){$p.active.speedBps=[math]::Max(0,[math]::Round(($p.active.bytesDone-$global:GHRDP_SP_A.b)/$dta));$global:GHRDP_SP_A=@{t=$now;b=$p.active.bytesDone}};if($p.active.bytesTotal -gt 0){$p.active.pct=[math]::Round(100.0*$p.active.bytesDone/$p.active.bytesTotal,1)}else{$p.active.pct=0};$p.agg.bytesDone=$comp;if($p.agg.bytesTotal -gt 0){$p.agg.overallPct=[math]::Round(100.0*$comp/$p.agg.bytesTotal,1)}else{$p.agg.overallPct=0};if($global:GHRDP_PROG_PATH){try{$t=$global:GHRDP_PROG_PATH+'.tmp';[IO.File]::WriteAllText($t,($p|ConvertTo-Json -Depth 7 -Compress),(New-Object Text.UTF8Encoding $false));[IO.File]::Copy($t,$global:GHRDP_PROG_PATH,$true);Remove-Item $t -Force -EA 0}catch{}}}
          function Encrypt-File($in,$out,$pw){$a=[Security.Cryptography.Aes]::Create();$a.KeySize=256;$a.Mode='CBC';$a.Padding='PKCS7';$salt=[byte[]]::new(16);([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt);$a.IV=[byte[]]::new(16);([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($a.IV);$k=New-Object Security.Cryptography.Rfc2898DeriveBytes($pw,$salt,100000,[Security.Cryptography.HashAlgorithmName]::SHA256);$a.Key=$k.GetBytes(32);$of=[IO.File]::Create($out);$of.Write($salt,0,16);$of.Write($a.IV,0,16);$cs=New-Object Security.Cryptography.CryptoStream($of,$a.CreateEncryptor(),[Security.Cryptography.CryptoStreamMode]::Write);$inf=[IO.File]::Open($in,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite);$buf=New-Object byte[] 65536;$r=1;while($r -gt 0){$r=$inf.Read($buf,0,$buf.Length);if($r -gt 0){$cs.Write($buf,0,$r);Tick-Bytes $r}};$inf.Close();$cs.Close();$of.Close();$a.Clear()}
          function Upload-File($enc,$name){$ua='Mozilla/5.0 ghrdp/4';$safe=($name -replace '[^\x20-\x7E]','_') -replace '[^A-Za-z0-9._-]','_';for($a=1;$a -le 4;$a++){foreach($ep in @('https://upload.gofile.io/uploadfile','https://store1.gofile.io/contents/uploadfile')){try{$bd='ghrdp'+[guid]::NewGuid().ToString('N');$iso=[Text.Encoding]::GetEncoding('iso-8859-1');$hd=$iso.GetBytes("--$bd`r`nContent-Disposition: form-data; name=`"file`"; filename=`"$safe`"`r`nContent-Type: application/octet-stream`r`n`r`n");$ft=$iso.GetBytes("`r`n--$bd--`r`n");$rq=[Net.HttpWebRequest]::Create($ep);$rq.Method='POST';$rq.ContentType="multipart/form-data; boundary=$bd";$rq.UserAgent=$ua;$rq.Timeout=1800000;$rq.ReadWriteTimeout=1800000;$rs=$rq.GetRequestStream();$rs.Write($hd,0,$hd.Length);$fs=[IO.File]::Open($enc,'Open','Read','Read');$buf=New-Object byte[] 65536;$r=1;while($r -gt 0){$r=$fs.Read($buf,0,$buf.Length);if($r -gt 0){$rs.Write($buf,0,$r);Tick-Bytes $r}};$fs.Close();$rs.Write($ft,0,$ft.Length);$rs.Close();$rp=$rq.GetResponse();$sr=New-Object IO.StreamReader($rp.GetResponseStream());$raw=$sr.ReadToEnd();$sr.Close();$rp.Close();"gf raw[$ep] a$a : $raw"|Out-File $env:GHRDP_LOG -Append;$uj=$raw|ConvertFrom-Json -EA Stop;$d=$uj.data;if(-not $d){$d=$uj};if($uj.status -eq 'ok' -or $d.downloadPage -or $d.code){if($d.downloadPage){return $d.downloadPage};if($d.code){return "https://gofile.io/d/$($d.code)"}}}catch{"gf err[$ep] a$a $($_.Exception.Message)"|Out-File $env:GHRDP_LOG -Append;$LASTEXITCODE=0}};try{$u=(& curl.exe -sS -A $ua --max-time 1800 -F "file=@$enc;filename=$safe" https://0x0.st 2>$null).Trim();if($u -match '^https?://'){"0x0 a$a $u"|Out-File $env:GHRDP_LOG -Append;return $u}}catch{$LASTEXITCODE=0};try{$u=(& curl.exe -sS -A $ua --max-time 1800 -F reqtype=fileupload -F "fileToUpload=@$enc" https://catbox.moe/user/api.php 2>$null).Trim();if($u -match '^https?://'){"catbox a$a $u"|Out-File $env:GHRDP_LOG -Append;return $u}}catch{$LASTEXITCODE=0};try{$raw=& curl.exe -sS -A $ua --max-time 1800 -F "file=@$enc" https://tmpfiles.org/api/v1/upload 2>$null;$uj=$raw|ConvertFrom-Json -EA 0;if($uj.status -eq 'success' -and $uj.data.url){$u=$uj.data.url -replace 'tmpfiles\.org/','tmpfiles.org/dl/';"tmp a$a $u"|Out-File $env:GHRDP_LOG -Append;return $u}}catch{$LASTEXITCODE=0};try{$raw=& curl.exe -sS -A $ua --max-time 1800 -F "file=@$enc" https://file.io 2>$null;$uj=$raw|ConvertFrom-Json -EA 0;if($uj.success -and $uj.link){"fileio a$a $($uj.link)"|Out-File $env:GHRDP_LOG -Append;return $uj.link}}catch{$LASTEXITCODE=0};Start-Sleep ([math]::Min(40,5*$a))};return $null}
          function LoadIdx($c){if(Test-Path $c.idxFile){try{return [Collections.ArrayList]@(Get-Content $c.idxFile -Raw|ConvertFrom-Json -EA Stop)}catch{}};return (New-Object Collections.ArrayList)}
          function SaveIdx($c,$i){[IO.File]::WriteAllText($c.idxFile,($i|ConvertTo-Json -Depth 6),(New-Object Text.UTF8Encoding $false))}
          function PushIdx($c,$idx){$L=New-Object Collections.ArrayList;[void]$L.Add('# GitHub RDP mirror (AES-256)');[void]$L.Add('Decrypt password: '+$c.decPw);[void]$L.Add('');if($idx.Count -eq 0){[void]$L.Add('_(none yet)_')};$n=1;foreach($it in $idx){$ln="$n. **$($it.name)** [$($it.status)] ($($it.src)) $($it.time)";if($it.gofile){$ln+='  ->  '+$it.gofile};[void]$L.Add($ln);$n++};$txt=$L -join "`r`n";$nodes=New-Object Collections.ArrayList;foreach($x in ($txt -split "`r?`n")){if($x -match '^\s*$'){continue};if($x -match '^#\s*(.*)$'){[void]$nodes.Add(@{tag='h3';children=@($Matches[1])})}else{[void]$nodes.Add(@{tag='p';children=@($x)})}};$cj=$nodes|ConvertTo-Json -Depth 8 -Compress;if(-not $c.telegraphToken){try{$ac=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{short_name='ghrdp';author_name='ghrdp'} -TimeoutSec 30;if($ac.ok){$c.telegraphToken=$ac.result.access_token}}catch{$LASTEXITCODE=0}};if($c.telegraphToken){try{if(-not $c.telegraphPath){$pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{access_token=$c.telegraphToken;title='GitHub RDP mirror';content=$cj;return_content='false'} -TimeoutSec 30;if($pg.ok){$c.telegraphPath=$pg.result.path;$c.rentryUrl=$pg.result.url}}else{$pg=Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{access_token=$c.telegraphToken;path=$c.telegraphPath;title='GitHub RDP mirror';content=$cj;return_content='false'} -TimeoutSec 30;if($pg.ok){$c.rentryUrl=$pg.result.url}}}catch{$LASTEXITCODE=0}};SaveCfg $c;$global:GHRDP_PROG.rentryUrl=$c.rentryUrl;return [bool]$c.rentryUrl}
          LIBEOF
      - name: Write watcher (real-profile resolution + writes roots back + markers)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference='Continue';$sd=Split-Path $CfgPath -Parent;try{[IO.File]::WriteAllText((Join-Path $sd 'ghrdp_watcher_started.txt'),("started "+(Get-Date -f o)+" as "+(whoami)+" PROFILE="+$env:USERPROFILE),(New-Object Text.UTF8Encoding $false))}catch{};trap{try{[IO.File]::WriteAllText((Join-Path $sd 'ghrdp_watcher_FATAL.txt'),("FATAL "+(Get-Date -f o)+"`r`n"+$_.Exception.ToString()),(New-Object Text.UTF8Encoding $false))}catch{};continue}
          $progEarly=Join-Path $sd 'ghrdp_progress.json';function Write-HB($m){try{$h=@{ts=(Get-Date -f o);alive=$true;resolvedProfile='';agg=@{tracked=0;done=0;active=0;failed=0};files=@();log=@($m);scan=@{}};[IO.File]::WriteAllText($progEarly,($h|ConvertTo-Json -Depth 7 -Compress),(New-Object Text.UTF8Encoding $false))}catch{}}
          $cn=$false;$mtx=New-Object Threading.Mutex $true,'Global\ghrdp-watcher-single',([ref]$cn);if(-not $cn){Write-HB 'lock held';exit 0}
          $cfg=$null;try{$b=[IO.File]::ReadAllBytes($CfgPath);if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]};$cfg=([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop}catch{Write-HB ('CFG FAIL '+$_.Exception.Message);throw};if(-not $cfg){Write-HB 'CFG NULL';throw 'cfg'}
          $env:GHRDP_CFG=$CfgPath;$env:GHRDP_LOG=$cfg.logFile;. $cfg.libPath;if(-not (Get-Command Init-Progress -EA 0)){Write-HB 'LIB NOT LOADED';throw 'lib'};Init-Progress $cfg.progressPath;$script:RUNLOG=New-Object Collections.ArrayList;$script:SCAN=@{};$script:ROOTSW=$false
          function LErr($t,$e){$m=("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'),$t,$e.Exception.Message);[void]$script:RUNLOG.Add($m);try{Add-Content $cfg.logFile $m -EA 0}catch{}}
          function ScanLine{$p=@($script:SCAN.GetEnumerator()|%{$v=$_.Value;$s=$_.Key+':raw='+$v.rawTotal+'/elig='+$v.eligible+' @'+$v.path;if($v.error){$s+=' ERR='+$v.error};$s});return ('[scan] '+($p -join ' | '))}
          function RealProf{$p=$env:USERPROFILE;try{$sid=([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value;$pi=(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid" -Name ProfileImagePath -EA 0).ProfileImagePath;if($pi){$pi=[Environment]::ExpandEnvironmentVariables($pi);if(Test-Path $pi){$p=$pi}}}catch{};return $p}
          function AddR($L,$path,$tag,$rec,$min){if(-not $path){return $L};$p=$path.TrimEnd('\');if(-not $p){return $L};foreach($r in $L){if($r.path.TrimEnd('\').ToLower() -eq $p.ToLower()){return $L}};try{New-Item -ItemType Directory -Path $p -Force -EA 0|Out-Null}catch{};$L+=@{path=$p;tag=$tag;rec=[bool]$rec;min=[long]$min};return $L}
          function BuildRoots{$R=@();$prof=RealProf;$global:GHRDP_PROG.resolvedProfile=$prof;foreach($r in $cfg.roots){if(@('Downloads','Desktop','Documents','Temp') -notcontains $r.tag){$R=AddR $R $r.path $r.tag $r.rec $r.min}};$map=@{Downloads=@('shell:Downloads');Desktop=@('shell:Desktop');Documents=@('shell:Personal')};$un=$env:USERNAME;foreach($t in 'Downloads','Desktop','Documents'){$p=$null;try{$sh=New-Object -ComObject Shell.Application;$ns=$sh.NameSpace($map[$t][0]);if($ns -and $ns.Self -and $ns.Self.Path -and (Test-Path -LiteralPath $ns.Self.Path -PathType Container)){$p=$ns.Self.Path}}catch{};if(-not $p){$c=Get-ChildItem 'C:\Users' -Directory -EA 0|?{$_.Name -eq $un -or $_.Name.StartsWith("$un.")}|%{Join-Path $_.FullName $t}|?{Test-Path -LiteralPath $_ -PathType Container}|select -First 1;if($c){$p=$c}else{$p=Join-Path $prof $t}};$R=AddR $R $p $t $false 0;foreach($base in @((Join-Path $prof 'OneDrive'),$env:OneDrive,$env:OneDriveConsumer)){if($base){$R=AddR $R (Join-Path $base $t) $t $false 0}}};$R=AddR $R (Join-Path $prof 'AppData\Local\Temp') 'Temp' $true 102400;$c2=Get-ChildItem 'C:\Users' -Directory -EA 0|?{$_.Name -eq $un -or $_.Name.StartsWith("$un.")}|%{Join-Path $_.FullName 'AppData\Local\Temp'}|?{Test-Path -LiteralPath $_ -PathType Container}|select -First 1;if($c2){$R=AddR $R $c2 'Temp' $true 102400};$qini=Join-Path $env:APPDATA 'qBittorrent\qBittorrent.ini';if(Test-Path $qini){$q=Get-Content $qini -Raw -EA 0;if($q){if($q -match '(?m)^\s*SavePath\s*=\s*(.+)$'){$R=AddR $R $Matches[1].Trim() 'qB-Save' $true 0};if($q -match '(?m)^\s*TempPath\s*=\s*(.+)$'){$R=AddR $R $Matches[1].Trim() 'qB-Temp' $true 102400}}};return $R}
          $roots=BuildRoots;Write-HB ('roots('+$roots.Count+') prof='+$global:GHRDP_PROG.resolvedProfile+' | '+(($roots|%{$_.tag+'='+(Test-Path -LiteralPath $_.path -PathType Container)}) -join ','))
          $junk=@('.tmp','.crdownload','.partial','.part','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak','.!qb');$done=@{};if(Test-Path $cfg.doneFile){Get-Content $cfg.doneFile|%{$done[$_]=$true}};$idx=LoadIdx $cfg;try{PushIdx $cfg $idx|Out-Null}catch{LErr 'init-idx' $_}
          function DoUpload($fi,$tag){if($done.ContainsKey($fi.FullName)){return};$len=$fi.Length;$safe=$fi.Name -replace '\|','_';$disp=($safe -replace '[^\x20-\x7E]','_') -replace '[^A-Za-z0-9._-]','_';$ex=$idx|?{$_.name -eq $safe -and $_.src -eq $tag}|select -First 1;if(-not $ex){$ex=@{name=$safe;src=$tag;status='queued';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss');pct=0;phase='queued';bytesDone=0;bytesTotal=$len;attempts=0;nextTry=0};[void]$idx.Add($ex);$global:GHRDP_TOTAL_BYTES+=$len;SaveIdx $cfg $idx};if($ex.nextTry -and ([datetime]::Now -lt [datetime]$ex.nextTry)){return};$ex.status='uploading';$ex.time=(Get-Date -f 'HH:mm:ss');$ex.bytesTotal=$len;$ex.phase='encrypt';$global:GHRDP_CUR=$ex;$enc=Join-Path $cfg.tmpDir ('ge_'+[guid]::NewGuid().ToString('N')+'.enc');$gf=$null;$eok=$false;Set-Active $disp 'encrypt' $len;try{Encrypt-File $fi.FullName $enc $cfg.decPw;$eok=$true}catch{LErr ('enc '+$fi.Name) $_};if($eok){$ex.phase='upload';Set-Active $disp 'upload' $len;try{$gf=Upload-File $enc $disp}catch{LErr ('up '+$fi.Name) $_}};Remove-Item $enc -Force -EA 0;$global:GHRDP_CUR=$null;if($gf){$ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe);$ex.gofile=$gf;$ex.status='ok';$ex.pct=100;$ex.phase='done';$ex.time=(Get-Date -f 'HH:mm:ss');$done[$fi.FullName]=$true;$fi.FullName|Out-File $cfg.doneFile -Append;$global:GHRDP_DONE_BYTES+=$len;SaveIdx $cfg $idx;try{PushIdx $cfg $idx|Out-Null}catch{LErr 'push' $_};"[$(Get-Date -f o)] OK $tag $($fi.Name) ($len) -> $gf"|Out-File $cfg.logFile -Append}else{$ex.status='retry';$ex.phase='wait';$ex.attempts=([int]$ex.attempts)+1;$ex.nextTry=([datetime]::Now.AddSeconds([math]::Min(120,10*$ex.attempts))).ToString('o');SaveIdx $cfg $idx;"[$(Get-Date -f o)] RETRY $tag $($fi.Name) #$($ex.attempts)"|Out-File $cfg.logFile -Append};Set-Active '' 'idle' 0}
          function Scan($r){$elig=0;$rawAll=@();if(-not (Test-Path -LiteralPath $r.path -PathType Container)){$script:SCAN[$r.tag]=@{rawTotal=0;eligible=0;path=$r.path;error='path-missing'};return};try{$items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0}else{Get-ChildItem -LiteralPath $r.path -File -EA 0}}catch{$script:SCAN[$r.tag]=@{rawTotal=-1;eligible=0;path=$r.path;error=$_.Exception.Message};return};$rawAll=@($items);foreach($fi in $rawAll){if($done.ContainsKey($fi.FullName)){continue};if($junk -contains $fi.Extension.ToLower()){continue};if($fi.Length -lt $r.min){continue};if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue};$elig++;DoUpload $fi $r.tag};$script:SCAN[$r.tag]=@{rawTotal=$rawAll.Count;eligible=$elig;path=$r.path}}
          function SweepAll($r){if(-not (Test-Path -LiteralPath $r.path -PathType Container)){return};$items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0|sort Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -EA 0|sort Length -Descending};foreach($fi in $items){if($done.ContainsKey($fi.FullName)){continue};if($junk -contains $fi.Extension.ToLower()){continue};if($fi.Length -lt $r.min){continue};DoUpload $fi $r.tag}}
          function EmergencyPass{"[$(Get-Date -f o)] EMERGENCY"|Out-File $cfg.logFile -Append;foreach($p in @('qbittorrent','qbittorrent-nox')){Get-Process -Name $p -EA 0|Stop-Process -Force -EA 0};Start-Sleep 4;for($rd=0;$rd -lt 3;$rd++){foreach($r in $roots){Scan $r};Start-Sleep 4};foreach($r in $roots){SweepAll $r};SaveIdx $cfg $idx;try{PushIdx $cfg $idx|Out-Null}catch{};Remove-Item $cfg.emergencyFlag -Force -EA 0}
          function SyncProg{try{$p=$global:GHRDP_PROG;$d=0;$u=0;$f=0;foreach($it in $idx){if($it.status -eq 'ok'){$d++}elseif($it.status -eq 'limit'){$f++}else{$u++}};$p.agg.done=$d;$p.agg.failed=$f;$p.agg.tracked=$idx.Count;$p.agg.active=$(if($p.active.phase -ne 'idle'){1}else{0});$p.agg.bytesTotal=$global:GHRDP_TOTAL_BYTES;$p.files=@(foreach($it in $idx){@{name=$it.name;src=$it.src;status=$it.status;pct=$it.pct;phase=$it.phase;bytesDone=$it.bytesDone;bytesTotal=$it.bytesTotal}});$p.scan=@{};foreach($k in @($script:SCAN.Keys)){$p.scan[$k]=$script:SCAN[$k]};$mk='[INDEX] url='+$cfg.rentryUrl;$errs=@($script:RUNLOG|select -Last 5);$ft=@();if(Test-Path $cfg.logFile){$g=Get-Content $cfg.logFile -Tail 10 -EA 0;if($g){$ft=@($g)}};$p.log=@($mk)+@($errs)+@(ScanLine)+$ft;Flush-Progress $true}catch{LErr 'sync' $_}}
          while($true){$roots=BuildRoots;if(-not $script:ROOTSW){try{$cfg.roots=$roots;SaveCfg $cfg;$script:ROOTSW=$true}catch{LErr 'roots-write' $_}};if(Test-Path $cfg.emergencyFlag){try{EmergencyPass}catch{LErr 'em' $_}}else{foreach($r in $roots){try{Scan $r}catch{LErr ('scan '+$r.tag) $_}};if(Test-Path $cfg.flushFlag){try{for($p=0;$p -lt 8;$p++){foreach($r in $roots){Scan $r};if(-not ($idx|?{$_.status -ne 'ok' -and $_.status -ne 'retry'})){break};Start-Sleep 8};PushIdx $cfg $idx|Out-Null;Remove-Item $cfg.flushFlag -Force -EA 0}catch{LErr 'flush' $_}}};SyncProg;try{$global:GHRDP_PROG.ts=(Get-Date -f o);$global:GHRDP_PROG.alive=$true;Flush-Progress $true}catch{LErr 'hb' $_};Start-Sleep 3}
          WATCHEOF
      - name: Write dashboard server (concurrent + troubleshoot + heal + startwatcher)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
          function Start-GhrdpServer($Port,$UiDir,$ProgressPath,$CfgPath,$EmFlag,$FlushFlag,$OkFile){
          $ErrorActionPreference='Continue';function RJ($p){$fs=[IO.File]::Open($p,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite);$ms=New-Object IO.MemoryStream;$fs.CopyTo($ms);$fs.Dispose();$b=$ms.ToArray();$ms.Dispose();if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]};return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop)}
          function RCfg{if(-not $CfgPath -or -not (Test-Path $CfgPath)){return $null};try{return (RJ $CfgPath)}catch{return $null}}
          function RProg{if(-not $ProgressPath -or -not (Test-Path $ProgressPath)){return $null};try{return (RJ $ProgressPath)}catch{return $null}}
          function QV($q,$n){if(-not $q){return $null};foreach($pair in $q.TrimStart('?').Split('&')){$kv=$pair.Split('=');if($kv[0] -eq $n){if($kv.Length -gt 1){return [uri]::UnescapeDataString($kv[1])};return ''}};return $null}
          function Send($resp,$st,$ct,$txt){$resp.StatusCode=[int]$st;$resp.ContentType=$ct;$resp.Headers.Add('Cache-Control','no-store');$resp.KeepAlive=$false;$b=[Text.Encoding]::UTF8.GetBytes([string]$txt);$resp.ContentLength64=$b.Length;$resp.OutputStream.Write($b,0,$b.Length)}
          function Aug{$cfg=RCfg;$prog=RProg;if(-not $prog){$prog=[PSCustomObject]@{ts=(Get-Date).ToString('o');alive=$false;resolvedProfile='';active=[PSCustomObject]@{name='';phase='idle';bytesDone=0;bytesTotal=0;pct=0;speedBps=0};agg=[PSCustomObject]@{done=0;active=0;failed=0;tracked=0;bytesDone=0;bytesTotal=0;overallPct=0;speedBps=0};files=@();log=@();scan=[PSCustomObject]@{}}};Add-Member $prog serverTs (Get-Date).ToString('o') -Force;Add-Member $prog mirror ([bool]$cfg.mirror) -Force;$cr=[PSCustomObject]@{ip='';user='';pass=''};if($cfg){$cr=[PSCustomObject]@{ip=$cfg.rdpIp;user=$cfg.rdpUser;pass=$cfg.rdpPass}};Add-Member $prog creds $cr -Force;Add-Member $prog ghrdp $(if($cfg){$cfg.ghrdp}else{''}) -Force;Add-Member $prog rentry $(if($cfg){$cfg.rentryUrl}else{''}) -Force;return $prog}
          function Troubleshoot($cfg,$prog){$listen=[bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0);$fw=[bool](Get-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0);$wp=@(Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -EA 0|?{$_.CommandLine -like '*ghrdp-watcher*'});$wok=[bool]$wp;$wo='';if($wp){try{$o=Invoke-CimMethod -InputObject $wp[0] -MethodName GetOwner -EA Stop;$wo=$o.Domain+'\'+$o.User}catch{}};$prof='';if($prog -and $prog.resolvedProfile){$prof=$prog.resolvedProfile};$pok=$prof -and (Test-Path $prof);$dlp='';$dlok=$false;if($prof){$dlp=Join-Path $prof 'Downloads';$dlok=Test-Path $dlp};$trk=0;if($prog -and $prog.agg){$trk=[int]$prog.agg.tracked};$age=$null;if($prog -and $prog.ts){try{$age=[int]((Get-Date)-(Get-Date $prog.ts)).TotalSeconds}catch{}};$fresh=($age -ne $null -and $age -lt 30);$gf=$false;$gfd='';try{$pb=Join-Path $env:TEMP ('gfp_'+[guid]::NewGuid().ToString('N')+'.bin');[IO.File]::WriteAllBytes($pb,[byte[]]::new(1024));$raw=& curl.exe -sS --max-time 30 -X POST 'https://upload.gofile.io/uploadfile' -F ('file=@'+$pb) 2>$null;$LASTEXITCODE=0;Remove-Item $pb -Force -EA 0;$uj=$raw|ConvertFrom-Json -EA 0;$d=$uj.data;if(-not $d){$d=$uj};if($uj.status -eq 'ok' -or $d.downloadPage -or $d.code){$gf=$true;$gfd='upload.gofile.io OK'}else{$gfd='status='+$uj.status}}catch{$gfd='gofile blocked -> fallback hosts (0x0/catbox/tmpfiles/file.io) will carry uploads'};$idxk=[bool]($cfg -and $cfg.rentryUrl);$checks=@();$recs=@();$checks+=@{name='Dashboard port 7331 listening';pass=$listen;detail="port $Port"};$checks+=@{name='Config loaded';pass=[bool]$cfg;detail=$(if($cfg){$cfg.cfgPath}else{'missing'})};$checks+=@{name='Real profile folder resolved';pass=$pok;detail=$prof};if(-not $pok){$recs+='Log on via RDP once; watcher resolves the real (suffixed) profile at runtime.'};$checks+=@{name='Downloads folder exists';pass=$dlok;detail=$dlp};if(-not $dlok -and $pok){$recs+='Download one file in Edge inside RDP; watcher auto-picks the real folder.'};$checks+=@{name='Watcher process running';pass=$wok;detail=$(if($wok){'pid '+$wp[0].ProcessId+' ('+$wo+')'}else{'not running'})};if(-not $wok){$recs+='Click Start Watcher here, or double-click Mission Control inside RDP, or log off/on once.'};$checks+=@{name='Watcher heartbeat fresh';pass=$fresh;detail=$(if($age -ne $null){"$age s"}else{'none'})};$checks+=@{name='Files tracked';pass=($trk -gt 0);detail="tracked=$trk"};$checks+=@{name='gofile / fallback reachable';pass=$true;detail=$gfd};$checks+=@{name='Index page published';pass=$idxk;detail=$(if($cfg){$cfg.rentryUrl}else{''})};$checks+=@{name='Firewall rule present';pass=$fw;detail='ghrdp-dash'};return @{checks=$checks;recommendations=$recs;profileDir=$prof;watcherOwner=$wo;tailscaleIp=$(if($cfg){$cfg.rdpIp}else{''});serverTs=(Get-Date).ToString('o')}}
          function Heal{$cfg=RCfg;if(-not $cfg){return @{ok=$false;error='cfg missing'}};$un=$cfg.user;$nr=@();foreach($t in 'Downloads','Desktop','Documents'){$cs=Get-ChildItem 'C:\Users' -Directory -EA 0|?{$_.Name -eq $un -or $_.Name.StartsWith("$un.")}|select -First 3;foreach($c in $cs){$nr+=@{path=(Join-Path $c.FullName $t);rec=$false;min=0;tag=$t}};$nr+=@{path=(Join-Path $env:USERPROFILE $t);rec=$false;min=0;tag=$t}};$nr+=@{path=(Join-Path $env:USERPROFILE 'AppData\Local\Temp');rec=$true;min=102400;tag='Temp'};foreach($r in $cfg.roots){if(@('Downloads','Desktop','Documents','Temp') -notcontains $r.tag){$nr+=$r}};$cfg.roots=$nr;try{[IO.File]::WriteAllText($cfg.cfgPath,($cfg|ConvertTo-Json -Depth 8),(New-Object Text.UTF8Encoding $false))}catch{return @{ok=$false;error=$_.Exception.Message}};return @{ok=$true;profileDir=$env:USERPROFILE;roots=@($nr|%{$_.tag+'='+$_.path})}}
          function Handle($ctx){$req=$ctx.Request;$resp=$ctx.Response;try{$path=$req.Url.AbsolutePath.ToLowerInvariant();$loop=$false;try{$loop=[Net.IPAddress]::IsLoopback($req.RemoteEndPoint.Address)}catch{};$cfg=RCfg;$keyOk=$true;if($cfg -and $cfg.dashToken){$k=QV $req.Url.Query 'key';if(-not $loop -and $k -ne $cfg.dashToken){$keyOk=$false}};if(-not $keyOk){Send $resp 403 'application/json' '{"error":"forbidden"}';return};if($path -eq '/' -or $path -eq '/index.html'){$ui=Join-Path $UiDir 'ghrdp-ui.html';if(-not (Test-Path $ui)){Send $resp 500 'text/plain' 'UI missing';return};$h=[IO.File]::ReadAllText($ui);$st=if($loop){'0'}else{'1'};$ip='';$us='';$pw='';$gh='';if($cfg){$ip=[string]$cfg.rdpIp;$us=[string]$cfg.rdpUser;$pw=[string]$cfg.rdpPass;$gh=[string]$cfg.ghrdp};$h=$h.Replace('__STATIC__',$st).Replace('__IP__',$ip).Replace('__USER__',$us).Replace('__PASS__',$pw).Replace('__GHRDP__',$gh);Send $resp 200 'text/html; charset=utf-8' $h}elseif($path -eq '/install.ps1'){$f=Join-Path $UiDir 'ghrdp-install.ps1';if(Test-Path $f){Send $resp 200 'text/plain; charset=utf-8' ([IO.File]::ReadAllText($f))}else{Send $resp 404 'application/json' '{"error":"missing"}'}}elseif($path -eq '/progress'){Send $resp 200 'application/json' ((Aug)|ConvertTo-Json -Depth 10)}elseif($path -eq '/conn'){Send $resp 200 'application/json' ((@{serverTs=(Get-Date).ToString('o');port=$Port}|ConvertTo-Json -Compress))}elseif($path -eq '/troubleshoot'){$prog=RProg;Send $resp 200 'application/json' ((Troubleshoot $cfg $prog)|ConvertTo-Json -Depth 8)}elseif($path -eq '/heal'){Send $resp 200 'application/json' ((Heal)|ConvertTo-Json -Depth 8)}elseif($path -eq '/startwatcher'){$o='';try{$o=(& schtasks.exe /Run /TN ghrdpwatcher 2>&1|Out-String);$LASTEXITCODE=0}catch{$o=$_.Exception.Message};Send $resp 200 'application/json' ((@{ok=$true;detail=$o.Trim()}|ConvertTo-Json -Compress))}elseif($path -eq '/rdpfile'){$i2='';$u2='';if($cfg){$i2=$cfg.rdpIp;$u2=$cfg.rdpUser};$rdp="full address:s:$i2`r`nusername:s:$u2`r`nprompt for credentials:i:0`r`nredirectdrives:i:1`r`nredirectclipboard:i:1`r`nredirectprinters:i:1`r`ndrivestoredirect:s:*`r`naudiomode:i:0`r`nsession bpp:i:32`r`nconnection type:i:7`r`n";$resp.Headers.Add('Content-Disposition','attachment; filename="ghrdp.rdp"');Send $resp 200 'application/octet-stream' $rdp}elseif($path -eq '/diag'){$pd=RProg;$pl=[bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0);$fw2=[bool](Get-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0);$o=[ordered]@{cfgLoaded=[bool]$cfg;portListening=$pl;firewallRulePresent=$fw2;progressLoaded=[bool]$pd;requestLoopback=$loop;requestHost=$req.UserHostName;tailscaleIp=$(if($cfg){$cfg.rdpIp}else{''});serverTs=(Get-Date).ToString('o')};Send $resp 200 'application/json' ($o|ConvertTo-Json -Depth 6)}elseif($path -eq '/emergency'){if($EmFlag){Set-Content $EmFlag (Get-Date -f o) -Encoding ASCII};if($FlushFlag){Set-Content $FlushFlag (Get-Date -f o) -Encoding ASCII};Send $resp 200 'application/json' '{"ok":true}'}elseif($path -eq '/flush'){if($FlushFlag){Set-Content $FlushFlag (Get-Date -f o) -Encoding ASCII};Send $resp 200 'application/json' '{"ok":true}'}else{Send $resp 404 'application/json' '{"error":"not found"}'}}catch{try{Send $resp 500 'application/json' ((@{error=$_.Exception.Message}|ConvertTo-Json -Compress))}catch{}}finally{try{$resp.Close()}catch{}}}
          $L=New-Object Net.HttpListener;$L.Prefixes.Add("http://+:$Port/");try{$L.Start()}catch{if($OkFile){Set-Content $OkFile ("FAIL "+$_.Exception.Message) -Encoding ASCII};throw};if($OkFile){Set-Content $OkFile 'LISTENING' -Encoding ASCII};$dl=(Get-Date).AddMinutes(330);while($L.IsListening -and (Get-Date) -lt $dl){$ctx=$null;try{$t=$L.GetContextAsync();if(-not $t.Wait(2000)){continue};$ctx=$t.Result}catch{Start-Sleep -Milliseconds 200;continue};if($ctx){[void][System.Threading.ThreadPool]::QueueUserWorkItem([System.Threading.WaitCallback]{param($o) Handle $o},$ctx)}};try{$L.Stop()}catch{}}
          SERVEREOF
      - name: Write dashboard UI (live troubleshooter + self-heal + start-watcher + overlay)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-ui.html" <<'UIEOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta id="ghrdpStatic" content="__STATIC__"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDP Mission Control</title>
          <style>:root{--bg:#080b10;--panel:#10161d;--panel2:#0c1117;--line:#1f2b35;--ink:#eef3f7;--mut:#8298a6;--teal:#34d3b6;--teal-d:#0d3a32;--amber:#f4ad3c;--amber-d:#3a2c0e;--red:#ef5d45;--red-d:#3a1712;--green:#43d98f;--violet:#9b8cff;--mono:'JetBrains Mono',monospace;--disp:'Space Grotesk',sans-serif;--body:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--body);color:var(--ink);min-height:100vh;padding:22px 18px 60px;background:radial-gradient(1100px 600px at 8% -10%,rgba(52,211,182,.10),transparent 60%),var(--bg)}body::before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--red),var(--violet));z-index:50}.wrap{max-width:1240px;margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--teal),#1c8f7c);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#04201c;font-size:18px}.brand h1{font-family:var(--disp);font-weight:700;font-size:23px}.brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:3px}.hstat{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chip{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:var(--panel2)}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:10.5px;text-transform:uppercase}.pill .d{width:8px;height:8px;border-radius:50%;background:var(--red)}.pill.on{color:var(--teal);border-color:var(--teal-d)}.pill.on .d{background:var(--teal);animation:pulse 1.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,182,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,182,0)}100%{box-shadow:0 0 0 0 rgba(52,211,182,0)}}.clock{font-family:var(--mono);font-size:12px;color:var(--mut)}.conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mut)}.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.conn.ok .dot{background:var(--green)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px}.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}.stack{display:flex;flex-direction:column;gap:16px}.hero .pct{font-family:var(--disp);font-weight:700;font-size:clamp(64px,12vw,116px);line-height:.9;letter-spacing:-4px;margin:8px 0 4px}.hero .pct small{font-size:.30em;color:var(--mut);margin-left:6px;vertical-align:.55em}.track{height:14px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden;margin:16px 0 14px}.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),#62e6cf);transition:width .6s}.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--mono);font-size:12.5px;color:var(--mut)}.meta b{color:var(--ink)}.active .row1{display:flex;justify-content:space-between;gap:10px;margin:12px 0 9px}.active .fname{font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phase{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;padding:4px 10px;border-radius:7px;background:var(--teal-d);color:var(--teal)}.phase.encrypt{background:var(--amber-d);color:var(--amber)}.phase.idle{background:#161e25;color:var(--mut)}.mini{height:8px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden}.mini>i{display:block;height:100%;background:var(--amber);width:0%}.eyes{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}.eye-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;padding:5px 0;border-bottom:1px solid #131b22}.eye-row .v.warn{color:var(--amber)}.eye-row .v.bad{color:var(--red)}.eye-row .v.ok{color:var(--teal)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}.tile .n{font-family:var(--disp);font-weight:700;font-size:32px}.tile .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mut);margin-top:8px}.tile.done .n{color:var(--teal)}.tile.act .n{color:var(--amber)}.tile.fail .n{color:var(--red)}.crow{display:grid;grid-template-columns:48px 1fr 60px;gap:10px;align-items:center;margin:8px 0}.crow .ck{font-family:var(--mono);font-size:10px;color:var(--mut)}.crow code{font-family:var(--mono);font-size:12.5px;background:#070b0f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis}.cp{font-family:var(--mono);font-size:10px;text-transform:uppercase;background:#14202a;color:var(--teal);border:1px solid var(--teal-d);border-radius:8px;padding:8px 4px;cursor:pointer}.btn{display:block;width:100%;text-align:center;border:0;cursor:pointer;font-family:var(--disp);font-weight:700;text-transform:uppercase;border-radius:12px;padding:15px;font-size:14px;text-decoration:none}.btn.rdp{background:linear-gradient(180deg,#3fd9bd,#1f9d89);color:#04201c;margin-bottom:12px}.btn.em{background:linear-gradient(180deg,#f0644c,#c83a26);color:#fff}.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:12px;margin:6px 6px 0 0}.btn.violet{background:linear-gradient(180deg,#9b8cff,#6a5ad0);color:#fff}.btn.teal{background:linear-gradient(180deg,#3fd9bd,#1f9d89);color:#04201c}.banner{display:none;margin-top:12px;padding:14px;border-radius:12px;text-align:center;font-family:var(--disp);font-weight:700}.banner.safe{display:block;background:#16402c;color:var(--green);border:1px solid #1f6f43}.banner.warn{display:block;background:var(--amber-d);color:var(--amber)}.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.files .head,.frow{display:grid;grid-template-columns:74px 1fr 96px 60px;gap:10px;align-items:center}.files .head{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mut);padding:0 4px 10px;border-bottom:1px solid var(--line)}.flist{max-height:300px;overflow:auto;margin-top:6px}.frow{padding:9px 4px;border-bottom:1px solid #141c23}.frow .nm{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow .src{font-family:var(--mono);font-size:10px;color:var(--mut)}.st{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:6px;text-align:center}.st.ok{background:var(--teal-d);color:var(--teal)}.st.limit{background:var(--red-d);color:var(--red)}.st.uploading,.st.retry{background:var(--amber-d);color:var(--amber)}.bar{height:6px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden}.bar.ok>i{display:block;height:100%;width:100%;background:var(--teal)}.bar.up>i{display:block;height:100%;background:var(--amber)}.bar.limit>i{display:block;height:100%;width:100%;background:var(--red)}.log pre{font-family:var(--mono);font-size:11px;line-height:1.6;color:#9fe7d6;background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}.empty{color:var(--mut);font-family:var(--mono);font-size:12px;padding:18px 4px}.code{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--mut);background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}.code a{color:var(--teal)}.diagbtn{font-family:var(--mono);font-size:11px;background:var(--amber-d);color:var(--amber);border:1px solid #5a4414;border-radius:8px;padding:7px 12px;cursor:pointer}.tcheck{display:flex;align-items:flex-start;gap:10px;font-family:var(--mono);font-size:12px;padding:8px 4px;border-bottom:1px solid #141c23}.tcheck .ic{font-weight:700;width:20px}.tcheck .ic.ok{color:var(--green)}.tcheck .ic.bad{color:var(--red)}.tcheck .dt{color:var(--mut);font-size:11px;margin-top:2px}.rec{font-family:var(--mono);font-size:11.5px;color:var(--amber);background:var(--amber-d);border:1px solid #6b4414;border-radius:8px;padding:8px 10px;margin-top:6px}details.setup{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}details.setup>summary{cursor:pointer;padding:13px 16px;font-family:var(--disp);font-weight:600;font-size:13px}details.setup .body{padding:0 16px 16px;font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.7}details.setup .body b{color:var(--ink)}details.setup .dl{display:inline-block;margin:10px 0 4px;background:linear-gradient(180deg,#9b8cff,#6a5ad0);color:#fff;text-decoration:none;font-family:var(--disp);font-weight:700;text-transform:uppercase;border-radius:10px;padding:11px 18px;font-size:12.5px}#overlay{position:fixed;inset:0;background:rgba(8,11,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:99;font-family:var(--mono);color:var(--mut);text-align:center;padding:20px}#overlay .sp{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite}#overlay a{color:var(--teal)}@keyframes spin{to{transform:rotate(360deg)}}#overlay.hide{display:none}@media(max-width:900px){.grid,.lower{grid-template-columns:1fr}}</style></head>
          <body>
          <div id="overlay"><div class="sp"></div><div id="ovTxt">connecting to runner…</div><div style="font-size:12px;max-width:520px">If this stays blank: you opened a <b>stale link from an old run</b> (the runner is gone). Open the link in <b>this</b> run's Actions summary, or inside RDP open <a href="http://127.0.0.1:7331/">http://127.0.0.1:7331</a> (never blank). Auto-retrying…</div></div>
          <div class="wrap"><header><div class="brand"><div class="logo">R</div><div><h1>Mission Control</h1><span class="tag">live mirror telemetry · RDP</span></div></div><div class="hstat"><span class="clock" id="clock">--:--:--</span><span class="conn" id="conn"><span class="dot"></span><span id="connTxt">connecting…</span></span><span class="chip" id="mode">checking…</span><button class="diagbtn" id="diagBtn" type="button">🔍 DIAGNOSE</button><button class="diagbtn" id="tsBtn" type="button" style="background:#0d3a32;color:var(--teal);border-color:var(--teal-d)">🩺 TROUBLESHOOT</button><span class="pill" id="alive"><span class="d"></span><span id="alivetxt">checking</span></span></div></header>
          <div class="grid"><div class="stack"><div class="panel hero"><div class="lbl">Overall uploaded</div><div class="pct"><span id="pct">0</span><small>%</small></div><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span><b id="bDone">0 B</b> / <span id="bTotal">0 B</span></span><span>throughput <b id="speed">0 B/s</b></span><span>eta <b id="eta">—</b></span></div></div>
          <div class="panel active"><div class="lbl">Active transfer</div><div class="row1"><span class="fname" id="aName">idle</span><span class="phase idle" id="aPhase">idle</span></div><div class="mini"><i id="aBar"></i></div><div class="meta" style="margin-top:10px"><span><b id="aBytes">0 B</b> / <span id="aTotal">0 B</span></span><span><b id="aSpeed">0 B/s</b></span></div><div class="eyes" id="eyes"></div></div></div>
          <div class="stack"><div class="panel"><div class="lbl" style="margin-bottom:12px">RDP credentials (auto-filled by handler)</div><div class="crow" data-k="ip"><span class="ck">IP</span><code id="vIp">__IP__</code><button class="cp" type="button">copy</button></div><div class="crow" data-k="user"><span class="ck">USER</span><code id="vUser">__USER__</code><button class="cp" type="button">copy</button></div><div class="crow" data-k="pass"><span class="ck">PASS</span><code id="vPass">__PASS__</code><button class="cp" type="button">copy</button></div><a class="btn rdp" id="rdp" href="__GHRDP__">⚡ Open Remote Desktop (zero typing)</a><div style="margin-top:6px"><a class="btn sm violet" href="/rdpfile">⬇ .rdp (drives+clipboard)</a><button class="btn sm teal" id="reconnect" type="button">↻ Reconnect</button><a class="btn sm violet" href="/install.ps1" download>🔌 Connector</a></div><details class="setup"><summary>▶ First-time setup (if handler missing)</summary><div class="body">Install the <b>ghrdp://</b> connector <b>once</b>:<br><a class="dl" href="/install.ps1" download>⬇ Download connector</a><br>Right-click → Run with PowerShell. Then click Open Remote Desktop again.</div></details></div>
          <div class="panel"><div class="lbl" style="margin-bottom:12px">Counters</div><div class="stats"><div class="tile done"><div class="n" id="cDone">0</div><div class="k">done</div></div><div class="tile act"><div class="n" id="cAct">0</div><div class="k">active</div></div><div class="tile fail"><div class="n" id="cFail">0</div><div class="k">failed</div></div><div class="tile"><div class="n" id="cTrk">0</div><div class="k">tracked</div></div></div></div>
          <div class="panel" id="mirrorBox" style="display:none"><div class="lbl" style="margin-bottom:12px">Mirror control</div><button class="btn em" id="emBtn" type="button">⚡ Upload everything now</button><div class="banner" id="banner"></div><p style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:10px">Click, wait for green banner, then Cancel workflow.</p></div></div></div>
          <div class="panel" id="tsPanel" style="margin-top:16px;display:none"><div class="lbl" style="margin-bottom:10px">🩺 Live Troubleshooter (RDP + local PC)</div><div style="margin-bottom:12px"><button class="btn sm teal" id="tsRunBtn" type="button">Run diagnostics</button><button class="btn sm violet" id="healBtn" type="button">🔧 Self-Heal roots</button><button class="btn sm teal" id="swBtn" type="button">▶ Start Watcher</button><span id="tsProfile" style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-left:10px"></span></div><div id="tsChecks"><div class="empty">Click Run diagnostics.</div></div><div id="tsRecs"></div></div>
          <div class="lower"><div class="panel files"><div class="lbl" style="margin-bottom:10px">File queue (per-file %)</div><div class="head"><span>status</span><span>file</span><span>progress</span><span>src</span></div><div class="flist" id="flist"><div class="empty">No files tracked yet.</div></div></div>
          <div class="panel"><div class="lbl" style="margin-bottom:10px">Live log</div><pre id="log">waiting for watcher…</pre><div class="code" id="rentry" style="display:none"></div><div id="diagBox" style="margin-top:14px;display:none"><div class="lbl" style="margin-bottom:8px">Diagnostics (raw)</div><pre id="diagOut" style="background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:240px;overflow:auto;white-space:pre-wrap"></pre></div></div></div></div>
          <script>(function(){var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';var cur='__GHRDP__';var got=false;function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';}function fe(r,s){s=+s||0;if(s<=0||r<=0)return '—';var x=r/s;if(x<60)return Math.round(x)+'s';if(x<3600)return Math.round(x/60)+'m';return(x/3600).toFixed(1)+'h';}function clk(){document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8);}setInterval(clk,1000);clk();function cp(t){if(navigator.clipboard)navigator.clipboard.writeText(t);else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}}document.querySelectorAll('.crow .cp').forEach(function(b){b.addEventListener('click',function(){var c=b.closest('.crow').querySelector('code');cp(c?c.textContent:'');b.textContent='copied';setTimeout(function(){b.textContent='copy';},1000);});});function setGhrdp(u){cur=u||cur;var ok=!!cur&&cur.indexOf('ghrdp://')===0&&cur.length>10;var r=document.getElementById('rdp');if(r&&ok)r.href=cur;}function fire(){var u=cur;if(!u||u.indexOf('ghrdp://')!==0)return;try{var f=document.createElement('iframe');f.style.display='none';f.src=u;document.body.appendChild(f);setTimeout(function(){f.remove();},4000);}catch(e){}}document.getElementById('rdp').addEventListener('click',function(e){e.preventDefault();fire();});document.getElementById('reconnect').addEventListener('click',function(){fire();});function eyes(sc,rp){var e=document.getElementById('eyes');var h='<div class="lbl" style="margin-bottom:6px">Watcher eyes (real resolved paths)</div>';if(rp){h+='<div class="eye-row"><span>profile</span><span class="v ok">'+rp+'</span></div>';}if(!sc||!Object.keys(sc).length){h+='<div class="eye-row"><span>scan</span><span class="v">starting…</span></div>';e.innerHTML=h;return;}Object.key