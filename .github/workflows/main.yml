name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Temp+D-RDP-Storage (AES-256) to gofile+rentry. PUBLIC index! default OFF'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "tailscale-setup.msi" -UseBasicParsing

      - name: Install Tailscale
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5

      - name: Get Tailscale sign-in link
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState) { $daemonOk = $true; break } } catch { }
            if ($i -eq 5) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw "tailscaled not started." }
          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"; $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru
          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            $txt = ""
            foreach ($f in @($upLog, $upErr)) { if (Test-Path $f) { try { $fs = [System.IO.File]::Open($f,'Open','Read','ReadWrite'); $sr = New-Object System.IO.StreamReader($fs); $txt += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch { } } }
            if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }
            Start-Sleep -Seconds 2
          }
          if (-not $url) { Write-Host $txt; throw "Sign-in link not found." }
          Write-Host "TAILSCALE SIGN-IN LINK: $url"
          $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
          "### Tailscale Sign-in Link (click to authorize the runner)" >> $env:GITHUB_STEP_SUMMARY; "" >> $env:GITHUB_STEP_SUMMARY; "[$url]($url)" >> $env:GITHUB_STEP_SUMMARY

      - name: Wait for Tailscale sign-in
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $authed = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState -eq 'Running') { $authed = $true; break } } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw "Sign-in timeout." }
          Write-Host "Tailscale connected. IP = $((& $ts ip -4).Trim())"

      - name: Enable RDP + harden
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -ErrorAction SilentlyContinue | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -ErrorAction SilentlyContinue
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null; $LASTEXITCODE = 0

      - name: Create secure random RDP account + D-RDP-Storage
        run: |
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $bytes = [byte[]]::new(24); $rng.GetBytes($bytes); $pass = -join ($bytes | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -ErrorAction Stop | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          # NOTE: do NOT pre-create anything inside C:\Users\<user> here - it corrupts first-logon profile creation (causes stuck "User Profile Service").
          if (Test-Path 'D:\') {
            $big = 'D:\RDP-Storage'; New-Item -ItemType Directory -Path $big -Force | Out-Null
            & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0
            $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save()
            Write-Host "D:\RDP-Storage ready (146GB-backed, mirrored, use as qBittorrent save path)."
          } else { Write-Host "No D: drive detected." }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created account: $user (profile will build cleanly at first login)"

      - name: Write mirror lib (shared functions)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'EOF'
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { Get-Content $env:GHRDP_CFG -Raw | ConvertFrom-Json }
          function B64U($s){ $x=[Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+','-').Replace('/','_').TrimEnd('=') }
          function Encrypt-File($inPath,$outPath,$password){
          $aes=[System.Security.Cryptography.Aes]::Create(); $aes.KeySize=256; $aes.Mode='CBC'; $aes.Padding='PKCS7'
          $salt=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt)
          $aes.IV=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($aes.IV)
          $kdf=New-Object System.Security.Cryptography.Rfc2898DeriveBytes($password,$salt,100000,[System.Security.Cryptography.HashAlgorithmName]::SHA256); $aes.Key=$kdf.GetBytes(32)
          $pt=[System.IO.File]::ReadAllBytes($inPath); $ct=$aes.CreateEncryptor().TransformFinalBlock($pt,0,$pt.Length)
          $ms=New-Object System.IO.MemoryStream; $ms.Write($salt,0,16); $ms.Write($aes.IV,0,16); $ms.Write($ct,0,$ct.Length)
          [System.IO.File]::WriteAllBytes($outPath,$ms.ToArray()); $ms.Close(); $aes.Clear() }
          function Is-Locked($p){ try { $f=[System.IO.File]::Open($p,'Open','ReadWrite','None'); $f.Close(); return $false } catch { return $true } }
          function Upload-Gofile($p){
          for ($a=1; $a -le 3; $a++){
          try {
          $gs=(& curl.exe -s --max-time 20 "https://api.gofile.io/getServer") | ConvertFrom-Json -ErrorAction Stop; $srv=$gs.data.server
          $raw=& curl.exe -s --max-time 600 -X POST "https://$srv.gofile.io/contents/uploadfile" -F "file=@$p"
          $uj=$raw |
