name: Windows RDP

on:
  workflow_dispatch:

# NOTE: NO secrets / tokens / auth-keys. Tailscale sign-in = 100% redirect link.
#       RDP connect = browser click only (ghrdp:// protocol handler + redirect page).

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360   # hosted runner උපරිමය පැය 6

    steps:
      # ------------------------------------------------------------
      - name: Download Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                            -OutFile "tailscale-setup.msi" -UseBasicParsing

      # ------------------------------------------------------------
      - name: Install Tailscale
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5

      # ------------------------------------------------------------
      - name: Get Tailscale sign-in link
        id: login
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"

          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              if ($j -and $j.BackendState) { $daemonOk = $true; break }
            } catch { }
            if ($i -eq 5) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw "tailscaled daemon එක start වුණේ නෑ." }

          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"
          $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList "up" `
                                -RedirectStandardOutput $upLog `
                                -RedirectStandardError  $upErr `
                                -WindowStyle Hidden -PassThru

          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            $txt = ""
            foreach ($f in @($upLog, $upErr)) {
              if (Test-Path $f) {
                try {
                  $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
                  $sr = New-Object System.IO.StreamReader($fs)
                  $txt += $sr.ReadToEnd()
                  $sr.Close(); $fs.Close()
                } catch { }
              }
            }
            if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }
            Start-Sleep -Seconds 2
          }
          if (-not $url) { Write-Host $txt; throw "Sign-in link එක හොයාගන්න බැරි වුණා." }

          Write-Host ""; Write-Host "=================================================="
          Write-Host "  TAILSCALE SIGN-IN LINK: $url"
          Write-Host "=================================================="
          $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8

          "### 🔗 Tailscale Sign-in Link" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**මේ link එක click කරලා sign-in වෙන්න 👇**" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "[$url]($url)" >> $env:GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------
      - name: Wait for Tailscale sign-in
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $u = Join-Path $env:RUNNER_TEMP "ts-login-url.txt"
          if (Test-Path $u) { Write-Host "Sign-in link: $((Get-Content $u -Raw).Trim())" }
          Write-Host "ඔයා sign-in වෙනකන් wait කරනවා (උපරිම මිනිත්තු 10)..."

          $authed = $false
          for ($i = 0; $i -lt 120; $i++) {
            try {
              $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              if ($j -and $j.BackendState -eq 'Running') { $authed = $true; break }
            } catch { }
            if ($i % 3 -eq 0) { Write-Host ("...wait ({0}s)" -f ($i * 5)) }
            Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw "Sign-in complete වුණේ නෑ (timeout)." }
          $ip = (& $ts ip -4).Trim()
          Write-Host "✅ Tailscale connected! IP = $ip"

      # ------------------------------------------------------------
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      # ------------------------------------------------------------
      - name: Set RDP Password
        run: |
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "P@ssw0rd123!" -Force)

      # ------------------------------------------------------------
      #  redirect page එකේ PowerShell script එක ලියනවා (bash heredoc = verbatim, no escaping issues)
      - name: Write RDP redirect server script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'EOF'
param(
[string]$Ip,
[int]$Port = 7331,
[string]$Ghrdp
)
$ErrorActionPreference = "SilentlyContinue"
$listener = New-Object System.Net.HttpListener
$listener.Prefixes.Add("http://${Ip}:${Port}/")
$ok = $false
try { $listener.Start(); $ok = $true } catch { Write-Host "listener failed: $_" }
if (-not $ok) { exit 0 }
$html = '<!doctype html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0; url=' + $Ghrdp + '"><title>RDP Connect</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16202b 0%,#0c1014 60%,#08090c 100%);color:#e8edf2;padding:24px}.card{width:min(440px,92vw);background:#11171d;border:1px solid #243039;border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .5s ease both}.dot{width:10px;height:10px;border-radius:50%;background:#37c6b0;margin:0 auto 16px;animation:pulse 1.8s infinite}h1{font-size:30px;font-weight:800;letter-spacing:-.5px}p{margin-top:10px;color:#9fb0bc;font-size:15px;line-height:1.5}.btn{display:inline-block;margin-top:22px;padding:14px 26px;border-radius:12px;background:#37c6b0;color:#04201c;font-weight:800;font-size:16px;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,background .15s ease;box-shadow:0 10px 24px rgba(55,198,176,.25)}.btn:hover{transform:translateY(-2px);background:#46d8c0;box-shadow:0 16px 34px rgba(55,198,176,.4)}.btn:active{transform:translateY(0)}code{display:block;margin-top:18px;word-break:break-all;background:#0b0f13;border:1px solid #20292f;border-radius:10px;padding:10px;color:#7f93a0;font-size:12px}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,198,176,.5)}70%{box-shadow:0 0 0 12px rgba(55,198,176,0)}100%{box-shadow:0 0 0 0 rgba(55,198,176,0)}}</style></head><body><div class="card"><div class="dot"></div><h1>Remote Desktop</h1><p>ඔයාගේ RDP session එක open වෙනවා. පහත button එක click කරන්න.</p><a class="btn" id="go" href="' + $Ghrdp + '">Open Remote Desktop</a><p>Browser popup එකේ <b>Open</b> click කරන්න.</p><code>' + $Ghrdp + '</code></div><script>setTimeout(function(){var a=document.getElementById("go");if(a)a.click();},400);</script></body></html>'
while ($listener.IsListening) {
$ctx = $listener.GetContext()
$buf = [System.Text.Encoding]::UTF8.GetBytes($html)
$ctx.Response.ContentType = "text/html; charset=utf-8"
$ctx.Response.ContentLength64 = $buf.Length
$ctx.Response.OutputStream.Write($buf, 0, $buf.Length)
$ctx.Response.Close()
}
EOF

      # ------------------------------------------------------------
      #  Connection info + clickable redirect link (NO download, NO typing)
      - name: Get Connection Info + Start RDP Redirect Page
        run: |
          $ts    = "C:\Program Files\Tailscale\tailscale.exe"
          $ip    = (& $ts ip -4).Trim()
          $user  = "runneradmin"
          $pass  = "P@ssw0rd123!"
          $eu    = [uri]::EscapeDataString($user)
          $ep    = [uri]::EscapeDataString($pass)
          $ghrdp = "ghrdp://$ip/$eu/$ep"
          $port  = 7331
          $serverPs1   = Join-Path $env:RUNNER_TEMP "rdp-redirect-server.ps1"
          $redirectUrl = "http://${ip}:${port}/"

          Write-Host "================================"
          Write-Host "RDP IP: $ip | User: $user | Pass: $pass"
          Write-Host "One-click page : $redirectUrl"
          Write-Host "Protocol link  : $ghrdp"
          Write-Host "================================"

          # redirect page එකට firewall allow
          New-NetFirewallRule -DisplayName "RDP Redirect Page" -Direction Inbound -LocalPort $port -Protocol TCP -Action Allow -ErrorAction SilentlyContinue | Out-Null

          # background web server start (detached process)
          $serverOk = $false
          if (Test-Path $serverPs1) {
            Start-Process powershell.exe -ArgumentList @('-ExecutionPolicy','Bypass','-WindowStyle','Hidden','-File',$serverPs1,'-Ip',$ip,'-Port',"$port",'-Ghrdp',$ghrdp) -WindowStyle Hidden | Out-Null
            Start-Sleep -Seconds 2
            try { Invoke-WebRequest -Uri $redirectUrl -UseBasicParsing -TimeoutSec 4 | Out-Null; $serverOk = $true } catch { $serverOk = $false }
          }
          Write-Host "Redirect server running: $serverOk"

          # ---- Summary ----
          "### 🖥️ RDP Connection Details" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| **Tailscale IP** | ``$ip`` |" >> $env:GITHUB_STEP_SUMMARY
          "| **Username** | ``$user`` |" >> $env:GITHUB_STEP_SUMMARY
          "| **Password** | ``$pass`` |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### 🚀 One-Click RDP Connect (download නෑ · type කරන්න නෑ)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          if ($serverOk) {
            "1️⃣ මේ link එක **click** කරන්න → browser tab එකක් open වෙනවා:" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "👉 **[$redirectUrl]($redirectUrl)**" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "2️⃣ එතන **Open Remote Desktop** button එක click කරන්න (සමහර වෙලාවට auto-open වෙනවා)." >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "3️⃣ Browser popup එකේ **Open** click කරන්න → RDP කෙලින්ම connect ✅" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "⚠️ Redirect page start වුණේ නෑ — පහත fallback එක use කරන්න." >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          "**Fallback (http page load නොවුණොත්):** browser address bar එකට මේක paste කරන්න: ``$ghrdp``" >> $env:GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------
      - name: Configure Dark Mode + Install Edge Extensions
        run: |
          $themeKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $themeKey)) { New-Item -Path $themeKey -Force | Out-Null }
          New-ItemProperty -Path $themeKey -Name 'AppsUseLightTheme'     -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $themeKey -Name 'SystemUsesLightTheme'  -Value 0 -PropertyType DWord -Force | Out-Null
          Write-Host "🌙 Dark mode enabled (apps + system)."

          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          if (-not (Test-Path $edgePol)) { New-Item -Path $edgePol -Force | Out-Null }
          $edgeCrx = 'https://edge.microsoft.com/extensionwebstorebase/v1/crx'
          New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$edgeCrx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$edgeCrx" -PropertyType String -Force | Out-Null
          Write-Host "🧩 Edge force-install policy set (uBlock Origin + Dark Reader)."

          try {
            $edge = (Get-Command msedge -ErrorAction SilentlyContinue).Source
            if (-not $edge) { $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
            $p = Start-Process -FilePath $edge -ArgumentList '--no-first-run','--no-default-browser-check','about:blank' -PassThru -ErrorAction Stop
            Write-Host "Edge launched (PID $($p.Id)), extensions download වෙනකන් wait..."
            Start-Sleep -Seconds 30
            Get-Process -Name msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "✅ Extensions pre-install attempt complete."
          } catch {
            Write-Host "⚠️ Pre-launch skip වුණා (policy එක නිසා Edge open කරන පළමු වතාවේ auto-install වෙනවා)."
          }

          "### 🌙 Dark Mode + 🧩 Edge Extensions Ready" >> $env:GITHUB_STEP_SUMMARY
          "Windows **dark mode** on. Edge එකට **uBlock Origin** + **Dark Reader** force‑install වෙලා." >> $env:GITHUB_STEP_SUMMARY

      # ------------------------------------------------------------
      - name: Keep Alive (5h 30m)
        run: |
          $limit = New-TimeSpan -Hours 5 -Minutes 30
          $start = Get-Date
          Write-Host "✅ RDP ready. Session එක පැය 5:30 ක් alive..."
          while (((Get-Date) - $start) -lt $limit) { Start-Sleep -Seconds 60 }
          Write-Host "⏰ 5h 30m ඉවරයි. Secure cleanup එකට යනවා..."

      # ------------------------------------------------------------
      - name: Secure Cleanup (wipe all data)
        run: |
          Write-Host "🧹 Secure cleanup starting..."

          foreach ($p in @('chrome','msedge','firefox','iexplore','brave','opera')) {
            Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3

          $browserPaths = @(
            "$env:LOCALAPPDATA\Google\Chrome\User Data",
            "$env:LOCALAPPDATA\Microsoft\Edge\User Data",
            "$env:APPDATA\Mozilla\Firefox\Profiles",
            "$env:LOCALAPPDATA\Mozilla\Firefox\Profiles",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data",
            "$env:APPDATA\Opera Software\Opera Stable"
          )
          foreach ($p in $browserPaths) {
            if (Test-Path $p) {
              try { Remove-Item -Path $p -Recurse -Force -ErrorAction Stop; Write-Host "  ✅ Deleted: $p" }
              catch { Start-Sleep -Seconds 2; Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }

          foreach ($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")) {
            if (Test-Path $p) { Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "  ✅ Cleared: $p" }
          }

          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
          Set-Clipboard -Value "" -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }

          Write-Host "🔐 Overwriting free space (cipher /w)..."
          cipher /w:C:\

          "### 🔒 Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
          "Browser history, **saved passwords**, cookies, cache, downloads, temp, recent, recycle bin **permanently wipe** කළා. ඊට පස්සේ VM එක destroy වෙනවා." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "✅ Cleanup complete. VM destroy වෙනවා."
