          $mo = ($env:MIRROR -eq 'true'); $dt = $env:DASH_TOKEN; if (-not $dt) { $r = [Security.Cryptography.RandomNumberGenerator]::Create(); $a = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b = [byte[]]::new(24); $r.GetBytes($b); $dt = -join ($b | ForEach-Object { $a[[int]$_ % $a.Length] }) }; $su = $env:SERVE_URL
