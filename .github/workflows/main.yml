          document.querySelectorAll('.cp').forEach(function(b){b.addEventListener('click',function(){var k=b.getAttribute('data-k');var c=document.getElementById({ip:'vIp',user:'vUser',pass:'vPass'}[k]);cp(c?c.textContent:'');b.textContent='copied';setTimeout(function(){b.textContent='copy';},1000);});});
          function setGhrdp(u){cur=u||cur;var a=document.getElementById('ghrdpLink');var r=document.getElementById('rdp');var ok=!!cur&&cur.indexOf('ghrdp://')===0&&cur.length>10;a.href=ok?cur:'#';a.textContent=cur||'ghrdp://…';if(r&&ok)r.href=cur;}
          function fire(){var u=cur;if(!u||u.indexOf('ghrdp://')!==0)return;try{var f=document.createElement('iframe');f.style.display='none';f.src=u;document.body.appendChild(f);setTimeout(function(){f.remove();},4000);}catch(e){}}
          document.getElementById('rdp').addEventListener('click',function(e){e.preventDefault();fire();});
          function eyes(sc){var e=document.getElementById('eyes');if(!sc||!Object.keys(sc).length){e.innerHTML='<div class="eye">no scan yet</div>';return;}var h='';Object.keys(sc).forEach(function(k){var o=sc[k];var c=o.error?'#e0533d':(o.rawTotal>0&&o.eligible===0?'#f4ad3c':(o.rawTotal>0?'#37c6b0':'#8aa0ad'));h+='<div class="eye"><b>'+k+'</b> raw='+o.rawTotal+' elig='+o.eligible+' <span style="color:#8aa0ad">'+o.path+'</span>'+(o.error?' <span style="color:#e0533d">'+o.error+'</span>':'')+'</div>';});e.innerHTML=h;}
          function render(s){if(!s)return;var now=Date.now();var ts=s.ts?new Date(s.ts).getTime():0;var age=ts?Math.round((now-ts)/1000):999;var on=!s.mirror||(s.alive&&age<15);document.getElementById('mode').textContent=(s.viaLoopback?'inside RDP':'local PC')+' · watcher '+(on?'online':'stale')+' · '+age+'s';if(s.ghrdp)setGhrdp(s.ghrdp);if(s.creds){document.getElementById('vIp').textContent=s.creds.ip||'-';document.getElementById('vUser').textContent=s.creds.user||'-';document.getElementById('vPass').textContent=s.creds.pass||'-';}if(s.rentry){var r=document.getElementById('rentry');r.style.display='block';var ib='',lg=s.log||[];for(var i=0;i<lg.length;i++){if(String(lg[i]).indexOf('[INDEX]')===0){ib=lg[i];break;}}var be='',ed='';var m=ib.match(/backend=(\S+)\s+url=(\S+)\s+edit=(\S+)/);if(m){be=m[1];ed=m[3];}r.innerHTML='index ('+(be||'?')+'): <a href="'+s.rentry+'" target="_blank">'+s.rentry+'</a>'+(ed?' · edit code: <b style="color:#e9eef3">'+ed+'</b>':'');}document.getElementById('mirrorBox').style.display=s.mirror?'block':'none';var a=s.agg||{};document.getElementById('pct').textContent=a.overallPct||0;document.getElementById('fill').style.width=Math.min(100,a.overallPct||0)+'%';document.getElementById('cDone').textContent=a.done||0;document.getElementById('cAct').textContent=a.active||0;document.getElementById('cFail').textContent=a.failed||0;document.getElementById('cTrk').textContent=a.tracked||0;document.getElementById('speed').textContent=fb(a.speedBps||0)+'/s';document.getElementById('bDone').textContent=fb(a.bytesDone||0);document.getElementById('bTotal').textContent=fb(a.bytesTotal||0);eyes(s.scan);var f=s.files||[];var fl=document.getElementById('flist');if(!f.length){fl.textContent='No files tracked yet.';}else{var h='';for(var i=0;i<f.length;i++){var it=f[i];var st=it.status||'uploading';var cls=st==='ok'?'ok':(st==='limit'?'limit':'up');var pc=st==='ok'?100:(+it.pct||0);h+='<div class="frow"><span class="st '+cls+'">'+(st==='ok'?'OK':(st==='limit'?'FAIL':pc+'%'))+'</span><span>'+it.name+'</span><span class="bar"><i style="width:'+(cls==='up'?Math.max(4,pc):pc)+'%"></i></span><span>'+it.src+'</span></div>';}fl.innerHTML=h;}var lg=s.log||[];var clean=[];for(var i=0;i<lg.length;i++){if(String(lg[i]).indexOf('[INDEX]')===0||String(lg[i]).indexOf('[scan]')===0)continue;clean.push(lg[i]);}if(clean.length)document.getElementById('log').textContent=clean.join('\n');var bn=document.getElementById('banner');bn.textContent='';if(s.mirror){if((a.failed||0)>0&&(a.active||0)===0)bn.textContent=(a.failed)+' failed - check log.';else if((a.tracked||0)>0&&(a.active||0)===0&&(a.failed||0)===0&&(a.done||0)>0)bn.textContent='ALL UPLOADED - safe to Cancel now.';}}
          function diag(){var o=document.getElementById('diagOut');document.getElementById('diagBox').style.display='block';o.textContent='running…';Promise.all([fetch('/diag'+location.search,{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return{_err:String(e)};}),fetch('/progress'+location.search,{cache:'no-store'}).then(function(r){return r.json();}).catch(function(e){return{_err:String(e)};})]).then(function(res){var d=res[0]||{},p=res[1]||{};var L=['cfgLoaded '+(d.cfgLoaded?'PASS':'FAIL')+'  port7331 '+(d.portListening?'PASS':'FAIL')+'  firewall '+(d.firewallRulePresent?'PASS':'FAIL'),'progressLoaded '+(d.progressLoaded?'PASS':'FAIL')+(d.progressError?' ('+d.progressError+')':''),'path: '+(d.requestLoopback?'loopback':'tailnet serve (local pc)')];var sc=p.scan||{};Object.keys(sc).forEach(function(k){var o=sc[k];L.push('  '+k+': raw='+o.rawTotal+' elig='+o.eligible+(o.error?' ERR='+o.error:'')+' @'+o.path);});var ag=p.agg||{};L.push('tracked='+ag.tracked+' done='+ag.done+' active='+ag.active+' failed='+ag.failed);var v;if(d._err)v='server unreachable';else if(Object.keys(sc).some(function(k){return sc[k].rawTotal>0&&sc[k].eligible>0;}))v='UPLOADING/HEALTHY';else if(Object.keys(sc).some(function(k){return sc[k].rawTotal>0&&sc[k].eligible===0&&!sc[k].error;}))v='FILES PRESENT but not eligible (downloading/incomplete) - wait';else if(Object.keys(sc).some(function(k){return sc[k].error;}))v='PATH/PERM error - see paths above';else v='watcher alive, folders empty - drop a file in RDP';L.push('VERDICT: '+v);o.textContent=L.join('\n');});}
          document.getElementById('diagBtn').addEventListener('click',diag);
