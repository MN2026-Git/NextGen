          function Line($c, $m) { Write-Host ("[{0}] {1}" -f (Get-Date -f 'HH:mm:ss'), $m) -ForegroundColor $c }
          if (-not (Test-Path $CfgPath)) { Line Red "cfg missing"; Start-Sleep 30; exit 0 }
          $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json; Line Cyan "Mission Control (OBSERVE mode)."; Line White ("IP={0} USER={1} MIRROR={2}" -f $cfg.rdpIp, $cfg.rdpUser, $cfg.mirror)
          try { Start-Process ("http://127.0.0.1:{0}/" -f $Port) | Out-Null } catch {}
          $wr = Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -EA 0 | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }
          if (-not $wr -and (Test-Path $ws)) { try { Start-Process -FilePath $ps -ArgumentList "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$ws`" -CfgPath `"$CfgPath`"" -WindowStyle Hidden | Out-Null; Line Green "[watcher] fallback started" } catch { Line Red $_.Exception.Message } }
          while ($true) { $l = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0); $d = 0; $ac = 0; $f = 0; $t = 0; $pc = 0; if (Test-Path $pp) { try { $p = Get-Content $pp -Raw | ConvertFrom-Json -EA 0; if ($p -and $p.agg) { $d = $p.agg.done; $ac = $p.agg.active; $f = $p.agg.failed; $t = $p.agg.tracked; $pc = $p.agg.overallPct } } catch {} }; Line $(if ($l) { 'Green' } else { 'Red' }) ("listen={0} done={1} active={2} fail={3} tracked={4} {5}%" -f $l, $d, $ac, $f, $t, $pc); Start-Sleep 2 }
