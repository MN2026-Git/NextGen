          Write-Host "Config written mirror=$mirrorOn";& (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath
      - name: Write debug script (NEW gofile probe + real profile + watcher markers)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/Debug-GHRDP.ps1" <<'DEBUGEOF'
          param([switch]$NoPause,[switch]$ShowSecrets)
          $ErrorActionPreference='Continue';$R=New-Object Collections.ArrayList;$me=$PID
          function Say($t=''){Write-Host $t;[void]$R.Add([string]$t)};function KV($k,$v){Say (('{0,-34}: {1}' -f $k,[string]$v))};function HD($t){Say '';Say ('==== '+$t+' ====')}
          function Mask($s){if([string]::IsNullOrEmpty($s)){return ''};if($ShowSecrets){return $s};if($s.Length -le 6){return '****'};return $s.Substring(0,2)+'****'+$s.Substring($s.Length-2)}
          function SJ($p){if(-not (Test-Path $p)){return $null};try{$fs=[IO.File]::Open($p,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite);$ms=New-Object IO.MemoryStream;$fs.CopyTo($ms);$fs.Close();$b=$ms.ToArray();$ms.Close();if($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF){$b=$b[3..($b.Length-1)]};return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF))|ConvertFrom-Json -EA Stop)}catch{return $null}}
          function Own($proc){try{$o=Invoke-CimMethod -InputObject $proc -MethodName GetOwner -EA Stop;if($o.User){return $o.Domain+'\'+$o.User}}catch{};return '?'}
          $desktop=[Environment]::GetFolderPath('Desktop');if(-not $desktop -or -not (Test-Path $desktop)){$desktop=$env:USERPROFILE}
          $rp=Join-Path $desktop ('Debug-GHRDP_'+(Get-Date -Format 'yyyy-MM-dd_HH-mm-ss')+'.txt')
          HD 'GHRDP DEBUG';KV 'user' (whoami);KV 'USERPROFILE' $env:USERPROFILE
          HD 'REAL PROFILE (ProfileList)';$sid=([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value;$reg="HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid";$pi=(Get-ItemProperty $reg -Name ProfileImagePath -EA 0).ProfileImagePath;if($pi){$pi=[Environment]::ExpandEnvironmentVariables($pi)};KV 'ProfileImagePath' $pi;foreach($sub in 'Downloads','Desktop','Documents'){$rp2=if($pi){Join-Path $pi $sub}else{Join-Path $env:USERPROFILE $sub};KV ($sub+' exists') (Test-Path $rp2)}
          HD 'CONFIG';$cfgPath=$null;if(Test-Path 'C:\ProgramData\ghrdp\cfgpath.txt'){$cfgPath=(Get-Content 'C:\ProgramData\ghrdp\cfgpath.txt' -Raw -EA 0).Trim()};if(-not $cfgPath -or -not (Test-Path $cfgPath)){foreach($d in @($env:RUNNER_TEMP,'D:\a\_temp')){if($d -and (Test-Path (Join-Path $d 'ghrdp_cfg.json'))){$cfgPath=Join-Path $d 'ghrdp_cfg.json';break}}};KV 'cfg' $cfgPath;$cfg=if($cfgPath){SJ $cfgPath}else{$null};KV 'loaded' ([bool]$cfg)
          if($cfg){HD 'VALUES';KV 'rdpIp' $cfg.rdpIp;KV 'mirror' $cfg.mirror;KV 'rentryUrl' $cfg.rentryUrl;KV 'indexBackend' $cfg.indexBackend;KV 'rentryEditCode' $cfg.rentryEditCode;KV 'decPw' (Mask $cfg.decPw)}
          HD 'RDP/PORTS';$fDeny=(Get-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections -EA 0).fDenyTSConnections;KV 'fDeny' $fDeny;foreach($c in @(Get-NetTCPConnection -State Listen -EA 0|Where-Object{@(3389,7331) -contains $_.LocalPort})){$pn='';try{$pn=(Get-Process -Id $c.OwningProcess -EA Stop).ProcessName}catch{};KV ('listen '+$c.LocalPort) ($c.LocalAddress+' pid='+$c.OwningProcess+' '+$pn)}
          HD 'WATCHED FOLDERS (cfg.roots - watcher may have rewritten these)';if($cfg -and $cfg.roots){foreach($r in $cfg.roots){KV ($r.tag+' exists') ((Test-Path $r.path).ToString()+'  '+$r.path)}}else{Say '  none'}
          HD 'GOFILE 2025 PROBE (upload.gofile.io)';try{$pb=Join-Path $env:TEMP ('gp_'+[guid]::NewGuid().ToString('N')+'.bin');[IO.File]::WriteAllBytes($pb,[byte[]]::new(2048));$raw=& curl.exe -sS --max-time 45 -X POST 'https://upload.gofile.io/uploadfile' -F ('file=@'+$pb) 2>$null;$LASTEXITCODE=0;Remove-Item $pb -Force -EA 0;$uj=$raw|ConvertFrom-Json -EA 0;$d=$uj.data;if(-not $d){$d=$uj};if($uj.status -eq 'ok' -or $d.downloadPage -or $d.code -or $d.folderId){KV 'upload endpoint' ('OK -> '+(if($d.downloadPage){$d.downloadPage}else{'folder '+$d.folderId}))}else{KV 'upload endpoint' ('UNEXPECTED: '+$raw)}}catch{KV 'gofile FAIL' $_.Exception.Message}
          HD 'PROCESSES';$psProcs=@(Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -EA 0|Where-Object{$_.ProcessId -ne $me -and $_.CommandLine -match 'ghrdp-watcher|rdp-redirect-server|ghrdp-server-run|ghrdp-launcher'});if(-not $psProcs.Count){Say 'none'};foreach($p in $psProcs){KV ('pid '+$p.ProcessId) (Own $p)}
          $watcherProc=@($psProcs|Where-Object{$_.CommandLine -like '*ghrdp-watcher*'})|Select-Object -First 1
          HD 'WATCHER MARKERS';$swf=Join-Path (Split-Path $cfgPath -Parent) 'ghrdp_watcher_started.txt';$fwf=Join-Path (Split-Path $cfgPath -Parent) 'ghrdp_watcher_FATAL.txt';if(Test-Path $swf){KV 'started' (Get-Content $swf -Raw)}else{KV 'started' 'NOT FOUND'};if(Test-Path $fwf){KV 'FATAL' (Get-Content $fwf -Raw)}else{KV 'FATAL' 'none'}
          HD 'ENDPOINTS';try{$d=Invoke-RestMethod 'http://127.0.0.1:7331/diag' -TimeoutSec 5 -EA Stop;KV 'port' $d.portListening;KV 'cfgLoaded' $d.cfgLoaded;KV 'progressLoaded' $d.progressLoaded}catch{KV 'diag err' $_.Exception.Message}
          $progApi=$null;try{$progApi=Invoke-RestMethod 'http://127.0.0.1:7331/progress' -TimeoutSec 8 -EA Stop}catch{}
          if($progApi){HD 'PROGRESS API';KV 'mirror' $progApi.mirror;KV 'resolvedProfile' $progApi.resolvedProfile;if($progApi.agg){KV 'tracked/done/active/fail' ("$($progApi.agg.tracked)/$($progApi.agg.done)/$($progApi.agg.active)/$($progApi.agg.failed)")};if($progApi.scan){Say 'Watcher eyes (real paths):';$progApi.scan.PSObject.Properties|ForEach-Object{$o=$_.Value;Say ('  '+$_.Name+' -> '+$o.path+' raw='+$o.rawTotal+' elig='+$o.eligible+$(if($o.error){' ERR='+$o.error}else{''}))}}}
          HD 'VERDICTS';$cu=(whoami).Trim();$wo=if($watcherProc){Own $watcherProc}else{''};Say ('['+$(if($fDeny -eq 0){'PASS'}else{'FAIL'})+'] RDP enabled');Say ('['+$(if($watcherProc){'PASS'}else{'FAIL'})+'] watcher running owner='+$wo);Say ('['+$(if($wo.ToLower() -eq $cu.ToLower()){'PASS'}else{'FAIL'})+'] watcher = RDP user')
          try{[IO.File]::WriteAllText($rp,($R -join "`r`n"),(New-Object Text.UTF8Encoding $false));HD 'SAVED';Say $rp}catch{}
          if(-not $NoPause){Read-Host 'Enter to close'}
          DEBUGEOF
          cat > "$RUNNER_TEMP/DEBUG-GHRDP.bat" <<'BATEOF'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Debug-GHRDP.ps1"
          BATEOF
      - name: Place debug on desktops
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'Debug-GHRDP.ps1';$b=Join-Path $env:RUNNER_TEMP 'DEBUG-GHRDP.bat';$desks=@('C:\Users\Public\Desktop');if($env:RDP_USER){$desks+="C:\Users\$($env:RDP_USER)\Desktop"};foreach($d in ($desks|Select-Object -Unique)){try{if(Test-Path $d){Copy-Item $p (Join-Path $d 'Debug-GHRDP.ps1') -Force;Copy-Item $b (Join-Path $d 'DEBUG-GHRDP.bat') -Force}}catch{}}
      - name: Keep Alive (5h30) - server SYSTEM + watcher ONLOGON task + startup + launcher
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null|Out-Null;& schtasks /Delete /TN ghrdpserver /F 2>$null|Out-Null;& schtasks /End /TN ghrdpwatcher 2>$null|Out-Null;& schtasks /Delete /TN ghrdpwatcher /F 2>$null|Out-Null;$LASTEXITCODE=0
          $sd=$env:RUNNER_TEMP;& (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json')
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json';$serverScript=Join-Path $sd 'rdp-redirect-server.ps1';$watcherScript=Join-Path $sd 'ghrdp-watcher.ps1';$progressPath=Join-Path $sd 'ghrdp_progress.json';$emFlag=Join-Path $sd 'ghrdp_emergency.flag';$flushFlag=Join-Path $sd 'ghrdp_flush.flag';$okFile=Join-Path $sd 'ghrdp_server_ok.txt'
          $cfg=Get-Content $cfgPath -Raw|ConvertFrom-Json;Remove-Item $okFile -Force -EA 0
          $srvRun=Join-Path $sd 'ghrdp-server-run.ps1'
          $srvTpl="`$ErrorActionPreference='Continue'`r`n. '<<SS>>'`r`nStart-GhrdpServer -Port 7331 -BindAddress '0.0.0.0' -UiDir '<<SD>>' -ProgressPath '<<PR>>' -CfgPath '<<CF>>' -EmergencyFlagPath '<<EM>>' -FlushFlagPath '<<FL>>' -OkFile '<<OK>>' -LimitMinutes 330`r`n"
          $srvTpl=$srvTpl.Replace('<<SS>>',$serverScript).Replace('<<SD>>',$sd).Replace('<<PR>>',$progressPath).Replace('<<CF>>',$cfgPath).Replace('<<EM>>',$emFlag).Replace('<<FL>>',$flushFlag).Replace('<<OK>>',$okFile)
          [IO.File]::WriteAllText($srvRun,$srvTpl,(New-Object Text.UTF8Encoding $false))
          foreach($f in @($cfgPath,$serverScript,$watcherScript,$progressPath,$emFlag,$flushFlag,$okFile,(Join-Path $sd 'ghrdp-lib.ps1'),(Join-Path $sd 'ghrdp-ui.html'),(Join-Path $sd 'ghrdp-install.ps1'),$srvRun,(Join-Path $sd 'ghrdp-launcher.ps1'))){if(Test-Path $f){& icacls.exe $f /grant "*S-1-5-18:(R)" 2>$null|Out-Null}}
          & icacls.exe $sd /grant "*S-1-5-18:(OI)(CI)R" 2>$null|Out-Null;$LASTEXITCODE=0
          if($env:RDP_USER){& icacls.exe $sd /grant "$($env:RDP_USER):(OI)(CI)M" 2>$null|Out-Null;$LASTEXITCODE=0}
          $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $srvTr="`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$srvRun`""
          & schtasks /Create /TN ghrdpserver /TR $srvTr /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F 2>$null|Out-Null;$LASTEXITCODE=0
          & schtasks /Run /TN ghrdpserver 2>$null|Out-Null;$LASTEXITCODE=0;Write-Host "[server] SYSTEM task created+run"
          if($env:MIRROR -eq 'true' -and $env:RDP_USER){
            $wTr="`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$cfgPath`""
            & schtasks /Create /TN ghrdpwatcher /TR $wTr /SC ONLOGON /RU $env:RDP_USER /RP $env:RDP_PASS /RL LIMITED /F 2>$null|Out-Null;$LASTEXITCODE=0
            Write-Host "[watcher] ONLOGON task created for $($env:RDP_USER)"
            & schtasks /Run /TN ghrdpwatcher 2>$null|Out-Null;$LASTEXITCODE=0;Write-Host "[watcher] start attempted now"
          }
          $up=$false;for($i=0;$i -lt 40;$i++){if((Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')){$up=$true;break};Start-Sleep -Milliseconds 500}
          $self=$false;try{Invoke-WebRequest 'http://127.0.0.1:7331/' -UseBasicParsing -TimeoutSec 3|Out-Null;$self=$true}catch{}
          Write-Host "[selftest] up=$up loopback=$self"
          $limit=New-TimeSpan -Hours 5 -Minutes 30;$start=Get-Date;while(((Get-Date)-$start) -lt $limit){Start-Sleep 60};Write-Host "5h30 done."
      - name: Emergency upload on cancel
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        shell: pwsh
        run: |
          $sd=$env:RUNNER_TEMP;$cfgPath=Join-Path $sd 'ghrdp_cfg.json';$lib=Join-Path $sd 'ghrdp-lib.ps1'
          if(-not ((Test-Path $cfgPath) -and (Test-Path $lib))){exit 0}
          $emf=Join-Path $sd 'ghrdp_emergency.flag';$progressPath=Join-Path $sd 'ghrdp_progress.json'
          Set-Content $emf (Get-Date -f o) -Encoding ascii;Write-Host "EMERGENCY (status=$env:STATUS)"
          $deadline=(Get-Date).AddMinutes(12);$watcherSeen=$false
          while((Get-Date) -lt $deadline){$prog=$null;if(Test-Path $progressPath){try{$prog=Get-Content $progressPath -Raw|ConvertFrom-Json -EA Stop}catch{}};if($prog -and $prog.ts){$age=[int]((Get-Date)-(Get-Date $prog.ts)).TotalSeconds;if($age -lt 15){$watcherSeen=$true}else{break}};if($prog -and $prog.agg){Write-Host "...done=$($prog.agg.done) active=$($prog.agg.active)"};if($watcherSeen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]$prog.agg.tracked -gt 0){break};Start-Sleep 5}
          $needFallback=-not $watcherSeen;if(-not $needFallback -and (Test-Path $progressPath)){try{$pp=Get-Content $progressPath -Raw|ConvertFrom-Json -EA Stop;if($pp.agg -and [int]$pp.agg.active -gt 0){$needFallback=$true}}catch{}}
          if($needFallback){
            Write-Host "DIRECT fallback";$env:GHRDP_CFG=$cfgPath;. $lib;$cfg=Read-Cfg;$env:GHRDP_LOG=$cfg.logFile;Init-Progress $progressPath
            foreach($p in @('qbittorrent','qbittorrent-nox')){Get-Process -Name $p -EA 0|Stop-Process -Force -EA 0};Start-Sleep 4
            $prof=$env:USERPROFILE;try{$sid=([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value;$pi=(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid" -Name ProfileImagePath -EA 0).ProfileImagePath;if($pi){$prof=[Environment]::ExpandEnvironmentVariables($pi)}}catch{}
            $roots=@();foreach($s in @('Downloads','Desktop','Documents')){$roots+=@{path=(Join-Path $prof $s);rec=$false;min=0;tag=$s};$cand=Get-ChildItem 'C:\Users' -Directory -EA 0|Where-Object{$_.Name -eq $env:USERNAME -or $_.Name.StartsWith("$($env:USERNAME).")}|Select-Object -First 3;foreach($c in $cand){$roots+=@{path=(Join-Path $c.FullName $s);rec=$false;min=0;tag=$s}}};$roots+=@{path=(Join-Path $prof 'AppData\Local\Temp');rec=$true;min=102400;tag='Temp'};foreach($r in $cfg.roots){if(@('Downloads','Desktop','Documents','Temp') -notcontains $r.tag){$roots+=$r}}
            $junk=@('.tmp','.crdownload','.partial','.part','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak','.!qb');$done=@{};if(Test-Path $cfg.doneFile){Get-Content $cfg.doneFile|ForEach-Object{$done[$_]=$true}};$idx=Load-Index $cfg
            foreach($r in $roots){if(-not (Test-Path $r.path)){continue};$items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0|Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -EA 0|Sort-Object Length -Descending};foreach($fi in $items){if($done.ContainsKey($fi.FullName)){continue};if($junk -contains $fi.Extension.ToLower()){continue};if($fi.Length -lt $r.min){continue};$len=$fi.Length;$safe=$fi.Name -replace '\|','_';$disp=($safe -replace '[^\x20-\x7E]','_') -replace '[^A-Za-z0-9._-]','_';$ex=$idx|Where-Object{$_.name -eq $safe -and $_.src -eq $r.tag}|Select-Object -First 1;if(-not $ex){$ex=@{name=$safe;src=$r.tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss');pct=0;phase='uploading';bytesDone=0;bytesTotal=$len;attempts=0;nextTry=0};[void]$idx.Add($ex);$global:GHRDP_TOTAL_BYTES+=$len};$ex.status='uploading';$ex.phase='encrypt';$ex.bytesTotal=$len;$global:GHRDP_CUR=$ex;$enc=Join-Path $cfg.tmpDir ('em_'+[guid]::NewGuid().ToString('N')+'.enc');$gf=$null;$eok=$false;Set-Active $disp 'encrypt' $len;try{Encrypt-File $fi.FullName $enc $cfg.decPw;$eok=$true}catch{};if($eok){$ex.phase='upload';Set-Active $disp 'upload' $len;try{$gf=Upload-Gofile-Streamed $enc $disp}catch{}};Remove-Item $enc -Force -EA 0;$global:GHRDP_CUR=$null;if($gf){$ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe);$ex.gofile=$gf;$ex.status='ok';$ex.pct=100;$done[$fi.FullName]=$true;$fi.FullName|Out-File $cfg.doneFile -Append;$global:GHRDP_DONE_BYTES+=$len;Write-Host "OK $($fi.Name)"}else{$ex.status='limit';Write-Host "LIMIT $($fi.Name)"};Set-Active '' 'idle' 0}}
            Save-Index $cfg $idx;Push-Index $cfg (Build-IndexText $cfg $idx)|Out-Null;Write-Host "fallback complete."
          }
      - name: Secure Cleanup
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          & schtasks /End /TN ghrdpserver 2>$null|Out-Null;& schtasks /Delete /TN ghrdpserver /F 2>$null|Out-Null;& schtasks /End /TN ghrdpwatcher 2>$null|Out-Null;& schtasks /Delete /TN ghrdpwatcher /F 2>$null|Out-Null;$LASTEXITCODE=0
          $ml=Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log';if(Test-Path $ml){Get-Content $ml -Tail 120|ForEach-Object{Write-Host $_}}
          foreach($p in @('chrome','msedge','firefox','iexplore','brave','opera','qbittorrent')){Get-Process -Name $p -EA 0|Stop-Process -Force -EA 0};Start-Sleep 3
          foreach($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data","$env:LOCALAPPDATA\Microsoft\Edge\User Data","$env:APPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data","$env:APPDATA\Opera Software\Opera Stable")){if(Test-Path $p){try{Remove-Item $p -Recurse -Force -EA Stop}catch{Remove-Item $p -Recurse -Force -EA 0}}}
          foreach($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")){if(Test-Path $p){Remove-Item "$p\*" -Recurse -Force -EA 0}}
          if($env:RDP_USER){foreach($base in @("C:\Users\$($env:RDP_USER)","C:\Users\$($env:RDP_USER).$env:COMPUTERNAME")){foreach($s in @('Downloads','Desktop','Documents','AppData\Local\Temp')){$d=Join-Path $base $s;if(Test-Path $d){Remove-Item "$d\*" -Recurse -Force -EA 0}}}}
          if(Test-Path 'D:\RDP-Storage'){Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -EA 0}
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -EA 0;Remove-Item "$env:TEMP\*" -Recurse -Force -EA 0;Clear-RecycleBin -Force -EA 0;wevtutil el 2>$null|ForEach-Object{wevtutil cl "$_" 2>$null};$LASTEXITCODE=0
          & "C:\Program Files\Tailscale\tailscale.exe" serve reset 2>$null|Out-Null;$LASTEXITCODE=0
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          cipher /w:C:\; $LASTEXITCODE=0; "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
