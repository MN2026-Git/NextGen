name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Temp+D-RDP-Storage (AES-256) to gofile+telegraph. PUBLIC index! default OFF'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download Tailscale
      shell: pwsh
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
        $out = "tailscale-setup.msi"
        $ok = $false
        for ($a = 1; $a -le 4; $a++) {
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
          $LASTEXITCODE = 0
          if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) {
            $ok = $true
            Write-Host "Downloaded via curl (attempt $a), size=$((Get-Item $out).Length)"
            break
          }
          Write-Host "curl attempt $a failed, retrying in $((3 * $a))s..."
          Start-Sleep -Seconds (3 * $a)
        }
        if (-not $ok) {
          for ($a = 1; $a -le 3; $a++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
              if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) {
                $ok = $true
                Write-Host "Downloaded via Invoke-WebRequest (attempt $a)"
                break
              }
            } catch {
              Write-Host "Invoke-WebRequest attempt $a failed: $_"
            }
            Start-Sleep -Seconds (3 * $a)
          }
        }
        if (-not $ok) {
          throw "Could not download Tailscale MSI after retries. Re-run the workflow."
        }

    - name: Install Tailscale
      shell: pwsh
      run: |
        Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
        Start-Sleep -Seconds 5

    - name: Get Tailscale sign-in link (auto if TS_AUTHKEY secret set, else guided)
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      shell: pwsh
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        $daemonOk = $false
        for ($i = 0; $i -lt 30; $i++) {
          try {
            $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
            if ($j -and $j.BackendState) {
              $daemonOk = $true
              break
            }
          } catch {}
          if ($i -eq 3) {
            Start-Service Tailscale -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
        }
        if (-not $daemonOk) {
          throw "tailscaled not started."
        }

        $S = $env:GITHUB_STEP_SUMMARY

        if ($env:TS_AUTHKEY) {
          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"
          $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList @("up", "--authkey=$($env:TS_AUTHKEY)", "--accept-dns=true") -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru

          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              if ($j -and $j.BackendState -eq 'Running') {
                $ok = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            throw "TS_AUTHKEY login did not reach Running. Check the key is valid, not expired, and reusable/ephemeral as intended."
          }

          $ip = (& $ts ip -4).Trim()
          Write-Host "TAILSCALE AUTO-LOGGED-IN via TS_AUTHKEY. IP = $ip"
          "### Tailscale: auto-logged-in via TS_AUTHKEY ✅" >> $S
        } else {
          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"
          $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $upLog -RedirectStandardError $upErr -WindowStyle Hidden -PassThru

          $url = $null
          for ($i = 0; $i -lt 90; $i++) {
            $txt = ""
            foreach ($f in @($upLog, $upErr)) {
              if (Test-Path $f) {
                try {
                  $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
                  $sr = New-Object System.IO.StreamReader($fs)
                  $txt += $sr.ReadToEnd()
                  $sr.Close()
                  $fs.Close()
                } catch {}
              }
            }
            if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') {
              $url = $Matches[0]
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $url) {
            Write-Host $txt
            throw "Tailscale sign-in link not found."
          }

          $keysPage = "https://login.tailscale.com/admin/settings/keys"
          $secretPage = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"

          Write-Host "TAILSCALE SIGN-IN LINK (click now): $url"
          Write-Host ""
          Write-Host "=== ONE-TIME SETUP: make every FUTURE run hands-free ==="
          Write-Host "STEP 1  Open Tailscale auth-keys page: $keysPage"
          Write-Host "        Generate auth key -> Reusable -> Expire 90 days -> copy tskey-auth-..."
          Write-Host "STEP 2  Open GitHub secret page: $secretPage"
          Write-Host "        Name = TS_AUTHKEY"
          Write-Host "        Value = paste tskey-auth-..."
          Write-Host "STEP 3  Re-run workflow. Tailscale will then login automatically forever."
          Write-Host "========================================================="

          $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8

          "### Tailscale Sign-in (click now)" >> $S
          "" >> $S
          "**[$url]($url)**" >> $S
          "" >> $S
          "### Make future runs hands-free" >> $S
          "1. Open: **[$keysPage]($keysPage)** and generate a reusable auth key." >> $S
          "2. Open: **[$secretPage]($secretPage)** and add secret \`TS_AUTHKEY\`." >> $S
          "3. Re-run workflow." >> $S
        }

    - name: Wait for Tailscale sign-in
      shell: pwsh
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        $authed = $false
        for ($i = 0; $i -lt 120; $i++) {
          try {
            $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
            if ($j -and $j.BackendState -eq 'Running') {
              $authed = $true
              break
            }
          } catch {}
          Start-Sleep -Seconds 5
        }
        if (-not $authed) {
          throw "Tailscale sign-in timeout."
        }
        Write-Host "Tailscale connected. IP = $((& $ts ip -4).Trim())"

    - name: Auto-enable Funnel on tailnet (Tailscale API, one-time secret)
      env:
        TS_KEY: ${{ secrets.TS_API_KEY }}
      shell: pwsh
      run: |
        $tok = $env:TS_KEY
        $secretPage = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"
        $actionsPage = "https://github.com/$($env:GITHUB_REPOSITORY)/actions"
        $tokenPage = "https://login.tailscale.com/admin/settings/keys"
        $aclPage = "https://login.tailscale.com/admin/acls"

        if (-not $tok) {
          Write-Host ""
          Write-Host "############################################################"
          Write-Host "#  TS_API_KEY secret is not set yet."
          Write-Host "#  One-time setup makes Funnel/Serve enable automatically."
          Write-Host "############################################################"
          Write-Host ""
          Write-Host "STEP 1  Commit this workflow file to the repo."
          Write-Host ""
          Write-Host "STEP 2  Create Tailscale API token:"
          Write-Host "        $tokenPage"
          Write-Host "        Generate access token -> copy tskey-api-..."
          Write-Host ""
          Write-Host "STEP 3  Add GitHub secret:"
          Write-Host "        $secretPage"
          Write-Host "        Name = TS_API_KEY"
          Write-Host "        Value = tskey-api-..."
          Write-Host ""
          Write-Host "STEP 4  Re-run workflow:"
          Write-Host "        $actionsPage"
          Write-Host ""
          Write-Host "MANUAL FALLBACK:"
          Write-Host "        $aclPage"
          Write-Host '        Add: "nodeAttrs":[{"target":["*"],"attr":["funnel"]}]'
          Write-Host "############################################################"
          exit 0
        }

        $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'
        $authH = @{ Authorization = ("Bearer " + $tok); Accept = 'application/json' }
        $txt = $null
        try {
          $r = Invoke-WebRequest -Uri $base -Headers $authH -UseBasicParsing -TimeoutSec 30
          $txt = $r.Content
        } catch {
          Write-Host "[acl] GET failed: $($_.Exception.Message)"
        }

        $acl = $null
        if ($txt) {
          $clean = $txt -replace '/\*[\s\S]*?\*/', ''
          $clean = ($clean -split "`n" | ForEach-Object { $_ -replace '//[^\r\n]*', '' }) -join "`n"
          $clean = $clean -replace ',(\s*[\]}])', '$1'
          try {
            $acl = $clean | ConvertFrom-Json -ErrorAction Stop
          } catch {
            Write-Host "[acl] Could not parse ACL text. Will NOT clobber your rules."
            $acl = $null
          }
        }

        $needPost = $false
        if ($acl) {
          $na = @()
          if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) {
            $na = @($acl.nodeAttrs)
          }

          $has = $false
          foreach ($n in $na) {
            $tg = @($n.target)
            $at = @($n.attr)
            if (($tg -contains '*') -and ($at -contains 'funnel')) {
              $has = $true
            }
          }

          if (-not $has) {
            $na = $na + , @{ target = @('*'); attr = @('funnel') }
            if ($acl.PSObject.Properties['nodeAttrs']) {
              $acl.nodeAttrs = $na
            } else {
              $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force
            }
            $needPost = $true
          } else {
            Write-Host "[acl] funnel attr already present."
          }
        }

        if ($needPost) {
          $body = [System.Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))
          try {
            Invoke-WebRequest -Uri $base -Headers (@{ Authorization = ("Bearer " + $tok); 'Content-Type' = 'application/json' }) -Method Post -Body $body -UseBasicParsing -TimeoutSec 30 | Out-Null
            Write-Host "[acl] SUCCESS - Funnel attr added via API."
          } catch {
            Write-Host "[acl] POST failed: $($_.Exception.Message)"
          }
        }

        if (-not $acl) {
          Write-Host "[acl] Left ACL unchanged. If Funnel still fails, regenerate token with admin rights."
        }

    - name: Setup tailnet web link (Tailscale Serve - clickable, no secret needed)
      shell: pwsh
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"

        $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
        $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
        $b = [byte[]]::new(24)
        $rng.GetBytes($b)
        $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
        Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dashToken)

        $serveOut = Join-Path $env:RUNNER_TEMP 'serve.out'
        $serveErr = Join-Path $env:RUNNER_TEMP 'serve.err'
        Remove-Item $serveOut, $serveErr -Force -ErrorAction SilentlyContinue

        try {
          Start-Process -FilePath $ts -ArgumentList @('serve', '--bg', '7331') -RedirectStandardOutput $serveOut -RedirectStandardError $serveErr -WindowStyle Hidden | Out-Null
          Write-Host '[serve] launched detached'
        } catch {
          Write-Host ('[serve] launch err: ' + $_)
        }

        $serveUrl = ''
        $dns = ''
        $deadline = (Get-Date).AddSeconds(20)
        while ((Get-Date) -lt $deadline) {
          $stj = $null
          try {
            $j = Start-Job -ScriptBlock { param($t) & $t status --json 2>$null } -ArgumentList $ts
            if (Wait-Job $j -Timeout 4) {
              $stj = Receive-Job $j | ConvertFrom-Json -ErrorAction SilentlyContinue
            }
            Remove-Job $j -Force -ErrorAction SilentlyContinue
          } catch {
            try { Remove-Job $j -Force -ErrorAction SilentlyContinue } catch {}
          }
          if ($stj -and $stj.Self.DNSName) {
            $dns = $stj.Self.DNSName.TrimEnd('.')
            break
          }
          Start-Sleep -Seconds 2
        }

        if ($dns) {
          $serveUrl = ('https://' + $dns + '/?key=' + $dashToken)
        }
        Add-Content $env:GITHUB_ENV ('SERVE_URL=' + $serveUrl)

        Start-Sleep -Seconds 2
        $slog = ''
        if (Test-Path $serveOut) { $slog = (Get-Content $serveOut -Raw -ErrorAction SilentlyContinue) }
        $serr = ''
        if (Test-Path $serveErr) { $serr = (Get-Content $serveErr -Raw -ErrorAction SilentlyContinue) }
        $alltext = (($slog + "`n" + $serr) -replace "`r`n", ' ')

        $enableLink = $null
        if ($alltext -match 'https://login\.tailscale\.com/f/serve\?[^\s]+') {
          $enableLink = $Matches[0]
        }

        $serveDisabled = ($alltext -match 'Serve is not enabled')
        if ($serveDisabled) {
          Write-Host '============================================================'
          Write-Host '  Serve is OFF on your tailnet.'
          Write-Host '  Enable it once using this link if present:'
          if ($enableLink) {
            Write-Host ('  ' + $enableLink)
          } else {
            Write-Host '  Tailscale admin -> your machine -> enable HTTPS/Serve.'
          }
          Write-Host '  Until then, use the ghrdp paste link from Show RDP credentials.'
          Write-Host '============================================================'
          $serveUrl = ''
        } else {
          if ($slog) {
            Write-Host ('[serve out] ' + $alltext.Trim())
          }
        }

        Write-Host '============================================================'
        if ($serveUrl) {
          Write-Host '  TAILNET WEB LINK:'
          Write-Host ('  SERVE_WEBAPP_LINK: ' + $serveUrl)
        } else {
          Write-Host '  Serve link not ready. Use ghrdp paste link later.'
        }
        Write-Host '============================================================'

        '### Tailnet web-app link' >> $env:GITHUB_STEP_SUMMARY
        if ($serveUrl) {
          ('**[>>> OPEN RDP WEB-APP <<<](' + $serveUrl + ')**') >> $env:GITHUB_STEP_SUMMARY
        } else {
          '_Serve link not ready - use ghrdp paste link._' >> $env:GITHUB_STEP_SUMMARY
        }

    - name: Enable RDP + harden + open dashboard port (all profiles)
      shell: pwsh
      run: |
        $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
        Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
        Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
        Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3

        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -ErrorAction SilentlyContinue |
          Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -ErrorAction SilentlyContinue

        Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -ErrorAction SilentlyContinue | Out-Null
        & netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null
        $LASTEXITCODE = 0

        & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null
        $LASTEXITCODE = 0

    - name: Create secure random RDP account + D-RDP-Storage
      shell: pwsh
      run: |
        $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
        $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'

        $bytes = [byte[]]::new(24)
        $rng.GetBytes($bytes)
        $pass = -join ($bytes | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })

        $hb = [byte[]]::new(4)
        $rng.GetBytes($hb)
        $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))

        New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -ErrorAction Stop | Out-Null
        Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

        if (Test-Path 'D:\') {
          $big = 'D:\RDP-Storage'
          New-Item -ItemType Directory -Path $big -Force | Out-Null
          & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null
          $LASTEXITCODE = 0

          $ws = New-Object -ComObject WScript.Shell
          $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk")
          $sc.TargetPath = $big
          $sc.Save()

          Write-Host "D:\RDP-Storage ready."
        } else {
          Write-Host "No D: drive detected."
        }

        Add-Content $env:GITHUB_ENV "RDP_USER=$user"
        Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
        Write-Host "Created account: $user"

    - name: Show RDP credentials (open THIS step for IP/user/pass + clickable link)
      shell: pwsh
      run: |
        $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
        $user = $env:RDP_USER
        $pass = $env:RDP_PASS
        $ghrdp = "ghrdp://" + $ip + "/" + [uri]::EscapeDataString($user) + "/" + [uri]::EscapeDataString($pass)
        Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $ghrdp)

        $serveUrl = $env:SERVE_URL

        Write-Host '============================================================'
        Write-Host ('  RDP CREDENTIALS  IP=' + $ip + '  USER=' + $user + '  PASS=' + $pass)
        Write-Host '============================================================'

        if ($serveUrl) {
          Write-Host ''
          Write-Host '>>> CLICKABLE WEB-APP LINK:'
          Write-Host ('    WEBAPP_LINK: ' + $serveUrl)
        }

        Write-Host ''
        Write-Host '>>> ZERO-TYPING now (PASTE in LOCAL browser bar):'
        Write-Host ('    ' + $ghrdp)
        Write-Host ''
        Write-Host ('>>> Manual mstsc: mstsc -> ' + $ip + '  user ' + $user + '  pass ' + $pass)
        Write-Host '============================================================'

    - name: Write mirror lib (shared functions; telegraph index + safe IO)
      if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        $ErrorActionPreference = 'SilentlyContinue'

        function Read-Cfg {
          $b = [System.IO.File]::ReadAllBytes($env:GHRDP_CFG)
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }
          $t = [System.Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)
          return ($t | ConvertFrom-Json)
        }

        function Save-Cfg($c) {
          [System.IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
        }

        function B64U($s) {
          $x = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($s))
          return $x.Replace('+', '-').Replace('/', '_').TrimEnd('=')
        }

        $global:GHRDP_PROG = @{
          ts = ''
          alive = $true
          active = @{ name = ''; phase = 'idle'; bytesDone = 0; bytesTotal = 0; pct = 0; speedBps = 0 }
          agg = @{ total = 0; done = 0; active = 0; failed = 0; tracked = 0; bytesDone = 0; bytesTotal = 0; overallPct = 0; speedBps = 0 }
          files = @()
          log = @()
        }
        $global:GHRDP_PROG_PATH = $null
        $global:GHRDP_LASTFLUSH = 0
        $global:GHRDP_DONE_BYTES = 0
        $global:GHRDP_TOTAL_BYTES = 0
        $global:GHRDP_SP = @{ t = 0; b = 0 }
        $global:GHRDP_SP_A = @{ t = 0; b = 0 }

        function Init-Progress($path) {
          $global:GHRDP_PROG_PATH = $path
          $n = [datetime]::Now.Ticks
          $global:GHRDP_SP = @{ t = $n; b = 0 }
          $global:GHRDP_SP_A = @{ t = $n; b = 0 }
        }

        function Set-Active($name, $phase, $total) {
          $a = $global:GHRDP_PROG.active
          $a.name = $name
          $a.phase = $phase
          $a.bytesDone = 0
          $a.bytesTotal = [long]$total
          $a.pct = 0
          $a.speedBps = 0
          $global:GHRDP_SP_A = @{ t = [datetime]::Now.Ticks; b = 0 }
        }

        function Tick-Bytes($n) {
          $p = $global:GHRDP_PROG
          $p.active.bytesDone += [long]$n
          $now = [datetime]::Now.Ticks
          if (($now - $global:GHRDP_LASTFLUSH) -gt 2000000) { Flush-Progress $false }
        }

        function Flush-Progress($force) {
          $now = [datetime]::Now.Ticks
          if (-not $force -and ($now - $global:GHRDP_LASTFLUSH) -lt 2000000) { return }
          $global:GHRDP_LASTFLUSH = $now
          $p = $global:GHRDP_PROG
          $p.ts = [datetime]::Now.ToString('o')

          $comp = $global:GHRDP_DONE_BYTES + $(if ($p.active.phase -eq 'upload') { $p.active.bytesDone } else { 0 })
          $dt = ($now - $global:GHRDP_SP.t) / 10000000.0
          if ($dt -gt 0.5) {
            $p.agg.speedBps = [math]::Max(0, [math]::Round(($comp - $global:GHRDP_SP.b) / $dt))
            $global:GHRDP_SP = @{ t = $now; b = $comp }
          }

          $dta = ($now - $global:GHRDP_SP_A.t) / 10000000.0
          if ($dta -gt 0.5) {
            $p.active.speedBps = [math]::Max(0, [math]::Round(($p.active.bytesDone - $global:GHRDP_SP_A.b) / $dta))
            $global:GHRDP_SP_A = @{ t = $now; b = $p.active.bytesDone }
          }

          if ($p.active.bytesTotal -gt 0) { $p.active.pct = [math]::Round(100.0 * $p.active.bytesDone / $p.active.bytesTotal, 1) } else { $p.active.pct = 0 }
          $p.agg.bytesDone = $comp
          if ($p.agg.bytesTotal -gt 0) { $p.agg.overallPct = [math]::Round(100.0 * $comp / $p.agg.bytesTotal, 1) } else { $p.agg.overallPct = 0 }

          if ($global:GHRDP_PROG_PATH) {
            try {
              $tmp = $global:GHRDP_PROG_PATH + '.tmp'
              [System.IO.File]::WriteAllText($tmp, ($p | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding $false))
              [System.IO.File]::Move($tmp, $global:GHRDP_PROG_PATH, $true)
            } catch {}
          }
        }

        function Encrypt-File($inPath, $outPath, $password) {
          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.KeySize = 256
          $aes.Mode = 'CBC'
          $aes.Padding = 'PKCS7'

          $salt = [byte[]]::new(16)
          ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt)
          $aes.IV = [byte[]]::new(16)
          ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($aes.IV)

          $kdf = New-Object System.Security.Cryptography.Rfc2898DeriveBytes($password, $salt, 100000, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          $aes.Key = $kdf.GetBytes(32)

          $outFs = [System.IO.File]::Create($outPath)
          $outFs.Write($salt, 0, 16)
          $outFs.Write($aes.IV, 0, 16)

          $cs = New-Object System.Security.Cryptography.CryptoStream($outFs, $aes.CreateEncryptor(), [System.Security.Cryptography.CryptoStreamMode]::Write)
          $inFs = [System.IO.File]::Open($inPath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)

          $buf = New-Object byte[] 65536
          $r = 1
          while ($r -gt 0) {
            $r = $inFs.Read($buf, 0, $buf.Length)
            if ($r -gt 0) { $cs.Write($buf, 0, $r); Tick-Bytes $r }
          }

          $inFs.Close()
          $cs.Close()
          $outFs.Close()
          $aes.Clear()
        }

        function Upload-Gofile-Streamed($encPath, $dispName) {
          for ($a = 1; $a -le 3; $a++) {
            $srv = $null
            try {
              $gs = (& curl.exe -s --max-time 30 "https://api.gofile.io/getServer") | ConvertFrom-Json -ErrorAction Stop
              $srv = $gs.data.server
            } catch {
              "getServer err $_" | Out-File $env:GHRDP_LOG -Append
              $LASTEXITCODE = 0
              Start-Sleep -Seconds (5 * $a)
              continue
            }

            try {
              $boundary = 'ghrdp' + [guid]::NewGuid().ToString('N')
              $iso = [System.Text.Encoding]::GetEncoding('iso-8859-1')
              $hdr = $iso.GetBytes("--$boundary`r`nContent-Disposition: form-data; name=`"file`"; filename=`"$dispName`"`r`nContent-Type: application/octet-stream`r`n`r`n")
              $foot = $iso.GetBytes("`r`n--$boundary--`r`n")

              $req = [System.Net.HttpWebRequest]::Create("https://$srv.gofile.io/contents/uploadfile")
              $req.Method = 'POST'
              $req.ContentType = "multipart/form-data; boundary=$boundary"
              $req.SendChunked = $true
              $req.Timeout = 1800000
              $req.ReadWriteTimeout = 1800000
              $req.UserAgent = 'ghrdp/1'

              $rs = $req.GetRequestStream()
              $rs.Write($hdr, 0, $hdr.Length)

              $fs = [System.IO.File]::Open($encPath, 'Open', 'Read', 'Read')
              $buf = New-Object byte[] 65536
              $r = 1
              while ($r -gt 0) {
                $r = $fs.Read($buf, 0, $buf.Length)
                if ($r -gt 0) { $rs.Write($buf, 0, $r); Tick-Bytes $r }
              }
              $fs.Close()
              $rs.Write($foot, 0, $foot.Length)
              $rs.Close()

              $resp = $req.GetResponse()
              $sr = New-Object System.IO.StreamReader($resp.GetResponseStream())
              $raw = $sr.ReadToEnd()
              $sr.Close()
              $resp.Close()

              $uj = $raw | ConvertFrom-Json -ErrorAction Stop
              if ($uj.status -eq 'ok') {
                if ($uj.data.downloadPage) { return $uj.data.downloadPage }
                if ($uj.data.code) { return "https://gofile.io/d/$($uj.data.code)" }
                if ($uj.data.id) { return "https://gofile.io/d/$($uj.data.id)" }
              }

              "gofile-stream try $a status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append
            } catch {
              "gofile-stream try $a err $_" | Out-File $env:GHRDP_LOG -Append
              try {
                $raw = & curl.exe -s --max-time 1800 -X POST "https://$srv.gofile.io/contents/uploadfile" -F "file=@$encPath"
                $uj = $raw | ConvertFrom-Json -ErrorAction Stop
                if ($uj.status -eq 'ok') {
                  if ($uj.data.downloadPage) { return $uj.data.downloadPage }
                  if ($uj.data.code) { return "https://gofile.io/d/$($uj.data.code)" }
                }
              } catch {
                "gofile-curl fallback err $_" | Out-File $env:GHRDP_LOG -Append
              }
            }

            $LASTEXITCODE = 0
            Start-Sleep -Seconds (5 * $a)
          }
          return $null
        }

        function Load-Index($cfg) {
          if (Test-Path $cfg.idxFile) {
            try { return [System.Collections.ArrayList]@(Get-Content $cfg.idxFile -Raw | ConvertFrom-Json -ErrorAction Stop) } catch {}
          }
          return (New-Object System.Collections.ArrayList)
        }

        function Save-Index($cfg, $idx) {
          [System.IO.File]::WriteAllText($cfg.idxFile, ($idx | ConvertTo-Json -Depth 5), (New-Object System.Text.UTF8Encoding $false))
        }

        function Build-Rentry($cfg, $idx) {
          $nodes = New-Object System.Collections.ArrayList
          [void]$nodes.Add(@{ tag = 'h3'; children = @('GitHub RDP - mirrored files') })
          [void]$nodes.Add(@{ tag = 'p'; children = @('Files are AES-256 encrypted on gofile. Decrypt password: ', $cfg.decPw) })
          if ($idx.Count -eq 0) { [void]$nodes.Add(@{ tag = 'p'; children = @('(no files yet)') }) }

          $n = 1
          foreach ($it in $idx) {
            $kids = New-Object System.Collections.ArrayList
            [void]$kids.Add(("$n. " + $it.name + " [" + $it.status + "] " + $it.src + " " + $it.time + " "))
            if ($it.gofile) { [void]$kids.Add(@{ tag = 'a'; attrs = @{ href = $it.gofile }; children = @('gofile') }) }
            [void]$nodes.Add(@{ tag = 'p'; children = $kids })
            $n++
          }

          return ($nodes | ConvertTo-Json -Depth 8 -Compress)
        }

        function Push-Rentry($cfg, $text) {
          $title = 'GitHub RDP - mirrored files'

          if (-not $cfg.telegraphToken) {
            try {
              $acc = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{ short_name = 'ghrdp'; author_name = 'GitHub RDP Mirror' } -TimeoutSec 30
              if ($acc.ok) { $cfg.telegraphToken = $acc.result.access_token }
            } catch {
              "telegraph createAccount err $_" | Out-File $cfg.logFile -Append
              $LASTEXITCODE = 0
              return $false
            }
          }

          if (-not $cfg.telegraphToken) { return $false }

          try {
            if (-not $cfg.telegraphPath) {
              $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{ access_token = $cfg.telegraphToken; title = $title; content = $text; return_content = 'false' } -TimeoutSec 30
              if ($pg.ok) {
                $cfg.telegraphPath = $pg.result.path
                $cfg.rentryUrl = $pg.result.url
              }
            } else {
              $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{ access_token = $cfg.telegraphToken; path = $cfg.telegraphPath; title = $title; content = $text; return_content = 'false' } -TimeoutSec 30
              if ($pg.ok) { $cfg.rentryUrl = $pg.result.url }
            }
          } catch {
            "telegraph page err $_" | Out-File $cfg.logFile -Append
            $LASTEXITCODE = 0
            return $false
          }

          Save-Cfg $cfg
          return [bool]$cfg.rentryUrl
        }
        LIBEOF

    - name: Write dashboard server script (NO token gate + BOM-safe + rich /diag)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
        function Start-GhrdpServer {
          param(
            [int]$Port,
            [string]$BindAddress,
            [string]$UiDir,
            [string]$ProgressPath,
            [string]$CfgPath,
            [string]$EmergencyFlagPath,
            [string]$FlushFlagPath,
            [string]$OkFile,
            [int]$LimitMinutes = 330
          )

          $ErrorActionPreference = 'SilentlyContinue'
          $global:GHRDP_CFGERR = ''
          $global:GHRDP_PROGERR = ''

          $uiPath = Join-Path $UiDir 'ghrdp-ui.html'
          $uiBytes = if (Test-Path $uiPath) { [System.IO.File]::ReadAllBytes($uiPath) } else { [System.Text.Encoding]::UTF8.GetBytes('<h1 style="font-family:sans-serif;color:#e9eef3;background:#0a0e12;padding:30px">dashboard ui missing</h1>') }

          function ReadJsonSafe($path, [ref]$errVar) {
            if (-not (Test-Path $path)) { $errVar.Value = 'file-missing'; return $null }
            try {
              $fs = [System.IO.File]::Open($path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
              $ms = New-Object System.IO.MemoryStream
              $fs.CopyTo($ms)
              $fs.Close()
              $bytes = $ms.ToArray()
              $ms.Close()
              if ($bytes.Length -eq 0) { $errVar.Value = 'empty-file'; return $null }
              if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { $bytes = $bytes[3..($bytes.Length - 1)] }
              $txt = [System.Text.Encoding]::UTF8.GetString($bytes).TrimStart([char]0xFEFF)
              return ($txt | ConvertFrom-Json -ErrorAction Stop)
            } catch {
              $errVar.Value = ('read/parse: ' + $_.Exception.Message)
              return $null
            }
          }

          function ParseHeaders($raw) {
            $h = @{}
            $lines = $raw -split "`r`n"
            for ($i = 1; $i -lt $lines.Length; $i++) {
              $l = $lines[$i]
              $ix = $l.IndexOf(':')
              if ($ix -gt 0) { $h[($l.Substring(0, $ix).Trim().ToLower())] = $l.Substring($ix + 1).Trim() }
            }

            $qp = @{}
            if ($lines[0] -match '\?(.+)\s') {
              foreach ($kv in ($Matches[1] -split '&')) {
                $p = $kv -split '='
                if ($p.Length -eq 2) { $qp[$p[0].ToLower()] = [uri]::UnescapeDataString($p[1]) }
              }
            }

            return @{ headers = $h; query = $qp }
          }

          function Is-Loopback($client) {
            try { return $client.Client.RemoteEndPoint.Address.IsLoopback } catch { return $false }
          }

          function ReadReq($stream) {
            $stream.ReadTimeout = 5000
            $acc = New-Object System.Text.StringBuilder
            $buf = New-Object byte[] 4096
            while ($true) {
              $n = 0
              try { $n = $stream.Read($buf, 0, $buf.Length) } catch { break }
              if ($n -le 0) { break }
              [void]$acc.Append([System.Text.Encoding]::ASCII.GetString($buf, 0, $n))
              if ($acc.ToString().Contains("`r`n`r`n")) { break }
              if ($acc.Length -gt 16384) { break }
            }
            return $acc.ToString()
          }

          function WriteResp($stream, $code, $ctype, $bodyBytes) {
            $status = switch ([int]$code) { 200 { 'OK' } 404 { 'Not Found' } default { 'OK' } }
            $hdr = "HTTP/1.1 $code $status`r`nContent-Type: $ctype`r`nContent-Length: $($bodyBytes.Length)`r`nConnection: close`r`nCache-Control: no-store`r`nAccess-Control-Allow-Origin: *`r`n`r`n"
            $hb = [System.Text.Encoding]::ASCII.GetBytes($hdr)
            $stream.Write($hb, 0, $hb.Length)
            if ($bodyBytes.Length -gt 0) { $stream.Write($bodyBytes, 0, $bodyBytes.Length) }
            $stream.Flush()
          }

          function JsonBytes($obj) {
            return [System.Text.Encoding]::UTF8.GetBytes(($obj | ConvertTo-Json -Depth 8 -Compress))
          }

          function HandleOne($client) {
            try {
              $stream = $client.GetStream()
              $req = ReadReq $stream
              $parsed = ParseHeaders $req
              $path = '/'
              if ($req -match '(?m)^GET\s+(\S+)') { $path = ($Matches[1] -split '\?')[0] }

              $loop = Is-Loopback $client
              $cfgErrRef = [ref]$global:GHRDP_CFGERR
              $cfg = ReadJsonSafe $CfgPath $cfgErrRef

              if ($path -eq '/emergency') {
                Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ascii
                WriteResp $stream 200 'application/json' (JsonBytes @{ ok = $true })
                return
              }

              if ($path -eq '/diag') {
                $progErrRef = [ref]$global:GHRDP_PROGERR
                $prog = ReadJsonSafe $ProgressPath $progErrRef
                $listen = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -ErrorAction SilentlyContinue)
                $fw = [bool](Get-NetFirewallRule -DisplayName 'ghrdp-dash' -ErrorAction SilentlyContinue)
                $tsip = ''
                if ($cfg -and $cfg.rdpIp) { $tsip = $cfg.rdpIp }

                $d = [ordered]@{
                  portListening = $listen
                  requestTrusted = $loop
                  requestLoopback = $loop
                  firewallRulePresent = $fw
                  cfgFileExists = (Test-Path $CfgPath)
                  cfgLoaded = [bool]$cfg
                  cfgError = $global:GHRDP_CFGERR
                  progressFileExists = (Test-Path $ProgressPath)
                  progressLoaded = [bool]$prog
                  progressError = $global:GHRDP_PROGERR
                  requestHost = $parsed.headers['host']
                  tailscaleIp = $tsip
                  note = 'No token gate. 7331 is loopback+tailnet only.'
                }
                WriteResp $stream 200 'application/json' (JsonBytes $d)
                return
              }

              if ($path -eq '/install.ps1') {
                $ip2 = Join-Path $UiDir 'ghrdp-install.ps1'
                if (Test-Path $ip2) {
                  WriteResp $stream 200 'application/octet-stream' ([System.IO.File]::ReadAllBytes($ip2))
                } else {
                  WriteResp $stream 404 'text/plain' ([System.Text.Encoding]::UTF8.GetBytes('installer missing'))
                }
                return
              }

              if ($path -eq '/progress' -or $path -eq '/app.js') {
                $progErrRef = [ref]$global:GHRDP_PROGERR
                $prog = ReadJsonSafe $ProgressPath $progErrRef
                if (-not $prog) { $prog = @{ alive = $false } }

                $obj = [ordered]@{
                  serverTs = (Get-Date -f o)
                  viaLoopback = $loop
                  cfgLoaded = [bool]$cfg
                  cfgError = $global:GHRDP_CFGERR
                  ghrdp = $(if ($cfg) { $cfg.ghrdp } else { '' })
                  rentry = $(if ($cfg) { $cfg.rentryUrl } else { '' })
                  mirror = $(if ($cfg) { [bool]$cfg.mirror } else { $false })
                  creds = @{
                    ip = $(if ($cfg) { $cfg.rdpIp } else { '' })
                    user = $(if ($cfg) { $cfg.rdpUser } else { '' })
                    pass = $(if ($cfg) { $cfg.rdpPass } else { '' })
                  }
                  ts = $prog.ts
                  alive = $prog.alive
                  active = $prog.active
                  agg = $prog.agg
                  files = $prog.files
                  log = $prog.log
                }
                WriteResp $stream 200 'application/json' (JsonBytes $obj)
                return
              }

              $html = [System.Text.Encoding]::UTF8.GetString($uiBytes)
              $ip = if ($cfg) { [string]$cfg.rdpIp } else { '' }
              $us = if ($cfg) { [string]$cfg.rdpUser } else { '' }
              $pw = if ($cfg) { [string]$cfg.rdpPass } else { '' }
              $gh = if ($cfg) { [string]$cfg.ghrdp } else { '' }
              $st = if ($loop) { '0' } else { '1' }

              $html = $html.Replace('__IP__', $ip).Replace('__USER__', $us).Replace('__PASS__', $pw).Replace('__GHRDP__', $gh).Replace('__STATIC__', $st)
              WriteResp $stream 200 'text/html; charset=utf-8' ([System.Text.Encoding]::UTF8.GetBytes($html))
            } catch {
              try {
                WriteResp $stream 200 'application/json' (JsonBytes @{ serverTs = (Get-Date -f o); handlerError = $_.Exception.Message; creds = @{ ip = ''; user = ''; pass = '' } })
              } catch {}
            }

            try { $client.Close() } catch {}
          }

          $ipObj = [System.Net.IPAddress]::Parse($BindAddress)
          $listener = New-Object System.Net.Sockets.TcpListener $ipObj, ([int]$Port)

          try {
            $listener.Start()
          } catch {
            Set-Content $OkFile ("LISTEN_FAIL on {0}: {1}" -f $BindAddress, $_) -Encoding ascii
            throw
          }

          Set-Content $OkFile ("LISTENING bind={0} pid={1} port={2} at {3}" -f $BindAddress, $PID, $Port, (Get-Date -f o)) -Encoding ascii

          $start = Get-Date
          $limit = (New-TimeSpan -Minutes $LimitMinutes)
          while (((Get-Date) - $start) -lt $limit) {
            if (Test-Path $FlushFlagPath) { Remove-Item $FlushFlagPath -Force -ErrorAction SilentlyContinue }
            while ($listener.Pending()) {
              $c = $null
              try { $c = $listener.AcceptTcpClient() } catch {}
              if ($c) { HandleOne $c }
            }
            Start-Sleep -Milliseconds 200
          }

          try { $listener.Stop() } catch {}
        }
        SERVEREOF

    - name: Write dashboard UI (clickable ghrdp link + live telemetry)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-ui.html" <<'UIEOF'
        <!doctype html>
        <html lang="en">
        <head>
        <meta charset="utf-8">
        <meta id="ghrdpStatic" name="ghrdp-static" content="__STATIC__">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>RDP Mission Control</title>
        <style>
        body{font-family:Segoe UI,system-ui,sans-serif;background:#0a0e12;color:#e9eef3;margin:0;padding:24px}
        h1{margin:0 0 8px}
        .sub{color:#8aa0ad;margin-bottom:20px}
        .panel{background:#11171d;border:1px solid #223039;border-radius:14px;padding:18px;margin:0 0 16px}
        code{background:#070b0e;border:1px solid #223039;border-radius:8px;padding:6px 8px;display:inline-block;min-width:120px}
        a.button,button{display:inline-block;background:#37c6b0;color:#04201c;font-weight:700;border:0;border-radius:10px;padding:12px 18px;text-decoration:none;cursor:pointer;margin:6px 6px 0 0}
        button.warn{background:#f0a830;color:#231600}
        pre{background:#070b0e;border:1px solid #223039;border-radius:10px;padding:12px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .big{font-size:56px;font-weight:800}
        #mirrorBox{display:none}
        @media(max-width:900px){.grid{grid-template-columns:1fr}}
        </style>
        </head>
        <body>
        <h1>RDP Mission Control</h1>
        <div class="sub" id="mode">checking…</div>

        <div class="panel">
        <div><b>IP</b> <code id="vIp">__IP__</code></div>
        <div style="margin-top:8px"><b>USER</b> <code id="vUser">__USER__</code></div>
        <div style="margin-top:8px"><b>PASS</b> <code id="vPass">__PASS__</code></div>
        <div style="margin-top:14px">
        <a id="rdp" href="__GHRDP__">Open Remote Desktop</a>
        <button id="diagBtn" type="button">Diagnose</button>
        </div>
        <div style="margin-top:12px;font-size:12px;color:#8aa0ad;word-break:break-all">
        ghrdp link: <a id="ghrdpLink" href="__GHRDP__" style="color:#37c6b0">__GHRDP__</a>
        </div>
        </div>

        <div class="grid">
        <div class="panel">
        <div class="sub">Overall uploaded</div>
        <div class="big"><span id="pct">0</span>%</div>
        <div style="margin-top:10px;color:#8aa0ad">
        done <b id="cDone">0</b> |
        active <b id="cAct">0</b> |
        failed <b id="cFail">0</b> |
        tracked <b id="cTrk">0</b>
        </div>
        <div style="margin-top:10px;color:#8aa0ad">
        speed <b id="speed">0 B/s</b> | overall bytes <b id="bDone">0</b> / <b id="bTotal">0</b>
        </div>
        <div id="mirrorBox" style="margin-top:14px">
        <button class="warn" id="emBtn" type="button">Upload everything now</button>
        <div id="banner" style="margin-top:10px;font-weight:700"></div>
        </div>
        </div>

        <div class="panel">
        <div class="sub">Live log</div>
        <pre id="log">waiting for watcher…</pre>
        <div id="rentry" style="margin-top:10px;font-size:12px;color:#8aa0ad;display:none"></div>
        </div>
        </div>

        <div class="panel">
        <div class="sub">Diagnostics</div>
        <pre id="diagOut" style="display:none"></pre>
        </div>

        <script>
        function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';if(b<1073741824)return (b/1048576).toFixed(1)+' MB';return (b/1073741824).toFixed(2)+' GB';}
        function setCreds(c){if(!c)return;document.getElementById('vIp').textContent=c.ip||'-';document.getElementById('vUser').textContent=c.user||'-';document.getElementById('vPass').textContent=c.pass||'-';}
        function setGhrdp(u){var a=document.getElementById('ghrdpLink');var r=document.getElementById('rdp');var ok=!!u&&u.indexOf('ghrdp://')===0&&u.length>10;a.href=ok?u:'#';a.textContent=u||'ghrdp://…';if(r&&ok)r.href=u;}
        function render(s){
          if(!s)return;
          var now=Date.now();var ts=s.ts?new Date(s.ts).getTime():0;var age=ts?Math.round((now-ts)/1000):999;
          var on = !s.mirror || (s.alive && age < 15);
          document.getElementById('mode').textContent = (s.viaLoopback ? 'Inside RDP / loopback' : 'Local PC view') + ' | watcher ' + (on ? 'online' : 'stale/offline') + ' | age ' + age + 's';
          if(s.ghrdp){setGhrdp(s.ghrdp);}
          if(s.creds){setCreds(s.creds);}
          if(s.rentry){var r=document.getElementById('rentry');r.style.display='block';r.textContent='index: '+s.rentry;}
          document.getElementById('mirrorBox').style.display=s.mirror?'block':'none';
          var a=s.agg||{};
          document.getElementById('pct').textContent=a.overallPct||0;
          document.getElementById('cDone').textContent=a.done||0;
          document.getElementById('cAct').textContent=a.active||0;
          document.getElementById('cFail').textContent=a.failed||0;
          document.getElementById('cTrk').textContent=a.tracked||0;
          document.getElementById('speed').textContent=fb(a.speedBps||0)+'/s';
          document.getElementById('bDone').textContent=fb(a.bytesDone||0);
          document.getElementById('bTotal').textContent=fb(a.bytesTotal||0);
          var lg=s.log||[];
          if(lg.length){document.getElementById('log').textContent=lg.join('\n');}
          var bn=document.getElementById('banner');
          bn.textContent='';
          if(s.mirror){
            if((a.failed||0)>0 && (a.active||0)===0){bn.textContent=(a.failed)+' file(s) failed — check log.';}
            else if((a.tracked||0)>0 && (a.active||0)===0 && (a.failed||0)===0 && (a.done||0)>0){bn.textContent='ALL UPLOADED — safe to Cancel workflow now.';}
          }
        }
        function poll(){
          fetch('/progress'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){});
        }
        document.getElementById('diagBtn').addEventListener('click',function(){
          var out=document.getElementById('diagOut');
          out.style.display='block';
          out.textContent='running diagnostics…';
          fetch('/diag'+(location.search||''),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
            out.textContent=JSON.stringify(d,null,2);
          }).catch(function(e){out.textContent='diag failed: '+e;});
        });
        document.getElementById('emBtn').addEventListener('click',function(){
          var b=this;b.disabled=true;b.textContent='triggered…';
          fetch('/emergency'+(location.search||''),{cache:'no-store'}).then(function(){
            setTimeout(function(){b.disabled=false;b.textContent='Upload everything now';},1500);
          }).catch(function(){b.disabled=false;b.textContent='Upload everything now';});
        });
        var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';
        if(STATIC){
          document.getElementById('mode').textContent='Local PC static view. Click Open Remote Desktop.';
          document.getElementById('diagBtn').addEventListener('click',function(){poll();});
        }else{
          poll();
          setInterval(poll,1500);
        }
        </script>
        </body>
        </html>
        UIEOF

    - name: Write mirror watcher script
      if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
        param([string]$CfgPath)
        $ErrorActionPreference = 'Continue'

        $progEarly = Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'

        function Write-HB($msg) {
          try {
            $h = @{ ts = (Get-Date -f o); alive = $true; agg = @{ tracked = 0; done = 0; active = 0; failed = 0 }; files = @(); log = @($msg) }
            [System.IO.File]::WriteAllText($progEarly, ($h | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding $false))
          } catch {}
        }

        $createdNew = $false
        $mtx = New-Object System.Threading.Mutex $true, 'Global\ghrdp-watcher-single', ([ref]$createdNew)
        if (-not $createdNew) {
          Write-HB 'another watcher instance already holds the lock - exiting'
          exit 0
        }

        $cfg = $null
        try {
          $b = [System.IO.File]::ReadAllBytes($CfgPath)
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }
          $cfg = ([System.Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -ErrorAction Stop
        } catch {
          Write-HB ('WATCHER CFG READ FAIL: ' + $_.Exception.Message)
          throw
        }

        if (-not $cfg) {
          Write-HB 'WATCHER CFG NULL'
          throw 'cfg null'
        }

        $env:GHRDP_CFG = $CfgPath
        $env:GHRDP_LOG = $cfg.logFile
        . $cfg.libPath

        if (-not (Get-Command Init-Progress -ErrorAction SilentlyContinue)) {
          Write-HB ('WATCHER LIB NOT LOADED: ' + $cfg.libPath + ' exists=' + (Test-Path $cfg.libPath))
          throw 'lib not loaded'
        }

        Init-Progress $cfg.progressPath

        $script:RUNLOG = New-Object System.Collections.ArrayList
        $script:SCAN = @{}

        function LErr($t, $e) {
          $m = ("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'), $t, $e.Exception.Message)
          [void]$script:RUNLOG.Add($m)
          try { if ($global:GHRDP_PROG -and $global:GHRDP_PROG.log) { $global:GHRDP_PROG.log = @($global:GHRDP_PROG.log) + $m } } catch {}
          try { Add-Content $cfg.logFile $m -ErrorAction SilentlyContinue } catch {}
        }

        function ScanLine {
          $parts = @($script:SCAN.GetEnumerator() | ForEach-Object {
            $v = $_.Value
            $s = $_.Key + ':raw=' + $v.rawTotal + '/elig=' + $v.eligible
            if ($v.rawSamples -and $v.rawSamples.Count) { $s += ' :: ' + ($v.rawSamples -join ', ') }
            if ($v.error) { $s += ' ERR=' + $v.error }
            $s
          })
          return ('[scan] ' + ($parts -join ' | '))
        }

        Write-HB 'watcher lib loaded - entering scan loop'

        $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb')
        $done = @{}
        if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }

        $idx = Load-Index $cfg
        try { Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null } catch { LErr 'init-err' $_ }

        function DoUpload($fi, $tag) {
          if ($done.ContainsKey($fi.FullName)) { return }

          $len = $fi.Length
          $safe = $fi.Name -replace '\|', '_'
          $disp = ($safe -replace '[^\x20-\x7E]', '_')

          $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $tag } | Select-Object -First 1
          if (-not $ex) {
            $ex = @{ name = $safe; src = $tag; status = 'uploading'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss') }
            [void]$idx.Add($ex)
            $global:GHRDP_TOTAL_BYTES += $len
            Save-Index $cfg $idx
          }

          $ex.status = 'uploading'
          $ex.time = (Get-Date -f 'HH:mm:ss')

          $enc = Join-Path $cfg.tmpDir ('ge_' + [guid]::NewGuid().ToString('N') + '.enc')
          $gofile = $null

          Set-Active $disp 'encrypt' $len
          try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch { "encrypt err $($fi.Name): $_" | Out-File $cfg.logFile -Append }

          Set-Active $disp 'upload' $len
          try { $gofile = Upload-Gofile-Streamed $enc $disp } catch { "upload err $($fi.Name): $_" | Out-File $cfg.logFile -Append }

          Remove-Item $enc -Force -ErrorAction SilentlyContinue

          if ($gofile) {
            $ex.payload = B64U ($gofile + '|' + $cfg.decPw + '|' + $safe)
            $ex.gofile = $gofile
            $ex.status = 'ok'
            $ex.time = (Get-Date -f 'HH:mm:ss')
            $done[$fi.FullName] = $true
            $fi.FullName | Out-File $cfg.doneFile -Append
            $global:GHRDP_DONE_BYTES += $len
            Save-Index $cfg $idx
            try { Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null } catch { LErr 'push-err' $_ }
            "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len bytes)" | Out-File $cfg.logFile -Append
          } else {
            $ex.status = 'limit'
            $ex.time = (Get-Date -f 'HH:mm:ss')
            Save-Index $cfg $idx
            try { Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null } catch {}
            "[$(Get-Date -f o)] LIMIT $tag $($fi.Name)" | Out-File $cfg.logFile -Append
          }

          Set-Active '' 'idle' 0
        }

        function Proc($fi, $tag) {
          if ($done.ContainsKey($fi.FullName)) { return }
          DoUpload $fi $tag
        }

        function Scan($r) {
          $elig = 0
          $esamp = New-Object System.Collections.ArrayList
          $rawAll = @()
          $rerr = ''

          if (-not (Test-Path $r.path)) {
            $script:SCAN[$r.tag] = @{ rawTotal = 0; eligible = 0; path = $r.path; error = 'path-missing'; rawSamples = @() }
            return
          }

          try {
            $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue } else { Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue }
          } catch {
            $script:SCAN[$r.tag] = @{ rawTotal = -1; eligible = 0; path = $r.path; error = $_.Exception.Message; rawSamples = @() }
            return
          }

          $rawAll = @($items)
          $rawNames = @($rawAll | Select-Object -First 4 | ForEach-Object { $_.Name })

          foreach ($fi in $rawAll) {
            if ($done.ContainsKey($fi.FullName)) { continue }
            if ($junk -contains $fi.Extension.ToLower()) { continue }
            if ($fi.Length -lt $r.min) { continue }
            if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }

            $elig++
            if ($esamp.Count -lt 6) { [void]$esamp.Add(($fi.Name + ' (' + [math]::Round($fi.Length / 1MB, 1) + 'MB)')) }
            Proc $fi $r.tag
          }

          $script:SCAN[$r.tag] = @{ rawTotal = $rawAll.Count; eligible = $elig; path = $r.path; error = $rerr; rawSamples = $rawNames; eligibleSamples = @($esamp) }
        }

        function SweepAll($r) {
          if (-not (Test-Path $r.path)) { return }
          $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending } else { Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending }
          foreach ($fi in $items) {
            if ($done.ContainsKey($fi.FullName)) { continue }
            if ($junk -contains $fi.Extension.ToLower()) { continue }
            if ($fi.Length -lt $r.min) { continue }
            if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }
            DoUpload $fi $r.tag
          }
        }

        function EmergencyPass {
          "[$(Get-Date -f o)] EMERGENCY pass start" | Out-File $cfg.logFile -Append

          foreach ($p in @('qbittorrent', 'qbittorrent-nox')) {
            Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 4

          for ($round = 0; $round -lt 3; $round++) {
            foreach ($r in $cfg.roots) { Scan $r }
            Start-Sleep -Seconds 4
          }

          foreach ($r in $cfg.roots) { SweepAll $r }

          Save-Index $cfg $idx
          try { Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null } catch { LErr 'emergency-push-err' $_ }
          Remove-Item $cfg.emergencyFlag -Force -ErrorAction SilentlyContinue

          "[$(Get-Date -f o)] EMERGENCY pass end" | Out-File $cfg.logFile -Append
        }

        function SyncProg {
          try {
            $p = $global:GHRDP_PROG
            $d = 0; $u = 0; $f = 0
            foreach ($it in $idx) {
              if ($it.status -eq 'ok') { $d++ }
              elseif ($it.status -eq 'limit') { $f++ }
              else { $u++ }
            }

            $p.agg.done = $d
            $p.agg.failed = $f
            $p.agg.tracked = $idx.Count
            $p.agg.active = if ($p.active.phase -ne 'idle') { 1 } else { 0 }
            $p.agg.bytesTotal = $global:GHRDP_TOTAL_BYTES

            $p.files = @( foreach ($it in $idx) { @{ name = $it.name; src = $it.src; status = $it.status } } )

            $errs = @($script:RUNLOG | Select-Object -Last 6)
            $filetail = @()
            if (Test-Path $cfg.logFile) {
              $g = Get-Content $cfg.logFile -Tail 12 -ErrorAction SilentlyContinue
              if ($g) { $filetail = @($g) }
            }

            $p.log = @($errs) + @(ScanLine) + $filetail
            Flush-Progress $true
          } catch {
            LErr 'sync-err' $_
          }
        }

        $iter = 0
        while ($true) {
          $iter++

          if (Test-Path $cfg.emergencyFlag) {
            try { EmergencyPass } catch { LErr 'emergency-err' $_ }
          } else {
            foreach ($r in $cfg.roots) {
              try { Scan $r } catch { LErr ('scan-err ' + $r.tag) $_ }
            }

            if (Test-Path $cfg.flushFlag) {
              try {
                "[$(Get-Date -f o)] FLUSH seen" | Out-File $cfg.logFile -Append
                for ($p = 0; $p -lt 8; $p++) {
                  foreach ($r in $cfg.roots) { Scan $r }
                  if (-not ($idx | Where-Object { $_.status -ne 'ok' })) { break }
                  Start-Sleep -Seconds 8
                }
                Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null
                Remove-Item $cfg.flushFlag -Force -ErrorAction SilentlyContinue
              } catch {
                LErr 'flush-err' $_
              }
            }
          }

          SyncProg

          try {
            $global:GHRDP_PROG.ts = (Get-Date -f o)
            $global:GHRDP_PROG.alive = $true
            [System.IO.File]::WriteAllText($cfg.progressPath, ($global:GHRDP_PROG | ConvertTo-Json -Depth 6 -Compress), (New-Object System.Text.UTF8Encoding $false))
          } catch {
            LErr 'heartbeat-err' $_
          }

          Start-Sleep -Seconds 3
        }
        WATCHEOF

    - name: Write Mission Control launcher (server observe + watcher fallback)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-launcher.ps1" <<'LAUNCHEOF'
        param([string]$CfgPath, [int]$Port = 7331)

        $sd = Split-Path $CfgPath -Parent
        $progressPath = Join-Path $sd 'ghrdp_progress.json'
        $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'
        $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"

        function Line($c, $m) {
          Write-Host ("[{0}] {1}" -f (Get-Date -f 'HH:mm:ss'), $m) -ForegroundColor $c
        }

        if (-not (Test-Path $CfgPath)) {
          Line Red "Config missing: $CfgPath"
          Start-Sleep -Seconds 30
          exit 0
        }

        $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json

        Line Cyan "Mission Control (OBSERVE mode)."
        Line White ("IP={0}  USER={1}  MIRROR={2}" -f $cfg.rdpIp, $cfg.rdpUser, $cfg.mirror)

        try {
          Start-Process ("http://127.0.0.1:{0}/" -f $Port) | Out-Null
          Line Green "[browser] opened dashboard tab inside RDP"
        } catch {}

        $wrunning = Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -ErrorAction SilentlyContinue |
          Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }

        if (-not $wrunning -and (Test-Path $watcherScript)) {
          try {
            $wArgs = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$CfgPath`""
            Start-Process -FilePath $ps -ArgumentList $wArgs -WindowStyle Hidden | Out-Null
            Line Green "[watcher] started in RDP session fallback"
          } catch {
            Line Red ("[watcher] start err " + $_.Exception.Message)
          }
        } else {
          Line Cyan "[watcher] already running or not required"
        }

        while ($true) {
          $listen = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -ErrorAction SilentlyContinue)
          $done = 0; $act = 0; $fail = 0; $trk = 0; $pct = 0
          if (Test-Path $progressPath) {
            try {
              $p = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction SilentlyContinue
              if ($p -and $p.agg) {
                $done = $p.agg.done
                $act = $p.agg.active
                $fail = $p.agg.failed
                $trk = $p.agg.tracked
                $pct = $p.agg.overallPct
              }
            } catch {}
          }

          Line $(if ($listen) { 'Green' } else { 'Red' }) ("listen={0} | done={1} active={2} fail={3} tracked={4} overall={5}%" -f $listen, $done, $act, $fail, $trk, $pct)
          Start-Sleep -Seconds 2
        }
        LAUNCHEOF

    - name: Write summary helper
      env:
        REPO: ${{ github.repository }}
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-summary.ps1" <<'SUMMARYEOF'
        param([string]$CfgPath)
        $ErrorActionPreference = 'SilentlyContinue'

        if (-not (Test-Path $CfgPath)) { return }

        $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json
        $ip = $cfg.rdpIp
        $user = $cfg.rdpUser
        $pass = $cfg.rdpPass
        $ghrdp = $cfg.ghrdp
        $funnel = $cfg.funnelUrl
        $S = $env:GITHUB_STEP_SUMMARY

        Write-Host '============================================================'
        Write-Host ('  RDP READY  IP=' + $ip + '  USER=' + $user + '  PASS=' + $pass)
        if ($funnel) { Write-Host ('  CLICKABLE WEB LINK: ' + $funnel) }
        Write-Host ('  CONNECT NOW PASTE: ' + $ghrdp)
        Write-Host '============================================================'

        '### RDP ready' >> $S
        '' >> $S
        if ($funnel) {
          ('**[>>> OPEN RDP WEB-APP <<<](' + $funnel + ')**') >> $S
          '' >> $S
        }
        '#### Paste this in your LOCAL browser address bar:' >> $S
        '' >> $S
        '```' >> $S
        $ghrdp >> $S
        '```' >> $S
        '' >> $S
        ('IP: ' + $ip + '   User: ' + $user + '   Pass: ' + $pass) >> $S
        '' >> $S
        if ($cfg.mirror) { ('Mirror ON. Index: ' + $cfg.rentryUrl) >> $S }
        SUMMARYEOF

    - name: Write ghrdp installer (local PC protocol connector)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/ghrdp-install.ps1" <<'INSTALLEOF'
        param()
        try {
          $dir = Join-Path $env:LOCALAPPDATA 'ghrdp'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $helperPath = Join-Path $dir 'ghrdp.ps1'

          $helper = @'
        param([string]$url)
        if ($url -match '^ghrdp://([^/]+)/([^/]+)/(.+)$') {
          $ip = $Matches[1]
          $user = [uri]::UnescapeDataString($Matches[2])
          $pass = [uri]::UnescapeDataString($Matches[3])
          cmdkey /generic:TERMSRV/$ip /user:$user /pass:$pass | Out-Null
          Start-Process "$env:windir\System32\mstsc.exe" "/v:$ip"
        }
        '@

          Set-Content -Path $helperPath -Value $helper -Encoding ASCII

          $root = 'HKCU:\Software\Classes\ghrdp'
          New-Item -Path $root -Force | Out-Null
          Set-Item -Path $root -Value 'URL:GitHub RDP Connect'
          New-ItemProperty -Path $root -Name 'URL Protocol' -Value '' -PropertyType String -Force | Out-Null
          New-Item -Path "$root\shell\open\command" -Force | Out-Null

          $pwsh = (Get-Command powershell.exe -ErrorAction SilentlyContinue).Source
          if (-not $pwsh) { $pwsh = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe' }
          Set-Item -Path "$root\shell\open\command" -Value "`"$pwsh`" -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$helperPath`" `"%1`""

          Write-Host ''
          Write-Host 'SUCCESS - RDP connector installed.'
          Write-Host 'Now click the ghrdp link again.'
        } catch {
          Write-Host "INSTALL ERROR: $($_.Exception.Message)"
        }

        Read-Host 'Press Enter to close'
        INSTALLEOF

    - name: Configure theme + bookmarks + apps + Mission Control shortcut + watcher startup
      env:
        MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        function Reset-Exit { $script:LASTEXITCODE = 0 }

        $mPers = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
        if (-not (Test-Path $mPers)) { New-Item -Path $mPers -Force | Out-Null }
        New-ItemProperty -Path $mPers -Name 'AppsUseLightTheme' -Value 0 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $mPers -Name 'SystemUsesLightTheme' -Value 0 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $mPers -Name 'ColorPrevalence' -Value 0 -PropertyType DWord -Force | Out-Null

        $mAcc = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent'
        if (-not (Test-Path $mAcc)) { New-Item -Path $mAcc -Force | Out-Null }
        New-ItemProperty -Path $mAcc -Name 'AccentColorMenu' -Value 0x8c2bc4 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $mAcc -Name 'StartColor' -Value 0x8c2bc4 -PropertyType DWord -Force | Out-Null
        New-ItemProperty -Path $mAcc -Name 'AccentColor' -Value 0xffc42b8c -PropertyType DWord -Force | Out-Null

        Write-Host "Machine-wide dark mode + accent set."

        $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
        if (-not (Test-Path $edgePol)) { New-Item -Path $edgePol -Force | Out-Null }
        $crx = 'https://edge.microsoft.com/extensionwebstorebase/v1/crx'
        New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -PropertyType String -Force | Out-Null
        New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -PropertyType String -Force | Out-Null

        $fav = '[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"},{"name":"GitHub RDP Mirror","url":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe"}]'
        New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value $fav -PropertyType String -Force | Out-Null

        $ffdist = 'C:\Program Files\Mozilla Firefox\distribution'
        New-Item -ItemType Directory -Path $ffdist -Force | Out-Null
        $ffpol = '{"policies":{"Bookmarks":[{"Title":"FMHY Torrenting","URL":"https://fmhy.net/torrenting","Placement":"toolbar"},{"Title":"GitHub RDP Mirror","URL":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe","Placement":"toolbar"}]}}'
        Set-Content -Path (Join-Path $ffdist 'policies.json') -Value $ffpol -Encoding UTF8

        try { winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null | Out-Null; Write-Host "qBittorrent installed." } catch { Write-Host "qBittorrent winget failed." }
        Reset-Exit

        try { winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null | Out-Null; Write-Host "Parsec installed." } catch { Write-Host "Parsec winget failed." }
        Reset-Exit

        $pcfg = 'C:\ProgramData\Parsec'
        New-Item -ItemType Directory -Path $pcfg -Force | Out-Null
        "app_host = 1`r`nprivacy_mode = 0`r`nserver_resolution = 1920x1080" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -ErrorAction SilentlyContinue

        if (Test-Path 'C:\Program Files\Parsec\parsecd.exe') {
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ParsecAuto' -Value '"C:\Program Files\Parsec\parsecd.exe"' -PropertyType String -Force -ErrorAction SilentlyContinue | Out-Null
          Write-Host "Parsec autolaunch set."
        }
        Reset-Exit

        $sd = $env:RUNNER_TEMP
        $cfgPath = Join-Path $sd 'ghrdp_cfg.json'
        $launcher = Join-Path $sd 'ghrdp-launcher.ps1'
        $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
        $user = $env:RDP_USER

        $args = "-NoExit -ExecutionPolicy Bypass -File `"$launcher`" -CfgPath `"$cfgPath`" -Port 7331"

        foreach ($desk in @("C:\Users\Public\Desktop", "C:\Users\$user\Desktop")) {
          try {
            New-Item -ItemType Directory -Path $desk -Force -ErrorAction SilentlyContinue | Out-Null
            $ws = New-Object -ComObject WScript.Shell
            $sc = $ws.CreateShortcut((Join-Path $desk 'Mission Control.lnk'))
            $sc.TargetPath = $ps
            $sc.Arguments = $args
            $sc.WindowStyle = 1
            $sc.Description = 'RDP dashboard + mirror status'
            $sc.Save()
            Write-Host "Mission Control shortcut -> $desk"
          } catch {
            Write-Host "shortcut err $desk : $_"
          }
        }

        if ($env:MIRROR -eq 'true') {
          $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'
          $startupAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
          try {
            $wArgs = "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$watcherScript`" -CfgPath `"$cfgPath`""
            $ws2 = New-Object -ComObject WScript.Shell
            $sc2 = $ws2.CreateShortcut((Join-Path $startupAll 'ghrdp-watcher.lnk'))
            $sc2.TargetPath = $ps
            $sc2.Arguments = $wArgs
            $sc2.WindowStyle = 7
            $sc2.Description = 'ghrdp mirror watcher (runs as logged-in RDP user)'
            $sc2.Save()
            Write-Host "watcher auto-start shortcut -> $startupAll"
          } catch {
            Write-Host "startup shortcut err: $_"
          }

          & icacls.exe $sd /grant "${user}:(OI)(CI)M" 2>$null | Out-Null
          $LASTEXITCODE = 0
          Write-Host "[perms] RDP user modify granted on $sd"
        }

        Write-Host "Configure step complete."
        exit 0

    - name: Prepare dashboard + mirror config + publish cfg path
      env:
        MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
      shell: pwsh
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        $ip = (& $ts ip -4).Trim()
        $user = $env:RDP_USER
        $pass = $env:RDP_PASS
        $eu = [uri]::EscapeDataString($user)
        $ep = [uri]::EscapeDataString($pass)
        $ghrdp = "ghrdp://$ip/$eu/$ep"
        $sd = $env:RUNNER_TEMP

        New-Item -ItemType Directory -Path (Join-Path $sd 'ghrdp_tmp') -Force | Out-Null

        $indexPath = Join-Path $sd 'ghrdp_mirror_index.json'
        $progressPath = Join-Path $sd 'ghrdp_progress.json'
        $hbPath = Join-Path $sd 'ghrdp_heartbeat.txt'
        $emPath = Join-Path $sd 'ghrdp_emergency.flag'
        $cfPath = Join-Path $sd 'ghrdp_cancel.flag'
        $adPath = Join-Path $sd 'ghrdp_alldone.flag'
        $cfgPath = Join-Path $sd 'ghrdp_cfg.json'

        $mirrorOn = ($env:MIRROR -eq 'true')

        $dashToken = $env:DASH_TOKEN
        if (-not $dashToken) {
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $b = [byte[]]::new(24)
          $rng.GetBytes($b)
          $dashToken = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
        }

        $serveUrl = $env:SERVE_URL

        if ($mirrorOn) {
          $rng2 = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha2 = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $b2 = [byte[]]::new(20)
          $rng2.GetBytes($b2)
          $decPw = -join ($b2 | ForEach-Object { $alpha2[[int]$_ % $alpha2.Length] })

          $dlDir = "C:\Users\$user\Downloads"
          $tempDir = "C:\Users\$user\AppData\Local\Temp"

          $roots = @(
            @{ path = $dlDir; rec = $false; min = 0; tag = 'Downloads' },
            @{ path = $tempDir; rec = $true; min = 102400; tag = 'Temp' }
          )

          if (Test-Path 'D:\RDP-Storage') {
            $roots += @{ path = 'D:\RDP-Storage'; rec = $true; min = 0; tag = 'D-Storage' }
            Write-Host "D-Storage added to mirror."
          }

          $cfg = @{
            rdpIp = $ip
            rdpUser = $user
            rdpPass = $pass
            ghrdp = $ghrdp
            mirror = $true
            rentryUrl = ''
            telegraphToken = ''
            telegraphPath = ''
            decPw = $decPw
            dashToken = $dashToken
            funnelUrl = $serveUrl
            user = $user
            dlDir = $dlDir
            tempDir = $tempDir
            roots = $roots
            idxFile = $indexPath
            doneFile = (Join-Path $sd 'ghrdp_uploaded.txt')
            logFile = (Join-Path $sd 'ghrdp_mirror.log')
            flushFlag = (Join-Path $sd 'ghrdp_flush.flag')
            cfgPath = $cfgPath
            libPath = (Join-Path $sd 'ghrdp-lib.ps1')
            heartbeatPath = $hbPath
            emergencyFlag = $emPath
            cancelFlag = $cfPath
            allDoneFlag = $adPath
            progressPath = $progressPath
            tmpDir = (Join-Path $sd 'ghrdp_tmp')
          }

          [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
        } else {
          $cfg = @{
            rdpIp = $ip
            rdpUser = $user
            rdpPass = $pass
            ghrdp = $ghrdp
            mirror = $false
            rentryUrl = ''
            telegraphToken = ''
            telegraphPath = ''
            dashToken = $dashToken
            funnelUrl = $serveUrl
          }
          [System.IO.File]::WriteAllText($cfgPath, ($cfg | ConvertTo-Json -Depth 8), (New-Object System.Text.UTF8Encoding $false))
        }

        New-Item -ItemType Directory -Path 'C:\ProgramData\ghrdp' -Force -ErrorAction SilentlyContinue | Out-Null
        Set-Content 'C:\ProgramData\ghrdp\cfgpath.txt' $cfgPath -Encoding ASCII -ErrorAction SilentlyContinue

        Write-Host "Config written. mirror=$mirrorOn."
        & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath

    - name: Write safe desktop debug script (read-only)
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/Debug-GHRDP.ps1" <<'DEBUGEOF'
        param([switch]$NoPause,[switch]$ShowSecrets)
        $ErrorActionPreference = 'Continue'
        $Report = New-Object System.Collections.ArrayList
        $script:CurrentPID = $PID

        function Say($t = '') { Write-Host $t; [void]$Report.Add([string]$t) }
        function SayKV($k, $v) { Say (('{0,-34}: {1}' -f $k, [string]$v)) }
        function SayHeader($t) { Say ''; Say ('==================== ' + $t + ' ====================') }
        function Mask($s) { if ([string]::IsNullOrEmpty($s)) { return '' }; if ($ShowSecrets) { return $s }; if ($s.Length -le 6) { return '****' }; return $s.Substring(0, 2) + '****' + $s.Substring($s.Length - 2) }

        function SafeJson($path) {
          if (-not (Test-Path $path)) { return $null }
          try {
            $fs = [System.IO.File]::Open($path, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::ReadWrite)
            $ms = New-Object System.IO.MemoryStream
            $fs.CopyTo($ms)
            $fs.Close()
            $bytes = $ms.ToArray()
            $ms.Close()
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { $bytes = $bytes[3..($bytes.Length - 1)] }
            $txt = [System.Text.Encoding]::UTF8.GetString($bytes).TrimStart([char]0xFEFF)
            return ($txt | ConvertFrom-Json -ErrorAction Stop)
          } catch { return $null }
        }

        function Owner($proc) {
          try {
            $o = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
            if ($o.User) { return $o.Domain + '\' + $o.User }
          } catch {}
          return 'unknown'
        }

        function ExtractCfg($text) {
          if ([string]::IsNullOrEmpty($text)) { return $null }
          if ($text -match "-CfgPath\s+'([^']+)'") { return $Matches[1] }
          if ($text -match '-CfgPath\s+"([^"]+)"') { return $Matches[1] }
          if ($text -match '-CfgPath\s+([A-Za-z]:\\\S+\.json)') { return $Matches[1] }
          return $null
        }

        $desktop = [Environment]::GetFolderPath('Desktop')
        if ([string]::IsNullOrEmpty($desktop) -or -not (Test-Path $desktop)) { $desktop = $env:USERPROFILE }
        $reportPath = Join-Path $desktop ('Debug-GHRDP_' + (Get-Date -Format 'yyyy-MM-dd_HH-mm-ss') + '.txt')

        SayHeader 'GHRDP SAFE DEBUG (READ-ONLY)'
        SayKV 'Report' $reportPath
        SayKV 'Time' (Get-Date -Format o)
        SayKV 'Computer' $env:COMPUTERNAME
        SayKV 'Current user' (whoami)

        try {
          $pr = New-Object System.Security.Principal.WindowsPrincipal([System.Security.Principal.WindowsIdentity]::GetCurrent())
          SayKV 'Is Administrator' $pr.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
        } catch { SayKV 'Is Administrator' 'unknown' }

        SayHeader 'CONFIG DISCOVERY'
        $cfgPath = $null
        $cfgSource = 'none'

        if (Test-Path 'C:\ProgramData\ghrdp\cfgpath.txt') {
          $cfgPath = (Get-Content 'C:\ProgramData\ghrdp\cfgpath.txt' -Raw -ErrorAction SilentlyContinue).Trim()
          $cfgSource = 'cfgpath.txt'
        }

        if (-not $cfgPath -or -not (Test-Path $cfgPath)) {
          $tasks = @()
          foreach ($tn in 'ghrdpserver', 'ghrdpwatcher') {
            $t = Get-ScheduledTask -TaskName $tn -ErrorAction SilentlyContinue
            if ($t) { $tasks += $t }
          }

          foreach ($t in $tasks) {
            foreach ($a in $t.Actions) {
              $arg = [string]$a.Arguments
              $c = ExtractCfg $arg
              if ($c) { $cfgPath = $c; $cfgSource = 'task args'; break }

              $file = $null
              if ($arg -match '-File\s+"([^"]+)"') { $file = $Matches[1] }
              elseif ($arg -match "-File\s+'([^']+)'") { $file = $Matches[1] }
              elseif ($arg -match '-File\s+([A-Za-z]:\\\S+\.ps1)') { $file = $Matches[1] }

              if ($file -and (Test-Path $file)) {
                $content = Get-Content $file -Raw -ErrorAction SilentlyContinue
                $c = ExtractCfg $content
                if ($c) { $cfgPath = $c; $cfgSource = 'task script'; break }
              }
            }
            if ($cfgPath) { break }
          }
        }

        if (-not $cfgPath -or -not (Test-Path $cfgPath)) {
          $dirs = @()
          if ($env:RUNNER_TEMP) { $dirs += $env:RUNNER_TEMP }
          if ($env:LOCALAPPDATA) { $dirs += (Join-Path $env:LOCALAPPDATA 'Temp') }
          $dirs += 'D:\a\_temp'
          $dirs += 'C:\Users\runneradmin\AppData\Local\Temp'

          foreach ($d in ($dirs | Select-Object -Unique)) {
            if ($d -and (Test-Path $d)) {
              $c = Join-Path $d 'ghrdp_cfg.json'
              if (Test-Path $c) { $cfgPath = $c; $cfgSource = 'temp dir'; break }
            }
          }
        }

        SayKV 'Config path' $cfgPath
        SayKV 'Config source' $cfgSource

        $cfg = $null
        if ($cfgPath -and (Test-Path $cfgPath)) { $cfg = SafeJson $cfgPath }
        SayKV 'Config loaded' [bool]$cfg

        if ($cfg) {
          SayHeader 'CONFIG VALUES'
          SayKV 'rdpIp' $cfg.rdpIp
          SayKV 'rdpUser' $cfg.rdpUser
          SayKV 'rdpPass' (Mask $cfg.rdpPass)
          SayKV 'mirror' $cfg.mirror
          SayKV 'funnelUrl' $cfg.funnelUrl
          SayKV 'rentryUrl' $cfg.rentryUrl
          SayKV 'telegraphToken set' [bool]$cfg.telegraphToken
          SayKV 'decPw' (Mask $cfg.decPw)
          SayKV 'progressPath' $cfg.progressPath
          SayKV 'logFile' $cfg.logFile
        }

        SayHeader 'TAILSCALE'
        $tsExe = 'C:\Program Files\Tailscale\tailscale.exe'
        if (-not (Test-Path $tsExe)) {
          $cmd = Get-Command tailscale.exe -ErrorAction SilentlyContinue
          if ($cmd) { $tsExe = $cmd.Source }
        }
        SayKV 'Tailscale exe' $tsExe

        $tsStatus = $null
        if (Test-Path $tsExe) {
          $job = Start-Job -ScriptBlock { param($x) & $x status --json 2>$null } -ArgumentList $tsExe
          if (Wait-Job $job -Timeout 10) {
            $raw = Receive-Job $job -ErrorAction SilentlyContinue
            if ($raw) { $tsStatus = $raw | ConvertFrom-Json -ErrorAction SilentlyContinue }
          }
          Remove-Job $job -Force -ErrorAction SilentlyContinue
        }

        $tsIp = ''
        if (Test-Path $tsExe) {
          $job = Start-Job -ScriptBlock { param($x) (& $x ip -4) } -ArgumentList $tsExe
          if (Wait-Job $job -Timeout 8) { $tsIp = (Receive-Job $job -ErrorAction SilentlyContinue | Out-String).Trim() }
          Remove-Job $job -Force -ErrorAction SilentlyContinue
        }

        if ($tsStatus) {
          SayKV 'BackendState' $tsStatus.BackendState
          SayKV 'Tailscale IP' $tsIp
          SayKV 'DNSName' $tsStatus.Self.DNSName
          SayKV 'Online' $tsStatus.Self.Online
        } else {
          SayKV 'Tailscale status' 'unavailable'
        }

        SayHeader 'RDP / PORTS'
        $rdpKey = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
        $fDeny = (Get-ItemProperty -Path $rdpKey -Name fDenyTSConnections -ErrorAction SilentlyContinue).fDenyTSConnections
        SayKV 'fDenyTSConnections' $fDeny

        $rdpTcp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
        $rdpPort = (Get-ItemProperty -Path $rdpTcp -Name PortNumber -ErrorAction SilentlyContinue).PortNumber
        if (-not $rdpPort) { $rdpPort = 3389 }
        SayKV 'RDP port' $rdpPort

        $conns = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { @($rdpPort, 7331) -contains $_.LocalPort })
        foreach ($c in $conns) {
          $pname = ''
          try { $pname = (Get-Process -Id $c.OwningProcess -ErrorAction Stop).ProcessName } catch {}
          SayKV ('Listen ' + $c.LocalPort) ($c.LocalAddress + ' pid=' + $c.OwningProcess + ' name=' + $pname)
        }

        $fwRemote = @(Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -Direction Inbound -ErrorAction SilentlyContinue | Where-Object { $_.Enabled -eq 'True' })
        SayKV 'Remote Desktop inbound enabled' ($fwRemote.Count)

        $fwDash = @(Get-NetFirewallRule -DisplayName 'ghrdp-dash' -ErrorAction SilentlyContinue)
        SayKV 'ghrdp-dash firewall rules' ($fwDash.Count)

        SayHeader 'WATCHED FOLDERS'
        $rawTotalAll = 0
        $eligibleTotalAll = 0
        $missingRoots = 0
        $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb')
        $excludePattern = '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'

        if ($cfg -and $cfg.roots) {
          foreach ($r in $cfg.roots) {
            SayHeader ('ROOT: ' + $r.tag)
            SayKV 'Path' $r.path
            $exists = Test-Path $r.path
            SayKV 'Exists' $exists
            if (-not $exists) { $missingRoots++; continue }

            $min = 0
            if ($r.min) { $min = [long]$r.min }

            if ($r.rec) { $items = @(Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue) }
            else { $items = @(Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue) }

            $rawTotalAll += $items.Count
            $sumBytes = ($items | Measure-Object Length -Sum).Sum
            if (-not $sumBytes) { $sumBytes = 0 }

            $eligible = @($items | Where-Object {
              ($junk -notcontains $_.Extension.ToLower()) -and
              ([long]$_.Length -ge $min) -and
              ($_.FullName -notmatch $excludePattern)
            })
            $eligibleTotalAll += $eligible.Count

            SayKV 'Raw files' $items.Count
            SayKV 'Total MB' ([math]::Round([double]$sumBytes / 1MB, 1))
            SayKV 'Eligible files' $eligible.Count
            SayKV 'Sample raw' (($items | Select-Object -First 5 | ForEach-Object { $_.Name }) -join ', ')
          }
        } else {
          Say 'No roots in config.'
          $missingRoots = 1
        }

        SayHeader 'SCHEDULED TASKS'
        foreach ($tn in 'ghrdpserver', 'ghrdpwatcher') {
          $t = Get-ScheduledTask -TaskName $tn -ErrorAction SilentlyContinue
          if ($t) {
            $info = Get-ScheduledTaskInfo -TaskName $tn -ErrorAction SilentlyContinue
            SayKV 'Task' $tn
            SayKV 'State' $t.State
            SayKV 'Principal' $t.Principal.UserId
            if ($info) { SayKV 'LastRun' $info.LastRunTime; SayKV 'LastResult' $info.LastTaskResult }
          } else {
            SayKV $tn 'not found'
          }
        }

        SayHeader 'GHRDP PROCESSES'
        $psProcs = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -ErrorAction SilentlyContinue |
          Where-Object { $_.ProcessId -ne $script:CurrentPID -and $_.CommandLine -match 'ghrdp-watcher|rdp-redirect-server|ghrdp-server-run|ghrdp-launcher' })

        if ($psProcs.Count -eq 0) { Say 'No ghrdp PowerShell processes found.' }
        foreach ($p in $psProcs) {
          SayKV 'PID' $p.ProcessId
          SayKV 'Owner' (Owner $p)
          SayKV 'CommandLine' $p.CommandLine
          Say ''
        }

        $watcherProc = @($psProcs | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }) | Select-Object -First 1

        SayHeader 'DASHBOARD ENDPOINTS'
        $diag = $null
        try { $diag = Invoke-RestMethod -Uri 'http://127.0.0.1:7331/diag' -TimeoutSec 5 -ErrorAction Stop } catch { SayKV 'Diag error' $_.Exception.Message }

        if ($diag) {
          SayKV 'portListening' $diag.portListening
          SayKV 'requestTrusted' $diag.requestTrusted
          SayKV 'firewallRulePresent' $diag.firewallRulePresent
          SayKV 'cfgLoaded' $diag.cfgLoaded
          SayKV 'cfgError' $diag.cfgError
          SayKV 'progressLoaded' $diag.progressLoaded
          SayKV 'progressError' $diag.progressError
          SayKV 'tailscaleIp' $diag.tailscaleIp
        }

        $progApi = $null
        try { $progApi = Invoke-RestMethod -Uri 'http://127.0.0.1:7331/progress' -TimeoutSec 8 -ErrorAction Stop } catch { SayKV 'Progress error' $_.Exception.Message }

        if ($progApi) {
          SayKV 'serverTs' $progApi.serverTs
          SayKV 'cfgLoaded' $progApi.cfgLoaded
          SayKV 'mirror' $progApi.mirror

          if ($progApi.creds) {
            SayKV 'creds.ip' $progApi.creds.ip
            SayKV 'creds.user' $progApi.creds.user
            SayKV 'creds.pass set' [bool]$progApi.creds.pass
          }

          if ($progApi.agg) {
            SayKV 'agg.tracked' $progApi.agg.tracked
            SayKV 'agg.done' $progApi.agg.done
            SayKV 'agg.active' $progApi.agg.active
            SayKV 'agg.failed' $progApi.agg.failed
            SayKV 'agg.overallPct' $progApi.agg.overallPct
          }

          if ($progApi.log) {
            $scanApi = @($progApi.log | Where-Object { $_ -match '^\[scan\]' } | Select-Object -Last 1)
            if ($scanApi.Count) { SayKV 'Last API scan' $scanApi[0] }
            Say 'Last API log lines:'
            $progApi.log | Select-Object -Last 8 | ForEach-Object { Say ('  ' + $_) }
          }
        }

        SayHeader 'PROGRESS FILE'
        $progressPath = $null
        if ($cfg -and $cfg.progressPath) { $progressPath = $cfg.progressPath }
        elseif ($cfgPath) { $progressPath = Join-Path (Split-Path $cfgPath -Parent) 'ghrdp_progress.json' }

        SayKV 'Progress path' $progressPath
        $prog = SafeJson $progressPath
        $heartbeatAge = $null

        if ($prog) {
          SayKV 'ts' $prog.ts
          try {
            $heartbeatAge = [int]((Get-Date) - (Get-Date $prog.ts)).TotalSeconds
            SayKV 'Age seconds' $heartbeatAge
          } catch { SayKV 'Age seconds' 'invalid ts' }

          SayKV 'alive' $prog.alive

          if ($prog.agg) {
            SayKV 'agg.tracked' $prog.agg.tracked
            SayKV 'agg.done' $prog.agg.done
            SayKV 'agg.failed' $prog.agg.failed
            SayKV 'agg.overallPct' $prog.agg.overallPct
          }

          if ($prog.log) {
            $scanFile = @($prog.log | Where-Object { $_ -match '^\[scan\]' } | Select-Object -Last 1)
            if ($scanFile.Count) { SayKV 'Last file scan' $scanFile[0] }
          }
        } else {
          Say 'Progress file not readable.'
        }

        SayHeader 'MIRROR LOG TAIL'
        if ($cfg -and $cfg.logFile -and (Test-Path $cfg.logFile)) {
          Get-Content $cfg.logFile -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Say ('  ' + $_) }
        } else {
          Say 'Mirror log not found.'
        }

        SayHeader 'VERDICTS'
        function Add-Verdict($name, $pass, $detail) {
          $mark = 'FAIL'
          if ($pass) { $mark = 'PASS' }
          Say ('[' + $mark + '] ' + $name + ' : ' + $detail)
        }

        $currentUser = (whoami).Trim()
        $listen7331 = [bool](Get-NetTCPConnection -LocalPort 7331 -State Listen -ErrorAction SilentlyContinue)
        $watcherRunning = [bool]$watcherProc
        $watcherOwner = ''
        if ($watcherProc) { $watcherOwner = Owner $watcherProc }
        $watcherIdentityOk = $watcherRunning -and ($watcherOwner.ToLower() -eq $currentUser.ToLower())
        $heartbeatFresh = [bool]($heartbeatAge -ne $null -and $heartbeatAge -lt 30)

        $tracked = 0; $done = 0; $failed = 0; $active = 0; $overallPct = 0
        if ($prog -and $prog.agg) {
          $tracked = [int]$prog.agg.tracked
          $done = [int]$prog.agg.done
          $failed = [int]$prog.agg.failed
          $active = [int]$prog.agg.active
          $overallPct = $prog.agg.overallPct
        }

        Add-Verdict 'RDP enabled' ($fDeny -eq 0) ('fDenyTSConnections=' + $fDeny)
        Add-Verdict 'Tailscale running' ([bool]($tsStatus -and $tsStatus.BackendState -eq 'Running')) ('BackendState=' + $tsStatus.BackendState)
        Add-Verdict 'Config found' ([bool]$cfg) ([string]$cfgPath)
        Add-Verdict 'Dashboard port 7331 listening' $listen7331 'port 7331'
        Add-Verdict 'Watcher process running' $watcherRunning ('owner=' + $watcherOwner)
        Add-Verdict 'Watcher identity equals current RDP user' $watcherIdentityOk ('owner=' + $watcherOwner + ' current=' + $currentUser)
        Add-Verdict 'Watcher heartbeat fresh' $heartbeatFresh ('age=' + $heartbeatAge + 's')
        Add-Verdict 'All watched paths exist' ($missingRoots -eq 0) ('missing=' + $missingRoots)

        if ($cfg -and -not $cfg.mirror) {
          Say '[INFO] Uploads tracked : mirror is OFF'
        } else {
          Add-Verdict 'Uploads tracked' ($tracked -gt 0) ('tracked=' + $tracked + ' done=' + $done + ' failed=' + $failed + ' active=' + $active + ' overall=' + $overallPct + '%')
        }

        SayHeader 'RECOMMENDATIONS'
        if ($fDeny -ne 0) { Say '- RDP disabled. Re-run workflow or check Enable RDP step.' }
        if (-not ($tsStatus -and $tsStatus.BackendState -eq 'Running')) { Say '- Tailscale not running. Add TS_AUTHKEY secret or click sign-in link.' }
        if (-not $cfg) { Say '- Config not found. Ensure Prepare config step completed and C:\ProgramData\ghrdp\cfgpath.txt exists.' }
        if (-not $listen7331) { Say '- Dashboard not listening. Check ghrdpserver SYSTEM task.' }
        if (-not $watcherRunning) { Say '- Watcher not running. Log off/on inside RDP once or run Mission Control shortcut.' }
        if ($watcherOwner -match 'SYSTEM') { Say '- Watcher is SYSTEM. Use Startup shortcut / launcher fallback as RDP user.' }
        if ($missingRoots -gt 0) { Say '- Watched folders missing. Log on once and download files inside RDP.' }
        if ($cfg -and $cfg.mirror -and $rawTotalAll -gt 0 -and $tracked -eq 0) { Say '- Files visible but not tracked. Check watcher log/min/junk.' }

        Say ''
        Say 'Read-only debug complete. No files were modified except this report.'

        try {
          [System.IO.File]::WriteAllText($reportPath, ($Report -join "`r`n"), (New-Object System.Text.UTF8Encoding $false))
          SayHeader 'REPORT SAVED'
          Say $reportPath
        } catch {
          Say ('Could not save report: ' + $_.Exception.Message)
        }

        if (-not $NoPause) { Read-Host 'Press Enter to close' }
        DEBUGEOF

        cat > "$RUNNER_TEMP/DEBUG-GHRDP.bat" <<'BATEOF'
        @echo off
        title GHRDP Safe Debug (read-only)
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Debug-GHRDP.ps1"
        BATEOF

    - name: Place safe debug script on desktops
      shell: pwsh
      run: |
        $ps1 = Join-Path $env:RUNNER_TEMP 'Debug-GHRDP.ps1'
        $bat = Join-Path $env:RUNNER_TEMP 'DEBUG-GHRDP.bat'

        $desks = @('C:\Users\Public\Desktop')
        if ($env:RDP_USER) { $desks += "C:\Users\$($env:RDP_USER)\Desktop" }

        foreach ($desk in ($desks | Select-Object -Unique)) {
          if (-not $desk) { continue }
          try {
            New-Item -ItemType Directory -Path $desk -Force -ErrorAction Stop | Out-Null
            Copy-Item $ps1 (Join-Path $desk 'Debug-GHRDP.ps1') -Force -ErrorAction Stop
            Copy-Item $bat (Join-Path $desk 'DEBUG-GHRDP.bat') -Force -ErrorAction Stop
            Write-Host "Debug files placed in $desk"
          } catch {
            Write-Host "Could not place debug files in ${desk}: $_"
          }
        }

        Write-Host "Inside RDP, double-click DEBUG-GHRDP.bat on the desktop."

    - name: Keep Alive (5h30) - server as SYSTEM task, watcher as RDP logon/startup
      shell: pwsh
      run: |
        & schtasks /End /TN ghrdpserver 2>$null | Out-Null
        & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null
        & schtasks /End /TN ghrdpwatcher 2>$null | Out-Null
        & schtasks /Delete /TN ghrdpwatcher /F 2>$null | Out-Null
        $LASTEXITCODE = 0

        $sd = $env:RUNNER_TEMP
        & (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json')

        $cfgPath = Join-Path $sd 'ghrdp_cfg.json'
        $serverScript = Join-Path $sd 'rdp-redirect-server.ps1'
        $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'
        $progressPath = Join-Path $sd 'ghrdp_progress.json'
        $emFlag = Join-Path $sd 'ghrdp_emergency.flag'
        $flushFlag = Join-Path $sd 'ghrdp_flush.flag'
        $okFile = Join-Path $sd 'ghrdp_server_ok.txt'

        $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json
        Remove-Item $okFile -Force -ErrorAction SilentlyContinue

        $srvRun = Join-Path $sd 'ghrdp-server-run.ps1'
        $srvTpl = "`$ErrorActionPreference='Continue'`r`n. '<<SS>>'`r`nStart-GhrdpServer -Port 7331 -BindAddress '0.0.0.0' -UiDir '<<SD>>' -ProgressPath '<<PR>>' -CfgPath '<<CF>>' -EmergencyFlagPath '<<EM>>' -FlushFlagPath '<<FL>>' -OkFile '<<OK>>' -LimitMinutes 330`r`n"
        $srvTpl = $srvTpl.Replace('<<SS>>', $serverScript).Replace('<<SD>>', $sd).Replace('<<PR>>', $progressPath).Replace('<<CF>>', $cfgPath).Replace('<<EM>>', $emFlag).Replace('<<FL>>', $flushFlag).Replace('<<OK>>', $okFile)
        [System.IO.File]::WriteAllText($srvRun, $srvTpl, (New-Object System.Text.UTF8Encoding $false))

        foreach ($f in @(
          $cfgPath,
          $serverScript,
          $watcherScript,
          $progressPath,
          $emFlag,
          $flushFlag,
          $okFile,
          (Join-Path $sd 'ghrdp-lib.ps1'),
          (Join-Path $sd 'ghrdp-ui.html'),
          (Join-Path $sd 'ghrdp-install.ps1'),
          (Join-Path $sd 'ghrdp-server-run.ps1'),
          (Join-Path $sd 'ghrdp-launcher.ps1')
        )) {
          if (Test-Path $f) {
            & icacls.exe $f /grant "*S-1-5-18:(R)" 2>$null | Out-Null
          }
        }

        & icacls.exe $sd /grant "*S-1-5-18:(OI)(CI)R" 2>$null | Out-Null
        $LASTEXITCODE = 0
        Write-Host "[perms] SYSTEM read granted on temp files + dir"

        if ($env:RDP_USER) {
          & icacls.exe $sd /grant "$($env:RDP_USER):(OI)(CI)M" 2>$null | Out-Null
          $LASTEXITCODE = 0
          Write-Host "[perms] RDP user modify granted on temp dir"
        }

        if ($cfg.roots) {
          foreach ($r in $cfg.roots) {
            if ($r.path -and (Test-Path $r.path)) {
              & icacls.exe $r.path /grant "*S-1-5-18:(OI)(CI)R" 2>$null | Out-Null
            }
          }
          $LASTEXITCODE = 0
          Write-Host "[perms] SYSTEM read granted on watcher roots"
        }

        $ps = "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
        $srvTr = "`"$ps`" -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$srvRun`""

        & schtasks /Create /TN ghrdpserver /TR $srvTr /SC ONCE /ST 23:59 /RU SYSTEM /RL HIGHEST /F 2>$null | Out-Null
        $LASTEXITCODE = 0
        & schtasks /Run /TN ghrdpserver 2>$null | Out-Null
        $LASTEXITCODE = 0

        Write-Host "[server] SYSTEM task ghrdpserver created+run"
        Write-Host "[watcher] no scheduled task. It starts at RDP logon or via Mission Control fallback."

        $up = $false
        for ($i = 0; $i -lt 40; $i++) {
          if ((Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')) {
            $up = $true
            Write-Host "[server] $((Get-Content $okFile -Raw).Trim())"
            break
          }
          Start-Sleep -Milliseconds 500
        }

        $self = $false
        try {
          Invoke-WebRequest -Uri 'http://127.0.0.1:7331/' -UseBasicParsing -TimeoutSec 3 | Out-Null
          $self = $true
        } catch {}

        Write-Host "[selftest] server up=$up loopback7331=$self"
        Write-Host "Keep Alive 5h30"

        $limit = New-TimeSpan -Hours 5 -Minutes 30
        $start = Get-Date
        while (((Get-Date) - $start) -lt $limit) {
          Start-Sleep -Seconds 60
        }

        Write-Host "5h30 done."

    - name: Emergency upload on cancel (always)
      if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
      env:
        STATUS: ${{ job.status }}
      shell: pwsh
      run: |
        $sd = $env:RUNNER_TEMP
        $cfgPath = Join-Path $sd 'ghrdp_cfg.json'
        $lib = Join-Path $sd 'ghrdp-lib.ps1'

        if (-not ((Test-Path $cfgPath) -and (Test-Path $lib))) {
          Write-Host "no mirror cfg/lib - skip"
          exit 0
        }

        $emf = Join-Path $sd 'ghrdp_emergency.flag'
        $progressPath = Join-Path $sd 'ghrdp_progress.json'
        Set-Content $emf (Get-Date -f o) -Encoding ascii

        Write-Host "EMERGENCY (status=$env:STATUS) - signalled watcher; monitoring..."

        $deadline = (Get-Date).AddMinutes(12)
        $watcherSeen = $false

        while ((Get-Date) -lt $deadline) {
          $prog = $null
          if (Test-Path $progressPath) {
            try { $prog = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction Stop } catch {}
          }

          if ($prog -and $prog.ts) {
            $age = [int]((Get-Date) - (Get-Date $prog.ts)).TotalSeconds
            if ($age -lt 15) { $watcherSeen = $true } else { Write-Host "watcher stale (${age}s) - fallback."; break }
          }

          if ($prog -and $prog.agg) {
            $u = [int]$prog.agg.active
            $f = [int]$prog.agg.failed
            $d = [int]$prog.agg.done
            $pct = $prog.agg.overallPct
            Write-Host "...done=$d active=$u failed=$f overall=${pct}%"
          }

          if ($watcherSeen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]($prog.agg.tracked) -gt 0 -and [int]($prog.agg.done) -ge ([int]($prog.agg.tracked) - [int]($prog.agg.failed))) {
            Write-Host "Watcher finished all transfers."
            break
          }

          Start-Sleep -Seconds 5
        }

        $needFallback = -not $watcherSeen
        if (-not $needFallback -and (Test-Path $progressPath)) {
          try {
            $pp = Get-Content $progressPath -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($pp.agg -and [int]$pp.agg.active -gt 0) { $needFallback = $true }
          } catch {}
        }

        if ($needFallback) {
          Write-Host "DIRECT fallback upload..."

          $env:GHRDP_CFG = $cfgPath
          . $lib
          $cfg = Read-Cfg
          $env:GHRDP_LOG = $cfg.logFile
          Init-Progress $progressPath

          foreach ($p in @('qbittorrent', 'qbittorrent-nox')) {
            Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 4

          $junk = @('.tmp', '.crdownload', '.partial', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak')
          $done = @{}
          if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }
          $idx = Load-Index $cfg

          foreach ($r in $cfg.roots) {
            if (-not (Test-Path $r.path)) { continue }

            $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending } else { Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending }

            foreach ($fi in $items) {
              if ($done.ContainsKey($fi.FullName)) { continue }
              if ($junk -contains $fi.Extension.ToLower()) { continue }
              if ($fi.Length -lt $r.min) { continue }
              if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }

              $len = $fi.Length
              $safe = $fi.Name -replace '\|', '_'
              $disp = ($safe -replace '[^\x20-\x7E]', '_')

              $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $r.tag } | Select-Object -First 1
              if (-not $ex) {
                $ex = @{ name = $safe; src = $r.tag; status = 'uploading'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss') }
                [void]$idx.Add($ex)
                $global:GHRDP_TOTAL_BYTES += $len
              }

              $ex.status = 'uploading'
              $enc = Join-Path $cfg.tmpDir ('em_' + [guid]::NewGuid().ToString('N') + '.enc')
              $gf = $null

              Set-Active $disp 'encrypt' $len
              try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch {}

              Set-Active $disp 'upload' $len
              try { $gf = Upload-Gofile-Streamed $enc $disp } catch {}

              Remove-Item $enc -Force -ErrorAction SilentlyContinue

              if ($gf) {
                $ex.payload = B64U ($gf + '|' + $cfg.decPw + '|' + $safe)
                $ex.gofile = $gf
                $ex.status = 'ok'
                $ex.time = (Get-Date -f 'HH:mm:ss')
                $done[$fi.FullName] = $true
                $fi.FullName | Out-File $cfg.doneFile -Append
                $global:GHRDP_DONE_BYTES += $len
                Write-Host "DIRECT OK $($fi.Name) ($len bytes)"
              } else {
                $ex.status = 'limit'
                Write-Host "DIRECT LIMIT $($fi.Name)"
              }

              Set-Active '' 'idle' 0
            }
          }

          Save-Index $cfg $idx
          Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null
          Write-Host "DIRECT fallback upload complete."
        }

        Write-Host "Emergency handling complete."

    - name: Secure Cleanup (wipe all data)
      if: ${{ always() }}
      continue-on-error: true
      shell: pwsh
      run: |
        & schtasks /End /TN ghrdpserver 2>$null | Out-Null
        & schtasks /Delete /TN ghrdpserver /F 2>$null | Out-Null
        & schtasks /End /TN ghrdpwatcher 2>$null | Out-Null
        & schtasks /Delete /TN ghrdpwatcher /F 2>$null | Out-Null
        $LASTEXITCODE = 0

        $ml = Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'
        if (Test-Path $ml) {
          Write-Host "----- mirror log tail -----"
          Get-Content $ml -Tail 120 | ForEach-Object { Write-Host $_ }
        }

        foreach ($p in @('chrome', 'msedge', 'firefox', 'iexplore', 'brave', 'opera', 'qbittorrent')) {
          Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
        }
        Start-Sleep -Seconds 3

        foreach ($p in @(
          "$env:LOCALAPPDATA\Google\Chrome\User Data",
          "$env:LOCALAPPDATA\Microsoft\Edge\User Data",
          "$env:APPDATA\Mozilla\Firefox\Profiles",
          "$env:LOCALAPPDATA\Mozilla\Firefox\Profiles",
          "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data",
          "$env:APPDATA\Opera Software\Opera Stable"
        )) {
          if (Test-Path $p) {
            try { Remove-Item -Path $p -Recurse -Force -ErrorAction Stop } catch {
              Start-Sleep 2
              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
        }

        foreach ($p in @("$env:USERPROFILE\Downloads", "$env:USERPROFILE\Desktop", "$env:USERPROFILE\Documents")) {
          if (Test-Path $p) { Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue }
        }

        if ($env:RDP_USER) {
          foreach ($s in @('Downloads', 'AppData\Local\Temp')) {
            $d = "C:\Users\$($env:RDP_USER)\$s"
            if (Test-Path $d) { Remove-Item "$d\*" -Recurse -Force -ErrorAction SilentlyContinue }
          }
        }

        if (Test-Path 'D:\RDP-Storage') { Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -ErrorAction SilentlyContinue }

        Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
        Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
        Set-Clipboard -Value "" -ErrorAction SilentlyContinue
        Clear-RecycleBin -Force -ErrorAction SilentlyContinue

        wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }
        $LASTEXITCODE = 0

        & "C:\Program Files\Tailscale\tailscale.exe" funnel --bg 7331 off 2>$null | Out-Null
        $LASTEXITCODE = 0
        & "C:\Program Files\Tailscale\tailscale.exe" serve reset 2>$null | Out-Null
        $LASTEXITCODE = 0

        "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY

    - name: Overwrite free space (skip on cancel)
      if: ${{ always() && !cancelled() }}
      continue-on-error: true
      shell: pwsh
      run: |
        Write-Host "Overwriting free space (cipher /w)..."
        cipher /w:C:\
        $LASTEXITCODE = 0
        "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
