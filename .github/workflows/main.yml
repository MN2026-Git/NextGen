          <body>
          <div class="wrap">
            <header>
              <div class="brand"><h1>RDP · Mission Control</h1><span class="tag">live mirror telemetry</span></div>
              <div class="hstat">
                <span id="mode" class="mode">…</span>
                <span id="clock">--:--:--</span>
                <button class="diagbtn" id="diagBtn" type="button">🔍 DIAGNOSE</button>
                <span id="alive" class="pill"><span class="d"></span><span id="alivetxt">checking</span></span>
              </div>
            </header>

            <div class="autobox" id="autoBox" style="display:none">
              <div class="big"><span class="spin" id="autoSpin"></span><span id="autoTitle">Connecting you to RDP…</span></div>
              <div class="sub" id="autoSub">Firing your local RDP connector (zero typing). If your browser shows an “Open app?” prompt, tick <b>Always allow</b> + Open — after that it is fully automatic.</div>
              <a class="manual" id="autoManual" href="#">⚡ Open RDP now (if it didn’t auto-open)</a>
            </div>

            <div class="instpanel open" id="instPanel" style="display:none">
              <div class="ip-head" id="instHead">
                <span class="dot"></span>
                <h3 id="instTitle">First time on this PC? Install the RDP connector (one-time)</h3>
                <span class="chev">▶</span>
              </div>
              <div class="ip-body">
                <div class="steps">
                  This page tried to launch RDP automatically. If it didn’t open, your PC needs the tiny <b>connector</b> once — after that every click auto-connects with zero typing.<br>
                  <b>1.</b> Click <b>Download connector</b> (or copy the command).<br>
                  <b>2.</b> Right-click <code>ghrdp-install.ps1</code> → <b>Run with PowerShell</b>. (Blocked? <code>Properties → Unblock</code>, or run the copied command in PowerShell.)<br>
                  <b>3.</b> Click the RDP link in the GitHub Summary again → RDP opens automatically. Tick <b>Always allow</b> once.
                </div>
                <div class="dlrow">
                  <button class="dlbtn primary" id="dlBtn" type="button">⬇ Download connector</button>
                  <button class="dlbtn ghost" id="cpCmdBtn" type="button">⧉ Copy install command</button>
                </div>
                <pre id="cmdBox" style="display:none"></pre>
                <div class="scan" id="instScan"><span class="wait">●</span> checking connector…</div>
              </div>
            </div>

            <div class="grid">
              <div class="stack">
                <div class="panel hero">
                  <div class="lbl">Overall uploaded</div>
                  <div class="pct"><span id="pct">0</span><small>%</small></div>
                  <div class="track"><div class="fill" id="fill"></div></div>
                  <div class="meta">
                    <span><b id="bDone">0 B</b> / <span id="bTotal">0 B</span></span>
                    <span>throughput <b id="speed">0 B/s</b></span>
                    <span>eta <b id="eta">—</b></span>
                  </div>
                </div>
                <div class="panel active">
                  <div class="lbl">Active transfer</div>
                  <div class="row1"><span class="fname" id="aName">idle</span><span class="phase idle" id="aPhase">idle</span></div>
                  <div class="mini"><i id="aBar"></i></div>
                  <div class="meta" style="margin-top:9px"><span><b id="aBytes">0 B</b> / <span id="aTotal">0 B</span></span><span><b id="aSpeed">0 B/s</b></span></div>
                </div>
              </div>
              <div class="stack">
                <div class="panel creds">
                  <div class="lbl" style="margin-bottom:12px">RDP credentials <span style="color:var(--mut);text-transform:none;letter-spacing:0">(auto-filled by handler)</span></div>
                  <div class="crow" data-k="ip"><span class="ck">IP</span><code id="vIp">-</code><button class="cp" type="button">copy</button></div>
                  <div class="crow" data-k="user"><span class="ck">USER</span><code id="vUser">-</code><button class="cp" type="button">copy</button></div>
                  <div class="crow" data-k="pass"><span class="ck">PASS</span><code id="vPass">-</code><button class="cp" type="button">copy</button></div>
                  <div id="diagBox"><pre id="diagOut">running diagnostics…</pre></div>
                </div>
                <div class="panel"><div class="lbl" style="margin-bottom:12px">Counters</div>
                  <div class="stats">
                    <div class="tile done"><div class="n" id="cDone">0</div><div class="k">done</div></div>
                    <div class="tile act"><div class="n" id="cAct">0</div><div class="k">active</div></div>
                    <div class="tile fail"><div class="n" id="cFail">0</div><div class="k">failed</div></div>
                    <div class="tile trk"><div class="n" id="cTrk">0</div><div class="k">tracked</div></div>
                  </div>
                </div>
                <div class="panel actions">
                  <a class="btn rdp" id="rdp" href="#">Open Remote Desktop</a>
                  <div id="mirrorBox">
                    <button class="btn em" id="emBtn">⚡ Upload everything now</button>
                    <div class="banner" id="banner"></div>
                    <p style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:10px;line-height:1.5">Click it, wait for the green banner, <b style="color:var(--ink)">then</b> press Cancel workflow. A 2nd Cancel force‑kills.</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="lower">
              <div class="panel files">
                <div class="lbl" style="margin-bottom:10px">File queue</div>
                <div class="head"><span>status</span><span>file</span><span>progress</span><span>src</span></div>
                <div class="flist" id="flist"><div class="empty">No files tracked yet.</div></div>
              </div>
              <div class="panel">
                <div class="lbl" style="margin-bottom:10px">Live log</div>
                <pre id="log">waiting for watcher…</pre>
                <div class="code" id="rentry" style="display:none"></div>
              </div>
            </div>
          </div>
          <script>
          (function(){
            var QS = location.search || '';
            var D={pct:0,bDone:0};
            var ghrdpUrl=null; var autoFired=false;
            function fb(b){ b=+b||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; if(b<1073741824)return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
            function fs(b){ b=+b||0; return fb(b)+'/s'; }
            function fe(remB,sp){ sp=+sp||0; if(sp<=0||remB<=0)return '—'; var s=remB/sp; if(s<60)return Math.round(s)+'s'; if(s<3600)return Math.round(s/60)+'m'; return (s/3600).toFixed(1)+'h'; }
            function lerp(a,b){ return a+(b-a)*0.18; }
            function tick(){ D.pct=lerp(D.pct,+ (window.__PCT||0)); D.bDone=lerp(D.bDone,+ (window.__BDONE||0)); document.getElementById('pct').textContent=Math.round(D.pct); document.getElementById('bDone').textContent=fb(D.bDone); document.getElementById('fill').style.width=Math.min(100,D.pct)+'%'; requestAnimationFrame(tick); }
            requestAnimationFrame(tick);
            function clk(){ var d=new Date(); document.getElementById('clock').textContent=d.toTimeString().slice(0,8); }
            setInterval(clk,1000); clk();
            var logEl=document.getElementById('log');
            function fallbackCopy(t){ var ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(ta); }
            function copyBtn(btn,val){ function ok(){ btn.textContent='copied'; btn.classList.add('done'); setTimeout(function(){btn.textContent='copy';btn.classList.remove('done');},1200); } if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(val).then(ok).catch(function(){ fallbackCopy(val); ok(); }); } else { fallbackCopy(val); ok(); } }
            function setCreds(c){ if(!c)return; var map={ip:c.ip,user:c.user,pass:c.pass}; ['ip','user','pass'].forEach(function(k){ var row=document.querySelector('.crow[data-k="'+k+'"]'); if(!row)return; row.dataset.val=map[k]||''; var code=row.querySelector('code'); if(code)code.textContent=map[k]||'-'; }); }
            document.querySelectorAll('.crow .cp').forEach(function(b){ b.addEventListener('click',function(){ var row=b.closest('.crow'); copyBtn(b, row?row.dataset.val:''); }); });
            function setMode(loop){ var m=document.getElementById('mode'); if(loop){ m.className='mode loop'; m.textContent='◉ RDP / loopback'; } else { m.className='mode funnel'; m.textContent='⬈ LOCAL PC (auto-connect)'; } }
            function fireAutoConnect(url){
              if(!url || autoFired) return;
              autoFired=true;
              var box=document.getElementById('autoBox'); box.style.display='block';
              document.getElementById('autoManual').href=url;
              try { var ifr=document.createElement('iframe'); ifr.style.display='none'; ifr.src=url; document.body.appendChild(ifr); } catch(e){}
              setTimeout(function(){ try{ window.location.href=url; }catch(e){} }, 300);
              setTimeout(function(){
                var scan=document.getElementById('instScan');
                if(scan){ scan.innerHTML='<span class="wait">●</span> if RDP did not open, install the connector below (one-time).'; }
              }, 3500);
            }
            // ---- first-time connector installer panel ----
            var instPanel=document.getElementById('instPanel');
            var instHead=document.getElementById('instHead');
            if(instHead){ instHead.addEventListener('click',function(){ instPanel.classList.toggle('open'); }); }
            var dlBtn=document.getElementById('dlBtn');
            if(dlBtn){ dlBtn.addEventListener('click',function(){ var a=document.createElement('a'); a.href='/install.ps1'+QS; a.download='ghrdp-install.ps1'; document.body.appendChild(a); a.click(); a.remove(); }); }
            function buildCmd(){ var o=location.origin; var q=QS; return 'powershell -ExecutionPolicy Bypass -Command "iwr ' + "'" + o + '/install.ps1' + q + "' -OutFile $env:TEMP\\g.ps1; & $env:TEMP\\g.ps1" + '"'; }
            var cpCmdBtn=document.getElementById('cpCmdBtn'); var cmdBox=document.getElementById('cmdBox');
            if(cpCmdBtn){ cpCmdBtn.addEventListener('click',function(){ var c=buildCmd(); cmdBox.style.display='block'; cmdBox.textContent=c; copyBtn(cpCmdBtn, c); }); }
            function yn(v){ return v? '<span class="ok">PASS</span>' : '<span class="bad">FAIL</span>'; }
            document.getElementById('diagBtn').addEventListener('click',function(){
              var box=document.getElementById('diagBox'); var out=document.getElementById('diagOut');
              box.style.display='block'; out.innerHTML='running diagnostics…';
              fetch('/diag'+QS,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
                var L=[];
                L.push('== SERVER SELF TEST (/diag) ==');
                L.push('bind 0.0.0.0            : '+yn(d.bindOk));
                L.push('port 7331 listening     : '+yn(d.portListening));
                L.push('firewall rule present   : '+yn(d.firewallRulePresent));
                L.push('tailscale ip            : '+(d.tailscaleIp||'(none)'));
                L.push('self-connect via TS ip  : '+yn(d.selfConnectFromVmViaTailscaleIp)+(d.selfConnectError?('  '+d.selfConnectError):''));
                L.push('funnel url (optional)   : '+(d.funnelUrl||'(not enabled - not required)'));
                L.push('this request via loopbk : '+yn(d.requestCameViaLoopback)+'   host='+d.requestHost);
                L.push('');
                L.push('== HOW ZERO-TYPING RDP WORKS ==');
                L.push('From your LOCAL pc this page auto-fires ghrdp:// -> your connector');
                L.push('runs cmdkey (saves password) + mstsc -> RDP opens with NO typing.');
                L.push('First time: install the connector from the panel above (one-time).');
                L.push('');
                L.push('raw: '+JSON.stringify(d,null,1));
                out.innerHTML=L.join('\n');
              }).catch(function(e){ out.innerHTML='<span class="bad">/diag failed: '+e+'</span>'; });
            });
            function render(s){
              if(!s){ return; }
              var now=Date.now(); var ts=s.ts? new Date(s.ts).getTime():0; var age=(now-ts)/1000;
              var on, txt;
              if(!s.mirror){ on=true; txt='rdp ready'; }
              else { on = s.alive && age<15; txt = on? 'online' : (s.alive? 'stale '+Math.round(age)+'s':'offline'); }
              var al=document.getElementById('alive'); al.className='pill'+(on?' on':''); document.getElementById('alivetxt').textContent=txt;
              if(s.ghrdp){ ghrdpUrl=s.ghrdp; document.getElementById('rdp').href=s.ghrdp; document.getElementById('autoManual').href=s.ghrdp; }
              if(s.rentry){ var r=document.getElementById('rentry'); r.style.display='block'; r.textContent='index: '+s.rentry; }
              document.getElementById('mirrorBox').style.display = s.mirror? 'block':'none';
              setCreds(s.creds); setMode(!!s.viaLoopback);
              instPanel.style.display = s.viaLoopback ? 'none' : '';
              if(s.ghrdp && !s.viaLoopback){ fireAutoConnect(s.ghrdp); }
              var a=s.agg||{}; window.__PCT=a.overallPct||0; window.__BDONE=a.bytesDone||0;
              document.getElementById('bTotal').textContent=fb(a.bytesTotal); document.getElementById('speed').textContent=fs(a.speedBps);
              document.getElementById('eta').textContent=fe((a.bytesTotal||0)-(a.bytesDone||0),a.speedBps);
              document.getElementById('cDone').textContent=a.done||0; document.getElementById('cAct').textContent=a.active||0; document.getElementById('cFail').textContent=a.failed||0; document.getElementById('cTrk').textContent=a.tracked||0;
              var ac=s.active||{}; document.getElementById('aName').textContent=ac.name||'idle';
              var ph=document.getElementById('aPhase'); ph.textContent=ac.phase||'idle'; ph.className='phase '+(ac.phase||'idle');
              document.getElementById('aBar').style.width=(ac.pct||0)+'%'; document.getElementById('aBytes').textContent=fb(ac.bytesDone); document.getElementById('aTotal').textContent=fb(ac.bytesTotal); document.getElementById('aSpeed').textContent=fs(ac.speedBps);
              var f=s.files||[]; var fl=document.getElementById('flist');
              if(!f.length){ fl.innerHTML='<div class="empty">No files tracked yet.</div>'; }
              else { var h=''; for(var i=0;i<f.length;i++){ var it=f[i]; var st=(it.status||'uploading'); var bc = st==='ok'?'ok':(st==='limit'?'limit':'up'); h+='<div class="frow"><span class="st '+st+'">'+(st==='ok'?'OK':(st==='limit'?'FAIL':'…'))+'</span><span class="nm" title="'+(it.name||'')+'">'+(it.name||'')+'</span><span class="bar '+bc+'"><i></i></span><span class="src">'+(it.src||'')+'</span></div>'; } fl.innerHTML=h; }
              var lg=(s.log||[]); if(lg.length){ var atBottom = logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<60; logEl.textContent=lg.join('\n'); if(atBottom) logEl.scrollTop=logEl.scrollHeight; }
              var bn=document.getElementById('banner'); bn.className='banner';
              if(s.mirror){ if((a.failed||0)>0 && (a.active||0)===0){ bn.className='banner warn'; bn.textContent=(a.failed)+' file(s) failed — retry or check log.'; } else if((a.tracked||0)>0 && (a.active||0)===0 && (a.failed||0)===0 && (a.done||0)>0){ bn.className='banner safe'; bn.textContent='ALL UPLOADED — safe to Cancel workflow now.'; } }
            }
            function poll(){ fetch('/progress'+QS,{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){}); }
            document.getElementById('emBtn').addEventListener('click',function(){ var b=this; b.disabled=true; b.textContent='triggered…'; fetch('/emergency'+QS,{cache:'no-store'}).then(function(){ setTimeout(function(){ b.disabled=false; b.textContent='⚡ Upload everything now'; },1500); }).catch(function(){ b.disabled=false; b.textContent='⚡ Upload everything now'; }); });
            poll(); setInterval(poll,1500);
          })();
          </script>
          </body>
          </html>
          UIEOF

      - name: Write mirror watcher script
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'EOF'
          param([string]$CfgPath)
          $ErrorActionPreference='SilentlyContinue'
          $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json
          $env:GHRDP_CFG=$CfgPath; $env:GHRDP_LOG=$cfg.logFile
          . $cfg.libPath
          Init-Progress $cfg.progressPath
          $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak')
          $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | %{$done[$_]=$true} }
          $idx=Load-Index $cfg
          Push-Rentry $cfg (Build-Rentry $cfg $idx) | Out-Null
          function DoUpload($fi,$tag){
            if($done.ContainsKey($fi.FullName)){return}
            $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_')
            $ex=$idx | ?{$_.name -eq $safe -and $_.src -eq $tag} | select -First 1
            if(-not $ex){ $ex=@{name=$safe;src=$tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }
            $ex.status='uploading'; $ex.time=(Get-Date -f 'HH:mm:ss')
            $enc=Join-Path $cfg.tmpDir ('ge_'+[guid]::NewGuid().ToString('N')+'.enc'); $gofile=$null
            Set-Active $disp 'encrypt' $len
            try { Encrypt-File $fi.FullName $enc $cfg.decPw } catch { "encrypt err $($fi.Name): $_"|Out-File $cfg.logFile -Append }
            Set-Active $disp 'upload' $len
            try { $gofile=Upload-Gofile-Streamed $enc $disp } catch { "upload err $($fi.Name): $_"|Out-File $cfg.logFile -Append }
            Remove-Item $enc -Force -ErrorAction SilentlyContinue
            if($gofile){ $ex.payload=B64U ($gofile+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gofile; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len bytes)"|Out-File $cfg.logFile -Append }
            else { $ex.status='limit'; $ex.time=(Get-Date -f 'HH:mm:ss'); Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; "[$(Get-Date -f o)] LIMIT $tag $($fi.Name)"|Out-File $cfg.logFile -Append }
            Set-Active '' 'idle' 0 }
          function Proc($fi,$tag){ if($done.ContainsKey($fi.FullName)){return}; DoUpload $fi $tag }
          function Scan($r){ if(-not (Test-Path $r.path)){return}; $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue}; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}; Proc $fi $r.tag } }
          function SweepAll($r){ if(-not (Test-Path $r.path)){return}; $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending}; foreach($fi in $items){ if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}; if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}; DoUpload $fi $r.tag } }
          function EmergencyPass{
            "[$(Get-Date -f o)] EMERGENCY pass start"|Out-File $cfg.logFile -Append
            foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 4
            for($round=0;$round -lt 3;$round++){ foreach($r in $cfg.roots){ Scan $r }; Start-Sleep -Seconds 4 }
            foreach($r in $cfg.roots){ SweepAll $r }
            Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null
            Remove-Item $cfg.emergencyFlag -Force -ErrorAction SilentlyContinue
            "[$(Get-Date -f o)] EMERGENCY pass end"|Out-File $cfg.logFile -Append }
          function SyncProg{ $p=$global:GHRDP_PROG; $d=0;$u=0;$f=0; foreach($it in $idx){ if($it.status -eq 'ok'){$d++} elseif($it.status -eq 'limit'){$f++} else {$u++} }; $p.agg.done=$d; $p.agg.failed=$f; $p.agg.tracked=$idx.Count; $p.agg.active=if($p.active.phase -ne 'idle'){1}else{0}; $p.agg.bytesTotal=$global:GHRDP_TOTAL_BYTES; $p.files=@( foreach($it in $idx){ @{name=$it.name;src=$it.src;status=$it.status} } ); if(Test-Path $cfg.logFile){ $p.log=@(Get-Content $cfg.logFile -Tail 40 -ErrorAction SilentlyContinue) } else { $p.log=@() }; Flush-Progress $true }
          $fsw=$null
          try{ if(Test-Path $cfg.dlDir){ $fsw=New-Object System.IO.FileSystemWatcher; $fsw.Path=$cfg.dlDir; $fsw.IncludeSubdirectories=$false; $fsw.EnableRaisingEvents=$true; $fsw.NotifyFilter=[System.IO.NotifyFilters]::FileName -bor [System.IO.NotifyFilters]::Size -bor [System.IO.NotifyFilters]::LastWrite } }catch{}
          while($true){
            if(Test-Path $cfg.emergencyFlag){ EmergencyPass } else { foreach($r in $cfg.roots){ Scan $r }; if(Test-Path $cfg.flushFlag){ "[$(Get-Date -f o)] FLUSH seen"|Out-File $cfg.logFile -Append; for($p=0;$p -lt 8;$p++){ foreach($r in $cfg.roots){Scan $r}; if(-not ($idx | ?{$_.status -ne 'ok'})){break}; Start-Sleep -Seconds 8 }; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null; Remove-Item $cfg.flushFlag -Force -ErrorAction SilentlyContinue } }
            SyncProg
            Start-Sleep -Seconds 3 }
          EOF

      # === CHANGED: launcher funnel is now robust + OPTIONAL (direct-IP link is primary) ===
      - name: Write Mission Control launcher (starts server + best-effort FUNNEL)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-launcher.ps1" <<'EOF'
          param([string]$CfgPath,[int]$Port=7331)
          $ErrorActionPreference='Continue'
          $sd = Split-Path $CfgPath -Parent
          $serverScript = Join-Path $sd 'rdp-redirect-server.ps1'
          $watcherScript = Join-Path $sd 'ghrdp-watcher.ps1'
          $okFile = Join-Path $sd 'ghrdp_server_ok.txt'
          $progressPath = Join-Path $sd 'ghrdp_progress.json'
          $emFlag = Join-Path $sd 'ghrdp_emergency.flag'
          $flushFlag = Join-Path $sd 'ghrdp_flush.flag'
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $cfg = $null; try { $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json } catch { Write-Host "[FATAL] cannot read config: $_"; Read-Host "press Enter to close"; exit 1 }
          function Line($c,$m){ Write-Host ("[{0}] {1}" -f (Get-Date -f 'HH:mm:ss'), $m) -ForegroundColor $c }
          function SaveCfg($c){ $c | ConvertTo-Json -Depth 6 | Set-Content $CfgPath -Encoding UTF8 }
          $tsip=$cfg.rdpIp; if(-not $tsip){ try { $tsip=(& $ts ip -4 2>$null).Trim() } catch {} }
          Write-Host ""
          Line Cyan "============================================================"
          Line Cyan "  MISSION CONTROL  -  dashboard + mirror (+ optional Funnel)"
          Line Cyan "============================================================"
          Line White ("  RDP / Tailscale IP = {0}   USER = {1}   MIRROR = {2}" -f $tsip,$cfg.rdpUser,$cfg.mirror)
          Line White ("  INSIDE RDP         -> http://127.0.0.1:{0}/" -f $Port)
          Line Green ("  PRIMARY local-pc link (in Summary) -> http://{0}:{1}/?key=..." -f $tsip,$Port)
          Write-Host ""
          if(-not (Test-Path $serverScript)){ Line Red "[FATAL] server script missing"; Read-Host "press Enter to close"; exit 1 }
          Remove-Item $okFile -Force -EA 0
          $wjob=$null
          if($cfg.mirror -and (Test-Path $watcherScript)){
            try { $wjob = Start-Job -FilePath $watcherScript -ArgumentList $CfgPath; Line Green ("[watcher] started job id={0}" -f $wjob.Id) }
            catch { Line Red ("[watcher] Start-Job FAILED: {0}" -f $_) }
          } elseif($cfg.mirror){ Line Red "[watcher] watcher script missing" }
          else { Line Yellow "[watcher] mirror OFF" }
          $sjob=$null
          try {
            $sjob = Start-Job -ScriptBlock {
              param($ss,$port,$bind,$uidir,$prog,$cfgp,$em,$fl,$ok)
              $ErrorActionPreference='Continue'
              try { . $ss; Start-GhrdpServer -Port $port -BindAddress $bind -UiDir $uidir -ProgressPath $prog -CfgPath $cfgp -EmergencyFlagPath $em -FlushFlagPath $fl -OkFile $ok }
              catch { Set-Content $ok ("JOB_EXCEPTION: $_") -Encoding ascii }
            } -ArgumentList $serverScript,$Port,'0.0.0.0',$sd,$progressPath,$CfgPath,$emFlag,$flushFlag,$okFile
            Line Green ("[server] started job id={0} (bind 0.0.0.0)" -f $sjob.Id)
          } catch { Line Red ("[server] Start-Job FAILED: {0}" -f $_) }
          $up=$false
          for($i=0;$i -lt 30;$i++){
            if(Test-Path $okFile){ $txt=(Get-Content $okFile -Raw).Trim(); if($txt -match 'LISTENING'){ $up=$true; Line Green ("[server] {0}" -f $txt); break } else { Line Red ("[server] {0}" -f $txt); break } }
            if($sjob -and $sjob.State -ne 'Running'){ Line Red ("[server] job died: {0}" -f (Receive-Job $sjob -EA 0)); break }
            Start-Sleep -Milliseconds 500
          }
          if(-not $up){ Line Red "[server] did NOT start." }
          $funnelUrl=''
          if($up){
            $funnelOk=$false
            for($fa=1;$fa -le 2;$fa++){
              $ferr = & $ts funnel --yes --bg $Port on 2>&1
              $ferr | ForEach-Object { Line DarkGray ("[funnel] {0}" -f $_) }
              $LASTEXITCODE=0; Start-Sleep -Seconds 3
              $stj = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              $dns = $stj.Self.DNSName
              if($dns){ $dns=$dns.TrimEnd('.'); $funnelUrl = ("https://{0}/?key={1}" -f $dns,$cfg.dashToken); $funnelOk=$true; Line Green ("[funnel] ENABLED (bonus) -> {0}" -f $funnelUrl); break }
              Line Yellow ("[funnel] attempt {0}: no DNS yet" -f $fa)
            }
            if(-not $funnelOk){ Line Yellow "[funnel] not enabled = OK (optional). Local pc uses the direct Tailscale-IP link in the Summary (no Funnel needed). To add Funnel: Tailscale admin -> tailnet -> enable Funnel / node ACL, then re-run." }
            $cfg.funnelUrl = $funnelUrl; SaveCfg $cfg
          }
          $loopOk=$false; try { Invoke-WebRequest -Uri ("http://127.0.0.1:{0}/" -f $Port) -UseBasicParsing -TimeoutSec 3 | Out-Null; $loopOk=$true } catch {}
          Line $(if($loopOk){'Green'}else{'Red'}) ("[selftest] loopback 127.0.0.1:{0} = {1}" -f $Port,$loopOk)
          if($up){ try { Start-Process ("http://127.0.0.1:{0}/" -f $Port) | Out-Null; Line Green "[browser] opened dashboard tab (inside RDP)" } catch {} }
          Write-Host ""
          Line Cyan "  LIVE STATUS (window open = alive; close = stop)"
          while($true){
            $sAlive = ($sjob -and $sjob.State -eq 'Running')
            $wAlive = ($wjob -and $wjob.State -eq 'Running')
            $listen = (Test-Path $okFile) -and ((Get-Content $okFile -Raw) -match 'LISTENING')
            $done=0;$act=0;$fail=0;$trk=0;$pct=0
            if(Test-Path $progressPath){ try { $p=Get-Content $progressPath -Raw|ConvertFrom-Json -EA 0; if($p -and $p.agg){ $done=$p.agg.done;$act=$p.agg.active;$fail=$p.agg.failed;$trk=$p.agg.tracked;$pct=$p.agg.overallPct } } catch {} }
            $col = if($listen){ 'Green' } else { 'Red' }
            Line $col ("server={0} listen={1} watcher={2} funnel={3} | done={4} active={5} fail={6} tracked={7} overall={8}%" -f $sAlive,$listen,$wAlive,[bool]$funnelUrl,$done,$act,$fail,$trk,$pct)
            if($sjob -and $sjob.State -ne 'Running'){ Line Red ("[server] NOT RUNNING: {0}" -f (Receive-Job $sjob -EA 0)) }
            if($wjob -and $wjob.State -ne 'Running'){ Line Red ("[watcher] NOT RUNNING: {0}" -f (Receive-Job $wjob -EA 0)) }
            Start-Sleep -Seconds 2
          }
          EOF

      # === CHANGED: summary = highlighted clickable direct-IP link + copy block + funnel backup ===
      - name: Write summary helper (highlighted ONE-CLICK link in Summary)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-summary.ps1" <<'EOF'
          param([string]$CfgPath)
          $ErrorActionPreference='SilentlyContinue'
          if(-not (Test-Path $CfgPath)){ return }
          $cfg = Get-Content $CfgPath -Raw | ConvertFrom-Json
          $ip=$cfg.rdpIp; $user=$cfg.rdpUser; $pass=$cfg.rdpPass; $ghrdp=$cfg.ghrdp; $funnel=$cfg.funnelUrl; $tok=$cfg.dashToken
          $dash = 'http://' + $ip + ':7331/?key=' + $tok
          $S = $env:GITHUB_STEP_SUMMARY
          Write-Host '============================================================'
          Write-Host ('  RDP READY  IP=' + $ip + '  USER=' + $user + '  PASS=' + $pass)
          Write-Host ('  OPEN ON YOUR PC (click): ' + $dash)
          Write-Host '============================================================'
          '### RDP is ready - open on YOUR pc (zero typing)' >> $S
          '' >> $S
          '#### 1) Click this highlighted link on your local pc (Tailscale ON, same tailnet):' >> $S
          '' >> $S
          ('**[>>> OPEN DASHBOARD / AUTO-CONNECT RDP <<<](' + $dash + ')**') >> $S
          '' >> $S
          ('Copyable: `' + $dash + '`') >> $S
          '' >> $S
          'The page auto-fires your RDP connector, so RDP opens with the password already filled (no typing). The FIRST time on a new PC, the page shows a one-time connector installer (Download + Run with PowerShell once); after that every click auto-connects. Tick Always-allow on the browser prompt once.' >> $S
          '' >> $S
          if($funnel){ ('#### Backup link (Funnel): **[OPEN](' + $funnel + ')**') >> $S; '' >> $S }
          '#### 2) Manual mstsc (reference only)' >> $S
          '' >> $S
          ('IP: ' + $ip + '   User: ' + $user + '   Pass: ' + $pass) >> $S
          '' >> $S
          if($cfg.mirror){ ('Mirror ON: in the dashboard click UPLOAD-EVERYTHING-NOW, wait for the green banner, then Cancel. Index: ' + $cfg.rentryUrl) >> $S }
          EOF

      - name: Configure theme + bookmarks + apps + Mission Control shortcut
        run: |
          $ErrorActionPreference = 'Continue'
          function Reset-Exit { $script:LASTEXITCODE = 0 }
          $mPers='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if(-not(Test-Path $mPers)){New-Item -Path $mPers -Force|Out-Null}
          New-ItemProperty -Path $mPers -Name 'AppsUseLightTheme'    -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'SystemUsesLightTheme' -Value 0 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mPers -Name 'ColorPrevalence'      -Value 0 -PropertyType DWord -Force|Out-Null
          $mAcc='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Accent'
          if(-not(Test-Path $mAcc)){New-Item -Path $mAcc -Force|Out-Null}
          New-ItemProperty -Path $mAcc -Name 'AccentColorMenu' -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'StartColor'      -Value 0x8c2bc4 -PropertyType DWord -Force|Out-Null
          New-ItemProperty -Path $mAcc -Name 'AccentColor'     -Value 0xffc42b8c -PropertyType DWord -Force|Out-Null
          try{ $mag=[byte[]](0x8C,0x2B,0xC4,0xFF,0x9E,0x33,0xD0,0xFF,0xB0,0x3B,0xDC,0xFF,0xC2,0x43,0xE8,0xFF,0x7A,0x22,0xB0,0xFF,0x66,0x1A,0x9C,0xFF,0x52,0x12,0x88,0xFF,0x3E,0x0A,0x74,0xFF); Set-ItemProperty -Path $mAcc -Name 'AccentPalette' -Value $mag -PropertyType Binary -Force|Out-Null }catch{}
          Write-Host "Machine-wide dark mode + magenta accent set."
          $edgePol='HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'; if(-not(Test-Path $edgePol)){New-Item -Path $edgePol -Force|Out-Null}
          $crx='https://edge.microsoft.com/extensionwebstorebase/v1/crx'
          New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$crx" -PropertyType String -Force|Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$crx" -PropertyType String -Force|Out-Null
          $fav='[{"name":"FMHY Torrenting","url":"https://fmhy.net/torrenting"},{"name":"GitHub RDP Mirror","url":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe"}]'
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'ManagedFavorites' -Value $fav -PropertyType String -Force|Out-Null
          $ffdist='C:\Program Files\Mozilla Firefox\distribution'; New-Item -ItemType Directory -Path $ffdist -Force|Out-Null
          $ffpol='{"policies":{"Bookmarks":[{"Title":"FMHY Torrenting","URL":"https://fmhy.net/torrenting","Placement":"toolbar"},{"Title":"GitHub RDP Mirror","URL":"https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe","Placement":"toolbar"}]}}'
          Set-Content -Path (Join-Path $ffdist 'policies.json') -Value $ffpol -Encoding UTF8
          try { winget install --id qBittorrent.qBittorrent -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "qBittorrent installed." } catch { Write-Host "qBittorrent winget failed (non-fatal)." }; Reset-Exit
          try { winget install --id Parsec.Parsec -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null|Out-Null; Write-Host "Parsec installed." } catch { Write-Host "Parsec winget failed (non-fatal)." }; Reset-Exit
          $pcfg='C:\ProgramData\Parsec'; New-Item -ItemType Directory -Path $pcfg -Force|Out-Null
          "app_host = 1`r`nprivacy_mode = 0`r`nserver_resolution = 1920x1080" | Set-Content (Join-Path $pcfg 'config.txt') -Encoding ASCII -ErrorAction SilentlyContinue
          if(Test-Path 'C:\Program Files\Parsec\parsecd.exe'){ New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -Name 'ParsecAuto' -Value '"C:\Program Files\Parsec\parsecd.exe"' -PropertyType String -Force -ErrorAction SilentlyContinue|Out-Null; Write-Host "Parsec autolaunch set." } else { Write-Host "Parsec exe not found - skipped autolaunch." }
          Reset-Exit
          $sd=$env:RUNNER_TEMP
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'
          $launcher=Join-Path $sd 'ghrdp-launcher.ps1'
          $ps="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
          $args = "-NoExit -ExecutionPolicy Bypass -File `"$launcher`" -CfgPath `"$cfgPath`" -Port 7331"
          foreach($desk in @("C:\Users\Public\Desktop","C:\Users\$($env:RDP_USER)\Desktop")){
            try { New-Item -ItemType Directory -Path $desk -Force -EA 0 | Out-Null; $ws=New-Object -ComObject WScript.Shell; $sc=$ws.CreateShortcut((Join-Path $desk 'Mission Control.lnk')); $sc.TargetPath=$ps; $sc.Arguments=$args; $sc.WindowStyle=1; $sc.Description='Start RDP dashboard + mirror (live console)'; $sc.Save(); Write-Host "Mission Control shortcut -> $desk" } catch { Write-Host "shortcut err $desk : $_" }
          }
          & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath
          "### Theme + Bookmarks + qBittorrent + Parsec + Mission Control + ONE-CLICK RDP Ready" >> $env:GITHUB_STEP_SUMMARY
          "Dark mode, bookmarks, qBittorrent, Parsec installed. The Summary now has a highlighted ONE-CLICK link (direct Tailscale IP) that auto-connects RDP with zero typing; first-time PCs get a one-time connector installer from the dashboard." >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Configure step complete (exit forced 0)."
          exit 0

      - name: Prepare dashboard + mirror config (incl. random dashboard token)
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        run: |
          $ts="C:\Program Files\Tailscale\tailscale.exe"; $ip=(& $ts ip -4).Trim(); $user=$env:RDP_USER; $pass=$env:RDP_PASS
          $eu=[uri]::EscapeDataString($user); $ep=[uri]::EscapeDataString($pass); $ghrdp="ghrdp://$ip/$eu/$ep"; $sd=$env:RUNNER_TEMP
          New-Item -ItemType Directory -Path (Join-Path $sd 'ghrdp_tmp') -Force | Out-Null
          $indexPath=Join-Path $sd 'ghrdp_mirror_index.json'; $progressPath=Join-Path $sd 'ghrdp_progress.json'
          $hbPath=Join-Path $sd 'ghrdp_heartbeat.txt'; $emPath=Join-Path $sd 'ghrdp_emergency.flag'; $cfPath=Join-Path $sd 'ghrdp_cancel.flag'; $adPath=Join-Path $sd 'ghrdp_alldone.flag'
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $mirrorOn=($env:MIRROR -eq 'true')
          $rng=[System.Security.Cryptography.RandomNumberGenerator]::Create(); $alpha='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b=[byte[]]::new(24); $rng.GetBytes($b); $dashToken=-join ($b|%{$alpha[[int]$_ % $alpha.Length]})
          if($mirrorOn){
            $b2=[byte[]]::new(20); $rng.GetBytes($b2); $decPw=-join ($b2|%{$alpha[[int]$_ % $alpha.Length]})
            $dlDir="C:\Users\$user\Downloads"; $tempDir="C:\Users\$user\AppData\Local\Temp"
            $roots=@(@{path=$dlDir;rec=$false;min=0;tag='Downloads'},@{path=$tempDir;rec=$true;min=102400;tag='Temp'})
            if(Test-Path 'D:\RDP-Storage'){ $roots += @{path='D:\RDP-Storage';rec=$true;min=0;tag='D-Storage'}; Write-Host "D-Storage added to mirror." }
            $cfg=@{ rdpIp=$ip; rdpUser=$user; rdpPass=$pass; ghrdp=$ghrdp; mirror=$true; rentryUrl='https://rentry.co/Rt7mK2pL9vQ4wX8nB3cF6zYe'; editCode='Gf5xW9qL2mK7pR4tBn3Y'; slug='Rt7mK2pL9vQ4wX8nB3cF6zYe'; decPw=$decPw; dashToken=$dashToken; funnelUrl=''; user=$user; dlDir=$dlDir; tempDir=$tempDir; roots=$roots; idxFile=$indexPath; doneFile=(Join-Path $sd 'ghrdp_uploaded.txt'); logFile=(Join-Path $sd 'ghrdp_mirror.log'); flushFlag=(Join-Path $sd 'ghrdp_flush.flag'); cfgPath=$cfgPath; libPath=(Join-Path $sd 'ghrdp-lib.ps1'); heartbeatPath=$hbPath; emergencyFlag=$emPath; cancelFlag=$cfPath; allDoneFlag=$adPath; progressPath=$progressPath; tmpDir=(Join-Path $sd 'ghrdp_tmp') }
            $cfg | ConvertTo-Json -Depth 6 | Set-Content $cfgPath -Encoding UTF8
          } else {
            @{ rdpIp=$ip; rdpUser=$user; rdpPass=$pass; ghrdp=$ghrdp; mirror=$false; rentryUrl=''; dashToken=$dashToken; funnelUrl='' } | ConvertTo-Json -Depth 4 | Set-Content $cfgPath -Encoding UTF8
          }
          Write-Host "Config written. mirror=$mirrorOn. dashToken set. Local-pc link = http://${ip}:7331/?key=..."
          & (Join-Path $sd 'ghrdp-summary.ps1') $cfgPath

      - name: Keep Alive (5h30)
        run: |
          $sd=$env:RUNNER_TEMP
          & (Join-Path $sd 'ghrdp-summary.ps1') (Join-Path $sd 'ghrdp_cfg.json')
          $limit=New-TimeSpan -Hours 5 -Minutes 30; $start=Get-Date
          Write-Host "Session alive 5h30. Local pc: click the highlighted link in the Summary tab."
          while(((Get-Date)-$start) -lt $limit){ Start-Sleep -Seconds 60 }
          Write-Host "5h30 done."

      - name: Emergency upload on cancel (always)
        if: ${{ always() && github.event.inputs.mirror_downloads_public == 'true' }}
        env:
          STATUS: ${{ job.status }}
        run: |
          $sd=$env:RUNNER_TEMP
          $cfgPath=Join-Path $sd 'ghrdp_cfg.json'; $lib=Join-Path $sd 'ghrdp-lib.ps1'
          if(-not ((Test-Path $cfgPath) -and (Test-Path $lib))){ Write-Host "no mirror cfg/lib - skip"; exit 0 }
          $emf=Join-Path $sd 'ghrdp_emergency.flag'; $progressPath=Join-Path $sd 'ghrdp_progress.json'
          Set-Content $emf (Get-Date -f o) -Encoding ascii
          Write-Host "EMERGENCY (status=$env:STATUS) - signalled watcher; monitoring live progress..."
          $deadline=(Get-Date).AddMinutes(12); $watcherSeen=$false
          while((Get-Date) -lt $deadline){
            $prog=$null; if(Test-Path $progressPath){ try{ $prog=Get-Content $progressPath -Raw|ConvertFrom-Json -ErrorAction Stop }catch{} }
            if($prog -and $prog.ts){ $age=[int]((Get-Date)-(Get-Date $prog.ts)).TotalSeconds; if($age -lt 15){ $watcherSeen=$true } else { Write-Host "watcher stale (${age}s) - fallback."; break } }
            if($prog -and $prog.agg){ $u=[int]$prog.agg.active; $f=[int]$prog.agg.failed; $d=[int]$prog.agg.done; $pct=$prog.agg.overallPct; Write-Host "...done=$d active=$u failed=$f overall=${pct}% (watcher alive=$watcherSeen)" }
            if($watcherSeen -and $prog -and $prog.agg -and [int]$prog.agg.active -eq 0 -and [int]($prog.agg.tracked) -gt 0 -and [int]($prog.agg.done) -ge ([int]($prog.agg.tracked)-[int]($prog.agg.failed))){ Write-Host "Watcher finished all transfers."; break }
            Start-Sleep -Seconds 5
          }
          $needFallback = -not $watcherSeen
          if(-not $needFallback -and (Test-Path $progressPath)){ try{ $pp=Get-Content $progressPath -Raw|ConvertFrom-Json -ErrorAction Stop; if($pp.agg -and [int]$pp.agg.active -gt 0){ $needFallback=$true } }catch{} }
          if($needFallback){
            Write-Host "DIRECT fallback upload (streaming, lock-safe)..."
            $env:GHRDP_CFG=$cfgPath; . $lib; $cfg=Read-Cfg; $env:GHRDP_LOG=$cfg.logFile; Init-Progress $progressPath
            foreach($p in @('qbittorrent','qbittorrent-nox')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 4
            $junk=@('.tmp','.crdownload','.partial','.lock','.log','.etl','.pf','.db-journal','.sqlite-journal','.old','.bak')
            $done=@{}; if(Test-Path $cfg.doneFile){ Get-Content $cfg.doneFile | %{$done[$_]=$true} }
            $idx=Load-Index $cfg
            foreach($r in $cfg.roots){
              if(-not (Test-Path $r.path)){ continue }
              $items=if($r.rec){Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -ErrorAction SilentlyContinue | Sort-Object Length -Descending}else{Get-ChildItem -LiteralPath $r.path -File -ErrorAction SilentlyContinue | Sort-Object Length -Descending}
              foreach($fi in $items){
                if($done.ContainsKey($fi.FullName)){continue}; if($junk -contains $fi.Extension.ToLower()){continue}; if($fi.Length -lt $r.min){continue}
                if($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)'){continue}
                $len=$fi.Length; $safe=$fi.Name -replace '\|','_'; $disp=($safe -replace '[^\x20-\x7E]','_')
                $ex=$idx | ?{$_.name -eq $safe -and $_.src -eq $r.tag} | select -First 1
                if(-not $ex){ $ex=@{name=$safe;src=$r.tag;status='uploading';payload='';gofile='';time=(Get-Date -f 'HH:mm:ss')}; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len }
                $ex.status='uploading'; $enc=Join-Path $cfg.tmpDir ('em_'+[guid]::NewGuid().ToString('N')+'.enc'); $gf=$null
                Set-Active $disp 'encrypt' $len; try{ Encrypt-File $fi.FullName $enc $cfg.decPw }catch{}
                Set-Active $disp 'upload' $len; try{ $gf=Upload-Gofile-Streamed $enc $disp }catch{}
                Remove-Item $enc -Force -ErrorAction SilentlyContinue
                if($gf){ $ex.payload=B64U ($gf+'|'+$cfg.decPw+'|'+$safe); $ex.gofile=$gf; $ex.status='ok'; $ex.time=(Get-Date -f 'HH:mm:ss'); $done[$fi.FullName]=$true; $fi.FullName|Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Write-Host "DIRECT OK $($fi.Name) ($len bytes)" }
                else { $ex.status='limit'; Write-Host "DIRECT LIMIT $($fi.Name)" }
                Set-Active '' 'idle' 0
              }
            }
            Save-Index $cfg $idx; Push-Rentry $cfg (Build-Rentry $cfg $idx)|Out-Null
            Write-Host "DIRECT fallback upload complete."
          }
          Write-Host "Emergency handling complete. (A 2nd Cancel force-kills immediately.)"

      - name: Secure Cleanup (wipe all data)
        if: ${{ always() }}
        run: |
          $ml=Join-Path $env:RUNNER_TEMP 'ghrdp_mirror.log'; if(Test-Path $ml){ Write-Host "----- mirror log (tail) -----"; Get-Content $ml -Tail 120 | %{Write-Host $_} }
          foreach($p in @('chrome','msedge','firefox','iexplore','brave','opera','qbittorrent')){ Get-Process -Name $p -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          foreach($p in @("$env:LOCALAPPDATA\Google\Chrome\User Data","$env:LOCALAPPDATA\Microsoft\Edge\User Data","$env:APPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\Mozilla\Firefox\Profiles","$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data","$env:APPDATA\Opera Software\Opera Stable")){ if(Test-Path $p){ try{Remove-Item -Path $p -Recurse -Force -ErrorAction Stop}catch{Start-Sleep 2;Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue} } }
          foreach($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")){ if(Test-Path $p){Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue} }
          if($env:RDP_USER){ foreach($s in @('Downloads','AppData\Local\Temp')){ $d="C:\Users\$($env:RDP_USER)\$s"; if(Test-Path $d){Remove-Item "$d\*" -Recurse -Force -ErrorAction SilentlyContinue} } }
          if(Test-Path 'D:\RDP-Storage'){ Remove-Item 'D:\RDP-Storage\*' -Recurse -Force -ErrorAction SilentlyContinue }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
          Set-Clipboard -Value "" -ErrorAction SilentlyContinue; Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | %{wevtutil cl "$_" 2>$null}; $LASTEXITCODE = 0
          & "C:\Program Files\Tailscale\tailscale.exe" funnel --bg 7331 off 2>$null | Out-Null; $LASTEXITCODE=0
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
          "VM wiped (incl D-RDP-Storage). Mirror copies (AES) + rentry index remain if mirror ON. No GitHub secrets - recoverable from script." >> $env:GITHUB_STEP_SUMMARY

      - name: Overwrite free space (skip on cancel)
        if: ${{ always() && !cancelled() }}
        run: |
          Write-Host "Overwriting free space (cipher /w)..."
          cipher /w:C:\
          $LASTEXITCODE = 0
          "Free-space overwrite complete." >> $env:GITHUB_STEP_SUMMARY
