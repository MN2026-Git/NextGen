name: Windows RDP

on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror EVERY download (AES-256 encrypted) to gofile + rentry. PUBLIC index! default OFF = private'
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Download Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
                            -OutFile "tailscale-setup.msi" -UseBasicParsing

      - name: Install Tailscale
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5

      - name: Get Tailscale sign-in link
        id: login
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $daemonOk = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              if ($j -and $j.BackendState) { $daemonOk = $true; break }
            } catch { }
            if ($i -eq 5) { Start-Service Tailscale -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 2
          }
          if (-not $daemonOk) { throw "tailscaled daemon not started." }
          $upLog = Join-Path $env:RUNNER_TEMP "ts-up.log"
          $upErr = Join-Path $env:RUNNER_TEMP "ts-up.err"
          $null = Start-Process -FilePath $ts -ArgumentList "up" `
                                -RedirectStandardOutput $upLog `
                                -RedirectStandardError  $upErr `
                                -WindowStyle Hidden -PassThru
          $url = $null
          for ($i = 0; $i -lt 60; $i++) {
            $txt = ""
            foreach ($f in @($upLog, $upErr)) {
              if (Test-Path $f) {
                try {
                  $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
                  $sr = New-Object System.IO.StreamReader($fs)
                  $txt += $sr.ReadToEnd()
                  $sr.Close(); $fs.Close()
                } catch { }
              }
            }
            if ($txt -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }
            Start-Sleep -Seconds 2
          }
          if (-not $url) { Write-Host $txt; throw "Sign-in link not found." }
          Write-Host "TAILSCALE SIGN-IN LINK: $url"
          $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
          "### Tailscale Sign-in Link" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "[$url]($url)" >> $env:GITHUB_STEP_SUMMARY

      - name: Wait for Tailscale sign-in
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $authed = $false
          for ($i = 0; $i -lt 120; $i++) {
            try {
              $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop
              if ($j -and $j.BackendState -eq 'Running') { $authed = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $authed) { throw "Sign-in timeout." }
          Write-Host "Tailscale connected. IP = $((& $ts ip -4).Trim())"

      - name: Enable RDP + harden connection
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -ErrorAction SilentlyContinue |
            Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -ErrorAction SilentlyContinue
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null
          Write-Host "RDP enabled + hardened (NLA/TLS/high-enc, Tailscale-only firewall, lockout)."

      - name: Create secure random RDP account
        run: |
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $bytes = [byte[]]::new(24); $rng.GetBytes($bytes)
          $pass = -join ($bytes | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
          $hb = [byte[]]::new(4); $rng.GetBytes($hb)
          $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name $user -Password $sec -FullName "RDP Session" -Description "temp rdp" -PasswordNeverExpires -ErrorAction Stop | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          $dl = "C:\Users\$user\Downloads"
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          & icacls.exe $dl /grant "${user}:(OI)(CI)F" 2>$null | Out-Null
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"
          Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"
          Write-Host "Created secure account: $user"

      - name: Write RDP + live dashboard server script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'EOF'
          param(
          [string]$Ip,
          [int]$Port = 7331,
          [string]$Ghrdp,
          [string]$IndexPath
          )
          $ErrorActionPreference = "SilentlyContinue"
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://${Ip}:${Port}/")
          $ok = $false
          try { $listener.Start(); $ok = $true } catch { Write-Host "listener failed: $_" }
          if (-not $ok) { exit 0 }
          function Build-Page($ghrdp, $indexPath) {
          $rows = ""
          if ($indexPath -and (Test-Path $indexPath)) {
          try {
          $fs = [System.IO.File]::Open($indexPath, 'Open', 'Read', 'ReadWrite')
          $sr = New-Object System.IO.StreamReader($fs); $json = $sr.ReadToEnd(); $sr.Close(); $fs.Close()
          $arr = $json | ConvertFrom-Json -ErrorAction Stop
          foreach ($it in $arr) { $rows += '<a class="btn file" href="ghrdp://dl/' + $it.payload + '">&#128229; ' + [System.Net.WebUtility]::HtmlEncode($it.name) + '</a>' }
          } catch { }
          }
          if (-not $rows) { $rows = '<p class="muted">No mirrored files yet. Save something to the Downloads folder.</p>' }
          return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="8"><title>RDP + Files</title><style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:Segoe UI,system-ui,sans-serif;background:#0c1014;color:#e8edf2;padding:24px;display:flex;justify-content:center}.card{width:min(560px,94vw);background:#11171d;border:1px solid #243039;border-radius:18px;padding:28px}.dot{width:10px;height:10px;border-radius:50%;background:#37c6b0;display:inline-block;margin-right:8px}h1{font-size:24px;margin-bottom:6px}h2{font-size:15px;color:#9fb0bc;margin:22px 0 10px;text-transform:uppercase;letter-spacing:1px}.btn{display:block;margin:8px 0;padding:14px 18px;border-radius:12px;background:#37c6b0;color:#04201c;font-weight:700;text-decoration:none;text-align:center}.btn.file{background:#1c2730;color:#cfe9e4;border:1px solid #2c3b46}.btn.file:hover{background:#243441}.muted{color:#7f93a0;font-size:13px}code{display:block;margin-top:14px;word-break:break-all;background:#0b0f13;border:1px solid #20292f;border-radius:10px;padding:10px;color:#7f93a0;font-size:12px}</style></head><body><div class="card"><h1><span class="dot"></span>Remote Desktop</h1><a class="btn" href="' + $ghrdp + '">Open Remote Desktop</a><h2>Mirrored files (one-click decrypt)</h2>' + $rows + '<p class="muted">In the browser popup click <b>Open</b>. Page auto-refreshes every 8s.</p><code>' + $ghrdp + '</code></div></body></html>'
          }
          while ($listener.IsListening) {
          $ctx = $listener.GetContext()
          $html = Build-Page $ghrdp $IndexPath
          $buf = [System.Text.Encoding]::UTF8.GetBytes($html)
          $ctx.Response.ContentType = "text/html; charset=utf-8"
          $ctx.Response.ContentLength64 = $buf.Length
          $ctx.Response.OutputStream.Write($buf, 0, $buf.Length)
          $ctx.Response.Close()
          }
          EOF

      - name: Write encrypted mirror watcher script
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-mirror-watcher.ps1" <<'EOF'
          param()
          $ErrorActionPreference = 'SilentlyContinue'
          $editCode = $env:GHRDP_EDITCODE
          $slug     = $env:GHRDP_SLUG
          $decPw    = $env:GHRDP_DECPW
          $dlUser   = $env:GHRDP_USER
          $dlDir    = "C:\Users\$dlUser\Downloads"
          $logFile  = Join-Path $env:TEMP 'ghrdp_mirror.log'
          $doneFile = Join-Path $env:TEMP 'ghrdp_uploaded.txt'
          $idxFile  = Join-Path $env:RUNNER_TEMP 'ghrdp_mirror_index.json'
          "[$(Get-Date -f o)] watcher start dir=$dlDir slug=$slug editcode=$([bool]$editCode)" | Out-File $logFile -Append
          if (-not (Test-Path $dlDir)) { New-Item -ItemType Directory -Path $dlDir -Force | Out-Null }
          $processed = @{}
          if (Test-Path $doneFile) { Get-Content $doneFile | ForEach-Object { $processed[$_] = $true } }
          $index = New-Object System.Collections.ArrayList
          if (Test-Path $idxFile) { try { $index = [System.Collections.ArrayList]@(Get-Content $idxFile -Raw | ConvertFrom-Json -ErrorAction Stop) } catch { $index = New-Object System.Collections.ArrayList } }
          function B64U($s){ $b=[System.Text.Encoding]::UTF8.GetBytes($s); $x=[Convert]::ToBase64String($b); return $x.Replace('+','-').Replace('/','_').TrimEnd('=') }
          function Encrypt-File($inPath,$outPath,$password){
          $aes=[System.Security.Cryptography.Aes]::Create(); $aes.KeySize=256; $aes.Mode='CBC'; $aes.Padding='PKCS7'
          $salt=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt)
          $aes.IV=[byte[]]::new(16); ([System.Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($aes.IV)
          $kdf=New-Object System.Security.Cryptography.Rfc2898DeriveBytes($password,$salt,100000,[System.Security.Cryptography.HashAlgorithmName]::SHA256)
          $aes.Key=$kdf.GetBytes(32)
          $pt=[System.IO.File]::ReadAllBytes($inPath)
          $ct=$aes.CreateEncryptor().TransformFinalBlock($pt,0,$pt.Length)
          $ms=New-Object System.IO.MemoryStream; $ms.Write($salt,0,16); $ms.Write($aes.IV,0,16); $ms.Write($ct,0,$ct.Length)
          [System.IO.File]::WriteAllBytes($outPath,$ms.ToArray()); $ms.Close(); $aes.Clear()
          }
          function Is-Locked($p){ try { $f=[System.IO.File]::Open($p,'Open','ReadWrite','None'); $f.Close(); return $false } catch { return $true } }
          function Upload-Gofile($p){
          try {
          $gs = (& curl.exe -s "https://api.gofile.io/getServer") | ConvertFrom-Json -ErrorAction Stop
          $server = $gs.data.server
          $raw = & curl.exe -s -X POST "https://$server.gofile.io/contents/uploadfile" -F "file=@$p"
          $uj = $raw | ConvertFrom-Json -ErrorAction Stop
          if ($uj.data.downloadPage) { return $uj.data.downloadPage }
          if ($uj.data.code) { return "https://gofile.io/d/$($uj.data.code)" }
          if ($uj.data.id) { return "https://gofile.io/d/$($uj.data.id)" }
          "gofile no link: $raw" | Out-File $logFile -Append
          } catch { "gofile err: $_" | Out-File $logFile -Append }
          return $null
          }
          function Push-Rentry($text){
          if (-not $editCode -or -not $slug) { return $false }
          for ($n=0; $n -lt 2; $n++){
          try {
          $out = & curl.exe -s -S -X POST ("https://rentry.co/api/edit/" + $slug) --data-urlencode "edit_code=$editCode" --data-urlencode "text=$text" --data-urlencode "update_mode=replace" 2>$null
          $j = $out | ConvertFrom-Json -ErrorAction Stop
          if ("$($j.status)" -eq '200') { return $true }
          "rentry $($j.status) $($j.content)" | Out-File $logFile -Append
          } catch { "rentry err: $_" | Out-File $logFile -Append }
          Start-Sleep -Seconds 3
          }
          return $false
          }
          function Save-Index { $index | ConvertTo-Json -Depth 5 | Set-Content $idxFile -Encoding UTF8 }
          function Build-Rentry {
          $sb = New-Object System.Text.StringBuilder
          [void]$sb.AppendLine("# GitHub RDP - mirrored files")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("Auto-updated. Files are **AES-256 encrypted** on gofile.")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("**Decrypt password (all files):** ``$decPw``")
          [void]$sb.AppendLine("")
          [void]$sb.AppendLine("| File | One-click open | gofile (encrypted) |")
          [void]$sb.AppendLine("|---|---|---|")
          if ($index.Count -eq 0) { [void]$sb.AppendLine("| _(none yet)_ | | |") }
          foreach ($it in $index) { [void]$sb.AppendLine("| " + $it.name + " | [open](ghrdp://dl/" + $it.payload + ") | [gofile](" + $it.gofile + ") |") }
          return $sb.ToString()
          }
          $lastSize = @{}
          while ($true) {
          if (Test-Path $dlDir) {
          $files = Get-ChildItem -LiteralPath $dlDir -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -ne '.enc' -and $_.Extension -ne '.uploaded' -and -not $processed.ContainsKey($_.FullName) }
          foreach ($fi in $files) {
          $age = (Get-Date) - $fi.LastWriteTime
          if ($age.TotalSeconds -lt 3) { continue }
          if (Is-Locked $fi.FullName) { continue }
          if ($lastSize.ContainsKey($fi.FullName) -and $lastSize[$fi.FullName] -ne $fi.Length) { $lastSize[$fi.FullName]=$fi.Length; continue }
          $lastSize[$fi.FullName] = $fi.Length
          $encPath = Join-Path $env:TEMP ('ghrdp_enc_' + [guid]::NewGuid().ToString('N') + '.enc')
          Encrypt-File $fi.FullName $encPath $decPw
          $gofile = Upload-Gofile $encPath
          Remove-Item $encPath -Force -ErrorAction SilentlyContinue
          $processed[$fi.FullName] = $true
          $fi.FullName | Out-File $doneFile -Append
          if ($gofile) {
          $safeName = $fi.Name -replace '\|','_'
          $payload = B64U ($gofile + '|' + $decPw + '|' + $safeName)
          [void]$index.Add(@{ name = $safeName; payload = $payload; gofile = $gofile })
          Save-Index
          "[$(Get-Date -f o)] uploaded+encrypted $($fi.Name) -> $gofile" | Out-File $logFile -Append
          Push-Rentry (Build-Rentry) | Out-Null
          } else {
          "[$(Get-Date -f o)] encrypt ok but gofile upload FAILED for $($fi.Name)" | Out-File $logFile -Append
          }
          }
          }
          Start-Sleep -Seconds 3
          }
          EOF

      - name: Get Connection Info + start dashboard + watcher
        env:
          MIRROR: ${{ github.event.inputs.mirror_downloads_public }}
        run: |
          $ts    = "C:\Program Files\Tailscale\tailscale.exe"
          $ip    = (& $ts ip -4).Trim()
          $user  = $env:RDP_USER
          $pass  = $env:RDP_PASS
          $eu    = [uri]::EscapeDataString($user)
          $ep    = [uri]::EscapeDataString($pass)
          $ghrdp = "ghrdp://$ip/$eu/$ep"
          $port  = 7331
          $redirectUrl = "http://${ip}:${port}/"
          $indexPath   = Join-Path $env:RUNNER_TEMP 'ghrdp_mirror_index.json'
          Write-Host "RDP IP: $ip | User: $user"
          Write-Host "Dashboard : $redirectUrl"
          New-NetFirewallRule -DisplayName "RDP Redirect Page" -Direction Inbound -LocalPort $port -Protocol TCP -RemoteAddress "100.64.0.0/10" -Action Allow -ErrorAction SilentlyContinue | Out-Null
          $serverPs1 = Join-Path $env:RUNNER_TEMP "rdp-redirect-server.ps1"
          $serverOk = $false
          if (Test-Path $serverPs1) {
            Start-Process powershell.exe -ArgumentList @('-ExecutionPolicy','Bypass','-WindowStyle','Hidden','-File',$serverPs1,'-Ip',$ip,'-Port',"$port",'-Ghrdp',$ghrdp,'-IndexPath',$indexPath) -WindowStyle Hidden | Out-Null
            Start-Sleep -Seconds 2
            try { Invoke-WebRequest -Uri $redirectUrl -UseBasicParsing -TimeoutSec 4 | Out-Null; $serverOk = $true } catch { $serverOk = $false }
          }
          Write-Host "Dashboard running: $serverOk"
          $mirrorOn = $false
          if ($env:MIRROR -eq 'true') {
            $wp = Join-Path $env:RUNNER_TEMP 'ghrdp-mirror-watcher.ps1'
            if (Test-Path $wp) {
              $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
              $alpha = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
              $b = [byte[]]::new(20); $rng.GetBytes($b)
              $decPw = -join ($b | ForEach-Object { $alpha[[int]$_ % $alpha.Length] })
              $env:GHRDP_DECPW   = $decPw
              $env:GHRDP_USER    = $user
              $env:GHRDP_SLUG    = "${{ vars.RENTRY_SLUG }}"
              $env:GHRDP_EDITCODE= "${{ secrets.RENTRY_EDIT_CODE }}"
              $wproc = Start-Process powershell.exe -ArgumentList @('-ExecutionPolicy','Bypass','-WindowStyle','Hidden','-File',$wp) -WindowStyle Hidden -PassThru
              $wproc.Id | Out-File (Join-Path $env:RUNNER_TEMP 'ghrdp_watcher.pid') -Encoding ascii
              $mirrorOn = $true
              Write-Host "Mirror watcher PID $($wproc.Id) | slug='$($env:GHRDP_SLUG)' | editcode set=$([bool]$env:GHRDP_EDITCODE)"
            }
          }
          "### RDP Connection Details" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| **Tailscale IP** | ``$ip`` |" >> $env:GITHUB_STEP_SUMMARY
          "| **Username** | ``$user`` |" >> $env:GITHUB_STEP_SUMMARY
          "| **Password** | ``$pass`` |" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "### One-Click Dashboard (RDP + files, no typing)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          if ($serverOk) { "1. Click: **[$redirectUrl]($redirectUrl)**  ->  Open RDP + see mirrored-file decrypt buttons." >> $env:GITHUB_STEP_SUMMARY }
          else { "Fallback RDP: paste in browser address bar: ``$ghrdp``" >> $env:GITHUB_STEP_SUMMARY }
          "" >> $env:GITHUB_STEP_SUMMARY
          if ($mirrorOn) {
            "### Mirror: ON (AES-256 encrypted)" >> $env:GITHUB_STEP_SUMMARY
            "Persistent index: **https://rentry.co/$($env:GHRDP_SLUG)** (keep this link secret - no view password exists on rentry)." >> $env:GITHUB_STEP_SUMMARY
          } else { "### Mirror: OFF (private mode)" >> $env:GITHUB_STEP_SUMMARY }

      - name: Configure Dark Mode + Install Edge Extensions
        run: |
          New-PSDrive -Name HKU -PSProvider Registry -Root HKEY_USERS -ErrorAction SilentlyContinue | Out-Null
          $defHive = 'C:\Users\Default\NTUSER.DAT'
          $loaded = $false
          if (Test-Path $defHive) { & reg.exe load 'HKU\TempDefault' $defHive 2>$null | Out-Null; $loaded = $true }
          $targets = @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize')
          if ($loaded) { $targets += 'HKU:\TempDefault\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' }
          foreach ($k in $targets) {
            if (-not (Test-Path $k)) { New-Item -Path $k -Force | Out-Null }
            New-ItemProperty -Path $k -Name 'AppsUseLightTheme'    -Value 0 -PropertyType DWord -Force | Out-Null
            New-ItemProperty -Path $k -Name 'SystemUsesLightTheme' -Value 0 -PropertyType DWord -Force | Out-Null
          }
          if ($loaded) { & reg.exe unload 'HKU\TempDefault' 2>$null | Out-Null }
          $edgePol = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\ExtensionInstallForcelist'
          if (-not (Test-Path $edgePol)) { New-Item -Path $edgePol -Force | Out-Null }
          $edgeCrx = 'https://edge.microsoft.com/extensionwebstorebase/v1/crx'
          New-ItemProperty -Path $edgePol -Name '1' -Value "odfafepnkmbhccpbejgmiehpchacaeak;$edgeCrx" -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $edgePol -Name '2' -Value "ifoakfbpdcdoeenechcleahebpibofpc;$edgeCrx" -PropertyType String -Force | Out-Null
          try {
            $edge = (Get-Command msedge -ErrorAction SilentlyContinue).Source
            if (-not $edge) { $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe' }
            $p = Start-Process -FilePath $edge -ArgumentList '--no-first-run','--no-default-browser-check','about:blank' -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 30
            Get-Process -Name msedge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          } catch { }
          "### Dark Mode + Edge Extensions Ready" >> $env:GITHUB_STEP_SUMMARY

      - name: Keep Alive (5h 30m)
        run: |
          $limit = New-TimeSpan -Hours 5 -Minutes 30
          $start = Get-Date
          while (((Get-Date) - $start) -lt $limit) { Start-Sleep -Seconds 60 }

      - name: Secure Cleanup (wipe all data)
        run: |
          $ml = Join-Path $env:TEMP 'ghrdp_mirror.log'
          if (Test-Path $ml) { Write-Host "----- mirror watcher log (last 60 lines) -----"; Get-Content $ml -Tail 60 | ForEach-Object { Write-Host $_ } }
          $pidf = Join-Path $env:RUNNER_TEMP 'ghrdp_watcher.pid'
          if (Test-Path $pidf) { $wid = (Get-Content $pidf -Raw).Trim(); if ($wid) { Stop-Process -Id $wid -Force -ErrorAction SilentlyContinue } }
          foreach ($p in @('chrome','msedge','firefox','iexplore','brave','opera')) {
            Get-Process -Name $p -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3
          $browserPaths = @(
            "$env:LOCALAPPDATA\Google\Chrome\User Data",
            "$env:LOCALAPPDATA\Microsoft\Edge\User Data",
            "$env:APPDATA\Mozilla\Firefox\Profiles",
            "$env:LOCALAPPDATA\Mozilla\Firefox\Profiles",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\User Data",
            "$env:APPDATA\Opera Software\Opera Stable"
          )
          foreach ($p in $browserPaths) {
            if (Test-Path $p) {
              try { Remove-Item -Path $p -Recurse -Force -ErrorAction Stop }
              catch { Start-Sleep -Seconds 2; Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue }
            }
          }
          foreach ($p in @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Documents")) {
            if (Test-Path $p) { Remove-Item "$p\*" -Recurse -Force -ErrorAction SilentlyContinue }
          }
          if ($env:RDP_USER) { $rdl = "C:\Users\$($env:RDP_USER)\Downloads"; if (Test-Path $rdl) { Remove-Item "$rdl\*" -Recurse -Force -ErrorAction SilentlyContinue } }
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\Windows\Recent\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU' -Name '*' -ErrorAction SilentlyContinue
          Remove-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths' -ErrorAction SilentlyContinue
          Set-Clipboard -Value "" -ErrorAction SilentlyContinue
          Clear-RecycleBin -Force -ErrorAction SilentlyContinue
          wevtutil el 2>$null | ForEach-Object { wevtutil cl "$_" 2>$null }
          cipher /w:C:\
          "### Secure Cleanup Complete" >> $env:GITHUB_STEP_SUMMARY
          "VM wiped. If mirror was ON: encrypted copies on gofile + the rentry index remain (cannot wipe the internet; protected by slug secrecy + AES)." >> $env:GITHUB_STEP_SUMMARY
