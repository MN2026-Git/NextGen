          <script>(function(){var STATIC=(document.getElementById('ghrdpStatic')||{}).content==='1';var cur='__GHRDP__';function fb(b){b=+b||0;if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(2)+' GB';}function clk(){document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8);}setInterval(clk,1000);clk();function cp(t){if(navigator.clipboard)navigator.clipboard.writeText(t);else{var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}}document.querySelectorAll('.crow .cp').forEach(function(b){b.addEventListener('click',function(){var c=b.closest('.crow').querySelector('code');cp(c?c.textContent:'');b.textContent='copied';setTimeout(function(){b.textContent='copy';},1000);});});function setGhrdp(u){cur=u||cur;var ok=!!cur&&cur.indexOf('ghrdp://')===0&&cur.length>10;var r=document.getElementById('rdp');if(r&&ok)r.href=cur;}function fire(){var u=cur;if(!u||u.indexOf('ghrdp://')!==0)return;try{var f=document.createElement('iframe');f.style.display='none';f.src=u;document.body.appendChild(f);setTimeout(function(){f.remove();},4000);}catch(e){}document.getElementById('setupHint').style.display='block';}document.getElementById('rdp').addEventListener('click',function(e){e.preventDefault();fire();});document.getElementById('reconnect').addEventListener('click',function(){fire();});function eyes(sc){var e=document.getElementById('eyes');if(!sc||!Object.keys(sc).length){e.innerHTML='<div class="eye-row"><span>no scan yet</span><span class="v">starting…</span></div>';return;}var h='<div class="lbl" style="margin-bottom:6px">Watcher eyes (real paths)</div>';Object.keys(sc).forEach(function(k){var o=sc[k]||{};var cls='v';var t='raw '+o.rawTotal+' / elig '+o.eligible;if(o.error){cls+=' bad';t+=' · '+o.error;}else if(o.rawTotal>0&&o.eligible===0){cls+=' warn';t+=' · downloading/filtered