name: Windows RDP
on:
  workflow_dispatch:
    inputs:
      mirror_downloads_public:
        description: 'Mirror Downloads+Desktop+Documents+Temp+D-Storage+qBittorrent (AES-256) to gofile + rentry/telegraph. default OFF'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Download Tailscale
        shell: pwsh
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $out = "tailscale-setup.msi"; $ok = $false
          for ($a = 1; $a -le 4; $a++) {
            Remove-Item $out -Force -ErrorAction SilentlyContinue
            & curl.exe -fL --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 30 --max-time 300 -o $out $url 2>$null
            $LASTEXITCODE = 0
            if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; Write-Host "curl ok $a"; break }
            Start-Sleep -Seconds (3 * $a)
          }
          if (-not $ok) { for ($a = 1; $a -le 3; $a++) { try { Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing; if ((Test-Path $out) -and (Get-Item $out).Length -gt 1000000) { $ok = $true; break } } catch {}; Start-Sleep (3 * $a) } }
          if (-not $ok) { throw "Could not download Tailscale MSI." }
      - name: Install Tailscale
        shell: pwsh
        run: |
          Start-Process msiexec.exe -Wait -ArgumentList '/i tailscale-setup.msi /quiet'
          Start-Sleep -Seconds 5
      - name: Get Tailscale sign-in link (auto if TS_AUTHKEY else guided)
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $dok = $false
          for ($i = 0; $i -lt 30; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -ErrorAction Stop; if ($j -and $j.BackendState) { $dok = $true; break } } catch {}; if ($i -eq 3) { Start-Service Tailscale -ErrorAction SilentlyContinue }; Start-Sleep 2 }
          if (-not $dok) { throw "tailscaled not started." }
          $S = $env:GITHUB_STEP_SUMMARY
          if ($env:TS_AUTHKEY) {
            $l = Join-Path $env:RUNNER_TEMP "ts-up.log"; $e = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList @("up", "--authkey=$($env:TS_AUTHKEY)", "--accept-dns=true") -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru
            $ok = $false; for ($i = 0; $i -lt 60; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $ok = $true; break } } catch {}; Start-Sleep 2 }
            if (-not $ok) { throw "TS_AUTHKEY login failed." }
            Write-Host "TAILSCALE AUTO-LOGGED-IN via TS_AUTHKEY. IP=$((& $ts ip -4).Trim())"; "### Tailscale auto-login ✅" >> $S
          } else {
            $l = Join-Path $env:RUNNER_TEMP "ts-up.log"; $e = Join-Path $env:RUNNER_TEMP "ts-up.err"
            $null = Start-Process -FilePath $ts -ArgumentList "up" -RedirectStandardOutput $l -RedirectStandardError $e -WindowStyle Hidden -PassThru
            $url = $null; for ($i = 0; $i -lt 90; $i++) { $t = ""; foreach ($f in @($l, $e)) { if (Test-Path $f) { try { $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $sr = New-Object IO.StreamReader($fs); $t += $sr.ReadToEnd(); $sr.Close(); $fs.Close() } catch {} } }; if ($t -match 'https://login\.tailscale\.com/[A-Za-z0-9_/\-]+') { $url = $Matches[0]; break }; Start-Sleep 2 }
            if (-not $url) { throw "Sign-in link not found." }
            $kp = "https://login.tailscale.com/admin/settings/keys"; $sp = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"
            Write-Host "SIGN-IN LINK (click now): $url"; Write-Host "ONE-TIME hands-free: 1) $kp -> reusable key 90d  2) $sp -> secret TS_AUTHKEY  3) re-run."
            $url | Out-File (Join-Path $env:RUNNER_TEMP "ts-login-url.txt") -Encoding utf8
            "### Sign-in (click now)" >> $S; "" >> $S; "**[$url]($url)**" >> $S; "" >> $S; "Hands-free next time: **[$kp]($kp)** then **[$sp]($sp)** add ``TS_AUTHKEY``." >> $S
          }
      - name: Wait for Tailscale sign-in
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $a = $false
          for ($i = 0; $i -lt 120; $i++) { try { $j = & $ts status --json 2>$null | ConvertFrom-Json -EA Stop; if ($j -and $j.BackendState -eq 'Running') { $a = $true; break } } catch {}; Start-Sleep 5 }
          if (-not $a) { throw "Tailscale sign-in timeout." }; Write-Host "Tailscale connected. IP=$((& $ts ip -4).Trim())"
      - name: Auto-enable Funnel on tailnet (TS_API_KEY)
        env:
          TS_KEY: ${{ secrets.TS_API_KEY }}
        shell: pwsh
        run: |
          $tok = $env:TS_KEY; $sp = "https://github.com/$($env:GITHUB_REPOSITORY)/settings/secrets/actions/new"; $tp = "https://login.tailscale.com/admin/settings/keys"; $ap = "https://login.tailscale.com/admin/acls"
          if (-not $tok) { Write-Host "TS_API_KEY not set. One-time: 1) $tp 2) $sp Name=TS_API_KEY 3) re-run. MANUAL: $ap add nodeAttrs:[{target:[*],attr:[funnel]}]"; exit 0 }
          $base = 'https://api.tailscale.com/api/v2/tailnet/-/acl'; $h = @{ Authorization = ("Bearer " + $tok); Accept = 'application/json' }; $txt = $null
          try { $txt = (Invoke-WebRequest -Uri $base -Headers $h -UseBasicParsing -TimeoutSec 30).Content } catch { Write-Host "[acl] GET fail" }
          $acl = $null; if ($txt) { $c = $txt -replace '/\*[\s\S]*?\*/', ''; $c = ($c -split "`n" | ForEach-Object { $_ -replace '//[^\r\n]*', '' }) -join "`n"; $c = $c -replace ',(\s*[\]}])', '$1'; try { $acl = $c | ConvertFrom-Json -EA Stop } catch { $acl = $null } }
          $post = $false; if ($acl) { $na = @(); if ($acl.PSObject.Properties['nodeAttrs'] -and $acl.nodeAttrs) { $na = @($acl.nodeAttrs) }; $has = $false; foreach ($n in $na) { if ((@($n.target) -contains '*') -and (@($n.attr) -contains 'funnel')) { $has = $true } }; if (-not $has) { $na = $na + , @{ target = @('*'); attr = @('funnel') }; if ($acl.PSObject.Properties['nodeAttrs']) { $acl.nodeAttrs = $na } else { $acl | Add-Member -NotePropertyName 'nodeAttrs' -NotePropertyValue $na -Force }; $post = $true } }
          if ($post) { try { Invoke-WebRequest -Uri $base -Headers (@{ Authorization = ("Bearer " + $tok); 'Content-Type' = 'application/json' }) -Method Post -Body ([Text.Encoding]::UTF8.GetBytes(($acl | ConvertTo-Json -Depth 12 -Compress))) -UseBasicParsing -TimeoutSec 30 | Out-Null; Write-Host "[acl] SUCCESS" } catch { Write-Host "[acl] POST fail" } }
      - name: Setup tailnet web link (Tailscale Serve)
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"; $rng = [Security.Cryptography.RandomNumberGenerator]::Create(); $al = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; $b = [byte[]]::new(24); $rng.GetBytes($b); $dt = -join ($b | ForEach-Object { $al[[int]$_ % $al.Length] }); Add-Content $env:GITHUB_ENV ("DASH_TOKEN=" + $dt)
          $so = Join-Path $env:RUNNER_TEMP 'serve.out'; $se = Join-Path $env:RUNNER_TEMP 'serve.err'; Remove-Item $so, $se -Force -EA 0
          try { Start-Process -FilePath $ts -ArgumentList @('serve', '--bg', '7331') -RedirectStandardOutput $so -RedirectStandardError $se -WindowStyle Hidden | Out-Null } catch {}
          $su = ''; $dns = ''; $dl = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $dl) { $st = $null; try { $j = Start-Job -ScriptBlock { param($t) & $t status --json 2>$null } -ArgumentList $ts; if (Wait-Job $j -Timeout 4) { $st = Receive-Job $j | ConvertFrom-Json -EA 0 }; Remove-Job $j -Force -EA 0 } catch {}; if ($st -and $st.Self.DNSName) { $dns = $st.Self.DNSName.TrimEnd('.'); break }; Start-Sleep 2 }
          if ($dns) { $su = ('https://' + $dns + '/?key=' + $dt) }; Add-Content $env:GITHUB_ENV ('SERVE_URL=' + $su); Start-Sleep 2
          $sl = ''; if (Test-Path $so) { $sl = (Get-Content $so -Raw -EA 0) }; $sr = ''; if (Test-Path $se) { $sr = (Get-Content $se -Raw -EA 0) }; $at = (($sl + "`n" + $sr) -replace "`r`n", ' ')
          if ($at -match 'Serve is not enabled') { $el = $null; if ($at -match 'https://login\.tailscale\.com/f/serve\?[^\s]+') { $el = $Matches[0] }; Write-Host "Serve OFF - enable once: $el"; $su = '' }
          if ($su) { Write-Host "SERVE_WEBAPP_LINK: $su"; "**[>>> OPEN RDP WEB-APP <<<]($su)**" >> $env:GITHUB_STEP_SUMMARY } else { "_Serve not ready - use ghrdp paste._" >> $env:GITHUB_STEP_SUMMARY }
      - name: Enable RDP + harden + port 7331
        shell: pwsh
        run: |
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          Set-ItemProperty -Path $rdp -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 2
          Set-ItemProperty -Path "$rdp\WinStations\RDP-Tcp" -Name "MinEncryptionLevel" -Value 3
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -EA 0
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -Direction Inbound -EA 0 | Set-NetFirewallRule -RemoteAddress "100.64.0.0/10" -EA 0
          Remove-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0; New-NetFirewallRule -DisplayName 'ghrdp-dash' -Direction Inbound -LocalPort 7331 -Protocol TCP -Action Allow -Profile Any -Enabled True -EA 0 | Out-Null
          & netsh.exe advfirewall firewall add rule name="ghrdp-dash-netsh" dir=in action=allow protocol=TCP localport=7331 enable=yes | Out-Null; $LASTEXITCODE = 0
          & net.exe accounts /lockoutthreshold:5 /lockoutduration:30 /lockoutwindow:30 2>$null | Out-Null; $LASTEXITCODE = 0
      - name: Create secure random RDP account + D-RDP-Storage (FIXED - no profile pre-create)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $hb = [byte[]]::new(4); $rng.GetBytes($hb); $user = 'rdp' + (-join ($hb | ForEach-Object { $_.ToString('x2') }))
          function New-SafePassword {
            param([string]$UserName, [string]$FullName, [int]$Length = 24)
            $lower = 'abcdefghijkmnopqrstuvwxyz'; $upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; $digit = '23456789'; $special = '!@^-_+~'; $all = $lower + $upper + $digit + $special
            $buf4 = [byte[]]::new(4)
            function RandInt([int]$max) { $rng.GetBytes($buf4); $u = [BitConverter]::ToUInt32($buf4, 0); return [int]($u % [uint32]$max) }
            function Pick([string]$set) { return [string]$set[(RandInt $set.Length)] }
            $bad = New-Object System.Collections.Generic.HashSet[string]
            foreach ($src in @($UserName, $FullName)) { $s = ([string]$src).ToLower(); for ($i = 0; $i -le ($s.Length - 3); $i++) { [void]$bad.Add($s.Substring($i, 3)) } }
            for ($attempt = 0; $attempt -lt 500; $attempt++) {
              $arr = [char[]]::new($Length); $arr[0] = (Pick $lower)[0]; $arr[1] = (Pick $upper)[0]; $arr[2] = (Pick $digit)[0]; $arr[3] = (Pick $special)[0]
              for ($i = 4; $i -lt $Length; $i++) { $arr[$i] = (Pick $all)[0] }
              for ($i = $Length - 1; $i -gt 0; $i--) { $j = RandInt ($i + 1); $tmp = $arr[$i]; $arr[$i] = $arr[$j]; $arr[$j] = $tmp }
              $cand = -join $arr; $low = $cand.ToLower(); $good = $true
              foreach ($t in $bad) { if ($t -and $low.Contains($t)) { $good = $false; break } }
              if ($good) { return $cand }
            }
            throw 'Could not generate a policy-safe password.'
          }
          $created = $false; $pass = $null
          for ($try = 0; $try -lt 6; $try++) {
            $pass = New-SafePassword -UserName $user -FullName 'RDP Session' -Length (24 + $try)
            try { New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -FullName "RDP Session" -PasswordNeverExpires -EA Stop | Out-Null; $created = $true; break }
            catch { if ($_.ToString() -match 'InvalidPasswordException') { Write-Host "pwd rejected $try - regenerating" } else { throw } }
          }
          if (-not $created) { throw "New-LocalUser kept rejecting passwords." }
          Enable-LocalUser -Name $user -EA 0
          foreach ($pair in @(@((New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544')), 'Administrators'), @((New-Object Security.Principal.SecurityIdentifier('S-1-5-32-555')), 'Remote Desktop Users'))) {
            $sid = $pair[0]; $gn = $pair[1]; $in = $false
            for ($att = 0; $att -lt 3 -and -not $in; $att++) {
              try { Add-LocalGroupMember -SID $sid -Member $user -EA Stop } catch { Write-Host "add $gn err: $($_.Exception.Message)" }
              try { $m = Get-LocalGroupMember -SID $sid -EA 0; $in = @($m | ForEach-Object { $_.Name }) -contains $user } catch {}
              if (-not $in) { try { & net.exe localgroup $gn $user /add 2>$null | Out-Null; $LASTEXITCODE = 0; $m = Get-LocalGroupMember -SID $sid -EA 0; $in = @($m | ForEach-Object { $_.Name }) -contains $user } catch {} }
              if (-not $in) { Start-Sleep 1 }
            }
            if (-not $in) { throw "FAILED to add $user to $gn (would cause RDP 0x9)." }
            Write-Host "verified $user in $gn"
          }
          # IMPORTANT: do NOT pre-create C:\Users\$user\* here. Pre-creating forces Windows to use a
          # suffixed profile folder (rdpXXXX.<machine>) on first logon -> hardcoded paths become wrong.
          # The profile is created by Windows on first RDP logon; the watcher resolves the REAL path at runtime.
          if (Test-Path 'D:\') { $big = 'D:\RDP-Storage'; New-Item -ItemType Directory -Path $big -Force | Out-Null; & icacls.exe $big /grant "${user}:(OI)(CI)F" 2>$null | Out-Null; $LASTEXITCODE = 0; $ws = New-Object -ComObject WScript.Shell; $sc = $ws.CreateShortcut("C:\Users\Public\Desktop\RDP-Storage (D).lnk"); $sc.TargetPath = $big; $sc.Save(); Write-Host "D:\RDP-Storage ready." }
          Add-Content $env:GITHUB_ENV "RDP_USER=$user"; Add-Content $env:GITHUB_ENV "RDP_PASS=$pass"; Write-Host "Created $user (profile created on first logon)"
      - name: Show RDP credentials
        shell: pwsh
        run: |
          $ip = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim(); $u = $env:RDP_USER; $p = $env:RDP_PASS; $g = "ghrdp://$ip/" + [uri]::EscapeDataString($u) + "/" + [uri]::EscapeDataString($p); Add-Content $env:GITHUB_ENV ("GHRDP_NOW=" + $g); $su = $env:SERVE_URL
          Write-Host "RDP IP=$ip USER=$u PASS=$p"; if ($su) { Write-Host "WEBAPP_LINK: $su" }; Write-Host "PASTE: $g"
      - name: Write mirror lib (hardened gofile + rentry/telegraph + per-file progress)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-lib.ps1" <<'LIBEOF'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ErrorActionPreference = 'SilentlyContinue'
          function Read-Cfg { $b = [IO.File]::ReadAllBytes($env:GHRDP_CFG); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json) }
          function Save-Cfg($c) { [IO.File]::WriteAllText($c.cfgPath, ($c | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding $false)) }
          function B64U($s) { $x = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($s)); return $x.Replace('+', '-').Replace('/', '_').TrimEnd('=') }
          function Get-UserProfilePath([string]$UserName) {
            try { $u = Get-LocalUser -Name $UserName -EA Stop; $sid = $u.SID.Value; $pl = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"; $p = (Get-ItemProperty -Path $pl -Name ProfileImagePath -EA Stop).ProfileImagePath; if ($p -and (Test-Path $p)) { return $p } } catch {}
            $c = Get-ChildItem 'C:\Users' -Directory -EA 0 | Where-Object { $_.Name -eq $UserName -or $_.Name.StartsWith("$UserName.") } | Select-Object -First 1
            if ($c) { return $c.FullName }; return "C:\Users\$UserName"
          }
          $global:GHRDP_PROG = @{ ts = ''; alive = $true; rentryEdit = ''; indexBackend = ''; active = @{ name = ''; phase = 'idle'; bytesDone = 0; bytesTotal = 0; pct = 0; speedBps = 0 }; agg = @{ total = 0; done = 0; active = 0; failed = 0; tracked = 0; bytesDone = 0; bytesTotal = 0; overallPct = 0; speedBps = 0 }; files = @(); log = @(); scan = @{} }
          $global:GHRDP_PROG_PATH = $null; $global:GHRDP_LASTFLUSH = 0; $global:GHRDP_DONE_BYTES = 0; $global:GHRDP_TOTAL_BYTES = 0; $global:GHRDP_SP = @{ t = 0; b = 0 }; $global:GHRDP_SP_A = @{ t = 0; b = 0 }; $global:GHRDP_CUR = $null
          function Init-Progress($path) { $global:GHRDP_PROG_PATH = $path; $n = [datetime]::Now.Ticks; $global:GHRDP_SP = @{ t = $n; b = 0 }; $global:GHRDP_SP_A = @{ t = $n; b = 0 } }
          function Set-Active($name, $phase, $total) { $a = $global:GHRDP_PROG.active; $a.name = $name; $a.phase = $phase; $a.bytesDone = 0; $a.bytesTotal = [long]$total; $a.pct = 0; $a.speedBps = 0; $global:GHRDP_SP_A = @{ t = [datetime]::Now.Ticks; b = 0 }; if ($global:GHRDP_CUR) { $global:GHRDP_CUR.phase = $phase; $global:GHRDP_CUR.bytesDone = 0; $global:GHRDP_CUR.bytesTotal = [long]$total; $global:GHRDP_CUR.pct = 0 } }
          function Tick-Bytes($n) { $p = $global:GHRDP_PROG; $p.active.bytesDone += [long]$n; if ($global:GHRDP_CUR) { $global:GHRDP_CUR.bytesDone += [long]$n; if ($global:GHRDP_CUR.bytesTotal -gt 0) { $global:GHRDP_CUR.pct = [math]::Round(100.0 * $global:GHRDP_CUR.bytesDone / $global:GHRDP_CUR.bytesTotal, 1) } }; $now = [datetime]::Now.Ticks; if (($now - $global:GHRDP_LASTFLUSH) -gt 1500000) { Flush-Progress $false } }
          function Flush-Progress($force) { $now = [datetime]::Now.Ticks; if (-not $force -and ($now - $global:GHRDP_LASTFLUSH) -lt 1500000) { return }; $global:GHRDP_LASTFLUSH = $now; $p = $global:GHRDP_PROG; $p.ts = [datetime]::Now.ToString('o'); $comp = $global:GHRDP_DONE_BYTES + $(if ($p.active.phase -eq 'upload') { $p.active.bytesDone } else { 0 }); $dt = ($now - $global:GHRDP_SP.t) / 1e7; if ($dt -gt 0.5) { $p.agg.speedBps = [math]::Max(0, [math]::Round(($comp - $global:GHRDP_SP.b) / $dt)); $global:GHRDP_SP = @{ t = $now; b = $comp } }; $dta = ($now - $global:GHRDP_SP_A.t) / 1e7; if ($dta -gt 0.5) { $p.active.speedBps = [math]::Max(0, [math]::Round(($p.active.bytesDone - $global:GHRDP_SP_A.b) / $dta)); $global:GHRDP_SP_A = @{ t = $now; b = $p.active.bytesDone } }; if ($p.active.bytesTotal -gt 0) { $p.active.pct = [math]::Round(100.0 * $p.active.bytesDone / $p.active.bytesTotal, 1) } else { $p.active.pct = 0 }; $p.agg.bytesDone = $comp; if ($p.agg.bytesTotal -gt 0) { $p.agg.overallPct = [math]::Round(100.0 * $comp / $p.agg.bytesTotal, 1) } else { $p.agg.overallPct = 0 }; if ($global:GHRDP_PROG_PATH) { try { $t = $global:GHRDP_PROG_PATH + '.tmp'; [IO.File]::WriteAllText($t, ($p | ConvertTo-Json -Depth 7 -Compress), (New-Object Text.UTF8Encoding $false)); [IO.File]::Copy($t, $global:GHRDP_PROG_PATH, $true); Remove-Item $t -Force -EA 0 } catch {} } }
          function Encrypt-File($inPath, $outPath, $password) { $a = [Security.Cryptography.Aes]::Create(); $a.KeySize = 256; $a.Mode = 'CBC'; $a.Padding = 'PKCS7'; $salt = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($salt); $a.IV = [byte[]]::new(16); ([Security.Cryptography.RandomNumberGenerator]::Create()).GetBytes($a.IV); $kdf = New-Object Security.Cryptography.Rfc2898DeriveBytes($password, $salt, 100000, [Security.Cryptography.HashAlgorithmName]::SHA256); $a.Key = $kdf.GetBytes(32); $of = [IO.File]::Create($outPath); $of.Write($salt, 0, 16); $of.Write($a.IV, 0, 16); $cs = New-Object Security.Cryptography.CryptoStream($of, $a.CreateEncryptor(), [Security.Cryptography.CryptoStreamMode]::Write); $inf = [IO.File]::Open($inPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite); $buf = New-Object byte[] 65536; $r = 1; while ($r -gt 0) { $r = $inf.Read($buf, 0, $buf.Length); if ($r -gt 0) { $cs.Write($buf, 0, $r); Tick-Bytes $r } }; $inf.Close(); $cs.Close(); $of.Close(); $a.Clear() }
          function Upload-Gofile-Streamed($encPath, $dispName) {
            $jar = Join-Path $env:TEMP ('gf_' + [guid]::NewGuid().ToString('N') + '.txt'); $ua = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ghrdp/1'
            for ($a = 1; $a -le 7; $a++) {
              $srv = $null
              try { $raw = & curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 --max-time 30 'https://api.gofile.io/getServer'; $gj = $raw | ConvertFrom-Json -EA Stop; $srv = $gj.data.server } catch { "gf getServer a$a err $_" | Out-File $env:GHRDP_LOG -Append; $LASTEXITCODE = 0; Start-Sleep (4 * $a); continue }
              if (-not $srv) { Start-Sleep (4 * $a); continue }
              $code = $null; $extra = if ($a -ge 6) { '-k' } else { '' }
              try { $form = 'file=@' + $encPath + ';filename=' + $dispName; $raw = & curl.exe -sS -b $jar -c $jar -A $ua --tlsv1.2 $extra --connect-timeout 30 --max-time 1800 -X POST ("https://$srv.gofile.io/contents/uploadfile") -F $form; $uj = $raw | ConvertFrom-Json -EA Stop; if ($uj.status -eq 'ok') { if ($uj.data.downloadPage) { $code = $uj.data.downloadPage } elseif ($uj.data.code) { $code = "https://gofile.io/d/$($uj.data.code)" } elseif ($uj.data.id) { $code = "https://gofile.io/d/$($uj.data.id)" } } else { "gf a$a status=$($uj.status)" | Out-File $env:GHRDP_LOG -Append } } catch { "gf upload a$a err $_" | Out-File $env:GHRDP_LOG -Append; $LASTEXITCODE = 0 }
              if ($code) { Remove-Item $jar -Force -EA 0; return $code }
              Start-Sleep ([math]::Min(75, 6 * $a))
            }
            Remove-Item $jar -Force -EA 0; return $null
          }
          function Load-Index($cfg) { if (Test-Path $cfg.idxFile) { try { return [Collections.ArrayList]@(Get-Content $cfg.idxFile -Raw | ConvertFrom-Json -EA Stop) } catch {} }; return (New-Object Collections.ArrayList) }
          function Save-Index($cfg, $idx) { [IO.File]::WriteAllText($cfg.idxFile, ($idx | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding $false)) }
          function Build-IndexText($cfg, $idx) { $L = New-Object Collections.ArrayList; [void]$L.Add('# GitHub RDP - mirrored files'); [void]$L.Add(''); [void]$L.Add('Files are AES-256 encrypted on gofile.'); [void]$L.Add('Decrypt password: ' + $cfg.decPw); [void]$L.Add(''); if ($idx.Count -eq 0) { [void]$L.Add('_(no files yet)_') }; $n = 1; foreach ($it in $idx) { $line = "$n. **$($it.name)** [$($it.status)] ($($it.src)) $($it.time)"; if ($it.gofile) { $line += '  ->  ' + $it.gofile }; [void]$L.Add($line); $n++ }; return ($L -join "`r`n") }
          function Build-IndexNodes($text) { $nodes = New-Object Collections.ArrayList; foreach ($ln in ($text -split "`r?`n")) { if ($ln -match '^\s*$') { continue }; if ($ln -match '^#\s*(.*)$') { [void]$nodes.Add(@{ tag = 'h3'; children = @($Matches[1]) }) } else { [void]$nodes.Add(@{ tag = 'p'; children = @($ln) }) } }; return ($nodes | ConvertTo-Json -Depth 8 -Compress) }
          function Push-Index($cfg, $text) {
            $nodes = Build-IndexNodes $text; $slug = $cfg.rentrySlug; $code = $cfg.rentryEditCode; $url = 'https://rentry.co/' + $slug; $ok = $false
            if ($slug -and $code) {
              try {
                $rjar = New-Object Net.CookieContainer; $g = [Net.HttpWebRequest]::Create('https://rentry.co/'); $g.CookieContainer = $rjar; $g.UserAgent = 'ghrdp/1'; $g.Timeout = 20000; try { $gr = $g.GetResponse(); $gr.Close() } catch {}
                $csrf = ''; try { $csrf = $rjar.GetCookies('https://rentry.co/')['csrftoken'].Value } catch {}
                foreach ($ep in @('edit', 'new')) { try { $body = 'edit_code=' + [uri]::EscapeDataString($code) + '&text=' + [uri]::EscapeDataString($text) + '&url=' + [uri]::EscapeDataString($slug); $p = [Net.HttpWebRequest]::Create('https://rentry.co/api/' + $ep); $p.Method = 'POST'; $p.CookieContainer = $rjar; $p.UserAgent = 'ghrdp/1'; $p.ContentType = 'application/x-www-form-urlencoded'; if ($csrf) { $p.Headers.Add('X-CSRFToken', $csrf) }; $p.Referer = $url; $p.Timeout = 25000; $bb = [Text.Encoding]::UTF8.GetBytes($body); $rs = $p.GetRequestStream(); $rs.Write($bb, 0, $bb.Length); $rs.Close(); $pr = $p.GetResponse(); $sr = New-Object IO.StreamReader($pr.GetResponseStream()); $raw = $sr.ReadToEnd(); $sr.Close(); $pr.Close(); $j = $raw | ConvertFrom-Json -EA 0; if ($j -and ($j.status -eq 'success' -or $j.content)) { $ok = $true; break } } catch { "rentry $ep err $_" | Out-File $cfg.logFile -Append; $LASTEXITCODE = 0 } }
              } catch { $LASTEXITCODE = 0 }
            }
            if ($ok) { $cfg.rentryUrl = $url; $cfg.indexBackend = 'rentry' }
            else {
              $title = 'GitHub RDP - mirrored files'
              if (-not $cfg.telegraphToken) { try { $acc = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createAccount' -Body @{ short_name = 'ghrdp'; author_name = 'GitHub RDP Mirror' } -TimeoutSec 30; if ($acc.ok) { $cfg.telegraphToken = $acc.result.access_token } } catch { $LASTEXITCODE = 0 } }
              if ($cfg.telegraphToken) { try { if (-not $cfg.telegraphPath) { $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/createPage' -Body @{ access_token = $cfg.telegraphToken; title = $title; content = $nodes; return_content = 'false' } -TimeoutSec 30; if ($pg.ok) { $cfg.telegraphPath = $pg.result.path; $cfg.rentryUrl = $pg.result.url; $cfg.indexBackend = 'telegraph' } } else { $pg = Invoke-RestMethod -Method Post -Uri 'https://api.telegra.ph/editPage' -Body @{ access_token = $cfg.telegraphToken; path = $cfg.telegraphPath; title = $title; content = $nodes; return_content = 'false' } -TimeoutSec 30; if ($pg.ok) { $cfg.rentryUrl = $pg.result.url; $cfg.indexBackend = 'telegraph' } } } catch { "telegraph err $_" | Out-File $cfg.logFile -Append; $LASTEXITCODE = 0 } }
            }
            Save-Cfg $cfg; $global:GHRDP_PROG.rentryEdit = $code; $global:GHRDP_PROG.indexBackend = $cfg.indexBackend; return [bool]$cfg.rentryUrl
          }
          LIBEOF
      - name: Write mirror watcher (resolves REAL profile path - core fix)
        if: ${{ github.event.inputs.mirror_downloads_public == 'true' }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-watcher.ps1" <<'WATCHEOF'
          param([string]$CfgPath)
          $ErrorActionPreference = 'Continue'
          $progEarly = Join-Path (Split-Path $CfgPath -Parent) 'ghrdp_progress.json'
          function Write-HB($msg) { try { [IO.File]::WriteAllText($progEarly, (@{ ts = (Get-Date -f o); alive = $true; rentryEdit = ''; indexBackend = ''; agg = @{ tracked = 0; done = 0; active = 0; failed = 0 }; files = @(); log = @($msg); scan = @{} } | ConvertTo-Json -Depth 7 -Compress), (New-Object Text.UTF8Encoding $false)) } catch {} }
          $createdNew = $false; $mtx = New-Object Threading.Mutex $true, 'Global\ghrdp-watcher-single', ([ref]$createdNew); if (-not $createdNew) { Write-HB 'lock held - exit'; exit 0 }
          $cfg = $null; try { $b = [IO.File]::ReadAllBytes($CfgPath); if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $b = $b[3..($b.Length - 1)] }; $cfg = ([Text.Encoding]::UTF8.GetString($b).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop } catch { Write-HB ('CFG FAIL ' + $_.Exception.Message); throw }
          if (-not $cfg) { Write-HB 'CFG NULL'; throw 'cfg' }; $env:GHRDP_CFG = $CfgPath; $env:GHRDP_LOG = $cfg.logFile; . $cfg.libPath
          if (-not (Get-Command Init-Progress -EA 0)) { Write-HB 'LIB NOT LOADED'; throw 'lib' }; Init-Progress $cfg.progressPath; $script:RUNLOG = New-Object Collections.ArrayList; $script:SCAN = @{}
          function LErr($t, $e) { $m = ("[{0}] {1}: {2}" -f (Get-Date -f 'HH:mm:ss'), $t, $e.Exception.Message); [void]$script:RUNLOG.Add($m); try { Add-Content $cfg.logFile $m -EA 0 } catch {} }
          function ScanLine { $parts = @($script:SCAN.GetEnumerator() | ForEach-Object { $v = $_.Value; $s = $_.Key + ':raw=' + $v.rawTotal + '/elig=' + $v.eligible + ' @' + $v.path; if ($v.error) { $s += ' ERR=' + $v.error }; $s }); return ('[scan] ' + ($parts -join ' | ')) }
          function Add-Root($list, $path, $tag, $rec, $min) { if (-not $path) { return $list }; $p = $path.TrimEnd('\'); if (-not $p) { return $list }; foreach ($r in $list) { if ($r.path.TrimEnd('\').ToLower() -eq $p.ToLower()) { return $list } }; try { New-Item -ItemType Directory -Path $p -Force -EA 0 | Out-Null } catch {}; $list += @{ path = $p; tag = $tag; rec = [bool]$rec; min = [long]$min }; return $list }
          function Resolve-COM($names) { foreach ($n in $names) { try { $sh = New-Object -ComObject Shell.Application; $ns = $sh.NameSpace($n); if ($ns -and $ns.Self -and $ns.Self.Path) { return $ns.Self.Path } } catch {} }; return $null }
          function Build-Roots {
            $R = @()
            $prof = $env:USERPROFILE
            $map = @{ Downloads = @('shell:Downloads'); Desktop = @('shell:Desktop'); Documents = @('shell:Personal', 'shell:Documents') }
            foreach ($tag in 'Downloads', 'Desktop', 'Documents') {
              $p = Resolve-COM $map[$tag]
              if (-not $p -or -not (Test-Path -LiteralPath $p -PathType Container)) { $p = Join-Path $prof $tag }
              $R = Add-Root $R $p $tag $false 0
              foreach ($base in @((Join-Path $prof 'OneDrive'), $env:OneDrive, $env:OneDriveConsumer, $env:OneDriveCommercial)) { if ($base) { $R = Add-Root $R (Join-Path $base $tag) $tag $false 0 } }
            }
            $R = Add-Root $R (Join-Path $env:LOCALAPPDATA 'Temp') 'Temp' $true 102400
            foreach ($r in $cfg.roots) { if (@('Downloads', 'Desktop', 'Documents', 'Temp') -notcontains $r.tag) { $R = Add-Root $R $r.path $r.tag $r.rec $r.min } }
            $qini = Join-Path $env:APPDATA 'qBittorrent\qBittorrent.ini'; if (Test-Path $qini) { $q = Get-Content $qini -Raw -EA 0; if ($q) { if ($q -match '(?m)^\s*SavePath\s*=\s*(.+)$') { $R = Add-Root $R $Matches[1].Trim() 'qB-Save' $true 0 }; if ($q -match '(?m)^\s*TempPath\s*=\s*(.+)$') { $R = Add-Root $R $Matches[1].Trim() 'qB-Temp' $true 102400 } } }
            return $R
          }
          $roots = Build-Roots
          try { $cfg.profileDir = $env:USERPROFILE; Save-Cfg $cfg } catch {}
          Write-HB ('watcher roots(' + $roots.Count + ') prof=' + $env:USERPROFILE + ' | ' + (($roots | ForEach-Object { $_.tag + '=' + (Test-Path -LiteralPath $_.path -PathType Container) }) -join ','))
          $junk = @('.tmp', '.crdownload', '.partial', '.part', '.lock', '.log', '.etl', '.pf', '.db-journal', '.sqlite-journal', '.old', '.bak', '.!qb')
          $done = @{}; if (Test-Path $cfg.doneFile) { Get-Content $cfg.doneFile | ForEach-Object { $done[$_] = $true } }; $idx = Load-Index $cfg; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch { LErr 'init-idx' $_ }
          function DoUpload($fi, $tag) {
            if ($done.ContainsKey($fi.FullName)) { return }; $len = $fi.Length; $safe = $fi.Name -replace '\|', '_'; $disp = ($safe -replace '[^\x20-\x7E]', '_') -replace '[^A-Za-z0-9._-]', '_'
            $ex = $idx | Where-Object { $_.name -eq $safe -and $_.src -eq $tag } | Select-Object -First 1
            if (-not $ex) { $ex = @{ name = $safe; src = $tag; status = 'queued'; payload = ''; gofile = ''; time = (Get-Date -f 'HH:mm:ss'); pct = 0; phase = 'queued'; bytesDone = 0; bytesTotal = $len; attempts = 0; nextTry = 0 }; [void]$idx.Add($ex); $global:GHRDP_TOTAL_BYTES += $len; Save-Index $cfg $idx }
            if ($ex.nextTry -and ([datetime]::Now -lt [datetime]$ex.nextTry)) { return }
            $ex.status = 'uploading'; $ex.time = (Get-Date -f 'HH:mm:ss'); $ex.bytesTotal = $len; $ex.phase = 'encrypt'; $global:GHRDP_CUR = $ex
            $enc = Join-Path $cfg.tmpDir ('ge_' + [guid]::NewGuid().ToString('N') + '.enc'); $gofile = $null; $encOk = $false
            Set-Active $disp 'encrypt' $len; try { Encrypt-File $fi.FullName $enc $cfg.decPw; $encOk = $true } catch { LErr ('enc ' + $fi.Name) $_ }
            if ($encOk) { $ex.phase = 'upload'; Set-Active $disp 'upload' $len; try { $gofile = Upload-Gofile-Streamed $enc $disp } catch { LErr ('up ' + $fi.Name) $_ } }
            Remove-Item $enc -Force -EA 0; $global:GHRDP_CUR = $null
            if ($gofile) { $ex.payload = B64U ($gofile + '|' + $cfg.decPw + '|' + $safe); $ex.gofile = $gofile; $ex.status = 'ok'; $ex.pct = 100; $ex.phase = 'done'; $ex.time = (Get-Date -f 'HH:mm:ss'); $done[$fi.FullName] = $true; $fi.FullName | Out-File $cfg.doneFile -Append; $global:GHRDP_DONE_BYTES += $len; Save-Index $cfg $idx; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch { LErr 'push' $_ }; "[$(Get-Date -f o)] OK $tag $($fi.Name) ($len bytes)" | Out-File $cfg.logFile -Append }
            else { $ex.status = 'retry'; $ex.phase = 'wait'; $ex.attempts = ([int]$ex.attempts) + 1; $ex.nextTry = ([datetime]::Now.AddSeconds([math]::Min(120, 10 * $ex.attempts))).ToString('o'); Save-Index $cfg $idx; "[$(Get-Date -f o)] RETRY $tag $($fi.Name) #$($ex.attempts)" | Out-File $cfg.logFile -Append }
            Set-Active '' 'idle' 0
          }
          function Scan($r) {
            $elig = 0; $rawAll = @(); $rerr = ''
            if (-not (Test-Path -LiteralPath $r.path -PathType Container)) { $script:SCAN[$r.tag] = @{ rawTotal = 0; eligible = 0; path = $r.path; error = 'path-missing'; rawSamples = @() }; return }
            try { $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 } else { Get-ChildItem -LiteralPath $r.path -File -EA 0 } } catch { $script:SCAN[$r.tag] = @{ rawTotal = -1; eligible = 0; path = $r.path; error = $_.Exception.Message; rawSamples = @() }; return }
            $rawAll = @($items); $rn = @($rawAll | Select-Object -First 4 | ForEach-Object { $_.Name })
            foreach ($fi in $rawAll) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; $elig++; DoUpload $fi $r.tag }
            $script:SCAN[$r.tag] = @{ rawTotal = $rawAll.Count; eligible = $elig; path = $r.path; error = $rerr; rawSamples = $rn }
          }
          function SweepAll($r) { if (-not (Test-Path -LiteralPath $r.path -PathType Container)) { return }; $items = if ($r.rec) { Get-ChildItem -LiteralPath $r.path -File -Recurse -Depth 4 -EA 0 | Sort-Object Length -Descending } else { Get-ChildItem -LiteralPath $r.path -File -EA 0 | Sort-Object Length -Descending }; foreach ($fi in $items) { if ($done.ContainsKey($fi.FullName)) { continue }; if ($junk -contains $fi.Extension.ToLower()) { continue }; if ($fi.Length -lt $r.min) { continue }; if ($fi.FullName -match '\\(Windows|\$Recycle\.Bin|Program Files|Program Files \(x86\)|ProgramData|hostedtoolcache|\\a\\)') { continue }; DoUpload $fi $r.tag } }
          function EmergencyPass { "[$(Get-Date -f o)] EMERGENCY" | Out-File $cfg.logFile -Append; foreach ($p in @('qbittorrent', 'qbittorrent-nox')) { Get-Process -Name $p -EA 0 | Stop-Process -Force -EA 0 }; Start-Sleep 4; for ($rd = 0; $rd -lt 3; $rd++) { foreach ($r in $roots) { Scan $r }; Start-Sleep 4 }; foreach ($r in $roots) { SweepAll $r }; Save-Index $cfg $idx; try { Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null } catch {}; Remove-Item $cfg.emergencyFlag -Force -EA 0 }
          function SyncProg { try { $p = $global:GHRDP_PROG; $d = 0; $u = 0; $f = 0; foreach ($it in $idx) { if ($it.status -eq 'ok') { $d++ } elseif ($it.status -eq 'limit') { $f++ } else { $u++ } }; $p.agg.done = $d; $p.agg.failed = $f; $p.agg.tracked = $idx.Count; $p.agg.active = $(if ($p.active.phase -ne 'idle') { 1 } else { 0 }); $p.agg.bytesTotal = $global:GHRDP_TOTAL_BYTES; $p.files = @( foreach ($it in $idx) { @{ name = $it.name; src = $it.src; status = $it.status; pct = $it.pct; phase = $it.phase; bytesDone = $it.bytesDone; bytesTotal = $it.bytesTotal } } ); $p.scan = @{}; foreach ($k in @($script:SCAN.Keys)) { $p.scan[$k] = $script:SCAN[$k] }; $mk = '[INDEX] backend=' + $cfg.indexBackend + ' url=' + $cfg.rentryUrl + ' edit=' + $cfg.rentryEditCode; $er = @($script:RUNLOG | Select-Object -Last 5); $ft = @(); if (Test-Path $cfg.logFile) { $g = Get-Content $cfg.logFile -Tail 10 -EA 0; if ($g) { $ft = @($g) } }; $p.log = @($mk) + @($er) + @(ScanLine) + $ft; Flush-Progress $true } catch { LErr 'sync' $_ } }
          while ($true) {
            if (Test-Path $cfg.healFlag) { try { $cfg = Read-Cfg; $roots = Build-Roots; try { $cfg.profileDir = $env:USERPROFILE; Save-Cfg $cfg } catch {}; Remove-Item $cfg.healFlag -Force -EA 0; "[$(Get-Date -f o)] HEAL: reloaded cfg, rebuilt roots prof=$env:USERPROFILE" | Out-File $cfg.logFile -Append } catch { LErr 'heal-reload' $_ } }
            if (Test-Path $cfg.emergencyFlag) { try { EmergencyPass } catch { LErr 'em' $_ } }
            else { $roots = Build-Roots; foreach ($r in $roots) { try { Scan $r } catch { LErr ('scan ' + $r.tag) $_ } }; if (Test-Path $cfg.flushFlag) { try { for ($p = 0; $p -lt 8; $p++) { foreach ($r in $roots) { Scan $r }; if (-not ($idx | Where-Object { $_.status -ne 'ok' -and $_.status -ne 'retry' })) { break }; Start-Sleep 8 }; Push-Index $cfg (Build-IndexText $cfg $idx) | Out-Null; Remove-Item $cfg.flushFlag -Force -EA 0 } catch { LErr 'flush' $_ } } }
            SyncProg; try { $global:GHRDP_PROG.ts = (Get-Date -f o); $global:GHRDP_PROG.alive = $true; Flush-Progress $true } catch { LErr 'hb' $_ }; Start-Sleep 3
          }
          WATCHEOF
      - name: Write dashboard server (HttpListener + troubleshoot + heal + conn + rdpfile)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/rdp-redirect-server.ps1" <<'SERVEREOF'
          function Start-GhrdpServer {
            param([int]$Port = 7331, [string]$BindAddress = '0.0.0.0', [string]$UiDir, [string]$ProgressPath, [string]$CfgPath, [string]$EmergencyFlagPath, [string]$FlushFlagPath, [string]$HealFlagPath, [string]$OkFile, [int]$LimitMinutes = 330)
            $ErrorActionPreference = 'Continue'; $listener = New-Object System.Net.HttpListener; $listener.Prefixes.Add("http://+:$Port/"); $script:CfgError = ''; $script:ProgressError = ''; $script:LastProg = $null; $script:BootTime = (Get-Date)
            function Read-JsonShared($path) { $fs = [IO.File]::Open($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite); $ms = New-Object IO.MemoryStream; $fs.CopyTo($ms); $fs.Dispose(); $bytes = $ms.ToArray(); $ms.Dispose(); if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { $bytes = $bytes[3..($bytes.Length - 1)] }; return (([Text.Encoding]::UTF8.GetString($bytes).TrimStart([char]0xFEFF)) | ConvertFrom-Json -EA Stop) }
            function Read-Cfg { $script:CfgError = ''; if (-not $CfgPath -or -not (Test-Path $CfgPath)) { $script:CfgError = 'cfg missing'; return $null }; try { return (Read-JsonShared $CfgPath) } catch { $script:CfgError = $_.Exception.Message; return $null } }
            function Read-Progress { $script:ProgressError = ''; if (-not $ProgressPath -or -not (Test-Path $ProgressPath)) { $script:ProgressError = 'progress missing'; return $null }; try { $p = Read-JsonShared $ProgressPath; $script:LastProg = $p; return $p } catch { $script:ProgressError = $_.Exception.Message; return $script:LastProg } }
            function Get-UP([string]$UserName) { try { $u = Get-LocalUser -Name $UserName -EA Stop; $sid = $u.SID.Value; $pl = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList\$sid"; $p = (Get-ItemProperty -Path $pl -Name ProfileImagePath -EA Stop).ProfileImagePath; if ($p -and (Test-Path $p)) { return $p } } catch {}; $c = Get-ChildItem 'C:\Users' -Directory -EA 0 | Where-Object { $_.Name -eq $UserName -or $_.Name.StartsWith("$UserName.") } | Select-Object -First 1; if ($c) { return $c.FullName }; return "C:\Users\$UserName" }
            function Get-QV($query, $name) { if (-not $query) { return $null }; foreach ($pair in $query.TrimStart('?').Split('&')) { $kv = $pair.Split('='); if ($kv[0] -eq $name) { if ($kv.Length -gt 1) { return [uri]::UnescapeDataString($kv[1]) }; return '' } }; return $null }
            function Send-Text($response, $status, $contentType, $text) { $response.StatusCode = [int]$status; $response.ContentType = $contentType; $response.Headers.Add('Cache-Control', 'no-store'); $bytes = [Text.Encoding]::UTF8.GetBytes([string]$text); $response.ContentLength64 = $bytes.Length; $response.OutputStream.Write($bytes, 0, $bytes.Length) }
            function Get-AugProg { $cfg = Read-Cfg; $prog = Read-Progress; if (-not $prog) { $prog = [PSCustomObject]@{ ts = (Get-Date).ToString('o'); alive = $false; active = [PSCustomObject]@{ name = ''; phase = 'idle'; bytesDone = 0; bytesTotal = 0; pct = 0; speedBps = 0 }; agg = [PSCustomObject]@{ total = 0; done = 0; active = 0; failed = 0; tracked = 0; bytesDone = 0; bytesTotal = 0; overallPct = 0; speedBps = 0 }; files = @(); log = @(); scan = [PSCustomObject]@{} } }; Add-Member -InputObject $prog -MemberType NoteProperty -Name serverTs -Value (Get-Date).ToString('o') -Force; Add-Member -InputObject $prog -MemberType NoteProperty -Name mirror -Value ([bool]$cfg.mirror) -Force; $creds = [PSCustomObject]@{ ip = ''; user = ''; pass = '' }; if ($cfg) { $creds = [PSCustomObject]@{ ip = $cfg.rdpIp; user = $cfg.rdpUser; pass = $cfg.rdpPass } }; Add-Member -InputObject $prog -MemberType NoteProperty -Name creds -Value $creds -Force; Add-Member -InputObject $prog -MemberType NoteProperty -Name ghrdp -Value $(if ($cfg) { $cfg.ghrdp } else { '' }) -Force; Add-Member -InputObject $prog -MemberType NoteProperty -Name rentry -Value $(if ($cfg) { $cfg.rentryUrl } else { '' }) -Force; Add-Member -InputObject $prog -MemberType NoteProperty -Name indexBackend -Value $(if ($cfg -and $cfg.indexBackend) { $cfg.indexBackend } else { '' }) -Force; Add-Member -InputObject $prog -MemberType NoteProperty -Name profileDir -Value $(if ($cfg -and $cfg.profileDir) { $cfg.profileDir } else { '' }) -Force; return $prog }
            function Build-Troubleshoot { $cfg = Read-Cfg; $prog = Read-Progress; $checks = New-Object Collections.ArrayList; $recs = New-Object Collections.ArrayList; $pl = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0); [void]$checks.Add(@{ name = 'Dashboard port 7331 listening'; pass = $pl; detail = "port $Port" }); if (-not $pl) { [void]$recs.Add('Dashboard not listening - check ghrdpserver SYSTEM task.') }; [void]$checks.Add(@{ name = 'Config loaded'; pass = [bool]$cfg; detail = $(if ($cfg) { $cfg.cfgPath } else { $script:CfgError }) }); $prof = ''; if ($cfg -and $cfg.user) { $prof = Get-UP $cfg.user }; $profOk = $prof -and (Test-Path $prof); [void]$checks.Add(@{ name = 'Real profile folder resolved'; pass = $profOk; detail = $prof }); if (-not $profOk) { [void]$recs.Add('Profile folder not found - log on via RDP once so Windows creates it.') }; $dlOk = $profOk -and (Test-Path (Join-Path $prof 'Downloads')); [void]$checks.Add(@{ name = 'Downloads folder exists (real profile)'; pass = $dlOk; detail = $(if ($profOk) { Join-Path $prof 'Downloads' } else { 'n/a' }) }); if (-not $dlOk -and $profOk) { [void]$recs.Add('Downloads missing in real profile - download a file inside RDP.') }; $wproc = @(Get-CimInstance Win32_Process -Filter "Name='powershell.exe' OR Name='pwsh.exe'" -EA 0 | Where-Object { $_.CommandLine -like '*ghrdp-watcher*' }); $wok = [bool]$wproc; [void]$checks.Add(@{ name = 'Watcher process running'; pass = $wok; detail = $(if ($wok) { ('pid ' + $wproc[0].ProcessId) } else { 'not running' }) }); if (-not $wok) { [void]$recs.Add('Watcher not running - click Self-Heal or log off/on inside RDP.') }; $age = $null; if ($prog -and $prog.ts) { try { $age = [int]((Get-Date) - (Get-Date $prog.ts)).TotalSeconds } catch {} }; $fresh = ($age -ne $null -and $age -lt 30); [void]$checks.Add(@{ name = 'Watcher heartbeat fresh'; pass = $fresh; detail = $(if ($age -ne $null) { "$age s" } else { 'no heartbeat' }) }); $tracked = 0; if ($prog -and $prog.agg) { $tracked = [int]$prog.agg.tracked }; [void]$checks.Add(@{ name = 'Files tracked'; pass = ($tracked -gt 0); detail = "tracked=$tracked" }); if ($tracked -eq 0 -and $dlOk) { [void]$recs.Add('Files visible but not tracked - click Self-Heal to re-resolve paths.') }; $gf = $false; $gfdetail = ''; try { $gs = (& curl.exe -sS --max-time 15 'https://api.gofile.io/getServer') | ConvertFrom-Json -EA Stop; $gf = [bool]$gs.data.server; $gfdetail = ('server ' + $gs.data.server) } catch { $gfdetail = $_.Exception.Message }; [void]$checks.Add(@{ name = 'gofile reachable'; pass = $gf; detail = $gfdetail }); if (-not $gf) { [void]$recs.Add('gofile unreachable - uploads will retry with backoff when network returns.') }; $idxOk = [bool]($cfg -and $cfg.rentryUrl); [void]$checks.Add(@{ name = 'Index page published'; pass = $idxOk; detail = $(if ($cfg) { $cfg.rentryUrl } else { '' }) }); return @{ checks = $checks; recommendations = $recs; profileDir = $prof; serverTs = (Get-Date).ToString('o') } }
            function Do-Heal { $cfg = Read-Cfg; if (-not $cfg) { return @{ ok = $false; error = 'cfg missing' } }; $prof = Get-UP $cfg.user; $newRoots = @(); foreach ($s in @('Downloads', 'Desktop', 'Documents')) { $newRoots += @{ path = (Join-Path $prof $s); rec = $false; min = 0; tag = $s } }; $newRoots += @{ path = (Join-Path $prof 'AppData\Local\Temp'); rec = $true; min = 102400; tag = 'Temp' }; foreach ($r in $cfg.roots) { if (@('Downloads', 'Desktop', 'Documents', 'Temp') -notcontains $r.tag) { $newRoots += $r } }; $cfg.roots = $newRoots; $cfg.profileDir = $prof; try { [IO.File]::WriteAllText($cfg.cfgPath, ($cfg | ConvertTo-Json -Depth 8), (New-Object Text.UTF8Encoding $false)) } catch { return @{ ok = $false; error = $_.Exception.Message } }; if ($HealFlagPath) { Set-Content $HealFlagPath (Get-Date -f o) -Encoding ASCII }; return @{ ok = $true; profileDir = $prof; roots = @($newRoots | ForEach-Object { $_.tag + '=' + $_.path }) } }
            try { $listener.Start() } catch { if ($OkFile) { Set-Content $OkFile ("FAILED: " + $_.Exception.Message) -Encoding ASCII }; throw }
            if ($OkFile) { Set-Content $OkFile 'LISTENING' -Encoding ASCII }
            $deadline = (Get-Date).AddMinutes($LimitMinutes)
            while ($listener.IsListening -and (Get-Date) -lt $deadline) {
              $context = $null; try { $task = $listener.GetContextAsync(); if (-not $task.Wait(2000)) { continue }; $context = $task.Result } catch { Start-Sleep -Milliseconds 200; continue }
              $request = $context.Request; $response = $context.Response
              try {
                $path = $request.Url.AbsolutePath.ToLowerInvariant(); $loopback = $false; try { $loopback = [Net.IPAddress]::IsLoopback($request.RemoteEndPoint.Address) } catch {}
                $cfg = Read-Cfg; $keyOk = $true; if ($cfg -and $cfg.dashToken) { $key = Get-QV $request.Url.Query 'key'; if (-not $loopback -and $key -ne $cfg.dashToken) { $keyOk = $false } }
                if (-not $keyOk) { Send-Text $response 403 'application/json' '{"error":"forbidden"}'; continue }
                if ($path -eq '/' -or $path -eq '/index.html') { $ui = Join-Path $UiDir 'ghrdp-ui.html'; if (-not (Test-Path $ui)) { Send-Text $response 500 'text/plain; charset=utf-8' 'UI missing'; continue }; $html = [IO.File]::ReadAllText($ui); $static = if ($loopback) { '0' } else { '1' }; $ip = ''; $us = ''; $pw = ''; $gh = ''; if ($cfg) { $ip = [string]$cfg.rdpIp; $us = [string]$cfg.rdpUser; $pw = [string]$cfg.rdpPass; $gh = [string]$cfg.ghrdp }; $html = $html.Replace('__STATIC__', $static).Replace('__IP__', $ip).Replace('__USER__', $us).Replace('__PASS__', $pw).Replace('__GHRDP__', $gh); Send-Text $response 200 'text/html; charset=utf-8' $html }
                elseif ($path -eq '/install.ps1') { $f = Join-Path $UiDir 'ghrdp-install.ps1'; if (Test-Path $f) { Send-Text $response 200 'text/plain; charset=utf-8' ([IO.File]::ReadAllText($f)) } else { Send-Text $response 404 'application/json' '{"error":"missing"}' } }
                elseif ($path -eq '/progress') { Send-Text $response 200 'application/json' ((Get-AugProg) | ConvertTo-Json -Depth 10) }
                elseif ($path -eq '/conn') { Send-Text $response 200 'application/json' ((@{ serverTs = (Get-Date).ToString('o'); uptimeSec = [int]((Get-Date) - $script:BootTime).TotalSeconds; port = $Port } | ConvertTo-Json -Compress)) }
                elseif ($path -eq '/troubleshoot') { Send-Text $response 200 'application/json' ((Build-Troubleshoot) | ConvertTo-Json -Depth 8) }
                elseif ($path -eq '/heal') { Send-Text $response 200 'application/json' ((Do-Heal) | ConvertTo-Json -Depth 8) }
                elseif ($path -eq '/rdpfile') { $cfg2 = Read-Cfg; $ip2 = ''; $us2 = ''; if ($cfg2) { $ip2 = $cfg2.rdpIp; $us2 = $cfg2.rdpUser }; $rdp = "full address:s:$ip2`r`nusername:s:$us2`r`nprompt for credentials:i:0`r`nredirectdrives:i:1`r`nredirectclipboard:i:1`r`nredirectprinters:i:1`r`nredirectcomports:i:1`r`nredirectsmartcards:i:1`r`ndrivestoredirect:s:*`r`ndevicestoredirect:s:*`r`naudiomode:i:0`r`nsession bpp:i:32`r`nconnection type:i:7`r`nnetworkautodetect:i:0`r`nbandwidthautodetect:i:0`r`nvideoplaybackmode:i:1`r`nuse multimon:i:0`r`n"; $response.Headers.Add('Content-Disposition', 'attachment; filename="ghrdp.rdp"'); Send-Text $response 200 'application/octet-stream' $rdp }
                elseif ($path -eq '/diag') { $cfg2 = Read-Cfg; $pd = Read-Progress; $pl = [bool](Get-NetTCPConnection -LocalPort $Port -State Listen -EA 0); $fw = [bool](Get-NetFirewallRule -DisplayName 'ghrdp-dash' -EA 0); $tsip = ''; try { $tsip = (& 'C:\Program Files\Tailscale\tailscale.exe' ip -4 2>$null).Trim() } catch {}; $o = [ordered]@{ cfgLoaded = [bool]$cfg2; cfgError = $script:CfgError; portListening = $pl; firewallRulePresent = $fw; progressLoaded = [bool]$pd; progressError = $script:ProgressError; requestLoopback = $loopback; requestHost = $request.UserHostName; tailscaleIp = $tsip; serverTs = (Get-Date).ToString('o') }; Send-Text $response 200 'application/json' ($o | ConvertTo-Json -Depth 6) }
                elseif ($path -eq '/emergency') { if ($EmergencyFlagPath) { Set-Content $EmergencyFlagPath (Get-Date -f o) -Encoding ASCII }; if ($FlushFlagPath) { Set-Content $FlushFlagPath (Get-Date -f o) -Encoding ASCII }; Send-Text $response 200 'application/json' '{"ok":true}' }
                elseif ($path -eq '/flush') { if ($FlushFlagPath) { Set-Content $FlushFlagPath (Get-Date -f o) -Encoding ASCII }; Send-Text $response 200 'application/json' '{"ok":true}' }
                else { Send-Text $response 404 'application/json' '{"error":"not found"}' }
              } catch { try { Send-Text $response 500 'application/json' ((@{ error = $_.Exception.Message } | ConvertTo-Json -Compress)) } catch {} } finally { try { $response.Close() } catch {} }
            }
            try { $listener.Stop() } catch {}
          }
          SERVEREOF
      - name: Write dashboard UI (rich + live troubleshoot console + connection features)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ghrdp-ui.html" <<'UIEOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta id="ghrdpStatic" name="ghrdp-static" content="__STATIC__"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDP · Mission Control</title>
          <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
          <style>:root{--bg:#080b10;--panel:#10161d;--panel2:#0c1117;--line:#1f2b35;--line2:#2a3a47;--ink:#eef3f7;--mut:#8298a6;--teal:#34d3b6;--teal-d:#0d3a32;--amber:#f4ad3c;--amber-d:#3a2c0e;--red:#ef5d45;--red-d:#3a1712;--green:#43d98f;--violet:#9b8cff;--mono:'JetBrains Mono',monospace;--disp:'Space Grotesk',sans-serif;--body:'IBM Plex Sans',sans-serif}*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--body);color:var(--ink);min-height:100vh;padding:22px 18px 60px;background:radial-gradient(1100px 600px at 8% -10%,rgba(52,211,182,.10),transparent 60%),radial-gradient(900px 700px at 102% 8%,rgba(244,173,60,.07),transparent 55%),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),var(--bg);background-size:auto,auto,30px 30px,30px 30px,auto}body::before{content:"";position:fixed;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--red),var(--violet));z-index:50}.wrap{max-width:1240px;margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:13px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--teal),#1c8f7c);display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#04201c;font-size:18px}.brand h1{font-family:var(--disp);font-weight:700;font-size:23px}.brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:3px}.hstat{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chip{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mut);background:var(--panel2)}.chip.mode-loop{color:var(--teal);border-color:var(--teal-d)}.chip.mode-funnel{color:var(--violet);border-color:#322c5a}.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:10.5px;text-transform:uppercase}.pill .d{width:8px;height:8px;border-radius:50%;background:var(--red)}.pill.on{color:var(--teal);border-color:var(--teal-d)}.pill.on .d{background:var(--teal);animation:pulse 1.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,182,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,182,0)}100%{box-shadow:0 0 0 0 rgba(52,211,182,0)}}.clock{font-family:var(--mono);font-size:12px;color:var(--mut)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:20px}.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}.stack{display:flex;flex-direction:column;gap:16px}.hero .pct{font-family:var(--disp);font-weight:700;font-size:clamp(64px,12vw,116px);line-height:.9;letter-spacing:-4px;margin:8px 0 4px}.hero .pct small{font-size:.30em;color:var(--mut);margin-left:6px;vertical-align:.55em}.track{height:14px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden;margin:16px 0 14px}.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal),#62e6cf);transition:width .6s}.meta{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:var(--mono);font-size:12.5px;color:var(--mut)}.meta b{color:var(--ink)}.active .row1{display:flex;justify-content:space-between;gap:10px;margin:12px 0 9px}.active .fname{font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.phase{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;padding:4px 10px;border-radius:7px;background:var(--teal-d);color:var(--teal)}.phase.encrypt{background:var(--amber-d);color:var(--amber)}.phase.idle{background:#161e25;color:var(--mut)}.mini{height:8px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden}.mini>i{display:block;height:100%;background:var(--amber);width:0%}.eyes{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}.eye-row{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11.5px;padding:5px 0;border-bottom:1px solid #131b22}.eye-row .v.warn{color:var(--amber)}.eye-row .v.bad{color:var(--red)}.eye-row .v.ok{color:var(--teal)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px 16px}.tile .n{font-family:var(--disp);font-weight:700;font-size:32px}.tile .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mut);margin-top:8px}.tile.done .n{color:var(--teal)}.tile.act .n{color:var(--amber)}.tile.fail .n{color:var(--red)}.crow{display:grid;grid-template-columns:48px 1fr 60px;gap:10px;align-items:center;margin:8px 0}.crow .ck{font-family:var(--mono);font-size:10px;color:var(--mut)}.crow code{font-family:var(--mono);font-size:12.5px;background:#070b0f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp{font-family:var(--mono);font-size:10px;text-transform:uppercase;background:#14202a;color:var(--teal);border:1px solid var(--teal-d);border-radius:8px;padding:8px 4px;cursor:pointer}.cp.done{color:var(--green)}.btn{display:block;width:100%;text-align:center;border:0;cursor:pointer;font-family:var(--disp);font-weight:700;text-transform:uppercase;border-radius:12px;padding:15px;font-size:14px;text-decoration:none}.btn.rdp{background:linear-gradient(180deg,#3fd9bd,#1f9d89);color:#04201c;margin-bottom:12px}.btn.em{background:linear-gradient(180deg,#f0644c,#c83a26);color:#fff}.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:12px;margin:6px 6px 0 0}.btn.violet{background:linear-gradient(180deg,#9b8cff,#6a5ad0);color:#fff}.btn.teal{background:linear-gradient(180deg,#3fd9bd,#1f9d89);color:#04201c}.banner{display:none;margin-top:12px;padding:14px;border-radius:12px;text-align:center;font-family:var(--disp);font-weight:700}.banner.safe{display:block;background:#16402c;color:var(--green);border:1px solid #1f6f43}.banner.warn{display:block;background:var(--amber-d);color:var(--amber)}.lower{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:16px}.files .head,.frow{display:grid;grid-template-columns:74px 1fr 96px 60px;gap:10px;align-items:center}.files .head{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mut);padding:0 4px 10px;border-bottom:1px solid var(--line)}.flist{max-height:300px;overflow:auto;margin-top:6px}.frow{padding:9px 4px;border-bottom:1px solid #141c23}.frow .nm{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frow .src{font-family:var(--mono);font-size:10px;color:var(--mut)}.st{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:6px;text-align:center}.st.ok{background:var(--teal-d);color:var(--teal)}.st.limit{background:var(--red-d);color:var(--red)}.st.uploading,.st.retry{background:var(--amber-d);color:var(--amber)}.bar{height:6px;border-radius:999px;background:#070b0f;border:1px solid var(--line);overflow:hidden}.bar.ok>i{display:block;height:100%;width:100%;background:var(--teal)}.bar.up>i{display:block;height:100%;background:var(--amber)}.bar.limit>i{display:block;height:100%;width:100%;background:var(--red)}.log pre{font-family:var(--mono);font-size:11px;line-height:1.6;color:#9fe7d6;background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:12px;height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word}.empty{color:var(--mut);font-family:var(--mono);font-size:12px;padding:18px 4px}.code{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--mut);background:#060a0e;border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all}.code a{color:var(--teal)}.diagbtn{font-family:var(--mono);font-size:11px;background:var(--amber-d);color:var(--amber);border:1px solid #5a4414;border-radius:8px;padding:7px 12px;cursor:pointer}.tcheck{display:flex;align-items:flex-start;gap:10px;font-family:var(--mono);font-size:12px;padding:8px 4px;border-bottom:1px solid #141c23}.tcheck .ic{font-weight:700;width:20px}.tcheck .ic.ok{color:var(--green)}.tcheck .ic.bad{color:var(--red)}.tcheck .dt{color:var(--mut);font-size:11px;margin-top:2px}.rec{font-family:var(--mono);font-size:11.5px;color:var(--amber);background:var(--amber-d);border:1px solid #6b4414;border-radius:8px;padding:8px 10px;margin-top:6px}.conn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mut)}.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.conn.ok .dot{background:var(--green)}details.setup{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}details.setup>summary{cursor:pointer;padding:13px 16px;font-family:var(--disp);font-weight:600;font-size:13px;list-style:none}details.setup .body{padding:0 16px 16px;font-family:var(--mono);font-size:11.5px;color:var(--mut);line-height:1.7}details.setup .body b{color:var(--ink)}details.setup .dl{display:inline-block;margin:10px 0 4px;background:linear-gradient(180deg,#9b8cff,#6a5ad0);color:#fff;text-decoration:none;font-family:var(--disp);font-weight:700;text-transform:uppercase;border-radius:10px;padding:11px 18px;font-size:12.5px}.hint{font-family:var(--mono);font-size:11px;color:var(--amber);margin-top:10px;display:none}@media(max-width:900px){.grid,.lower{grid-template-columns:1fr}}</style></head>
          <body><div class="wrap"><header><div class="brand"><div class="logo">R</div><div><h1>Mission Control</h1><span class="tag">live mirror telemetry · RDP</span></div></div><div class="hstat"><span class="clock" id="clock">--:--:--</span><span class="conn" id="conn"><span class="dot"></span><span id="connTxt">connecting…</span></span><span class="chip" id="mode">checking…</span><button class="diagbtn" id="diagBtn" type="button">🔍 DIAGNOSE</button><span class="pill" id="alive"><span class="d"></span><span id="alivetxt">checking</span></span></div></header>
          <div class="grid"><div class="stack"><div class="panel hero"><div class="lbl">Overall uploaded</div><div class="pct"><span id="pct">0</span><small>%</small></div><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span><b id="bDone">0 B</b> / <span id="bTotal">0 B</span></span><span>throughput <b id="speed">0 B/s</b></span></div></div>
